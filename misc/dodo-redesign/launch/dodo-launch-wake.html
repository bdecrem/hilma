<title>Dodo Wake Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the phone is the hero; controls and the cue sheet sit beside it on wide screens, under it on a phone. */
:root{
  --paper:#F8F2F8; --surface:#FFFCFF; --surface2:#F1E8F5; --ink:#2D2537; --ink2:#6A5F73;
  --sky:#2689BD; --skyHi:#5EC6EC; --skyDeep:#1C6E9E; --gold:#E0A100; --line:rgba(120,90,140,.18);
  --bezel:#2D2537; --rowHi:rgba(94,198,236,.16); --onSky:#FFFFFF;
  --display:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17131D; --surface:#271F31; --surface2:#332A3F; --ink:#F3EBF6; --ink2:#B3A8BC;
  --sky:#5EC6EC; --skyHi:#8FDDF6; --skyDeep:#2689BD; --gold:#FFD43A; --line:rgba(200,170,230,.16);
  --bezel:#0E0B12; --rowHi:rgba(94,198,236,.14); --onSky:#FFFFFF; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#17131D; --surface:#271F31; --surface2:#332A3F; --ink:#F3EBF6; --ink2:#B3A8BC;
  --sky:#5EC6EC; --skyHi:#8FDDF6; --skyDeep:#2689BD; --gold:#FFD43A; --line:rgba(200,170,230,.16);
  --bezel:#0E0B12; --rowHi:rgba(94,198,236,.14); --onSky:#FFFFFF; color-scheme:dark }
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;box-sizing:border-box}
.stage{display:grid;grid-template-columns:auto minmax(0,440px);gap:40px;justify-content:center;align-items:start}
.phone{margin:0;position:relative;height:min(844px,calc(100dvh - 48px));aspect-ratio:390/844;max-width:100%;border-radius:52px;box-shadow:0 0 0 10px var(--bezel),0 30px 70px rgba(45,20,70,.28);overflow:hidden;background:#FFECD6}
.phone canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0;padding-top:6px}
.head h1{font:600 30px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--ink2)}
.play{appearance:none;border:0;cursor:pointer;font:600 19px/1 var(--display);color:var(--onSky);padding:18px 26px;border-radius:999px;
  background:radial-gradient(120% 140% at 28% 18%,#DCF6FF 0,#5EC6EC 42%,#2689BD 100%);
  box-shadow:inset 0 -4px 0 rgba(8,75,120,.35),inset 0 0 0 1.5px rgba(8,75,120,.4),0 8px 22px rgba(38,137,189,.32);
  text-shadow:0 1px 0 rgba(8,75,120,.45);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.play:active{transform:scale(.96,.92)}
.play svg{flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn,.seg button{appearance:none;cursor:pointer;font:600 14px/1 var(--display);color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:999px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(45,20,70,.14)}
button:focus-visible,.cues tr:focus-visible,input:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.lbl{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.scrub .lbl{grid-column:1/-1}

.scrub output{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}
.hint{margin:0;color:var(--ink2);font-size:13.5px}
.sheet{min-width:0}
.sheet h2{font:600 17px/1.2 var(--display);margin:0 0 8px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cues{border-collapse:collapse;width:100%;font-size:13px}
.cues th{font:600 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.cues td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.cues tr:last-child td{border-bottom:0}
.cues td.t{font:500 12.5px/1.5 var(--mono);font-variant-numeric:tabular-nums;color:var(--sky);white-space:nowrap}
.cues td.s{color:var(--ink2);font-family:var(--mono);font-size:11.5px;line-height:1.5}
.cues tbody tr{cursor:pointer}
.cues tbody tr:hover{background:var(--surface2)}
.cues tbody tr.on{background:var(--rowHi)}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);gap:22px}
  .phone{height:auto;width:calc(100% + 2 * max(16px, env(safe-area-inset-left,0px)));max-width:none;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));border-radius:0;box-shadow:none}
  .wrap{padding-block:0 32px}
  .head{order:-1}
}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>

<main class="wrap">
  <div class="stage">
    <figure class="phone" id="phone"><canvas id="cv" role="img" aria-label="Dodo Wake Up: the dodo wakes on its level stone"></canvas></figure>
    <section class="panel" aria-label="Playback controls">
      <div class="head">
        <h1>Dodo Wake Up</h1>
        <p>The dodo wakes up with the sunrise: one sleepy peek, a big yawn, a happy shake. 2.9 s of picture, 2.85 s of synthesized sound. Tap the phone while it plays to skip to the exit.</p>
      </div>
      <button class="play" id="play" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.2v15.6c0 1 1.1 1.6 2 1.1l12.2-7.8c.8-.5.8-1.7 0-2.2L5 1.1C4.1.6 3 1.2 3 2.2z" fill="currentColor"/></svg><span id="playLbl">Play with sound</span></button>
      <div class="row">
        <button class="btn" id="replay" type="button">Replay</button>
        <div class="seg" role="group" aria-label="Speed"><button type="button" id="sp1" aria-pressed="true">1×</button><button type="button" id="sp4" aria-pressed="false">0.25×</button></div>
        <div class="seg" role="group" aria-label="Time of day"><button type="button" id="day" aria-pressed="true">Day</button><button type="button" id="night" aria-pressed="false">Night</button></div>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="Sound"><button type="button" id="sndOn" aria-pressed="true">Sound on</button><button type="button" id="sndOff" aria-pressed="false">Off</button></div>
        <div class="seg" role="group" aria-label="Motion"><button type="button" id="rmOff" aria-pressed="true">Full motion</button><button type="button" id="rmOn" aria-pressed="false">Reduce Motion</button></div>
      </div>
      <div class="scrub">
        <label class="lbl" for="scrub">Scrub (silent)</label>
        <input type="range" id="scrub" min="0" max="3.1" step="0.005" value="1.72">
        <output id="tOut" for="scrub">1.72 s</output>
      </div>
      <div class="sheet">
        <h2>Cue sheet</h2>
        <div class="tablebox"><table class="cues"><thead><tr><th>Time</th><th>Beat</th><th>Sound</th></tr></thead><tbody id="cueBody"></tbody></table></div>
      </div>
    </section>
  </div>
</main>

<script>
'use strict';
/* =====================================================================
   Dodo Launch · "Hatch"
   One cue list drives picture and sound. Every frame is a pure function
   of time t (seconds). Seeded RNG is used only to build LAYOUT once.
   ===================================================================== */
const TAU = Math.PI * 2, W = 390, H = 844;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - (1 - t) ** 3, easeInCubic = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(clamp(t)); };
}
/* the app's overshoot ease, cubic-bezier(.34,1.56,.64,1), used for ~0.28 s pose blends */
const jelly = cubicBezier(.34, 1.56, .64, 1);
const blend = (t, t0, d = .28) => jelly(clamp((t - t0) / d));
/* underdamped spring step response 0 -> 1 (overshoots), w rad/s, z damping */
function spring(t, w, z) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
/* decaying wobble */
const wob = (t, A, k, f) => t < 0 ? 0 : A * Math.exp(-k * t) * Math.sin(TAU * f * t);
const tri = (t, c, w) => clamp(1 - Math.abs(t - c) / w);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- color ---------- */
function hexRgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function shade(c, t) { return t >= 0 ? mix(c, '#ffffff', t) : mix(c, '#1a0f24', -t); }
function rgba(c, a) { const A = hexRgb(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }

/* =====================================================================
   THE SCORE (Wake Up): one cue list. Visual beats read their times from
   it (B.id); the synth plays every cue that has a voice.
   ===================================================================== */
const NOTE = { F3: 174.61, C4: 261.63, F4: 349.23, G4: 392.00, A4: 440.00, C5: 523.25, D5: 587.33, F5: 698.46, G5: 783.99, A5: 880.00, C6: 1046.50 };
const CUES = [
  { t: 0.00, id: 'pad', beat: 'Pre-dawn ground; the dodo asleep on its stone', voice: 'pad', gain: .025, dur: 2.85, chordA: ['F4', 'C5'], chordB: ['F4', 'A4', 'C5', 'D5'], bass: 'F3', change: 1.6, exitAt: 2.55, lp: [600, 1800, 1400] },
  { t: 0.05, id: 'breath1', beat: 'Sleepy breath', voice: 'breath', gain: .05, dur: .4 },
  { t: 0.15, id: 'z', beat: 'A small "z" rises and drifts', voice: null },
  { t: 0.47, id: 'breath2', beat: 'Second breath', voice: 'breath', gain: .05, dur: .38 },
  { t: 0.78, id: 'zpop', beat: 'The "z" fades', voice: 'blip', gain: .08, f: 900 },
  { t: 0.80, id: 'light', beat: 'Sunrise light grows from the top-left', voice: null },
  { t: 0.90, id: 'peek', beat: 'One eye peeks halfway, squints, shuts', voice: 'tink', gain: .17, note: 'G5' },
  { t: 1.18, id: 'open', beat: 'Both eyes open slowly', voice: 'tink', gain: .08, note: 'C5' },
  { t: 1.34, id: 'blink1', beat: 'Sleepy blink; pupils drift toward the light', voice: null },
  { t: 1.42, id: 'blink2', beat: 'Second blink', voice: null },
  { t: 1.48, id: 'yawn', beat: 'Big yawn-stretch: > <, "o" mouth, wings out', voice: 'yawn', gain: .17 },
  { t: 1.88, id: 'tuft', beat: 'Tuft springs upright', voice: 'boing', gain: .19, note: 'C5', bend: .75, tau: .12 },
  { t: 1.97, id: 'shake', beat: 'Happy fluff-shake (±3 pt, 240 ms)', voice: 'wobble', gain: .21 },
  { t: 2.15, id: 'word', beat: 'Wordmark fades in, rises 8 pt', voice: null },
  { t: 2.21, id: 'awake', beat: 'Looks at you, cheeks brighten', voice: null },
  { t: 2.48, id: 'chime', beat: 'Wordmark lands: two-note chime', voice: 'chime2', gain: .14, notes: ['C6', 'F5'], step: .09 },
  { t: 2.55, id: 'exit', beat: 'Gentle scale (1.06), fade to paper', voice: null },
  { t: 2.90, id: 'end', beat: 'App paper (#F8F2F8 / #17131D)', voice: null },
];
/* Reduce Motion: sleeping pose crossfades to the awake pose, then the wordmark */
const R_CUES = [
  { t: 0.00, id: 'pad', beat: 'Pre-dawn ground', voice: 'pad', gain: .04, dur: 2.2, chordA: ['F4', 'C5'], chordB: ['F4', 'A4', 'C5', 'D5'], bass: 'F3', change: .8, exitAt: 1.9, lp: [600, 1600, 1400] },
  { t: 0.05, id: 'sleep', beat: 'Sleeping dodo fades in', voice: 'breath', gain: .05, dur: .4 },
  { t: 0.60, id: 'wake', beat: 'Crossfade to the awake pose; light warms', voice: 'tink', gain: .16, note: 'C5' },
  { t: 0.95, id: 'word', beat: 'Wordmark fades in', voice: 'chime2', gain: .15, notes: ['C6', 'F5'], step: .09 },
  { t: 1.90, id: 'exit', beat: 'Crossfade to paper', voice: null },
  { t: 2.25, id: 'end', beat: 'App paper', voice: null },
];
const B = Object.fromEntries(CUES.map(c => [c.id, c.t]));
const RB = Object.fromEntries(R_CUES.map(c => [c.id, c.t]));
const SKIP_EXIT = 0.3;
const SLEEP_T = 0.3, AWAKE_T = 2.42;   // poses used by Reduce Motion

/* =====================================================================
   GEOMETRY: the Quiet layout (stone + dodo on ~44 % of the height,
   wordmark well below, calm ground everywhere else).
   ===================================================================== */
const STONE = { x: 195, y: 414, rx: 44, ry: 15, th: 13, color: '#FF9F4A' };
const DODO_S = 1.3;
const WM = { size: 60, baseline: 560, rise: 8 };
const FACE_Y = 360;
const SKY = { pre: ['#EAD7D2', '#E5B6A9'], day: ['#FFECD6', '#FFC9A6'], night: ['#3A2850', '#17131D'] };
const LAYOUT = (() => {
  const R = rng(2026), L = {};
  L.stars = []; for (let i = 0; i < 400 && L.stars.length < 7; i++) { const x = 30 + R() * 330, y = 50 + R() * 220; if (Math.abs(x - 195) > 70) L.stars.push({ x, y, r: .7 + R() * .8, a: .28 + R() * .26 }); }
  return L;
})();

/* =====================================================================
   JELLY DRAWING KIT (ported from the Living Island art page)
   ===================================================================== */
function ell(ctx, x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); ctx.fill(); }
function hl(ctx, x, y, rx, ry, rot = -.5, a = .8) { ell(ctx, x, y, rx, ry, `rgba(255,255,255,${a})`, rot); }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function jgrad(ctx, c, cx, cy, r) { const g = ctx.createRadialGradient(cx - r * .4, cy - r * .5, r * .05, cx, cy, r * 1.2); g.addColorStop(0, shade(c, .55)); g.addColorStop(.5, c); g.addColorStop(1, shade(c, -.32)); return g; }
function jfill(ctx, c, cx, cy, r, line = 1.2) { ctx.fillStyle = jgrad(ctx, c, cx, cy, r); ctx.fill(); if (line) { ctx.lineWidth = line; ctx.strokeStyle = rgba(shade(c, -.55), .45); ctx.stroke(); } }
/* cast shadow: silhouette with base at origin, object toward -y; falls down-right from a top-left light */
function cast(ctx, x, y, pathFn, o = {}) {
  const a = (o.a ?? .17) * .42;
  for (const [dx, dy] of [[0, 0], [1.1, .6], [-.9, -.5]]) { ctx.save(); ctx.translate(x + dx, y + dy); ctx.transform(1, 0, -(o.len ?? .5) * .9, -(o.sq ?? .4), 0, 0); pathFn(ctx); ctx.fillStyle = `rgba(48,30,80,${a})`; ctx.fill(); ctx.restore(); }
}
function contact(ctx, x, y, rx, ry, a = .26) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx); g.addColorStop(0, `rgba(40,25,70,${a})`); g.addColorStop(1, 'rgba(40,25,70,0)');
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function tuft(ctx, x, y, s, dark, light) {
  ctx.lineCap = 'round'; ctx.lineWidth = 1.1 * s; ctx.strokeStyle = dark; ctx.beginPath();
  ctx.moveTo(x - 2 * s, y); ctx.quadraticCurveTo(x - 2.5 * s, y - 3 * s, x - 4 * s, y - 5 * s);
  ctx.moveTo(x, y); ctx.quadraticCurveTo(x, y - 4 * s, x + .6 * s, y - 7 * s);
  ctx.moveTo(x + 2 * s, y); ctx.quadraticCurveTo(x + 2.6 * s, y - 3 * s, x + 4.2 * s, y - 4.6 * s); ctx.stroke();
  ctx.strokeStyle = light; ctx.lineWidth = .8 * s; ctx.beginPath(); ctx.moveTo(x - .3 * s, y - 2 * s); ctx.quadraticCurveTo(x - .2 * s, y - 4.5 * s, x + .5 * s, y - 6.4 * s); ctx.stroke();
}
function flower(ctx, x, y, s, col) {
  ctx.fillStyle = 'rgba(60,110,50,.35)'; ctx.beginPath(); ctx.ellipse(x + 1, y + 2.4 * s, 2.6 * s, 1 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = col; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU - .3; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 1.7 * s, y + Math.sin(a) * 1.5 * s, 1.35 * s, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#FFE36A'; ctx.beginPath(); ctx.arc(x, y, .95 * s, 0, TAU); ctx.fill();
}
function jellyBlob(ctx, w, h, color) {
  ctx.beginPath(); ctx.moveTo(-w, h * .2); ctx.bezierCurveTo(-w, -h * 1.1, w, -h * 1.1, w, h * .2); ctx.bezierCurveTo(w, h * .9, -w, h * .9, -w, h * .2); ctx.closePath();
  const g = ctx.createRadialGradient(-w * .35, -h * .5, 1, 0, 0, w * 1.3); g.addColorStop(0, shade(color, .6)); g.addColorStop(.5, color); g.addColorStop(1, shade(color, -.35));
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = rgba(shade(color, -.6), .45); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(-w * .45, -h * .45, w * .22, h * .1, -.5, 0, TAU); ctx.fill();
}
function face(ctx, sx, y, r = 2.6, mouth = true) {
  ctx.fillStyle = '#2A1F2B'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * sx, y, r, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#fff'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * sx - r * .3, y - r * .35, r * .35, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,110,160,.4)'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * (sx + r * 2.2), y + r * 1.6, r * 1.3, r * .7, 0, 0, TAU); ctx.fill(); }
  if (mouth) { ctx.strokeStyle = '#2A1F2B'; ctx.lineWidth = 1.1; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, y + r * .9, r * .7, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
}
function star4(ctx, x, y, r, rot, col) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .32 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }

/* ---------- props (Living Island) ---------- */
function gumTree(ctx, s, canopy, fruits) {
  ctx.save(); ctx.scale(s, s);
  cast(ctx, 0, 0, c => { c.beginPath(); c.rect(-2.5, -24, 5, 24); c.arc(0, -36, 18, 0, TAU); }, { a: .16 });
