<title>Dodo Launch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the phone is the hero; controls and the cue sheet sit beside it on wide screens, under it on a phone. */
:root{
  --paper:#F8F2F8; --surface:#FFFCFF; --surface2:#F1E8F5; --ink:#2D2537; --ink2:#6A5F73;
  --sky:#2689BD; --skyHi:#5EC6EC; --skyDeep:#1C6E9E; --gold:#E0A100; --line:rgba(120,90,140,.18);
  --bezel:#2D2537; --rowHi:rgba(94,198,236,.16); --onSky:#FFFFFF;
  --display:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17131D; --surface:#271F31; --surface2:#332A3F; --ink:#F3EBF6; --ink2:#B3A8BC;
  --sky:#5EC6EC; --skyHi:#8FDDF6; --skyDeep:#2689BD; --gold:#FFD43A; --line:rgba(200,170,230,.16);
  --bezel:#0E0B12; --rowHi:rgba(94,198,236,.14); --onSky:#FFFFFF; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#17131D; --surface:#271F31; --surface2:#332A3F; --ink:#F3EBF6; --ink2:#B3A8BC;
  --sky:#5EC6EC; --skyHi:#8FDDF6; --skyDeep:#2689BD; --gold:#FFD43A; --line:rgba(200,170,230,.16);
  --bezel:#0E0B12; --rowHi:rgba(94,198,236,.14); --onSky:#FFFFFF; color-scheme:dark }
html,body{background:var(--paper);color:var(--ink)}
body{font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;box-sizing:border-box}
.stage{display:grid;grid-template-columns:auto minmax(0,440px);gap:40px;justify-content:center;align-items:start}
.phone{margin:0;position:relative;height:min(844px,calc(100dvh - 48px));aspect-ratio:390/844;max-width:100%;border-radius:52px;box-shadow:0 0 0 10px var(--bezel),0 30px 70px rgba(45,20,70,.28);overflow:hidden;background:#FFECD6}
.phone canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0;padding-top:6px}
.head h1{font:600 30px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--ink2)}
.play{appearance:none;border:0;cursor:pointer;font:600 19px/1 var(--display);color:var(--onSky);padding:18px 26px;border-radius:999px;
  background:radial-gradient(120% 140% at 28% 18%,#DCF6FF 0,#5EC6EC 42%,#2689BD 100%);
  box-shadow:inset 0 -4px 0 rgba(8,75,120,.35),inset 0 0 0 1.5px rgba(8,75,120,.4),0 8px 22px rgba(38,137,189,.32);
  text-shadow:0 1px 0 rgba(8,75,120,.45);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.play:active{transform:scale(.96,.92)}
.play svg{flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn,.seg button{appearance:none;cursor:pointer;font:600 14px/1 var(--display);color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:999px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(45,20,70,.14)}
button:focus-visible,.cues tr:focus-visible,input:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.lbl{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.scrub{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.scrub .lbl{grid-column:1/-1}
.scrub input{width:100%;accent-color:var(--sky)}
.scrub output{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}
.hint{margin:0;color:var(--ink2);font-size:13.5px}
.sheet{min-width:0}
.sheet h2{font:600 17px/1.2 var(--display);margin:0 0 8px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cues{border-collapse:collapse;width:100%;font-size:13px}
.cues th{font:600 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.cues td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.cues tr:last-child td{border-bottom:0}
.cues td.t{font:500 12.5px/1.5 var(--mono);font-variant-numeric:tabular-nums;color:var(--sky);white-space:nowrap}
.cues td.s{color:var(--ink2);font-family:var(--mono);font-size:11.5px;line-height:1.5}
.cues tbody tr{cursor:pointer}
.cues tbody tr:hover{background:var(--surface2)}
.cues tbody tr.on{background:var(--rowHi)}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);gap:22px}
  .phone{height:auto;width:calc(100% + 2 * max(16px, env(safe-area-inset-left,0px)));max-width:none;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));border-radius:0;box-shadow:none}
  .wrap{padding-block:0 32px}
  .head{order:-1}
}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>

<main class="wrap">
  <div class="stage">
    <figure class="phone" id="phone"><canvas id="cv" role="img" aria-label="Dodo launch animation: the dodo hatches on its jelly island"></canvas></figure>
    <section class="panel" aria-label="Playback controls">
      <div class="head">
        <h1>Dodo Launch</h1>
        <p>“Hatch”, the new LaunchSplashView: 3.4 s of picture, 3.7 s of synthesized sound. Tap the phone while it plays to skip to the exit.</p>
      </div>
      <button class="play" id="play" type="button"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.2v15.6c0 1 1.1 1.6 2 1.1l12.2-7.8c.8-.5.8-1.7 0-2.2L5 1.1C4.1.6 3 1.2 3 2.2z" fill="currentColor"/></svg><span id="playLbl">Play with sound</span></button>
      <div class="row">
        <button class="btn" id="replay" type="button">Replay</button>
        <div class="seg" role="group" aria-label="Speed"><button type="button" id="sp1" aria-pressed="true">1×</button><button type="button" id="sp4" aria-pressed="false">0.25×</button></div>
        <div class="seg" role="group" aria-label="Time of day"><button type="button" id="day" aria-pressed="true">Day</button><button type="button" id="night" aria-pressed="false">Night</button></div>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="Sound"><button type="button" id="sndOn" aria-pressed="true">Sound on</button><button type="button" id="sndOff" aria-pressed="false">Off</button></div>
        <div class="seg" role="group" aria-label="Motion"><button type="button" id="rmOff" aria-pressed="true">Full motion</button><button type="button" id="rmOn" aria-pressed="false">Reduce Motion</button></div>
      </div>
      <div class="scrub">
        <label class="lbl" for="scrub">Scrub (silent)</label>
        <input type="range" id="scrub" min="0" max="3.6" step="0.005" value="2.64">
        <output id="tOut" for="scrub">2.64 s</output>
      </div>
      <div class="sheet">
        <h2>Cue sheet</h2>
        <div class="tablebox"><table class="cues"><thead><tr><th>Time</th><th>Beat</th><th>Sound</th></tr></thead><tbody id="cueBody"></tbody></table></div>
      </div>
    </section>
  </div>
</main>

<script>
'use strict';
/* =====================================================================
   Dodo Launch · "Hatch"
   One cue list drives picture and sound. Every frame is a pure function
   of time t (seconds). Seeded RNG is used only to build LAYOUT once.
   ===================================================================== */
const TAU = Math.PI * 2, W = 390, H = 844;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - (1 - t) ** 3, easeInCubic = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(clamp(t)); };
}
/* the app's overshoot ease, cubic-bezier(.34,1.56,.64,1), used for ~0.28 s pose blends */
const jelly = cubicBezier(.34, 1.56, .64, 1);
const blend = (t, t0, d = .28) => jelly(clamp((t - t0) / d));
/* underdamped spring step response 0 -> 1 (overshoots), w rad/s, z damping */
function spring(t, w, z) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
/* decaying wobble */
const wob = (t, A, k, f) => t < 0 ? 0 : A * Math.exp(-k * t) * Math.sin(TAU * f * t);
const tri = (t, c, w) => clamp(1 - Math.abs(t - c) / w);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- color ---------- */
function hexRgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function shade(c, t) { return t >= 0 ? mix(c, '#ffffff', t) : mix(c, '#1a0f24', -t); }
function rgba(c, a) { const A = hexRgb(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }

/* =====================================================================
   THE SCORE: one cue list. Visual beats read their times from it (B.id);
   the synth plays every cue that has a voice. Port: this table becomes
   a Swift array of LaunchCue; each voice is a JellySynth function.
   ===================================================================== */
const NOTE = { F2: 87.31, C3: 130.81, F3: 174.61, G3: 196.00, A3: 220.00, C4: 261.63, D4: 293.66, F4: 349.23, G4: 392.00, A4: 440.00, C5: 523.25, D5: 587.33, F5: 698.46, G5: 783.99, A5: 880.00, C6: 1046.50, D6: 1174.66, F6: 1396.91 };
const CUES = [
  { t: 0.00, id: 'pad', beat: 'Static launch screen (peach ground only)', voice: 'pad', gain: .045, dur: 3.62, chordA: ['F4', 'G4', 'C5'], chordB: ['F4', 'A4', 'C5', 'D5'], bass: 'F3', change: 1.55, exitAt: 3.05, lp: [900, 2100, 1600], duck: [.3, .95] },
  { t: 0.02, id: 'island', beat: 'Island rises from below', voice: 'bloop', gain: .13, f: [300, 184, 500] },
  { t: 0.03, id: 'swish', beat: 'Water swish', voice: 'swish', gain: .1, dur: .55, bp: [300, 1300] },
  { t: 0.30, id: 'land', beat: 'Island jelly-squash, ripple ring', voice: 'blub', gain: .16, f: [520, 300] },
  { t: 0.35, id: 'tree1', beat: 'Gum tree pops', voice: 'pluck', gain: .24, note: 'F4', pan: -.5 },
  { t: 0.47, id: 'tree2', beat: 'Second gum tree pops', voice: 'pluck', gain: .24, note: 'G4', pan: .35 },
  { t: 0.59, id: 'windmill', beat: 'Windmill pops, sails start turning', voice: 'pluck', gain: .23, note: 'A4', pan: -.35 },
  { t: 0.71, id: 'lighthouse', beat: 'Lighthouse pops', voice: 'pluck', gain: .22, note: 'C5', pan: .55 },
  { t: 0.83, id: 'mushrooms', beat: 'Three mushrooms pop', voice: 'pluck', gain: .18, notes: ['D5', 'F5', 'G5'], step: .04, pan: -.55 },
  { t: 1.00, id: 'wobble1', beat: 'Egg wobbles', voice: 'tick', gain: .20, f: 760 },
  { t: 1.07, id: 'crack1', beat: 'Hairline crack', voice: 'crackle', gain: .34, n: 3, seed: 11 },
  { t: 1.20, id: 'wobble2', beat: 'Egg wobbles harder', voice: 'tick', gain: .28, f: 700 },
  { t: 1.27, id: 'crack2', beat: 'Second crack', voice: 'crackle', gain: .42, n: 4, seed: 12 },
  { t: 1.40, id: 'wobble3', beat: 'Egg wobbles hardest', voice: 'tick', gain: .38, f: 640 },
  { t: 1.46, id: 'crack3', beat: 'Crack runs round the egg', voice: 'crackle', gain: .5, n: 6, seed: 13 },
  { t: 1.55, id: 'hatch', beat: 'HATCH: shells fly, dodo pops up', voice: 'hatch', gain: 1.25, seed: 21 },
  { t: 1.58, id: 'sparkle', beat: 'Sparkle burst', voice: 'bells', gain: .16, notes: ['C5', 'F5', 'A5', 'C6', 'D6', 'F6'], step: .045 },
  { t: 1.85, id: 'dodoLand', beat: 'Dodo lands: > < squish, tuft boing', voice: 'squish', gain: .26 },
  { t: 1.92, id: 'l1', beat: 'Letter d lands', voice: 'boing', gain: .19, note: 'F4', bend: .72, pan: -.3 },
  { t: 2.05, id: 'l2', beat: 'Letter o lands', voice: 'boing', gain: .19, note: 'A4', bend: .72, pan: -.1 },
  { t: 2.18, id: 'l3', beat: 'Letter d lands', voice: 'boing', gain: .18, note: 'C5', bend: .72, pan: .1 },
  { t: 2.31, id: 'l4', beat: 'Letter o lands', voice: 'boing', gain: .17, note: 'F5', bend: .72, pan: .3 },
  { t: 2.38, id: 'blink1', beat: 'Blink', voice: null },
  { t: 2.42, id: 'beam', beat: 'Lighthouse beam sweeps', voice: 'shimmer', gain: .05, dur: .5 },
  { t: 2.51, id: 'bee', beat: 'A bee loops past', voice: 'buzz', gain: .095, dur: .5 },
  { t: 2.52, id: 'blink2', beat: 'Blink again', voice: null },
  { t: 2.75, id: 'hop', beat: 'Hello hop, tuft spins, cheeks glow', voice: 'boing', gain: .2, note: 'C5', bend: .75, rise: 1.335, tau: .2 },
  { t: 3.05, id: 'exit', beat: 'Zoom toward dodo, dissolve to paper', voice: 'bloom', gain: .3, notes: ['F4', 'A4', 'C5', 'F5', 'A5'], bass: 'F3', chime: ['F5', 'C6'] },
  { t: 3.40, id: 'end', beat: 'App paper (#F8F2F8 / #17131D)', voice: null },
];
/* Reduce Motion: a crossfade with its own short, gentle score */
const R_CUES = [
  { t: 0.00, id: 'pad', beat: 'Static launch screen', voice: 'pad', gain: .07, dur: 2.9, chordA: ['F4', 'G4', 'C5'], chordB: ['F4', 'A4', 'C5', 'D5'], bass: 'F3', change: .7, exitAt: 2.1, lp: [900, 1900, 1600] },
  { t: 0.05, id: 'appear', beat: 'Island and dodo fade in', voice: 'pluck', gain: .22, notes: ['F4', 'A4'], step: .06 },
  { t: 0.70, id: 'word', beat: 'Wordmark fades in', voice: 'bells', gain: .1, notes: ['C5', 'F5', 'A5'], step: .07 },
  { t: 2.10, id: 'exit', beat: 'Crossfade to paper', voice: 'bloom', gain: .22, notes: ['F4', 'A4', 'C5', 'F5', 'A5'], bass: 'F3', chime: ['F5'] },
  { t: 2.45, id: 'end', beat: 'App paper', voice: null },
];
const B = Object.fromEntries(CUES.map(c => [c.id, c.t]));
const RB = Object.fromEntries(R_CUES.map(c => [c.id, c.t]));
const SKIP_EXIT = 0.32;           // exit length after a tap-to-skip
const REST_T = 2.66;              // scene time shown (static) in Reduce Motion

/* =====================================================================
   STAGE GEOMETRY (logical points, 390 x 844)
   ===================================================================== */
const ISL = { x: 195, y: 392, rx: 148, ry: 56, th: 18 };    // island top-surface centre; waterline is th lower
const NEST = { x: 0, y: 10 };                                   // island-local
const EGG = { x: 0, y: -13, rx: 21, ry: 27 };                   // island-local egg centre
const DODO_S = 1.25;                                            // dodo scale (1 unit = 1.12 pt)
const WM = { size: 92, baseline: 588, track: 2.5 };
/* Layout: island group scaled 1.265 (1.1 x 1.15) about its waterline centre, placed at y 368;
   wordmark at 1.1 with its baseline at 578, clear of the water. Group (sails top to wordmark
   bottom) is centred on ~47 % of the screen height. */
const ISL_S = 1.265, ISL_Y = 368, WM_Y = 578, WM_S = 1.1;
const ISL_M = new DOMMatrix().translate(195, ISL_Y).scale(ISL_S).translate(-195, -(ISL.y + ISL.th));
const WM_M = new DOMMatrix().translate(195, WM_Y).scale(WM_S).translate(-195, -WM.baseline);
const FACE_Y = ISL_Y + (ISL.y + NEST.y - 52 - (ISL.y + ISL.th)) * ISL_S;   // zoom anchor, screen pt
const BEE_DUR = .5;
const PROPS = [
  { id: 'tree2', kind: 'tree', x: 74, y: -26, s: .82, canopy: '#7ED67C', fr: ['#FF6F9F', '#FFD43A', '#A77BF2'], seed: 3, d: 0 },
  { id: 'windmill', kind: 'windmill', x: -80, y: -18, s: .78, d: 0 },
  { id: 'lighthouse', kind: 'lighthouse', x: 116, y: 0, s: .72, d: 0 },
  { id: 'tree1', kind: 'tree', x: -114, y: 8, s: .68, canopy: '#8EDC86', fr: ['#FF9F4A', '#FFD43A'], seed: 5, d: 0 },
  { id: 'mushrooms', kind: 'mush', x: -104, y: 20, s: .62, d: 0 },
  { id: 'mushrooms', kind: 'mush', x: -124, y: 29, s: .38, d: .08 },
  { id: 'mushrooms', kind: 'mush', x: -98, y: 38, s: .42, d: .04 },
];

/* ---------- LAYOUT: built once from seeded RNG ---------- */
const LAYOUT = (() => {
  const R = rng(2026), L = {};
  L.stars = []; for (let i = 0; i < 26; i++) L.stars.push({ x: 18 + R() * 354, y: 34 + R() * 250, r: .7 + R() * 1.3, ph: R() * TAU, big: R() < .22 });
  const keep = [[-80, -18, 30], [74, -26, 26], [-114, 8, 20], [116, 0, 22], [-108, 28, 26], [0, 6, 58], [-58, 34, 22], [66, 32, 22]];
  const free = (x, y) => keep.every(([a, b, r]) => ((x - a) / r) ** 2 + ((y - b) / (r * .6)) ** 2 > 1);
  const inGrass = (x, y, k = .92) => ((x + 2) / (ISL.rx * .84)) ** 2 + ((y + 3) / (ISL.ry * .78)) ** 2 < k;
  L.flowers = []; L.tufts = [];
  const FC = ['#FF9FC8', '#FFFFFF', '#A77BF2', '#FFAA82', '#5EC6EC'];
  for (let i = 0; i < 400 && L.flowers.length < 24; i++) { const x = (R() * 2 - 1) * 130, y = (R() * 2 - 1) * 46; if (inGrass(x, y, .8) && free(x, y)) L.flowers.push({ x, y, s: .8 + R() * .5, c: FC[Math.floor(R() * FC.length)] }); }
  for (let i = 0; i < 600 && L.tufts.length < 34; i++) { const x = (R() * 2 - 1) * 130, y = (R() * 2 - 1) * 46; if (inGrass(x, y, .9) && free(x, y)) L.tufts.push({ x, y, s: .8 + R() * .6 }); }
  L.flowers.sort((a, b) => a.y - b.y); L.tufts.sort((a, b) => a.y - b.y);
  L.pebbles = []; for (let i = 0; i < 22; i++) { const a = R() * Math.PI * .9 + Math.PI * .05, k = .9 + R() * .07; L.pebbles.push({ x: Math.cos(a) * ISL.rx * k, y: Math.sin(a) * ISL.ry * k, r: .9 + R() * 1.2, c: ['#E8C9A0', '#FFFFFF', '#F7B9CF', '#D9B990'][i % 4] }); }

/* =====================================================================

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

}
function render() {

}
function syncUI() {

  const cues = cuesNow(); let cur = -1; cues.forEach((c, i) => { if (S.t >= c.t - .001) cur = i; });
