<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dodo · jelly map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2433; --ink2:rgba(58,36,51,.62); --glass:rgba(255,250,252,.78); --line:rgba(120,70,100,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --glass:rgba(40,30,48,.78); --ink:#fbeef6; --ink2:rgba(251,238,246,.65); --line:rgba(255,255,255,.14); }
}
:root[data-theme="dark"]{ --glass:rgba(40,30,48,.78); --ink:#fbeef6; --ink2:rgba(251,238,246,.65); --line:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:linear-gradient(#ffd3b4 50%,#9cd58e 50%)}
body{position:relative;overflow:hidden;background:#f6dcea;font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font:inherit;color:inherit}
.pill{height:42px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;gap:5px;padding:0 12px;font-weight:900;font-size:17px;
  box-shadow:0 4px 14px rgba(120,60,90,.14), inset 0 1px 0 rgba(255,255,255,.7)}
.pill svg{width:18px;height:18px;flex-shrink:0}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hud>div{display:flex;gap:6px;align-items:center}
.hud button,.hud .pill{pointer-events:auto}
button.pill{cursor:pointer;padding:0;width:42px;justify-content:center}
.av{width:54px;height:54px;border-radius:50%;padding:0;border:3px solid #fff;background:radial-gradient(circle at 40% 35%,#fff6fb,#f3d6ec);
  position:relative;cursor:pointer;box-shadow:0 4px 14px rgba(120,60,90,.22);overflow:visible}
.av canvas{width:100%;height:100%;border-radius:50%;display:block}
.av .lv{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#fff;color:#3a2433;font-weight:900;font-size:12px;padding:1px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.streak b{color:#f28a2e;font-weight:900;font-size:16px}
.bolt span{font-variant-numeric:tabular-nums}
.banner{position:absolute;left:12px;right:12px;top:78px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:22px;
  background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 6px 18px rgba(120,60,90,.14);font-size:16px;line-height:1.3;font-weight:700;transition:opacity .3s,transform .3s}
.banner.gone{opacity:0;transform:translateY(-8px);pointer-events:none}
.banner .ic{width:38px;height:38px;border-radius:50%;background:linear-gradient(#fff4e3,#ffe2bd);display:grid;place-items:center;flex-shrink:0}
.banner .ic svg{width:20px;height:20px}
.banner p{margin:0;flex:1;color:var(--ink2)} .banner p b{color:var(--ink);font-weight:900}
.banner button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(150,110,130,.12);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.tabs{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;padding:5px;border-radius:999px;background:rgba(40,30,48,.86);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(40,10,40,.3)}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.62);font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
.tabs svg{width:20px;height:20px}
#snd{position:absolute;right:14px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:grid;place-items:center;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#snd svg{width:20px;height:20px}
.toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);opacity:0;background:rgba(40,30,48,.9);color:#fff;font-weight:800;font-size:15px;
  padding:10px 16px;border-radius:999px;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-width:460px;margin:0 auto;border-radius:28px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(60,20,60,.3);padding:22px 20px 18px;
  transform:translateY(120%);transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:5}
.sheet.on{transform:translateY(0)}
.sheet .k{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0}
.sheet h2{margin:4px 0 6px;font-size:26px;font-weight:900;line-height:1.15}
.sheet .meta{margin:0 0 16px;font-size:15px;font-weight:700;color:var(--ink2)}
.sheet .row{display:flex;gap:10px}
.go{flex:1;height:54px;border:0;border-radius:18px;font-size:19px;font-weight:900;color:#fff;cursor:pointer;
  background:radial-gradient(120% 140% at 30% 15%,#d9c2ff,#a77bf2 45%,#6a3fc4);box-shadow:inset 0 -5px 10px rgba(50,10,120,.35),inset 0 3px 4px rgba(255,255,255,.55),0 6px 16px rgba(106,63,196,.35);
  text-shadow:0 1px 0 rgba(60,20,120,.4)}
.go:active{transform:scale(.97)}
.later{height:54px;padding:0 18px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink2)}
:focus-visible{outline:3px solid #a77bf2;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Level map. Scroll to explore. Tap a level to send Dodo there, tap critters and chests."></canvas>
<div class="hud">
  <div>
    <button class="av" id="av" aria-label="Change Dodo's color"><canvas id="avc" width="112" height="112"></canvas><span class="lv">L17</span></button>
    <div class="pill streak" aria-label="12 day streak, 3x multiplier"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-3 1.5-4.5 2.5-6 .3 2 1.3 3 2.3 3-.8-3-.3-5.6.2-8z" fill="#ff8a3d"/><path d="M12 12c.6 2 2.5 2.5 2.5 5a2.5 2.5 0 0 1-5 0c0-1.6 1.2-2.4 2.5-5z" fill="#ffd25e"/></svg>12 <b>×3</b></div>
  </div>
  <div>
    <button class="pill" aria-label="Quotes"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11.5C4 8 6 6 9 5.5v2.6c-1.4.5-2 1.4-2.1 2.7H10V18H4zM14 11.5c0-3.5 2-5.5 5-6v2.6c-1.4.5-2 1.4-2.1 2.7H20V18h-6z"/></svg></button>
    <button class="pill" aria-label="Cards"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="8" width="16" height="12" rx="3"/><rect x="6" y="5" width="12" height="2" rx="1"/><rect x="8" y="2.5" width="8" height="1.6" rx=".8"/></svg></button>
    <div class="pill bolt"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.5h-5.5z" fill="#f5a623"/></svg><span id="coins">10,735</span></div>
  </div>
</div>
<div class="banner" id="banner">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#f0962e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4h-4"/></svg></div>
  <p>This week: <b>How LLMs work</b> refresher, due tomorrow.</p>
  <button id="bx" aria-label="Dismiss"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<nav class="tabs" aria-label="Sections">
  <button id="tTopics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Topics</button>
  <button class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.5h-5.5z" fill="#f5a623"/></svg>Peck</button>
</nav>
<button id="snd" aria-label="Mute sound"><svg id="sndIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="shT">
  <p class="k" id="shK">Level 8 · Jelly Lagoon</p>
  <h2 id="shT">Fine-tuning &amp; RLHF</h2>
  <p class="meta" id="shM">Due in 4 days · about 6 minutes · 3 stars up for grabs</p>
  <div class="row"><button class="later" id="shX">Later</button><button class="go" id="shGo">Peck it</button></div>
</div>
<script>
(function(){
"use strict";
const TAU=Math.PI*2, HP=Math.PI/2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1,CZ=1,COX=0;
/* ---------------- audio ---------------- */
let AC=null, soundOn=true;
function ac(){
  if(!soundOn) return null;
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function bloop(f0,f1,dur,vol,type){
  const a=ac(); if(!a) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function popSound(){
  const a=ac(); if(!a) return;
  const t=a.currentTime, len=Math.floor(a.sampleRate*0.09), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=buf; f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.8; g.gain.value=0.35;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
  bloop(620,140,0.16,0.22);
  setTimeout(()=>bloop(300,90,0.25,0.12),40);
}
/* ---------------- face helpers (spec units) ---------------- */
const INK='#2a1f2b';
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);}
function soft(x,y,rx,ry,col){
  ctx.save(); ctx.translate(x,y); ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,0,0,0,rx); g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rx,0,TAU); ctx.fill(); ctx.restore();
}
function blush(x,y,r,col){ soft(x,y,r,r*0.7,col||'rgba(255,90,130,.42)'); }
function strokeStyle(w,col){ctx.lineWidth=w;ctx.strokeStyle=col||INK;ctx.lineCap='round';ctx.lineJoin='round';}
function squint(x,y,r){
  const s=x<0?1:-1; strokeStyle(Math.max(2,r*0.42));
  ctx.beginPath(); ctx.moveTo(x-s*r*0.7,y-r*0.6); ctx.lineTo(x+s*r*0.55,y); ctx.lineTo(x-s*r*0.7,y+r*0.6); ctx.stroke();
}
function closedLid(x,y,r){ strokeStyle(Math.max(2,r*0.38)); ctx.beginPath(); ctx.arc(x,y-r*0.5,r*0.85,0.25*Math.PI,0.75*Math.PI); ctx.stroke(); }
function eyeDot(b,x,y,r){
  if(b.squeeze>0) return squint(x,y,r*1.15);
  if(b.blinking) return closedLid(x,y,r);
  const lx=x+b.lookX*r*0.35, ly=y+b.lookY*r*0.35;
  ctx.fillStyle=INK; ell(lx,ly,r,r*1.12); ctx.fill();
  ctx.fillStyle='#fff'; ell(lx-r*0.32,ly-r*0.38,r*0.36,r*0.36); ctx.fill();
  ctx.globalAlpha=.8; ell(lx+r*0.35,ly+r*0.4,r*0.15,r*0.15); ctx.fill(); ctx.globalAlpha=1;
}
function eyeSparkle(b,x,y,r,iris,lashes){
  if(b.squeeze>0) return squint(x,y,r);
  if(b.blinking) return closedLid(x,y,r);
  const lx=b.lookX*r*0.22, ly=b.lookY*r*0.22;
  ctx.fillStyle=INK; ell(x,y,r,r*1.1); ctx.fill();
  const g=ctx.createRadialGradient(x+lx,y+ly+r*0.35,0,x+lx,y+ly,r*0.85);
  g.addColorStop(0,iris[0]); g.addColorStop(1,iris[1]);
  ctx.fillStyle=g; ell(x+lx,y+ly+r*0.08,r*0.78,r*0.86); ctx.fill();
  ctx.fillStyle=INK; ell(x+lx,y+ly+r*0.1,r*0.38,r*0.42); ctx.fill();
  ctx.fillStyle='#fff'; ell(x+lx-r*0.3,y+ly-r*0.35,r*0.32,r*0.32); ctx.fill();
  ell(x+lx+r*0.32,y+ly+r*0.38,r*0.15,r*0.15); ctx.fill();
  if(lashes){
    const s=x<0?-1:1; strokeStyle(r*0.22);
    ctx.beginPath(); ctx.moveTo(x+s*r*0.8,y-r*0.55); ctx.lineTo(x+s*r*1.25,y-r*0.85);
    ctx.moveTo(x+s*r*0.95,y-r*0.15); ctx.lineTo(x+s*r*1.4,y-r*0.3); ctx.stroke();
  }
}
function eyeHappy(b,x,y,r){
  if(b.squeeze>0) return squint(x,y,r);
  strokeStyle(Math.max(2,r*0.36)); ctx.beginPath(); ctx.arc(x,y+r*0.45,r*0.85,1.15*Math.PI,1.85*Math.PI); ctx.stroke();
}
function mouth(b,x,y,w,kind){
  if(b.squeeze>0){ ctx.fillStyle='#7a1f33'; ell(x,y+w*0.3,w*0.55,w*0.7); ctx.fill(); return; }
  strokeStyle(Math.max(1.8,w*0.42));
  ctx.beginPath();
  if(kind==='w'){ ctx.arc(x-w*0.5,y,w*0.5,0.1*Math.PI,0.9*Math.PI); ctx.moveTo(x+w,y); ctx.arc(x+w*0.5,y,w*0.5,0.1*Math.PI,0.9*Math.PI); }
  else ctx.arc(x,y-w*0.45,w,0.22*Math.PI,0.78*Math.PI);
  ctx.stroke();
}

/* ---------------- critter catalog ---------------- */
// o: outline (superellipse a, bt (top), bb (bottom), n exponent, bumps); c: [light, base, dark]
const K={
  bunny:{c:['#ffe0ef','#ff9fc8','#e9649d'],rim:'rgba(185,30,100,.55)',k:.2,
    o:{a:36,bt:36,bb:38,n:2.8,np:72,bumps:[
      {at:-HP-.43,h:34,w:.16,p:4,dir:-HP-.2},{at:-HP+.43,h:34,w:.16,p:4,dir:-HP+.2},
      {at:HP-.45,h:3,w:.1},{at:HP+.45,h:3,w:.1}]},
    face(b){
      ctx.fillStyle='rgba(255,120,170,.38)'; ell(-20,-52,5,11,-.2); ctx.fill(); ell(20,-52,5,11,.2); ctx.fill();
      soft(0,24,18,13,'rgba(255,245,250,.6)');
      ctx.fillStyle='rgba(255,235,244,.65)'; ell(-10,25,5.5,4.2); ctx.fill(); ell(10,25,5.5,4.2); ctx.fill();
      blush(-21,9,6.5); blush(21,9,6.5);
      eyeSparkle(b,-13,0,7.2,['#c86a7e','#5a2232'],true); eyeSparkle(b,13,0,7.2,['#c86a7e','#5a2232'],true);
      mouth(b,0,9,2.4,'w');
    }},
  peach:{c:['#ffe6cf','#ffaa82','#f06c55'],rim:'rgba(215,70,45,.5)',k:.2,
    o:{a:46,bt:40,bb:34,n:2.3,nb:3.4,np:52,bumps:[{at:-HP,h:6,w:.06}]},
    face(b){
      strokeStyle(3,'rgba(214,82,60,.22)'); ctx.beginPath(); ctx.moveTo(4,-40); ctx.quadraticCurveTo(26,-12,14,28); ctx.stroke();
      const g=ctx.createRadialGradient(-2,-46,0,0,-43,7); g.addColorStop(0,'#ffc56a'); g.addColorStop(1,'#f0891c');
      ctx.fillStyle=g; ell(0,-43,6.5,5.5); ctx.fill();
      eyeDot(b,-15,4,4.4); eyeDot(b,15,4,4.4); mouth(b,0,9,5);
      blush(-25,12,7,'rgba(255,80,90,.25)'); blush(25,12,7,'rgba(255,80,90,.25)');
    }},
  cat:{c:['#e2fff4','#91e9cc','#4dc5a2'],rim:'rgba(25,135,105,.5)',k:.22,
    o:{a:44,bt:34,bb:34,n:3.2,np:64,bumps:[{at:-HP-.62,h:17,w:.12,dir:-HP-.55},{at:-HP+.62,h:17,w:.12,dir:-HP+.55}]},
    face(b){
      ctx.fillStyle='rgba(255,150,180,.5)'; ctx.beginPath(); ctx.moveTo(-34,-34); ctx.lineTo(-31,-46); ctx.lineTo(-24,-36); ctx.fill();
      ctx.beginPath(); ctx.moveTo(34,-34); ctx.lineTo(31,-46); ctx.lineTo(24,-36); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.88)'; ell(-6.5,11,9,7); ctx.fill(); ell(6.5,11,9,7); ctx.fill();
      ell(-15,31,9,6); ctx.fill(); ell(15,31,9,6); ctx.fill();
      eyeHappy(b,-16,-2,6.5); eyeHappy(b,16,-2,6.5);
      ctx.fillStyle='#ff8fa8'; ctx.beginPath(); ctx.moveTo(-3,5.5); ctx.lineTo(3,5.5); ctx.lineTo(0,8.5); ctx.fill();
      mouth(b,0,11,2.6,'w');
      blush(-27,8,6); blush(27,8,6);
    }},
  dragon:{c:['#c8f7d6','#5fbf86','#2c8a55'],rim:'rgba(15,85,45,.55)',k:.22,
    o:{a:31,bt:36,bb:38,n:2.4,np:64,bumps:[
      {at:-HP-.45,h:12,w:.08,dir:-HP-.35},{at:-HP+.45,h:12,w:.08,dir:-HP+.35},
      {at:-.18,h:15,w:.15,p:3,dir:-.35},{at:Math.PI+.18,h:15,w:.15,p:3,dir:Math.PI+.35},
      {at:HP-.45,h:4,w:.1},{at:HP+.45,h:4,w:.1}]},
    face(b){
      soft(0,20,17,17,'rgba(240,255,215,.85)');
      ctx.fillStyle='rgba(255,236,170,.55)'; ell(-12,-44,3,5,-.3); ctx.fill(); ell(12,-44,3,5,.3); ctx.fill();
      blush(-20,4,5.5); blush(20,4,5.5);
      eyeSparkle(b,-11,-8,8,['#3f8f5e','#10331f']); eyeSparkle(b,11,-8,8,['#3f8f5e','#10331f']);
      mouth(b,0,4,3.4);
    }},
  gummy:{c:['#ff9cc4','#ff3c86','#c9145a'],rim:'rgba(140,0,50,.55)',k:.3,alpha:.94,
    o:{a:30,bt:40,bb:40,n:2.2,np:60,bumps:[
      {at:-HP-.62,h:9,w:.13,p:4},{at:-HP+.62,h:9,w:.13,p:4},
      {at:.3,h:6,w:.16},{at:Math.PI-.3,h:6,w:.16},
      {at:HP-.5,h:5,w:.1},{at:HP+.5,h:5,w:.1}]},
    face(b){
      soft(0,18,15,15,'rgba(255,190,215,.5)');
      eyeDot(b,-9,-14,4); eyeDot(b,9,-14,4); mouth(b,0,-8,3.6);
      blush(-17,-6,5,'rgba(255,190,210,.5)'); blush(17,-6,5,'rgba(255,190,210,.5)');
    }},
  penguin:{c:['#6c6c7c','#26262f','#0b0b10'],rim:'rgba(0,0,0,.65)',k:.3,
    o:{a:32,bt:40,bb:38,n:2.1,np:52,bumps:[{at:.15,h:7,w:.2},{at:Math.PI-.15,h:7,w:.2}]},

  g.addColorStop(0,sp.c[0]); g.addColorStop(0.5,sp.c[1]); g.addColorStop(1,sp.c[2]);
  if(sp.stops){
    const p0=toWorld(b,0,sp.sy[0]), p1=toWorld(b,0,sp.sy[1]);
    const lg=ctx.createLinearGradient(p0[0],p0[1],p1[0],p1[1]);
    for(const [t,c] of sp.stops) lg.addColorStop(t,c);
    ctx.fillStyle=lg; ctx.fill();

  ctx.save(); ctx.translate(hx,hy); ctx.rotate(-0.55); ctx.scale(1,0.5);

  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,0,o.a*0.38,0,TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.95)'; ell(hx-o.a*0.08,hy-o.bt*0.02,o.a*0.07,o.a*0.045,-0.6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ell(o.a*0.55,o.bb*0.35,o.a*0.05,o.a*0.11,-0.3); ctx.fill();
  ctx.restore();
  ctx.restore(); // clip

}

function tap(x,y){

  for(let i=actors.length-1;i>=0;i--){ const b=actors[i]; if(b.contains(x,y,4)){ pokeActor(b,x,y); return; } }
  for(const c of CHESTS){ if(Math.abs(x-c.x)<24&&Math.abs(y-(c.y-10))<22){ openChest(c); return; } }
  for(const s of SIGNS){ if(Math.abs(x-s.x)<56&&Math.abs(y-(s.y-34))<16){ toast(s.toast); bloop(500,700,0.08,0.06,'triangle'); return; } }

  if(y<300){ toast('Sugar Castle opens after level 18'); bloop(300,240,0.15,0.08); return; }

  if(!b.hopping) hopInPlace(b,2.1+Math.random()*0.6,(x-b.cx)/b.core*0.4);

/* ================= particles ================= */
let parts=[], rain=[], petals=[];
function burst(x,y,n,cols){ for(let i=0;i<n;i++){ const a=rnd(-Math.PI,0), v=rnd(1.5,4.5);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:rnd(3,6),t:0,life:rnd(.7,1.2),col:cols[(Math.random()*cols.length)|0],rot:rnd(0,TAU),kind:Math.random()<0.5?'s':'t'}); } }

/* ================= simulation ================= */
function step(){
  const t=performance.now()/1000;
  const top=camY-200, bot=camY+viewH()+200;
  for(const b of actors){
    if(!b.isPlayer&&(b.cy<top||b.cy>bot)) continue;
    const G=1900*b.s*hh*hh;
    for(let s=0;s<SUBS;s++){
      const x=b.x,p=b.p, flo=b.float;
      const damp=b.hopping?1:(flo?0.985:0.996), gk=flo?0.15:1;
      let nx=0,ny=0;
      if(flo){ const ty=b.anchorY+Math.sin(t*2+b.id)*6, tx=b.anchorX+Math.sin(t*0.6+b.id*2)*10;
        ny=clamp((ty-b.cy)*0.002,-0.2,0.2); nx=clamp((tx-b.cx)*0.0008,-0.1,0.1); }
      for(let i=0;i<b.N;i++){
        const vx=(x[2*i]-p[2*i])*damp, vy=(x[2*i+1]-p[2*i+1])*damp;
        p[2*i]=x[2*i]; p[2*i+1]=x[2*i+1];
        x[2*i]+=vx+nx; x[2*i+1]+=vy+G*gk+ny;
      }
      b.upright=b.hopping?0.004:((b.grounded||flo)?0.035:0.01);
      b.shapeMatch(b.sp.k,0.42);
      let ground=false;
      if(b.floorOn){
        for(let i=0;i<b.N;i++){ if(x[2*i+1]>b.floor){ const vy=x[2*i+1]-p[2*i+1]; x[2*i+1]=b.floor; ground=true;
          p[2*i]=x[2*i]-(x[2*i]-p[2*i])*0.6; if(vy>2.4*b.s) p[2*i+1]=b.floor+vy*0.22;
          if(vy>3.2*b.s&&b.thudCD<=0&&s===0){ b.thudCD=0.25; bloop(b.isPlayer?170:240,100,0.08,Math.min(0.1,vy*0.01)); } } }
      }
      b.grounded=ground;
    }
    b.bounds();
    b.vyAvg=b.cy-b.prevCy; b.prevCy=b.cy;
    // landing
    if(b.hopping&&b.vyAvg>0&&b.maxY>=b.targetFloor-2){
      b.hopping=false; b.floorOn=true; b.floor=b.targetFloor; b.at=b.target; b.squeeze=0.2;
      if(b.queue.length) setTimeout(nextHop,140);
      else if(b.at===CUR){ setTimeout(()=>{ if(!player.hopping&&player.at===CUR) honk(1); },250); }
    }
    b.thudCD-=DT; b.squeeze=Math.max(0,b.squeeze-DT);
    b.blinkT-=DT; b.blinking=b.blinkT<0.13&&b.blinkT>0; if(b.blinkT<0) b.blinkT=rnd(2,6);
    // eyes
    let tx=0,ty=0;
    if(performance.now()-look.t<2500){ const dx=look.x-b.cx, dy=look.y-b.cy, L=Math.hypot(dx,dy)||1, k=Math.min(1,L/120); tx=dx/L*k; ty=dy/L*k; }
    else if(!b.isPlayer){ const dx=player.cx-b.cx, dy=player.cy-b.cy, L=Math.hypot(dx,dy)||1, k=Math.min(1,L/200); tx=dx/L*k; ty=dy/L*k; }
    else { ty=-0.4; }
    b.lookX+=(tx-b.lookX)*0.1; b.lookY+=(ty-b.lookY)*0.1;
    if(!reduceMotion&&!b.float&&!b.hopping){ b.hopT-=DT; if(b.hopT<0){ b.hopT=b.isPlayer?rnd(3,6):rnd(4,9); if(b.grounded) hopInPlace(b,rnd(1.2,2),rnd(-.25,.25)); } }
  }
  for(const n of NODES){ n.sv+=(1-n.sx)*0.22; n.sv*=0.82; n.sx+=n.sv; n.shake=Math.max(0,n.shake-DT); }
  for(const c of CHESTS){ c.lid+=((c.open?1:0)-c.lid)*0.15; c.lv*=0.86; }
  for(const p of parts){ p.t+=DT; p.vy+=0.12; p.x+=p.vx; p.y+=p.vy; p.vx*=0.98; p.rot+=0.2; }
  parts=parts.filter(p=>p.t<p.life);
  for(const r of rain){ r.t+=DT; r.vy+=0.15; r.y+=r.vy; }
  rain=rain.filter(r=>r.t<1.2);
  for(const pt of petals){ pt.y+=pt.v*DT*0.6; pt.x+=Math.sin(performance.now()/1400+pt.ph)*0.0006; pt.rot+=0.02; if(pt.y>1.05){pt.y=-0.05;pt.x=rnd(0,1);} }
  // camera
  if(!pd&&(player.hopping||player.queue.length)) camTarget=clamp(player.cy-viewH()*0.55,-150,Math.max(0,WH-viewH()));
  if(!pd){
    if(camTarget!==null){ camY+=(camTarget-camY)*0.08; if(Math.abs(camTarget-camY)<0.5) camTarget=null; }
    else if(Math.abs(camV)>0.05){ camY+=camV; camV*=0.94; }
    clampCam();
  }
  if(shownCoins<coins){ shownCoins=Math.min(coins,shownCoins+2); coinsEl.textContent=shownCoins.toLocaleString('en-US'); }
}

}

function drawPath(t){
  for(let i=0;i<SEGS.length;i++){
    const pts=SEGS[i], unlocked=i+1<=CUR, my=pts[12][1], reg=regionOf(my);
    if(!unlocked){
      let acc=0;
      for(let k=1;k<pts.length;k++){ const [x0,y0]=pts[k-1],[x1,y1]=pts[k], L=Math.hypot(x1-x0,y1-y0);
        for(let d=(18-acc%18);d<L;d+=18){ const px=x0+(x1-x0)*d/L, py=y0+(y1-y0)*d/L;
          if(nearNode(px,py,46)) continue;
          ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(px,py,3.6,0,TAU); ctx.fill(); }
        acc+=L; }
      continue;
    }
    if(reg==='lagoon'){
      let acc=0, n=0;
      for(let k=1;k<pts.length;k++){ const [x0,y0]=pts[k-1],[x1,y1]=pts[k], L=Math.hypot(x1-x0,y1-y0);
        for(let d=(24-acc%24);d<L;d+=24){ const px=x0+(x1-x0)*d/L, py=y0+(y1-y0)*d/L; n++;
          if(nearNode(px,py,58)) continue;
          const bob=Math.sin(t*2+n)*1.2;
          ctx.fillStyle='rgba(30,110,140,.2)'; ell(px,py+4+bob,11,5); ctx.fill();
          glossBall(px,py+bob,8,['#fff3dc','#ffd9a8','#e8ad6e']); }
        acc+=L; }
      continue;
    }
    const line=(w,col,dash)=>{ ctx.beginPath(); pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]); };
    line(34,'rgba(150,90,60,.18)'); line(28,'#f1c99f'); line(22,'#fff2df'); line(5,'#ffa9cf',[9,13]);
  }
}
function arch(){
  const x=195,y=1040, r=78;
  ctx.lineCap='butt';
  ctx.strokeStyle='rgba(120,40,80,.18)'; ctx.lineWidth=18; ctx.beginPath(); ctx.arc(x,y+4,r,Math.PI,0); ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=16; ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.moveTo(x-r,y); ctx.lineTo(x-r,y+40); ctx.moveTo(x+r,y); ctx.lineTo(x+r,y+40); ctx.stroke();
  ctx.strokeStyle='#ff4d6d'; ctx.setLineDash([10,10]); ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.moveTo(x-r,y); ctx.lineTo(x-r,y+40); ctx.moveTo(x+r,y); ctx.lineTo(x+r,y+40); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(x,y,r-4,Math.PI*1.1,Math.PI*1.45); ctx.stroke();
  ribbon(x,y-r-30,'TO SPRINKLE PEAKS','#b06cff');
}
function chest(c){
  const wob=Math.sin(performance.now()/60)*c.lv*0.3;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(wob);
  const locked=c.need>CUR;
  const body=locked?['#ece6f5','#c7bed8','#958aab']:['#ffd1e1','#ff8fb6','#d9507f'];
  ctx.fillStyle='rgba(60,30,60,.18)'; ell(0,2,22,5); ctx.fill();
  if(c.lid>0.05){ const gl=ctx.createRadialGradient(0,-16,0,0,-16,30); gl.addColorStop(0,'rgba(255,230,120,'+(0.8*c.lid)+')'); gl.addColorStop(1,'rgba(255,230,120,0)'); ctx.fillStyle=gl; ctx.fillRect(-32,-48,64,44); }
  const g=ctx.createLinearGradient(0,-20,0,0); g.addColorStop(0,body[1]); g.addColorStop(1,body[2]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-18,-20,36,20,6):ctx.rect(-18,-20,36,20); ctx.fill();
  ctx.fillStyle=locked?'#b3a9c4':'#ffd43a'; ctx.fillRect(-18,-13,36,4);
  ctx.save(); ctx.translate(0,-20); ctx.translate(0,0); ctx.rotate(-c.lid*0.9);
  const lg=ctx.createLinearGradient(0,-12,0,0); lg.addColorStop(0,body[0]); lg.addColorStop(1,body[1]);
  ctx.fillStyle=lg; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-19,-12,38,13,[8,8,3,3]):ctx.rect(-19,-12,38,13); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ell(-9,-8,6,2,0); ctx.fill();
  ctx.restore();
  if(locked){ ctx.strokeStyle='#8a809f'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(0,-12,4,Math.PI,0); ctx.stroke(); ctx.fillStyle='#8a809f'; ctx.fillRect(-5,-12,10,8); }
  else if(!c.open){ glossBall(0,-11,4,['#fff8d0','#ffd43a','#d9a000']); }
  ctx.restore();
}
function star(x,y,r,filled){
  ctx.beginPath(); for(let k=0;k<10;k++){ const a=-HP+k*TAU/10, rr=k%2?r*0.48:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } ctx.closePath();
  if(filled){ const g=ctx.createRadialGradient(x-r*0.3,y-r*0.4,0,x,y,r); g.addColorStop(0,'#fff6c2'); g.addColorStop(0.5,'#ffcf3a'); g.addColorStop(1,'#e59a00');
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='rgba(200,120,0,.5)'; ctx.lineWidth=1; ctx.stroke(); }
  else { ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fill(); ctx.strokeStyle='rgba(150,110,140,.3)'; ctx.lineWidth=1; ctx.stroke(); }
}
function drawNode(n,t){
  const st=n.i<CUR?'done':n.i===CUR?'cur':'locked', r=nodeR(n), cols=st==='locked'?LOCKED:RC[regionOf(n.y)];
  const sh=n.shake>0?Math.sin(n.shake*60)*4*n.shake*2:0;
  ctx.save(); ctx.translate(n.x+sh,n.y); ctx.scale(n.sx,2-n.sx);
  if(st==='cur'){ const p=(Math.sin(t*3)+1)/2;
    ctx.strokeStyle=`rgba(255,255,255,${0.55-p*0.35})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,3,r+12+p*10,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(255,210,90,.9)'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,3,r+7,0,TAU); ctx.stroke(); }
  ctx.fillStyle='rgba(60,30,60,.2)'; ell(0,r*0.62,r*1.05,r*0.34); ctx.fill();
  ctx.fillStyle=cols[2]; ctx.beginPath(); ctx.arc(0,7,r,0,TAU); ctx.fill();
  const g=ctx.createRadialGradient(-r*0.35,-r*0.45,r*0.05,0,0,r*1.25); g.addColorStop(0,cols[0]); g.addColorStop(0.55,cols[1]); g.addColorStop(1,cols[2]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.clip();
  ctx.shadowColor='rgba(80,20,60,.35)'; ctx.shadowBlur=10*CZ*DPR; ctx.shadowOffsetY=-4*CZ*DPR;
  ctx.beginPath(); ctx.rect(-r*3,-r*3,r*6,r*6); ctx.arc(0,0,r,0,TAU,true); ctx.fillStyle='#000'; ctx.fill();
  ctx.shadowColor='rgba(255,255,255,.8)'; ctx.shadowBlur=6*CZ*DPR; ctx.shadowOffsetY=3*CZ*DPR; ctx.fill();
  ctx.restore();
  const hg=ctx.createRadialGradient(-r*0.32,-r*0.45,0,-r*0.32,-r*0.45,r*0.5); hg.addColorStop(0,'rgba(255,255,255,.9)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.save(); ctx.translate(-r*0.3,-r*0.45); ctx.rotate(-0.5); ctx.scale(1,0.5); ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,0,r*0.5,0,TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.95)'; ell(-r*0.5,-r*0.42,r*0.09,r*0.055,-0.6); ctx.fill();
  if(st==='locked'){
    ctx.strokeStyle='rgba(90,75,110,.75)'; ctx.lineWidth=3.2; ctx.beginPath(); ctx.arc(0,-4,7,Math.PI,0); ctx.stroke();
    ctx.fillStyle='rgba(90,75,110,.75)'; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-10,-4,20,15,4):ctx.rect(-10,-4,20,15); ctx.fill();
  } else {
    ctx.font=`900 ${Math.round(r*0.9)}px Nunito, ui-rounded, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillText(String(n.i+1),0,4);
    ctx.fillStyle='#3a2433'; ctx.fillText(String(n.i+1),0,2.5);
  }
  ctx.restore();
  if(st==='done'){ for(let k=0;k<3;k++){ const a=-HP+(k-1)*0.55; star(n.x+Math.cos(a)*(r+12),n.y+Math.sin(a)*(r+12)+(k===1?-2:0),k===1?9:7.5,k<STARS[n.i]); } }
}
function drawCurrentDecor(){
  const n=NODES[CUR], r=nodeR(n);
  sign({x:n.x-96,y:n.y+28,text:'DUE IN 4 DAYS'});
  ribbon(n.x,n.y+r+16,'START','#3a2433');
}
function drawActorShadow(b){
  if(b.float) return;
  const fy=b.floorOn?b.floor:(b.isPlayer&&b.hopping?b.targetFloor:b.floor);
  const d=fy-b.maxY; if(d>140) return;
  const a=1-Math.max(0,d)/140, w=(b.maxX-b.minX)*0.42*(0.6+0.4*a);
  ctx.save(); ctx.globalAlpha=a*0.5; ctx.fillStyle='rgba(60,30,60,.5)'; ell(b.isPlayer&&b.hopping?b.cx:b.cx,fy+1,w,w*0.18); ctx.fill(); ctx.restore();
}

/* ================= render ================= */
function render(){
  const t=performance.now()/1000; TNOW=t;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.setTransform(DPR*CZ,0,0,DPR*CZ,DPR*COX,-DPR*camY*CZ);
  const top=camY-60, bot=camY+viewH()+60;
  if(top<440) drawSky();
  if(bot>300&&top<1140) drawPeaks();
  if(top<330) { drawCastle(); cloudBank(300); }
  if(bot>1080&&top<1900) drawLagoon(t);
  if(bot>1820) drawMeadow();
  drawPath(t);
  if(bot>960&&top<1140) arch();
  for(const s of SIGNS) sign(s);
  for(const c of CHESTS) chest(c);
  for(const n of NODES){ if(n.y>top-60&&n.y<bot+60) drawNode(n,t); }
  drawCurrentDecor();
  for(const b of actors) if(b.cy>top-80&&b.cy<bot+80) drawActorShadow(b);
  const order=actors.filter(b=>b.cy>top-120&&b.cy<bot+120).sort((a,b)=>(a.isPlayer?1:0)-(b.isPlayer?1:0)||a.maxY-b.maxY);
  for(const b of order) drawBody(b);
  for(const r of rain){ ctx.fillStyle='rgba(120,190,255,'+(1-r.t/1.2)+')'; ell(r.x,r.y,2,3.5); ctx.fill(); }
  for(const p of parts){ const k=p.t/p.life; ctx.save(); ctx.globalAlpha=1-k; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
    if(p.kind==='s') ctx.fillRect(-p.r,-p.r*0.35,p.r*2,p.r*0.7); else { ctx.beginPath(); for(let j=0;j<10;j++){const a=-HP+j*TAU/10,rr=j%2?p.r*0.45:p.r; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.fill(); }
    ctx.restore(); }
  // ambient sprinkles drifting down the screen
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const pt of petals){ ctx.save(); ctx.globalAlpha=.55; ctx.translate(pt.x*W,pt.y*H); ctx.rotate(pt.rot); ctx.fillStyle=pt.col; ctx.fillRect(-4,-1.3,8,2.6); ctx.restore(); }
}

/* ================= avatar ================= */
const avc=document.getElementById('avc'), avx=avc.getContext('2d');
function drawAvatar(){
  const save=ctx, sS=S, sCZ=CZ, sD=DPR;
  ctx=avx; CZ=1; DPR=1; S=0.95;
  const b=new Body('dodo_'+DODO_ORDER[dodoIdx],56,70,0); b.bounds();
  avx.setTransform(1,0,0,1,0,0); avx.clearRect(0,0,112,112);
  drawBody(b);
  ctx=save; S=sS; CZ=sCZ; DPR=sD;
}

/* ================= loop ================= */
let last=performance.now(), acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000); last=now;
  let n=0; while(acc>=DT&&n<3){ step(); acc-=DT; n++; } if(n===3) acc=0;
  render(); requestAnimationFrame(frame);
}
resize();
buildActors(); initPetals(); drawAvatar();
camY=NODES[CUR].y-viewH()*0.58; clampCam();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawAvatar);
requestAnimationFrame(frame);
window.__map={tap,NODES,player:()=>player,get cam(){return camY;}};
})();
</script>
