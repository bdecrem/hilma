<!doctype html>

<style>
  html, body { margin: 0; height: 100%; background: #0a0d1c; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-sizing: border-box;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: #6c7596; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; height: min(calc(100dvh - 60px), calc((100vw - 24px) * 16 / 9)); aspect-ratio: 9 / 16; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; border-radius: 6px; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  #cover { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18%; pointer-events: none; transition: opacity .5s; }
  #cover span { font: 500 clamp(12px, 1.8vh, 15px)/1 ui-monospace, monospace; letter-spacing: .06em; color: #e3e9f6; border: 1px solid rgba(223,231,245,.5); background: rgba(12,17,40,.72); padding: .8em 1.2em; border-radius: 999px; }
  #cover.gone { opacity: 0; }
  #meta { display: flex; gap: 16px; letter-spacing: .04em; }
  #meta b { color: #c9d2ea; font-weight: 600; }
</style>

<body>
<div id="stage">
  <canvas id="c" aria-label="one seed — an animated short with sound"></canvas>
  <div id="cover"><span>▶ tap to play · sound on</span></div>
</div>
<div id="meta"><b>one seed</b><span id="hint">tap to play</span></div>
<script>
'use strict';
/* ============================================================
   one seed — a dandelion's year in twelve cuts, alternating
   between a picture book and a field instrument.
   Everything is drawn on canvas and synthesised with Web Audio.
   ============================================================ */

const VW = 900, VH = 1600;
const SCN = 2.6, NS = 12, T = SCN * NS;     // 31.2 s loop
const C = {
  cream: '#efe2c2', mint: '#d2e1d0', ink: '#26282b', guide: '#4a78b8',
  green: '#6c9b50', green2: '#4c7b3a', greenL: '#a5c886', yellow: '#f2c23a', yellow2: '#dd961d',
  soil: '#b8976d', soil2: '#8d6c4b', soil3: '#6e5238', seed: '#f8f4ea', brown: '#7a5a3a',
  navy0: '#16204a', navy1: '#0b1029', line: '#dfe7f5', pink: '#e8457f', amber: '#e6b450', cyan: '#8fd0e8',
};
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const GOLD = 137.508 * Math.PI / 180;

const cv = document.getElementById('c');
const g = cv.getContext('2d');
let S = 1, PW = 900, PH = 1600;
const tex = {};
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function noiseImg(x, w, h, amt, fn) {
  const im = x.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; if (fn) fn(d, i); }
  x.putImageData(im, 0, 0);
}

// ============================================================
//  TEXTURES
// ============================================================
function stripes(a, b, extra) {
  const c = mk(PW, PH), x = c.getContext('2d'); x.scale(S, S);
  x.fillStyle = a; x.fillRect(0, 0, VW, VH);
  x.save(); x.translate(VW / 2, VH / 2); x.rotate(-.52);
  x.fillStyle = b;
  for (let i = -20; i < 20; i++) x.fillRect(-1400, i * 150, 2800, 72);
  x.restore();
  if (extra) extra(x);
  x.setTransform(1, 0, 0, 1, 0, 0);
  noiseImg(x, PW, PH, 16, (d, i) => { if (Math.random() < .004) { d[i] -= 30; d[i + 1] -= 30; d[i + 2] -= 34; } });
  return c;
}

function buildTextures() {
  tex.day = stripes(C.cream, C.mint);
  tex.warm = stripes('#f3e3bd', '#f5d990');
  tex.dusk = stripes('#3f4b7c', '#4c5a8e');
  // blueprint
  {
    const c = mk(PW, PH), x = c.getContext('2d'); x.scale(S, S);
    const gr = x.createRadialGradient(VW / 2, VH * .45, 60, VW / 2, VH / 2, VH * .75);
    gr.addColorStop(0, C.navy0); gr.addColorStop(1, C.navy1);
    x.fillStyle = gr; x.fillRect(0, 0, VW, VH);
    x.lineWidth = .6;
    for (let i = 0; i <= VW; i += 25) { x.strokeStyle = `rgba(160,180,230,${i % 100 ? .035 : .07})`; x.beginPath(); x.moveTo(i, 0); x.lineTo(i, VH); x.stroke(); }
    for (let i = 0; i <= VH; i += 25) { x.strokeStyle = `rgba(160,180,230,${i % 100 ? .035 : .07})`; x.beginPath(); x.moveTo(0, i); x.lineTo(VW, i); x.stroke(); }
    // faint big construction circles
    x.strokeStyle = 'rgba(160,180,230,.06)'; x.lineWidth = 1;
    [[450, 780, 520], [450, 780, 380], [120, 200, 300]].forEach(([a, b, r]) => { x.beginPath(); x.arc(a, b, r, 0, 6.283); x.stroke(); });
    x.setTransform(1, 0, 0, 1, 0, 0);
    noiseImg(x, PW, PH, 10);
    tex.bp = c;
  }
  // top-down farmland for the drift shot (taller than the screen, it scrolls)
  {
    const H = 2600, c = mk(PW, H * S), x = c.getContext('2d'); x.scale(S, S);
    const r = rng(12);
    x.fillStyle = '#e9ddb9'; x.fillRect(0, 0, VW, H);
    // fields on a jittered grid
    const fc = ['#d7dfae', '#c9d89c', '#e7d49c', '#dcc98f', '#b9cf92', '#e4dcb5', '#cfdca8'];
    const cols = 5, rows = 18, cw = VW / cols + 20, rh = H / rows;
    const P = (i, j) => [i * cw - 40 + (hash(i, j) - .5) * 60, j * rh + (hash(j, i + 7) - .5) * 60];
    for (let i = 0; i < cols + 1; i++) for (let j = 0; j < rows; j++) {
      const a = P(i, j), b = P(i + 1, j), cc = P(i + 1, j + 1), d = P(i, j + 1);
      x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.lineTo(...cc); x.lineTo(...d); x.closePath();
      x.fillStyle = fc[Math.floor(r() * fc.length)]; x.fill();
      x.save(); x.clip();
      const ang = r() * Math.PI, sp = 5 + r() * 5;
      x.strokeStyle = 'rgba(90,80,40,.18)'; x.lineWidth = 1;
      x.translate(a[0] + 60, a[1] + 60); x.rotate(ang);
      for (let k = -200; k < 200; k += sp) { x.beginPath(); x.moveTo(-200, k); x.lineTo(200, k); x.stroke(); }
      x.restore();
      x.strokeStyle = 'rgba(70,60,30,.35)'; x.lineWidth = 1.2; x.stroke();
    }
    // a river
    x.lineCap = 'round'; x.lineJoin = 'round';
    const river = [];
    for (let y = -20; y < H + 20; y += 20) river.push([560 + Math.sin(y / 260) * 140 + Math.sin(y / 90) * 30, y]);
    [[14, C.ink], [10, '#4a7fb8'], [3, '#8fb6dc']].forEach(([w, col]) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); river.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.stroke(); });
    // a lane
    x.strokeStyle = '#f6efd9'; x.lineWidth = 7; x.beginPath();
    for (let y = -20; y < H + 20; y += 20) x.lineTo(180 + Math.sin(y / 400 + 1) * 90, y); x.stroke();
    // tree clumps
    const clump = (cx, cy, n, spread) => {
      for (let k = 0; k < n; k++) {
        const a = r() * 6.283, d = Math.sqrt(r()) * spread, tx = cx + Math.cos(a) * d, ty = cy + Math.sin(a) * d * .8, rr = 7 + r() * 7;
        x.fillStyle = 'rgba(40,50,20,.35)'; x.beginPath(); x.arc(tx + 3, ty + 4, rr, 0, 6.283); x.fill();
        x.fillStyle = r() < .5 ? '#5f8f40' : '#4f7f35'; x.beginPath(); x.arc(tx, ty, rr, 0, 6.283); x.fill();
        x.strokeStyle = 'rgba(30,40,20,.7)'; x.lineWidth = 1.2; x.stroke();
        x.fillStyle = 'rgba(190,220,140,.55)'; x.beginPath(); x.arc(tx - rr * .3, ty - rr * .3, rr * .35, 0, 6.283); x.fill();
      }
    };
    for (let k = 0; k < 34; k++) clump(r() * VW, r() * H, 8 + Math.floor(r() * 26), 30 + r() * 60);
    for (let y = 0; y < H; y += 40) clump(560 + Math.sin(y / 260) * 140 + Math.sin(y / 90) * 30 + (r() < .5 ? -34 : 34), y, 3, 12);
    // farmhouses
    for (let k = 0; k < 8; k++) {
      const hx = r() * VW, hy = r() * H;
      x.fillStyle = '#d7735a'; x.fillRect(hx, hy, 26, 16); x.strokeStyle = C.ink; x.lineWidth = 1.2; x.strokeRect(hx, hy, 26, 16);
      x.beginPath(); x.moveTo(hx, hy + 8); x.lineTo(hx + 26, hy + 8); x.stroke();
    }
    x.setTransform(1, 0, 0, 1, 0, 0);
    noiseImg(x, c.width, c.height, 14);
    tex.map = c; tex.mapH = H;
  }
  // grain for the illustrated shots
  {
    const c = mk(256, 256), x = c.getContext('2d');
    noiseImg(x, 256, 256, 0, (d, i) => { const w = Math.random() < .5; d[i] = d[i + 1] = d[i + 2] = w ? 255 : 20; d[i + 3] = Math.random() * 26; });
    tex.grain = g.createPattern(c, 'repeat');
  }
}

// ============================================================
//  DRAWING HELPERS
// ============================================================
function hatch(path, ang, gap, col, w = 1, box = [0, 0, VW, VH]) {
  g.save(); g.clip(path);
  g.strokeStyle = col; g.lineWidth = w;
  const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2, R = Math.hypot(box[2] - box[0], box[3] - box[1]) / 2 + 10;
  g.translate(cx, cy); g.rotate(ang);
  g.beginPath(); for (let k = -R; k < R; k += gap) { g.moveTo(-R, k); g.lineTo(R, k); } g.stroke();
  g.restore();
}
function drawOn(p, fn) {           // progressive stroke for blueprint lines
  if (p <= 0) return;
  if (p >= 1) { fn(); return; }
  g.save(); g.setLineDash([p * 3000, 99999]); fn(); g.restore();
}
function bpLine(w = 1.1, a = .85) { g.strokeStyle = `rgba(223,231,245,${a})`; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; }
function label(text, x, y, a = .55, align = 'left', size = 14) {
  g.fillStyle = `rgba(223,231,245,${a})`; g.font = `500 ${size}px ${MONO}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(text, x, y);
}
function inset(x, y, r, p, content, leader) {
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 2);
  bpLine(1, .7);
  drawOn(p, () => { g.beginPath(); g.arc(x, y, r, -Math.PI / 2, Math.PI * 1.5); g.stroke(); });
  g.strokeStyle = 'rgba(223,231,245,.25)'; g.beginPath(); g.arc(x, y, r + 7, 0, 6.283); g.stroke();
  for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283; g.beginPath(); g.moveTo(x + Math.cos(a) * (r + 7), y + Math.sin(a) * (r + 7)); g.lineTo(x + Math.cos(a) * (r + (i % 6 ? 10 : 14)), y + Math.sin(a) * (r + (i % 6 ? 10 : 14))); g.stroke(); }
  g.fillStyle = 'rgba(20,30,70,.6)'; g.beginPath(); g.arc(x, y, r - 1, 0, 6.283); g.fill();
  if (leader) {
    const [lx, ly] = leader, a = Math.atan2(ly - y, lx - x);
    bpLine(.9, .45); drawOn(seg(p, .3, 1), () => { g.beginPath(); g.moveTo(x + Math.cos(a) * (r + 14), y + Math.sin(a) * (r + 14)); g.lineTo(lx, ly); g.stroke(); });
    g.fillStyle = C.line; g.beginPath(); g.arc(lx, ly, 2.5, 0, 6.283); g.fill();
  }
  g.save(); g.beginPath(); g.arc(x, y, r - 2, 0, 6.283); g.clip(); g.translate(x, y); content(seg(p, .3, 1)); g.restore();
  g.restore();
}
function dial(t) {       // the instrument's signature, top right, every diagram shot
  const x = 800, y = 110;
  bpLine(1, .55); g.beginPath(); g.arc(x, y, 22, 0, 6.283); g.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; g.beginPath(); g.moveTo(x + Math.cos(a) * 26, y + Math.sin(a) * 26); g.lineTo(x + Math.cos(a) * 31, y + Math.sin(a) * 31); g.stroke(); }
  const a = t * .8; bpLine(1.4, .9); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 30, y + Math.sin(a) * 30); g.stroke();
  g.fillStyle = C.line; g.beginPath(); g.arc(x + Math.cos(a) * 30, y + Math.sin(a) * 30, 2.5, 0, 6.283); g.fill();
}
function ruler(x, y0, y1, p, marks = 5) {
  bpLine(.9, .5);
  drawOn(p, () => { g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); });
  const n = Math.floor((y1 - y0) / 16 * p);
  for (let i = 0; i <= n; i++) { const y = y0 + i * 16; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (i % marks ? 6 : 12), y); g.stroke(); }
}
function dimension(x0, y0, x1, y1, p, text) {
  bpLine(.9, .55);
  drawOn(p, () => { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); });
  const a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a) * 8, ny = Math.cos(a) * 8;
  if (p > .1) { g.beginPath(); g.moveTo(x0 - nx, y0 - ny); g.lineTo(x0 + nx, y0 + ny); g.moveTo(x1 - nx, y1 - ny); g.lineTo(x1 + nx, y1 + ny); g.stroke(); }
  if (text && p > .8) label(text, (x0 + x1) / 2 - nx * 2.4, (y0 + y1) / 2 - ny * 2.4, .6 * seg(p, .8, 1), 'center', 13);
}
function pinkRing(x, y, rx, ry, p, rot = 0) {
  if (p <= 0) return;
  g.save(); g.strokeStyle = C.pink; g.lineWidth = 2.2;
  drawOn(p, () => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, -2.6, -2.6 + 6.6); g.stroke(); });
  g.restore();
}
function guides(x, y, r, a = .35) {  // faint measuring overlay on the illustrated shots
  g.strokeStyle = `rgba(74,120,184,${a})`; g.lineWidth = 1.2;
  g.beginPath(); g.arc(x, y, r, 0, 6.283); g.stroke();
  g.beginPath(); g.arc(x, y, r + 26, 0, 6.283); g.stroke();
  g.setLineDash([6, 6]); g.beginPath(); g.moveTo(x, y - r - 160); g.lineTo(x, y - r); g.stroke(); g.setLineDash([]);
}
function sideRuler(x, y0, y1, bracket) {
  g.strokeStyle = 'rgba(74,120,184,.7)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
  for (let y = y0, i = 0; y <= y1; y += 14, i++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x - (i % 5 ? 7 : 14), y); g.stroke(); }
  if (bracket) { g.strokeStyle = 'rgba(221,150,29,.85)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 26, bracket[0]); g.lineTo(x - 30, bracket[0]); g.lineTo(x - 30, bracket[1]); g.lineTo(x - 26, bracket[1]); g.stroke(); }
}
function dashedArrow(x0, y0, x1, y1, a = .7, col = '74,120,184') {
  g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = 1.6; g.setLineDash([6, 6]);
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.setLineDash([]);
  const an = Math.atan2(y1 - y0, x1 - x0);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - Math.cos(an - .4) * 10, y1 - Math.sin(an - .4) * 10); g.moveTo(x1, y1); g.lineTo(x1 - Math.cos(an + .4) * 10, y1 - Math.sin(an + .4) * 10); g.stroke();
}

// illustrated free seed (side view): achene, beak, a fan of filaments
function seedI(x, y, s, rot, alpha = 1) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha *= alpha;
  g.lineCap = 'round';
  g.strokeStyle = C.ink; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 44); g.stroke();
  g.fillStyle = C.brown; g.beginPath(); g.ellipse(0, 54, 3.6, 11, 0, 0, 6.283); g.fill(); g.stroke();
  for (let i = 0; i < 17; i++) {
    const a = -Math.PI + .25 + i / 16 * (Math.PI - .5), L = 34;
    const ex = Math.cos(a) * L, ey = Math.sin(a) * L * .85;
    g.strokeStyle = C.ink; g.lineWidth = 2.4; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(ex * .5, ey * .5 - 4, ex, ey); g.stroke();
    g.strokeStyle = C.seed; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(ex * .5, ey * .5 - 4, ex, ey); g.stroke();
  }
  g.restore();
}

// fibonacci sphere (seed head)
const SPHERE = []; { const n = 120; for (let i = 0; i < n; i++) { const y = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - y * y), th = i * GOLD; SPHERE.push([Math.cos(th) * r, y, Math.sin(th) * r]); } }
function seedHead(cx, cy, R, rotY, sway, missing, style, open = 1) {
  if (style === 'ink') { const hg = g.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.25 * open); hg.addColorStop(0, 'rgba(255,253,244,.55)'); hg.addColorStop(1, 'rgba(255,253,244,0)'); g.fillStyle = hg; g.beginPath(); g.arc(cx, cy, R * 1.25 * open + 1, 0, 6.283); g.fill(); }
  const pts = SPHERE.map((p, i) => {
    const c = Math.cos(rotY), s = Math.sin(rotY);
    const x = p[0] * c + p[2] * s, z = -p[0] * s + p[2] * c, y = p[1];
    return { i, x, y, z };
  }).sort((a, b) => a.z - b.z);
  for (const p of pts) {
    if (missing && missing.has(p.i)) continue;
    const depth = (p.z + 1) / 2;
    const ex = cx + (p.x * R + sway * (1 - p.y) * 10) * open, ey = cy + p.y * R * open;
    if (style === 'ink') {
      g.globalAlpha = .45 + .55 * depth;
      g.strokeStyle = 'rgba(38,40,43,.45)'; g.lineWidth = 1; g.beginPath(); g.moveTo(cx + p.x * 16, cy + p.y * 16); g.lineTo(ex, ey); g.stroke();
      const n = 10, L = 17 * open;
      for (let k = 0; k < n; k++) {
        const a = k / n * 6.283 + p.i;
        g.strokeStyle = 'rgba(38,40,43,.38)'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex + Math.cos(a) * L, ey + Math.sin(a) * L); g.stroke();
      }
      for (let k = 0; k < n; k++) {
        const a = k / n * 6.283 + p.i;
        g.strokeStyle = '#fffdf6'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex + Math.cos(a) * L, ey + Math.sin(a) * L); g.stroke();
      }
    } else {
      g.globalAlpha = .18 + .7 * depth;
      bpLine(.8, .6); g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
      g.fillStyle = C.line; g.beginPath(); g.arc(ex, ey, 1.4 + depth * 1.6, 0, 6.283); g.fill();
    }
  }
  g.globalAlpha = 1;
  if (style === 'ink') {
    g.fillStyle = '#b89a5a'; g.beginPath(); g.arc(cx, cy, 15, 0, 6.283); g.fill(); g.strokeStyle = C.ink; g.lineWidth = 1.6; g.stroke();
    g.fillStyle = 'rgba(80,60,30,.5)'; for (let k = 0; k < 14; k++) { g.beginPath(); g.arc(cx + Math.cos(k * 2.4) * 8 * Math.sqrt(k / 14), cy + Math.sin(k * 2.4) * 8 * Math.sqrt(k / 14), 1.3, 0, 6.283); g.fill(); }
  }
  return pts;
}

function stem(x0, y0, x1, y1, w = 11, bend = 30) {
  const p = new Path2D(); const mx = (x0 + x1) / 2 + bend;
  p.moveTo(x0 - w / 2, y0); p.quadraticCurveTo(mx - w / 2, (y0 + y1) / 2, x1 - w / 2, y1); p.lineTo(x1 + w / 2, y1); p.quadraticCurveTo(mx + w / 2, (y0 + y1) / 2, x0 + w / 2, y0); p.closePath();
  g.fillStyle = C.greenL; g.fill(p); hatch(p, .3, 5, 'rgba(60,90,40,.35)');
  g.strokeStyle = C.ink; g.lineWidth = 2; g.stroke(p);
}

function toothedLeaf(len, wid, teeth = 6) {   // dandelion leaf pointing +x
  const p = new Path2D(); p.moveTo(0, 0);
  for (let i = 1; i <= teeth; i++) { const u = i / teeth, x = u * len, w = wid * Math.sin(Math.PI * Math.pow(u, .8)) ; p.lineTo(x - len / teeth * .55, -w * .55); p.lineTo(x, -w); }
  p.lineTo(len + 8, 0);
  for (let i = teeth; i >= 1; i--) { const u = i / teeth, x = u * len, w = wid * Math.sin(Math.PI * Math.pow(u, .8)); p.lineTo(x, w); p.lineTo(x - len / teeth * .55, w * .55); }
  p.closePath(); return p;
}

// ============================================================
//  FRAME
// ============================================================
function render(tRaw) {
  const t = ((tRaw % T) + T) % T;
  const k = Math.min(NS - 1, Math.floor(t / SCN)), u = (t - k * SCN) / SCN;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = C.navy1; g.fillRect(0, 0, PW, PH);
  // a slow push in on every shot
  const z = 1 + .035 * eInOut(u);
  g.setTransform(S * z, 0, 0, S * z, S * VW / 2 * (1 - z), S * VH * .45 * (1 - z));
  g.lineCap = 'butt'; g.lineJoin = 'miter';
  SCENES[k](u, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // grain everywhere; illustrated shots get a touch more
  const illus = k % 2 === 0;
  const ox = Math.floor(Math.random() * 256), oy = Math.floor(Math.random() * 256);
  g.save(); g.globalAlpha = illus ? 1 : .6; g.translate(-ox, -oy); g.fillStyle = tex.grain; g.fillRect(ox, oy, PW, PH); g.restore();
  // soft vignette
  const vg = g.createRadialGradient(PW / 2, PH / 2, PH * .35, PW / 2, PH / 2, PH * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, illus ? 'rgba(60,40,20,.22)' : 'rgba(0,0,10,.35)');
  g.fillStyle = vg; g.fillRect(0, 0, PW, PH);
}

function makeAudio(ac) {
  const out = ac.createGain(); out.gain.value = 1.85;

// A major pentatonic
const AP = [69, 71, 73, 76, 78, 81, 83, 85, 88, 90, 93];
function buildScore() {
  const E = [], r = rng(4);
  const add = (t, fn) => E.push({ t: ((t % T) + T) % T, fn });
  const at = (k, u) => k * SCN + u * SCN;
  // 1 — quiet: a breath of wind, the seed lets go
  add(at(0, .1), A => SND.air(A, at(0, .1) + A.o, 2.2, 300, 1100, .12, -.6, .6));
  add(at(0, 0), A => SND.drone(A, at(0, 0) + A.o, SCN * 2 - .6, [69, 76, 81], .55, 0));
  add(at(0, .42), A => SND.bloop(A, at(0, .42) + A.o, 700, 1500, .8, .3, .3));

  // diagram shots: instrument ticks as lines draw on, a ping when the pink ring lands
  [1, 3, 5, 7, 9, 11].forEach(k => {
    for (let i = 0; i < 14; i++) { const t = at(k, .05 + i * .06 + r() * .02); add(t, A => SND.tick(A, t + A.o, .6 + r() * .6, r() * 1.2 - .6, 4200 + r() * 2400)); }
  });

  add(at(1, .45), A => SND.bloop(A, at(1, .45) + A.o, 400, 900, .5, 0, .5));
  [.2, .4].forEach(u => add(at(1, u), A => SND.bell(A, at(1, u) + A.o, mtof(u < .3 ? 76 : 81), .35, -.4)));
  // 3 — the drone arrives as the seed flies

  add(at(2, 0), A => SND.air(A, at(2, 0) + A.o, SCN * 2, 400, 1400, .05, -.8, .8, .5));
  for (let i = 0; i < 12; i++) { const t = at(2, i / 12), m = AP[[4, 5, 7, 5, 8, 7, 5, 4, 5, 7, 9, 8][i]]; add(t, A => SND.pluck(A, t + A.o, mtof(m), .45, Math.sin(i) * .5)); }
  add(at(3, .85), A => SND.bell(A, at(3, .85) + A.o, mtof(90), .5, .4, 3, 5));
  for (let i = 0; i < 10; i++) { const t = at(3, .3 + i * .055); add(t, A => SND.pluck(A, t + A.o, mtof(AP[6 - Math.floor(i / 2)]), .3, -.3 + i * .06)); }

  add(at(4, .15), A => SND.thunder(A, at(4, .15) + A.o));
  add(at(4, 0), A => SND.drone(A, at(4, 0) + A.o, SCN * 2, [54, 61, 66, 69], .9, 30));
  add(at(4, .45), A => SND.bloop(A, at(4, .45) + A.o, 900, 300, .8, 0, .35));
  // 6 — germination: a low bloom, a rising line as the root grows
  add(at(5, .5), A => SND.bloop(A, at(5, .5) + A.o, 90, 55, 1.4, 0, .8));
  for (let i = 0; i < 9; i++) { const t = at(5, .5 + i * .055); add(t, A => SND.pluck(A, t + A.o, mtof(AP[i]), .35, -.2)); }
  // 7 — the sprout: brighter

  for (let i = 0; i < 6; i++) { const t = at(6, .42 + i * .08); add(t, A => SND.bell(A, t + A.o, mtof(AP[3 + i]), .5, i % 2 ? .4 : -.4, 2.2)); }

  for (let i = 0; i < 7; i++) { const t = at(10, .3 + i * .1); add(t, A => SND.cricket(A, t + A.o, i % 2 ? .6 : -.6)); }

  add(at(11, .55), A => SND.bell(A, at(11, .55) + A.o, mtof(81), .4, 0, 3.4));
  add(at(11, .85), A => SND.bloop(A, at(11, .85) + A.o, 600, 1800, .7, .6, .4));

}

let EV = [], AC = null, AUD = null, startAt = 0, loopN = 0, evIdx = 0, playing = false;

// ============================================================
//  BOOT
// ============================================================
const params = new URLSearchParams(location.search);
const stillT = params.has('t') ? parseFloat(params.get('t')) : null;
function resize() {
  const rect = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.max(360, Math.min(1100, Math.round(rect.width * dpr)));
  if (pw === PW && tex.bp) return;
  PW = pw; PH = Math.round(pw * 16 / 9); cv.width = PW; cv.height = PH; S = PW / VW;
  buildTextures();
}
function loop() {
  render(stillT !== null ? stillT : (playing ? Math.max(0, audioTime()) : 1.6));
  if (stillT === null) requestAnimationFrame(loop);
}
(function boot() {
  resize(); EV = buildScore(); window.__ready = true;
  if (stillT !== null) { document.getElementById('cover').remove(); document.getElementById('meta').style.display = 'none'; }
  loop();
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { resize(); if (stillT !== null) render(stillT); }, 150); });
})();
function toggle() {
  if (stillT !== null) return;
  if (!AC) { start(); return; }
  if (AC.state === 'running') { AC.suspend(); document.getElementById('hint').textContent = 'tap to play'; }
  else { AC.resume(); document.getElementById('hint').textContent = 'tap to pause'; }
}
cv.addEventListener('click', toggle);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(); });
