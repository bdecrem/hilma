<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドードー — The Road to the Sea</title>
<meta name="description" content="Dodo and the Peck map redrawn as a summer anime: rice paddies at morning, a cedar wood at magic hour, a night festival, and the sea at dawn. With the studio character sheet.">
<meta name="theme-color" content="#1350c8">
<meta property="og:type" content="website">
<meta property="og:title" content="ドードー — The Road to the Sea">
<meta property="og:description" content="Dodo's Peck map, redrawn as a four-episode summer anime. Scroll the trail, collect the stamps, reach the sea.">
<meta property="og:image" content="https://dodo.foo/dodo/anime-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dodo.foo/dodo/anime-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0c1233;color:#fff;font-family:"Zen Maru Gothic",system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background-image:var(--grain);opacity:.07;mix-blend-mode:overlay}

/* ── Dodo colour models (色彩設計): one per time of day, like a studio's 昼/夕/夜 sheets ── */
.dd{overflow:visible;display:block}
.m-day  {--f:#6fa8e0;--fs:#4a70c0;--fh:#e6f6ff;--c:#fff8e8;--cs:#f0c9b0;--b:#ffb43c;--bs:#df761e;--bh:#ffe7a6;--ln:#232c5c;--lnw:#7a3a22;--sc:#f04a35;--scs:#b02242;--lf:#78d86c;--lfs:#2e9c63;--bl:#ff7b8c;--i1:#0f1b58;--i2:#2f72e6;--i3:#8cf0ff;--rim:#ffffff;--rimo:.55}
.m-dusk {--f:#9b8fd8;--fs:#5b48a6;--fh:#ffd9b0;--c:#ffe3c6;--cs:#d997a6;--b:#ff9e45;--bs:#c44f3a;--bh:#ffd48a;--ln:#3a2050;--lnw:#6a2530;--sc:#ff5a3a;--scs:#9e2450;--lf:#a2cf5e;--lfs:#4e7e55;--bl:#ff6f8a;--i1:#2a1150;--i2:#c0508a;--i3:#ffc27a;--rim:#ffb45a;--rimo:.95}
.m-night{--f:#4262ac;--fs:#222c6a;--fh:#9fc4ff;--c:#bcc5e8;--cs:#7a7eb8;--b:#d8924a;--bs:#8a4a48;--bh:#ffd08a;--ln:#0d1134;--lnw:#3a1a30;--sc:#c93a4e;--scs:#6a1d48;--lf:#4e9e78;--lfs:#245a5a;--bl:#e0708c;--i1:#0a0f36;--i2:#3e6cf0;--i3:#ffcf7a;--rim:#ffc46a;--rimo:.95}
.m-dawn {--f:#88a6e6;--fs:#6a68c0;--fh:#ffe6f0;--c:#ffeee6;--cs:#efb3b6;--b:#ffae5c;--bs:#df684e;--bh:#ffe3b0;--ln:#302c5e;--lnw:#6a2c2e;--sc:#ff5b4a;--scs:#b33462;--lf:#86d47a;--lfs:#3e9a78;--bl:#ff7f98;--i1:#1c1656;--i2:#6a5ae6;--i3:#ffd0b0;--rim:#ffd7a0;--rimo:.9}
.dd .f{fill:var(--f)}.dd .fs{fill:var(--fs)}.dd .fh{fill:var(--fh)}.dd .c{fill:var(--c)}.dd .cs{fill:var(--cs)}
.dd .b{fill:var(--b)}.dd .bs{fill:var(--bs)}.dd .bh{fill:var(--bh)}.dd .sc{fill:var(--sc)}.dd .scs{fill:var(--scs)}
.dd .lf{fill:var(--lf)}.dd .lfs{fill:var(--lfs)}.dd .bl{fill:var(--bl)}.dd .lnf{fill:var(--ln)}
.dd .ln{stroke:var(--ln)}.dd .lnw{stroke:var(--lnw)}.dd .rim{stroke:var(--rim);opacity:var(--rimo)}
.dd .sk{fill:none;stroke-linecap:round;stroke-linejoin:round}
.dd path,.dd ellipse,.dd circle{transition:fill .9s,stroke .9s}
.dd .ec{display:none}.dd.blink .eo{display:none}.dd.blink .ec{display:inline}
.dd .gad{display:none}.dd[data-gad="umbrella"] .g-umbrella,.dd[data-gad="leaf"] .g-leaf,.dd[data-gad="lantern"] .g-lantern,.dd[data-gad="crane"] .g-crane{display:inline}

/* ── HUD ── */
.hud{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
.hud.on{opacity:1;transform:none}
.pill{background:rgba(10,14,40,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:7px}
.pill .jp{font-family:"Shippori Mincho B1",serif;font-weight:800}
.pill .muted{opacity:.7;font-weight:500}
.stampicon{width:16px;height:16px;border-radius:50%;border:2px solid #ff5a4e;display:inline-grid;place-items:center;font-size:8px;color:#ff5a4e;font-weight:900;transform:rotate(-12deg)}

/* ── Hero (key visual) ── */
.hero{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:#1350c8}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero .dodo-wrap{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 58px);transform:translateX(-50%);cursor:pointer;z-index:3}
.logo{position:absolute;z-index:4;left:0;right:0;top:calc(env(safe-area-inset-top) + 7vh);text-align:center;padding:0 16px;pointer-events:none}
.logo .jp{font-family:"Dela Gothic One",sans-serif;font-size:clamp(58px,17vw,128px);line-height:.95;letter-spacing:.02em;color:#fff;-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 4px 0 #1d3f9c,0 0 0 #000;transform:skewX(-6deg);filter:drop-shadow(0 6px 18px rgba(8,24,90,.35))}
.logo .jp span{display:inline-block;-webkit-text-stroke:7px #1b3a94;paint-order:stroke fill}
.logo .en{margin-top:8px;font-family:"Dela Gothic One",sans-serif;letter-spacing:.55em;font-size:clamp(13px,3.4vw,18px);padding-left:.55em;color:#fff;-webkit-text-stroke:4px #1b3a94;paint-order:stroke fill}
.logo .sub{margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1b3a94;padding:8px 16px;border-radius:4px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(14px,3.8vw,18px);box-shadow:4px 4px 0 #1b3a94;transform:rotate(-1.5deg)}
.logo .sub i{font-style:normal;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:.78em;opacity:.8}
.cue{position:absolute;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-weight:700;font-size:12px;letter-spacing:.2em;color:#fff;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none}
.cue b{display:block;font-size:18px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.hero .credit{position:absolute;z-index:4;right:16px;top:calc(env(safe-area-inset-top) + 14px);font-size:10px;letter-spacing:.14em;writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;font-weight:700;opacity:.85;text-shadow:0 1px 4px rgba(0,0,40,.4)}
@media (min-aspect-ratio: 5/4){
  .logo{text-align:left;left:6vw;right:auto;top:18vh;max-width:48vw}
  .logo .jp{font-size:clamp(60px,9vw,150px)}
  .hero .dodo-wrap{left:70%}
}

/* ── World ── */
.world{position:relative;overflow:hidden}
.world svg.map{position:absolute;left:0;top:0;display:block}
.world .dodo-walker{position:absolute;left:0;top:0;z-index:2;will-change:transform;cursor:pointer}
.band{position:absolute;left:0;right:0;z-index:3;background:#050507;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.band::before,.band::after{content:"";position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#1a1a22 0 14px,transparent 14px 22px)}
.band::before{top:8px}.band::after{bottom:8px}
.band .ep{font-weight:700;font-size:11px;letter-spacing:.42em;color:#ff5a4e;padding-left:.42em}
.band .t{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(26px,7vw,40px);letter-spacing:.12em;margin-top:6px;padding-left:.12em}
.band .e{font-size:13px;opacity:.72;margin-top:6px;letter-spacing:.06em}
.pop{position:absolute;z-index:4;pointer-events:none;font-family:"Dela Gothic One",sans-serif;font-size:22px;color:#fff;-webkit-text-stroke:5px #e8363e;paint-order:stroke fill;animation:pop .9s ease-out forwards;white-space:nowrap}
.pop.blue{-webkit-text-stroke-color:#2a4cc8}
@keyframes pop{0%{transform:translate(-50%,0) scale(.4) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-14px) scale(1.15) rotate(-8deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-40px) scale(1) rotate(-8deg);opacity:0}}
.home{position:absolute;z-index:3;left:0;right:0;text-align:center;opacity:0;transform:translateY(16px);transition:opacity 1.2s,transform 1.2s;pointer-events:none}
.home.on{opacity:1;transform:none}
.home .jp{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(40px,11vw,68px);color:#fff;letter-spacing:.16em;text-shadow:0 3px 0 #c25a74,0 0 30px rgba(255,160,120,.7)}
.home .en{font-weight:700;color:#7a3a4e;font-size:15px;margin-top:4px}
.home .done{display:inline-block;margin-top:10px;font-weight:900;font-size:12px;letter-spacing:.2em;color:#e8363e;border:2px solid #e8363e;border-radius:999px;padding:5px 12px;transform:rotate(-3deg);background:rgba(255,255,255,.55)}

/* world animation classes (SVG, 1 user unit = 1px) */
.sway{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.drift{animation:drift 60s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.train{animation:train 16s linear infinite}
@keyframes train{from{transform:translateX(-220px)}to{transform:translateX(calc(var(--w) + 60px))}}
.fly{animation:fly 7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(26px,-12px)}50%{transform:translate(8px,10px)}75%{transform:translate(-20px,-6px)}}
.ff{animation:ff 5s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.2}30%{opacity:1}50%{transform:translate(12px,-18px);opacity:.9}80%{opacity:.25}}
.shaft{animation:shaft 6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes shaft{0%,100%{opacity:.55}50%{opacity:1}}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.fw{animation:fw 5.4s ease-out infinite;opacity:0}
@keyframes fw{0%{transform:scale(.05);opacity:0}4%{opacity:1}30%{transform:scale(1);opacity:.95}55%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.float{animation:float 22s linear infinite}
@keyframes float{from{transform:translateY(-40px)}to{transform:translateY(var(--fl))}}
.glint{animation:glint 1.8s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:1}}
.gull{animation:gull 14s linear infinite}
@keyframes gull{from{transform:translateX(-60px)}to{transform:translateX(calc(var(--w) + 60px))}}
.foam{animation:foam 4.2s ease-in-out infinite}
@keyframes foam{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.bobk{animation:bobk 2.4s ease-in-out infinite}
@keyframes bobk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.spirit{cursor:pointer;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.spirit.hide{transform:translateY(14px) scale(.2)}
.wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(18deg)}}
.stamp{opacity:0;transform:scale(1.9)}
.stamped .stamp{opacity:.9;transform:scale(1);transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .12s}
.stamped .num{opacity:.55}

/* ── Settei (character sheet) ── */
.settei{position:relative;background:#f4efe3;color:#23263b;padding:56px 16px 64px;background-image:linear-gradient(rgba(80,120,200,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(80,120,200,.09) 1px,transparent 1px);background-size:24px 24px}
.sheet{max-width:1080px;margin:0 auto}
.sheet header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid #23263b;padding-bottom:12px}
.sheet h2{margin:0;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(30px,7vw,48px);letter-spacing:.08em;line-height:1}
.sheet h2 small{display:block;font-family:"Zen Maru Gothic",sans-serif;font-size:13px;letter-spacing:.2em;font-weight:700;color:#e8363e;margin-bottom:8px}
.stampbox{display:flex;gap:6px;font-size:11px;font-weight:700;text-align:center}
.stampbox div{border:1.5px solid #23263b;padding:4px 8px;min-width:58px}
.stampbox b{display:block;font-family:"Shippori Mincho B1",serif;font-size:15px;color:#e8363e}
.sheet h3{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:20px;letter-spacing:.1em;margin:40px 0 14px;display:flex;align-items:baseline;gap:10px}
.sheet h3 span{font-family:"Zen Maru Gothic",sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;color:#6a6f8a}
.turn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.turn figure{margin:0;text-align:center;position:relative}
.turn svg{width:100%;height:auto;max-height:260px}
.turn figcaption,.faces figcaption,.models figcaption{font-weight:700;font-size:12px;margin-top:4px}
.turn figcaption b,.faces figcaption b,.models figcaption b{font-family:"Shippori Mincho B1",serif;font-size:14px;margin-right:4px}
.guides{position:absolute;left:0;right:0;top:0;bottom:24px;pointer-events:none}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.faces figure{margin:0;background:#fffdf7;border:1.5px solid #23263b;padding:8px 6px 10px;text-align:center}
.faces svg{width:100%;height:auto}
.faces p{margin:3px 0 0;font-size:11px;color:#5a5f78;line-height:1.35}
.models{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.models figure{margin:0;border-radius:10px;padding:10px 8px;text-align:center;color:#fff}
.models svg{width:78%;height:auto;margin:0 auto}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}
.sw i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:block}
.models code{display:block;font-size:10px;opacity:.8;margin-top:5px;font-family:ui-monospace,Menlo,monospace}
.beforeafter{display:grid;grid-template-columns:1fr auto 1.4fr;align-items:center;gap:10px;background:#fffdf7;border:1.5px solid #23263b;padding:14px}
.beforeafter svg{width:100%;height:auto;max-height:200px}
.beforeafter .arrow{font-family:"Dela Gothic One",sans-serif;font-size:28px;color:#e8363e}
.beforeafter figcaption{text-align:center;font-size:12px;font-weight:700}
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px;margin:0;padding:0;list-style:none}
.notes li{font-size:14.5px;line-height:1.55;padding-left:26px;position:relative}
.notes li::before{content:attr(data-n);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:#23263b;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.notes b{font-family:"Shippori Mincho B1",serif}
.art{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;align-items:end}
.art figure{margin:0;text-align:center;font-size:12px;font-weight:700}
.art a{display:block;color:inherit;text-decoration:none}
.art img{display:block;width:100%;height:auto;border:1.5px solid #23263b;background:#fffdf7}
.art .icon img{border-radius:22.4%;border:0;box-shadow:0 6px 18px rgba(20,30,80,.25)}
.art .cut img{background:repeating-conic-gradient(#e6e1d4 0 25%,#fffdf7 0 50%) 0 0/16px 16px}
.art figcaption{margin-top:6px}
.art figcaption span{display:block;font-weight:500;color:#5a5f78;font-size:11px}
@media (max-width:720px){.art{grid-template-columns:1fr 1fr}}
.manpu{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.manpu figure{margin:0;text-align:center;font-size:11px;font-weight:700}
.manpu svg{width:100%;height:auto;max-height:70px;background:#fffdf7;border:1.5px solid #23263b}
@media (max-width:720px){
  .turn{grid-template-columns:repeat(2,1fr)}
  .faces{grid-template-columns:repeat(2,1fr)}
  .models{grid-template-columns:repeat(2,1fr)}
  .notes{grid-template-columns:1fr}
  .manpu{grid-template-columns:repeat(3,1fr)}
}

/* ── Next episode ── */
.next{position:relative;background:#0a0a10;overflow:hidden;min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:40px 16px calc(env(safe-area-inset-bottom) + 34px);text-align:center}
.next svg.lines{position:absolute;inset:0;width:100%;height:100%}
.next .dodo-wrap{position:relative;z-index:2;width:min(300px,68vw);margin-bottom:-6px}
.next .tag{position:absolute;z-index:3;top:34px;left:16px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:22px;letter-spacing:.3em;background:#fff;color:#0a0a10;padding:6px 14px;transform:rotate(-3deg)}
.next h4{position:relative;z-index:3;margin:18px 0 0;font-family:"Dela Gothic One",sans-serif;font-size:clamp(24px,7.2vw,56px);white-space:nowrap;line-height:1.05;color:#fff;-webkit-text-stroke:8px #e8363e;paint-order:stroke fill;transform:skewX(-8deg)}
.next p{position:relative;z-index:3;margin:12px 0 0;font-size:15px;opacity:.85;max-width:420px}
.next .foot{position:relative;z-index:3;margin-top:26px;font-size:12px;opacity:.55;letter-spacing:.08em}
.next .foot a{color:#fff}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="hud" id="hud">
  <div class="pill"><span class="jp" id="hudJp">第一話</span><span class="muted" id="hudEn">Paddy Morning</span></div>
  <div class="pill"><span class="stampicon">済</span><span id="hudStamps">00</span><span class="muted">/ 30</span></div>
</div>

<section class="hero" id="hero">
  <svg class="bg" id="heroBg" aria-hidden="true"></svg>
  <div class="logo">
    <div class="jp"><span>ドードー</span></div>
    <div class="en">DODO</div>
    <div class="sub">海までの道 <i>The Road to the Sea</i></div>
  </div>
  <div class="credit">原作 ドードー ・ ペック篇 全四話</div>
  <div class="dodo-wrap" id="heroDodo" role="img" aria-label="Dodo, redrawn as an anime character, looking up at the summer sky"></div>
  <div class="cue">SCROLL · 第一話<b>↓</b></div>
</section>

<section class="world" id="world" aria-label="The Peck trail, level 1 to 30"></section>

<section class="settei" id="settei">
  <div class="sheet" id="sheet"></div>
</section>

<section class="next" id="next">
  <svg class="lines" id="speed" aria-hidden="true"></svg>
  <div class="tag">次回予告</div>
  <div class="dodo-wrap" id="nextDodo"></div>
  <h4>ペック・オア・ペリッシュ!</h4>
  <p>Next time: the rats come off the Dutch ships, and there is only one egg. Dodo can't fly. Dodo can peck.</p>
  <div class="foot">An anime reimagining of Dodo's Peck mode · <a href="https://dodo.foo">dodo.foo</a></div>
</section>

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const r1 = n => Math.round(n * 10) / 10;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Film grain for the 撮影 (compositing) pass — one tiny noise tile.
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), d = g.createImageData(128, 128), R = rng(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
})();

function tailPaths(t, dir, amp) {
  const out = [];
  for (const [ph, len, drop] of [[0, 23, 3], [1.4, 18, 7.5]]) {
    const top = [], bot = [];
    for (let k = 0; k <= 6; k++) {
      const u = k / 6, x = -8.6 + dir * u * len;
      const y = 30.6 + u * drop + Math.sin(t * 7 - u * 4.2 + ph) * u * amp;
      const w = (1 - u) * 2.5 + .7;
      top.push(`${r1(x)},${r1(y - w)}`); bot.unshift(`${r1(x + dir * .6)},${r1(y + w)}`);
    }
    out.push(`M${top.join('L')}L${bot.join('L')}Z`);
  }
  return out;
}

/** Live mascot: owns one SVG, applies a pose each frame. */
class Mascot {
  constructor(el, o) {
    this.el = el; this.o = { blinkable: true, ...o }; this.dir = o.dir || -1; this.wind = o.wind ?? 1.2;
    this.build();
    this.nextBlink = 1 + Math.random() * 2; this.blinkT = -1; this.react = null; this.reactT = 0;
  }
  build() {
    this.el.innerHTML = dodoSVG(this.o);
    const s = this.svg = this.el.querySelector('svg');
    this.q = k => s.querySelector(k);
    this.root = this.q('.root'); this.wl = this.q('.wl'); this.wr = this.q('.wr'); this.spr = this.q('.spr');
    this.ftl = this.q('.ftl'); this.ftr = this.q('.ftr'); this.t1 = this.q('.t1'); this.t2 = this.q('.t2');

  set(k, v) { if (this.o[k] !== v) { this.o[k] = v; this.build(); } }
  model(m) { if (this.o.model !== m) { this.svg.classList.replace('m-' + this.o.model, 'm-' + m); this.o.model = m; } }
  gadget(g) { if (this.svg.dataset.gad !== (g || '')) this.svg.dataset.gad = g || ''; }
  pose(t, p) {
    // Squash/stretch anchored at the feet (0,58), like the app's DodoPose.
    const tr = `translate(0,58) rotate(${r1(p.roll || 0)}) translate(0,${r1(p.y || 0)}) scale(${(p.sx || 1).toFixed(3)},${(p.sy || 1).toFixed(3)}) translate(0,-58)`;

    this.wl.setAttribute('transform', `rotate(${r1(wa)} -16.5 27.5)`);
    this.wr.setAttribute('transform', `rotate(${r1(-wb)} 16.5 27.5)`);
    const V = VIEWS[this.o.view] || VIEWS.front;
    this.spr.setAttribute('transform', `translate(${V ? V.spr : 0},0) rotate(${r1(p.spr || 0)} 0 -26)`);
    this.ftl.setAttribute('transform', `translate(0,${r1(-(p.fl || 0))})`);
    this.ftr.setAttribute('transform', `translate(0,${r1(-(p.fr || 0))})`);
    const [a, b] = tailPaths(t, this.dir, p.tail ?? this.wind);
    this.t1.setAttribute('d', a); this.t2.setAttribute('d', b);
    if (this.gads) this.gads.setAttribute('transform', `rotate(${r1(p.gad || 0)} 0 -30)`);

    if (!reduce) {

      if (this.blinkT >= 0) {

        if (u > .4) { this.blinkT = -1; this.nextBlink = t + 2.6 + Math.random() * 2.4; this.dbl = Math.random() > .7; }
      }
    }
  }
}

function idlePose(t, seed = 0) {
  if (reduce) return {};
  const br = .025 * (.5 + .5 * Math.sin(t * 2 * Math.PI / 3.2 + seed));

  if (u < .13) { const a = u / .13; return { sy: 1 - .08 * a, sx: 1 + .08 * a }; }

];

function geometry(W) {
  const cx = W / 2, amp = clamp(W * .21, 64, 112);
  const zig = j => [0, -1, 0, 1][j % 4];
  const nodes = [];
  for (let i = 1; i <= 30; i++) {
    const r = Math.floor((i - 1) / 10), j = (i - 1) % 10;
    nodes.push({ i, r, j, x: cx + zig(j) * amp, y: regTop(r) + LV0 + j * PITCH, zig: zig(j) });
  }
  const H = regTop(3) + SEA_H;
  return { W, H, cx, amp, nodes, zig };
}

function trailD(pts) {
  let d = `M${r1(pts[0].x)},${r1(pts[0].y)}`;
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k], my = (a.y + b.y) / 2, mx = (a.x + b.x) / 2, sp = (b.y - a.y) * .18;
    d += `Q${r1(a.x)},${r1(my - sp)} ${r1(mx)},${r1(my)}Q${r1(b.x)},${r1(my + sp)} ${r1(b.x)},${r1(b.y)}`;
  }
  return d;
}

/* Route Dodo walks: drift in with the region's gadget, then the trail, then behind the title card. */
function buildRoute(g) {
  const pts = [];
  const quad = (p0, c, p1, n, type) => { for (let k = 0; k <= n; k++) { const t = k / n, s = 1 - t; pts.push({ x: s * s * p0.x + 2 * s * t * c.x + t * t * p1.x, y: s * s * p0.y + 2 * s * t * c.y + t * t * p1.y, type }); } };
  const drift = (x0, y0, x1, y1, A, type, r) => {
    const n = Math.ceil((y1 - y0) / 4);
    for (let k = 0; k <= n; k++) { const u = k / n; pts.push({ x: lerp(x0, x1, u) + Math.sin(u * Math.PI * 2) * A * (1 - u), y: lerp(y0, y1, u), type, r, u }); }
  };
  for (let r = 0; r < 3; r++) {
    const top = regTop(r), ns = g.nodes.filter(n => n.r === r);
    drift(g.cx, top + 20, ns[0].x, ns[0].y, g.amp * .9, 'drift', r);
    const seq = [...ns, { x: g.cx, y: top + RH + 4 }];
    for (let k = 1; k < seq.length; k++) {
      const a = seq[k - 1], b = seq[k], my = (a.y + b.y) / 2, mx = (a.x + b.x) / 2, sp = (b.y - a.y) * .18;
      quad(a, { x: a.x, y: my - sp }, { x: mx, y: my }, 16, 'walk');
      quad({ x: mx, y: my }, { x: b.x, y: my + sp }, b, 16, 'walk');
    }
    for (let y = top + RH + 8; y < regTop(r + 1); y += 6) pts.push({ x: g.cx, y, type: 'walk' });
  }
  drift(g.cx, regTop(3) + 20, g.cx - 18, regTop(3) + 1188, g.W * .28, 'drift', 3);
  return pts;
}

function paintRegion3(W, top, defs, R) {
  let s = '';

  s += `<rect x="0" y="${top}" width="${W}" height="${SEA_H}" fill="${grad(defs, [[0, '#2a2e78'], [.12, '#6b4fa8'], [.26, '#e0739a'], [.34, '#ffb08a'], [.405, '#ffe6a8'], [.406, '#f7b89a'], [.55, '#8a70c0'], [.76, '#3e4a9a'], [.77, '#f6dcb4'], [1, '#e8c298']])}"/>`;
  // Stratus clouds lit from below.
  for (let k = 0; k < 6; k++) {
    const cy = top + 150 + k * 60 + R() * 20, cx = W * R(), w = 120 + R() * 180;
    s += `<g class="drift" style="animation-duration:${r1(50 + R() * 40)}s"><path d="M${r1(cx - w / 2)},${r1(cy)}Q${r1(cx)},${r1(cy - 16)} ${r1(cx + w / 2)},${r1(cy)}Q${r1(cx)},${r1(cy + 7)} ${r1(cx - w / 2)},${r1(cy)}Z" fill="#a45c9c" opacity=".85"/><path d="M${r1(cx - w * .42)},${r1(cy + 1)}Q${r1(cx)},${r1(cy + 9)} ${r1(cx + w * .42)},${r1(cy + 1)}" stroke="#ffc49a" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>`;
  }
  // The sun, its rays, and a lens flare (the 撮影 pass).
  const sx = W * .62;
  s += `<circle cx="${r1(sx)}" cy="${HZ}" r="260" fill="${rgrad(defs, [[0, '#fff8d8', .95], [.2, '#ffd29a', .55], [1, '#ff9a8a', 0]])}"/>`;
  let rays = ''; for (let k = 0; k < 16; k++) { const an = Math.PI + (k + .5) / 16 * Math.PI, a2 = an + .035; rays += `M${r1(sx)},${HZ}L${r1(sx + Math.cos(an) * 900)},${r1(HZ + Math.sin(an) * 900)}L${r1(sx + Math.cos(a2) * 900)},${r1(HZ + Math.sin(a2) * 900)}Z`; }
  s += `<path d="${rays}" fill="#fff4d0" opacity=".13"/>`;
  s += `<path d="M${r1(sx - 50)},${HZ}A50,50 0 0,1 ${r1(sx + 50)},${HZ}Z" fill="#fff6d6"/>`;
  const hex = (x, y, r, c, o) => { let d = ''; for (let k = 0; k < 6; k++) { const an = k / 6 * Math.PI * 2 + .5; d += (k ? 'L' : 'M') + r1(x + Math.cos(an) * r) + ',' + r1(y + Math.sin(an) * r); } return `<path d="${d}Z" fill="${c}" opacity="${o}"/>`; };
  for (const [f, r, c, o] of [[.25, 22, '#ffe0f0', .25], [.45, 12, '#c8f0ff', .3], [.7, 40, '#ffd0a0', .12], [.95, 16, '#fff', .2]]) s += hex(lerp(sx, W * .1, f), lerp(HZ, top + 120, f), r, c, o);

  s += `<path d="M${W * .02},${HZ}L${W * .06},${HZ - 16}L${W * .1},${HZ - 22}L${W * .13},${HZ - 58}Q${W * .15},${HZ - 66} ${W * .18},${HZ - 56}L${W * .2},${HZ - 30}Q${W * .27},${HZ - 26} ${W * .34},${HZ - 12}L${W * .38},${HZ}Z" fill="#5a4a8a"/>`;
  // Sea: glitter under the sun, waves.
  for (let k = 0; k < 44; k++) { const yy = HZ + 6 + Math.pow(R(), 1.4) * 480, sp = 20 + (yy - HZ) * .3; s += `<path class="glint" style="animation-delay:${r1(-R() * 2)}s" d="M${r1(sx + (R() - .5) * sp - 8)},${r1(yy)}h${r1(8 + R() * 18)}" stroke="#fff4d0" stroke-width="${r1(1 + (yy - HZ) / 160)}" stroke-linecap="round"/>`; }
  for (let k = 0; k < 18; k++) { const yy = HZ + 40 + R() * 440, xx = R() * W; s += `<path d="M${r1(xx)},${r1(yy)}q8,-4 16,0t16,0" stroke="#c8b8f0" stroke-width="1.2" fill="none" opacity=".5"/>`; }

  s += `<g class="train" style="--w:${W}px;animation-duration:26s"><g transform="translate(0,${ty - 22})"><rect x="0" y="0" width="120" height="20" rx="3" fill="#3a3a8a" stroke="#1a1440" stroke-width="1"/><rect x="0" y="12" width="120" height="3" fill="#e8b84a"/>${[8, 28, 48, 68, 88, 104].map(x => `<rect x="${x}" y="3" width="11" height="7" fill="#ffe0a8"/>`).join('')}<g opacity=".3" transform="translate(0,46) scale(1,-1)"><rect x="0" y="0" width="120" height="20" rx="3" fill="#3a3a8a"/></g></g></g>`;

  s += `<ellipse cx="${r1(tx)}" cy="${tb + 2}" rx="80" ry="5" fill="#fff" opacity=".25"/>`;
  // Gulls.
  for (let k = 0; k < 4; k++) s += `<g class="gull" style="--w:${W}px;animation-delay:${-k * 3.4}s;animation-duration:${r1(14 + k * 3)}s"><path d="M0,${r1(top + 200 + k * 50)}q6,-6 12,0q6,-6 12,0" stroke="#3a2a5a" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`;
  // Beach and foam.
  s += `<path class="foam" d="M0,${SEA + 4}Q${W * .25},${SEA - 6} ${W * .5},${SEA + 4}T${W},${SEA + 2}V${SEA + 14}H0Z" fill="#fff" opacity=".85"/>`;

  return s;
}

function paintWorld() {
  const W = document.documentElement.clientWidth;
  G = geometry(W);
  const R = rng(20260923);
  const defs = [];
  let body = '';
  body += paintRegion0(W, regTop(0), defs, R);
  body += paintRegion1(W, regTop(1), defs, R);
  body += paintRegion2(W, regTop(2), defs, R);
  body += paintRegion3(W, regTop(3), defs, R);
  // Level nodes: waystones with a stamp-rally hanko.
  const STONE = [['#f4efe0', '#8e8468', '#d3c9ac', '#3b3a4c'], ['#c9cba8', '#3a4630', '#9fa383', '#23281e'], ['#f2d9bc', '#5a3f5e', '#c9a68e', '#3a2230']];
  let nodes = '';
  for (const n of G.nodes) {
    const [base, edge, shade, ink] = STONE[n.r], rot = ((n.i * 37) % 30) - 15;
    let extra = '';
    if (CHESTS[n.i]) {
      const ex = n.zig < 0 ? n.x - 52 : n.x + 50, ey = n.zig < 0 ? n.y + 4 : n.y - 32;

      if (n.r === 1) extra = `<g class="bobk"><circle cx="${ex}" cy="${ey}" r="16" fill="#ffd89a" opacity=".2"/><path d="M${ex - 8},${ey - 6}Q${ex},${ey - 10} ${ex + 8},${ey - 6}L${ex + 9},${ey + 12}Q${ex},${ey + 14} ${ex - 9},${ey + 12}Z" fill="#e8363e" stroke="#2a0a14" stroke-width="1.1"/><path d="M${ex - 5},${ey - 8}q5,-6 10,0" stroke="#ffd34a" stroke-width="1.6" fill="none"/><rect x="${ex - 4}" y="${ey - 1}" width="8" height="9" fill="#fff6e0"/><text x="${ex}" y="${ey + 6}" text-anchor="middle" font-family="Shippori Mincho B1" font-weight="800" font-size="6.4" fill="#e8363e">守</text></g>`;

    </g>`;

  const fam = [[G.cx + Math.min(96, G.W * .24), regTop(3) + 1196, 'fam1', .78], [G.cx + Math.min(150, G.W * .38), regTop(3) + 1200, 'fam2', .62]];

function paintHero() {
  const el = document.getElementById('heroBg'), hero = document.getElementById('hero');
  const W = hero.clientWidth, H = hero.clientHeight, R = rng(1998);
  const defs = []; let s = '';
  const HZ = H * .7, wide = W / H > 1.25;
  s += `<rect width="${W}" height="${H}" fill="${grad(defs, [[0, '#0e3fb0'], [.35, '#2c7ae8'], [.62, '#86ccfb'], [.7, '#e2f6ff'], [.701, '#5ab84a'], [1, '#3a9a3c']])}"/>`;
  const sunx = wide ? W * .3 : W * .18, suny = H * .1;
  s += `<circle cx="${sunx}" cy="${suny}" r="${H * .5}" fill="${rgrad(defs, [[0, '#fffbe6', .95], [.12, '#fff2b8', .5], [1, '#fff', 0]])}"/>`;
  s += cumulo(defs, R, wide ? W * .7 : W * .56, HZ - 6, Math.max(W * (wide ? .8 : 1.25), 460), H * .66, { sh: '#a8b4ee', lit: '#ffffff', hi: '#fffaf0', base: '#b4c0f0' });
  s += `<g class="drift">` + cumulo(defs, R, wide ? W * .12 : W * .1, H * .36, W * .32, H * .1, { sh: '#bcc8f2', lit: '#fff', base: '#c8d2f6' }) + `</g>`;
  s += `<path d="M${W * .98},${H * .18}L${W * .6},${H * .3}" stroke="#fff" stroke-width="2" opacity=".75" stroke-linecap="round"/><circle cx="${W * .6}" cy="${H * .3}" r="2" fill="#fff"/>`;
  s += ridge(R, W, HZ - 26, 22, '#6f9fe6', 7, HZ + 10) + ridge(R, W, HZ - 12, 12, '#4f86d4', 11, HZ + 10) + ridge(R, W, HZ - 3, 6, '#2f7d5b', 30, HZ + 12);
  // Perspective paddies with a white road to the vanishing point.
  const vp = W * .5;
  let rows = ''; let y = HZ + 3, h = 5, k = 0;
  while (y < H) { rows += `<rect x="0" y="${r1(y)}" width="${W}" height="${r1(h)}" fill="${k % 2 ? '#62c24e' : '#4fae43'}"/>`; if (k % 3 === 1) rows += `<rect x="0" y="${r1(y + h * .2)}" width="${W}" height="${r1(h * .5)}" fill="#9ad8f6" opacity=".5"/>`; y += h; h *= 1.32; k++; }
  s += rows;
  let div = ''; for (let q = -10; q <= 10; q++) div += `M${r1(vp + q * 6)},${r1(HZ + 3)}L${r1(vp + q * W * .22)},${H}`;
  s += `<path d="${div}" stroke="#d6e69a" stroke-width="2.4" opacity=".8"/>`;
  s += `<path d="M${r1(vp - 3)},${r1(HZ + 3)}L${r1(vp + 3)},${r1(HZ + 3)}L${r1(vp + W * .2)},${H}L${r1(vp - W * .2)},${H}Z" fill="#f2ead0"/><path d="M${r1(vp)},${r1(HZ + 3)}L${r1(vp + W * .03)},${H}L${r1(vp - W * .03)},${H}Z" fill="#e2d6b0" opacity=".6"/>`;
  // Pole and wires.
  const px = wide ? W * .06 : W * .09, pw = Math.max(10, W * .018);
  s += `<rect x="${r1(px - pw / 2)}" y="${r1(H * .04)}" width="${r1(pw)}" height="${r1(H)}" fill="#26304e"/><rect x="${r1(px - pw * 3)}" y="${r1(H * .1)}" width="${r1(pw * 6)}" height="${r1(pw * .7)}" fill="#26304e"/><rect x="${r1(px - pw * 2.2)}" y="${r1(H * .16)}" width="${r1(pw * 4.4)}" height="${r1(pw * .6)}" fill="#26304e"/>`;
  for (const [o, e, sag] of [[-2.6, .26, .1], [-1, .3, .14], [1.2, .34, .18], [2.6, .22, .08]]) s += `<path d="M${r1(px + o * pw)},${r1(H * .1)}Q${r1(W * .5)},${r1(H * (.1 + sag))} ${W + 10},${r1(H * e)}" stroke="#26304e" stroke-width="1.4" fill="none"/>`;
  // Lens flare from the sun.
  for (const [f, r, c, o] of [[.3, 30, '#ffe6c8', .22], [.5, 14, '#c8e6ff', .3], [.8, 54, '#fff0d0', .1], [1.1, 20, '#ffd0f0', .2]]) s += `<circle cx="${r1(lerp(sunx, W * .8, f))}" cy="${r1(lerp(suny, H * .9, f))}" r="${r}" fill="${c}" opacity="${o}"/>`;
  s += sfx(wide ? W * .84 : W * .66, H * .52, 'ミーン', -8, Math.round(W * .04 + 12), '#fff', '#2c7ae8', .8);
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.innerHTML = `<defs>${defs.join('')}</defs>${s}`;
  const size = Math.min(H * .42, W * (wide ? .3 : .64));
  const dw = document.getElementById('heroDodo'); dw.style.width = size + 'px';
}

    <ul class="notes">
      <li data-n="1"><b>The sprout is the ahoge.</b> Anime gives a character one stray hair that acts. Dodo's sprout perks up on a right answer, wilts on a wrong one, curls into a question mark while thinking, and holds the umbrella, because the wings are too short.</li>
      <li data-n="2"><b>Cel, not airbrush.</b> Every surface gets three flat tones: base, shadow, highlight. The only gradient on the character is in the eyes. The backgrounds are painted; the character sits on top of them in hard shapes, the way cels sit on painted boards.</li>
      <li data-n="3"><b>Coloured line art.</b> The trace line is deep indigo, never black, and warm brown around the beak and feet. At night the line darkens and a lantern rim light runs down the right edge.</li>
      <li data-n="4"><b>Shadows go violet.</b> Shadow colours are cooler and more purple than the base, and the whole model is re-coloured per scene: noon, magic hour, festival night, dawn. That's why Dodo changes colour as you walk.</li>
      <li data-n="5"><b>The eyes do the acting.</b> Taller than wide, a lash line with an outer flick, an iris that lightens toward the bottom, two catchlights from one light source (upper left). Stars when excited, a flat lid when determined.</li>
      <li data-n="6"><b>A red scarf.</b> A traveller needs something the wind can move. It's the one colour the design system keeps constant against every background, and it tells you which way the wind is blowing in every frame.</li>
      <li data-n="7"><b>New setting: a summer in the countryside.</b> The meadow became rice paddies and telephone wires, the ferns a cedar wood with spirits, the summit a festival night. The sea is Mauritius, where dodos came from. The level buttons are stamp-rally waystones.</li>
      <li data-n="8"><b>A Dodo can't fly</b>, so between episodes it drifts in under something else: a janome umbrella, a giant leaf, a wish lantern, and for the last one, a paper crane.</li>

  const el = document.getElementById('speed'), box = document.getElementById('next');
  const W = box.clientWidth, H = box.clientHeight, R = rng(5), cx = W / 2, cy = H * .56;
  let d = '';
  for (let k = 0; k < 90; k++) { const an = R() * Math.PI * 2, a2 = an + .012 + R() * .02, r0 = 90 + R() * 60, r2 = Math.max(W, H); d += `M${r1(cx + Math.cos(an) * r0)},${r1(cy + Math.sin(an) * r0)}L${r1(cx + Math.cos(an) * r2)},${r1(cy + Math.sin(an) * r2)}L${r1(cx + Math.cos(a2) * r2)},${r1(cy + Math.sin(a2) * r2)}Z`; }
  let rats = '';
  const rat = (x, y, s, f) => `<g transform="translate(${x},${y}) scale(${s * f},${s})"><path d="M-30,6Q-50,0 -58,-14" stroke="#1a1a22" stroke-width="3" fill="none"/><ellipse cx="0" cy="0" rx="30" ry="16" fill="#15151e"/><path d="M22,-8L46,2L22,10Z" fill="#15151e"/><circle cx="20" cy="-12" r="7" fill="#15151e"/><circle cx="34" cy="-2" r="2.6" fill="#ff3a3a"/><path d="M-28,-8Q0,-22 26,-10" stroke="#fff" stroke-width="1.4" fill="none" opacity=".35"/></g>`;
  rats = rat(W * .12, H * .6, 1.1, 1) + rat(W * .88, H * .56, 1.2, -1) + rat(W * .2, H * .7, .8, 1) + rat(W * .8, H * .68, .7, -1);
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.innerHTML = `<rect width="${W}" height="${H}" fill="#0a0a10"/><circle cx="${cx}" cy="${cy}" r="${H * .45}" fill="#e8363e" opacity=".22"/><path d="${d}" fill="#fff" opacity=".85"/>${rats}`;
}

/* ════════════════════════════════════════════════════════════════════
   Motion
   ════════════════════════════════════════════════════════════════════ */
let ROUTE = [], walker = null, stamped = new Set(), dodoPos = null, now = 0, walkPh = 0, lastMove = 0, facing = 'front', region = -1, heroM, nextM;
const worldEl = document.getElementById('world'), hud = document.getElementById('hud');
const meta = document.querySelector('meta[name="theme-color"]');

function routeAt(y) {
  let lo = 0, hi = ROUTE.length - 1;
  if (y <= ROUTE[0].y) return ROUTE[0];
  if (y >= ROUTE[hi].y) return ROUTE[hi];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ROUTE[m].y < y) lo = m; else hi = m; }
  const a = ROUTE[lo], b = ROUTE[hi], t = (y - a.y) / Math.max(.001, b.y - a.y);
  return { x: lerp(a.x, b.x, t), y, type: a.type, r: a.r, u: a.u != null ? lerp(a.u, b.u ?? a.u, t) : null };
}
function regionOf(y) { for (let r = 3; r >= 0; r--) if (y >= regTop(r) - BAND * .5) return r; return 0; }

function frame(ts) {
  now = ts / 1000;
  // Hero + next-episode mascots idle.
  if (heroM) { const p = idlePose(now); heroM.pose(now, { ...p, ...(heroM.react ? hopPose(Math.min(1, (now - heroM.reactT) / .6)) : {}), tail: 2.4 }); if (heroM.react && now - heroM.reactT > .6) { heroM.react = null; heroM.set('expr', 'normal'); } }
  if (nextM) nextM.pose(now, { ...idlePose(now, 2), tail: 3 });
  if (walker && ROUTE.length) {
    const wr = worldEl.getBoundingClientRect();
    const target = clamp(-wr.top + innerHeight * .58, ROUTE[0].y, ROUTE[ROUTE.length - 1].y);
    if (!dodoPos) dodoPos = routeAt(target);
    const ny = reduce ? target : lerp(dodoPos.y, target, .14);
    const dy = ny - dodoPos.y;
    const p = routeAt(ny);
    const dx = p.x - dodoPos.x;
    dodoPos = p;
    if (Math.abs(dy) > .6) lastMove = now;
    const moving = now - lastMove < .25;
    // Facing: three-quarter toward the direction of travel while walking.
    const want = moving && p.type === 'walk' && Math.abs(dx) > .15 ? (dx > 0 ? 'right' : 'left') : (moving ? facing : 'front');
    if (want !== facing) { facing = want; walker.set('view', want === 'front' ? 'front' : 'q'); walker.dir = want === 'left' ? 1 : -1; walker.el.firstElementChild.style.transform = want === 'left' ? 'scaleX(-1)' : ''; }
    // Colour model + HUD by region.
    const rg = regionOf(p.y);
    if (rg !== region) { region = rg; const e = EPISODES[rg]; walker.model(e.model); document.getElementById('hudJp').textContent = e.jp; document.getElementById('hudEn').textContent = e.hud; meta.setAttribute('content', e.theme); }
    // Gadget while drifting.
    const drifting = p.type === 'drift' && (p.u ?? 0) < .965;
    walker.gadget(drifting ? EPISODES[p.r].gad : '');
    let pose;
    if (drifting) {
      pose = { roll: 7 * Math.sin(now * 1.6), gad: -6 * Math.sin(now * 1.6), wing: 112 + 6 * Math.sin(now * 3), wingR: 112 + 6 * Math.sin(now * 3 + 1), fl: 2 + 2 * Math.sin(now * 2), fr: 2 + 2 * Math.sin(now * 2 + 1.4), spr: 6 * Math.sin(now * 2), tail: 3 };
      if (EPISODES[p.r].gad === 'crane') { pose.wing = 30 + 20 * Math.sin(now * 3); pose.wingR = pose.wing; pose.fl = pose.fr = 0; pose.roll = 4 * Math.sin(now * 1.2); pose.gad = 0; }
    } else if (moving) {
      walkPh += Math.abs(dy) * .085 + .02;
      pose = walkPose(walkPh);
    } else pose = { ...idlePose(now), tail: 1.4 };
    if (walker.react) { const u = (now - walker.reactT) / .6; if (u >= 1) { walker.react = null; walker.set('expr', 'normal'); } else { if (walker.o.expr !== 'happy') walker.set('expr', 'happy'); pose = { ...pose, ...hopPose(u) }; } }
    walker.pose(now, pose);
    // Place: feet (art 0,58) at the route point. viewBox -70 -112 140 196 → feet at (70,170).
    const k = Math.min(1, G.W / 420) * .92 + .08;
    walker.el.style.width = (140 * k) + 'px';
    walker.el.style.transform = `translate(${r1(p.x - 70 * k)}px,${r1(p.y - 170 * k)}px)`;
    // Stamp rally.
    for (const n of G.nodes) {
      if (!stamped.has(n.i) && p.y >= n.y - 4 && p.type === 'walk') {
        stamped.add(n.i);
        const g = worldEl.querySelector(`.node[data-i="${n.i}"]`); if (g) g.classList.add('stamped');
        if (Math.abs(target - p.y) < 400) { popText(worldEl, n.x + (n.zig > 0 ? -30 : 30), n.y - 34, n.i % 10 === 0 ? 'ドン!' : 'ポン!', n.i % 5 === 0); if (n.i % 5 === 0) { walker.react = 'hop'; walker.reactT = now; } }
        document.getElementById('hudStamps').textContent = String(stamped.size).padStart(2, '0');
      }
    }
    document.getElementById('home').classList.toggle('on', p.y >= ROUTE[ROUTE.length - 1].y - 20);
    hud.classList.toggle('on', wr.top < innerHeight * .3 && wr.bottom > innerHeight * .6);
  }
  requestAnimationFrame(frame);
}

function build() {
  paintHero(); paintWorld(); paintSettei(); paintNext();
  heroM = new Mascot(document.getElementById('heroDodo'), { model: 'day', view: 'q', expr: 'normal', look: [1.2, -2], dir: -1, vb: '-56 -64 112 126' });
  heroM.el.onclick = () => { heroM.set('expr', 'excited'); heroM.react = 'hop'; heroM.reactT = now; const b = heroM.el.getBoundingClientRect(), hb = document.getElementById('hero').getBoundingClientRect(); popText(document.getElementById('hero'), b.left - hb.left + b.width / 2, b.top - hb.top, 'ピョン!', true); };
  nextM = new Mascot(document.getElementById('nextDodo'), { model: 'day', view: 'front', expr: 'determined', dir: -1, vb: '-52 -64 104 126' });
  region = -1;
}
let lastW = document.documentElement.clientWidth, rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const w = document.documentElement.clientWidth; if (w !== lastW) { lastW = w; build(); } else paintHero(); }, 200); });
// Stills (scripts/dodo-anime/stills.mjs) borrow the drawing code without the page.
window.__anime = { dodoSVG, tailPaths, cumulo, grad, rgrad, rng, ridge, star4 };
if (location.hash === '#still') return;
const go = () => { build(); requestAnimationFrame(frame); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
})();
</script>
</body>
