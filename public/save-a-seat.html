<script>
'use strict';
/* ============================================================
   save a seat — what makes a home, anyway?
   A torn-paper collage short. Everything is drawn on canvas
   and synthesised with Web Audio; no image or audio files.
   ============================================================ */

const VW = 1600, VH = 900, GY = 770;              // logical size, ground line
const BPM = 100, BEAT = 60 / BPM, BAR = BEAT * 4; // .6 / 2.4
const S0 = [0, 4.8, 12.0, 19.2, 26.4], DUR = [4.8, 7.2, 7.2, 7.2, 14.4];
const T = 40.8, WIPE = .7;
const HAND = '"Caveat Brush", cursive', BLOCK = '"Bowlby One", sans-serif';
const C = {
  sky: '#b5d5e5', mint: '#c3dfc9', ochre: '#ecd290', navy: '#27315b', dusk: '#eab39c', plum: '#40355f',
  grass: '#2f6a3d', grassN: '#24503a', tan: '#b8895a', tan2: '#a37a52',
  cream: '#f3ecd9', fringe: '#fbf7ec', ink: '#221f1d', red: '#df5a37', pink: '#e9a2b0', teal: '#5aa894',
  blue: '#3d6cb5', yellow: '#edc04a', orange: '#e8a33a', green: '#4f9a62', brick: '#cf5f3f', wood: '#9a6a45',
};

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const cv = document.getElementById('c');
const g = cv.getContext('2d');
let S = 1, PW = 1600, PH = 900, BF = 0;
const tex = {};
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function noiseImg(x, w, h, amt, fn) {
  const im = x.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; if (fn) fn(d, i); }
  x.putImageData(im, 0, 0);
}

// ============================================================
//  TORN PAPER
// ============================================================
// Every shape is a polygon whose edges are subdivided and pushed in/out a little.
// A second, slightly bigger polygon in off-white sits under it: the torn fibre edge.
// The jitter "boils" a touch (BF steps at 8 fps), like cut paper under a camera.
const PCACHE = new Map();
function torn(pts, seed, amp = 1.8, step = 7) {
  const key = seed + '|' + BF + '|' + amp + '|' + pts.length + '|' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1) + '|' + pts[1][0].toFixed(1);
  let p = PCACHE.get(key); if (p) return p;
  p = new Path2D(); let k = 0;
  for (let e = 0; e < pts.length; e++) {
    const [ax, ay] = pts[e], [bx, by] = pts[(e + 1) % pts.length];
    const L = Math.hypot(bx - ax, by - ay) || 1, n = Math.max(1, Math.round(L / step)), nx = -(by - ay) / L, ny = (bx - ax) / L;
    for (let j = 0; j < n; j++, k++) {
      const u = j / n, d = (hash(seed, k) - .5) * 2 * amp + (hash(seed + BF * 37, k) - .5) * amp * .6;
      const x = lerp(ax, bx, u) + nx * d, y = lerp(ay, by, u) + ny * d;
      k === 0 ? p.moveTo(x, y) : p.lineTo(x, y);
    }
  }
  p.closePath();
  if (PCACHE.size > 6000) PCACHE.clear();
  PCACHE.set(key, p); return p;
}
const grow = (pts, d) => { let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length; return pts.map(([x, y]) => { const L = Math.hypot(x - cx, y - cy) || 1; return [x + (x - cx) / L * d, y + (y - cy) / L * d]; }); };
const rectPts = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
const ellPts = (rx, ry, n = 22) => Array.from({ length: n }, (_, i) => { const a = i / n * 6.283; return [Math.cos(a) * rx, Math.sin(a) * ry]; });
function rrPts(w, h, r) { const out = []; const c = [[w / 2 - r, -h / 2 + r, -Math.PI / 2], [w / 2 - r, h / 2 - r, 0], [-w / 2 + r, h / 2 - r, Math.PI / 2], [-w / 2 + r, -h / 2 + r, Math.PI]]; c.forEach(([x, y, a0]) => { for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; out.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } }); return out; }

// paper(pts, fill, seed): shadow + fibre edge + fill, in the current transform
function paper(pts, fill, seed, o = {}) {
  const amp = o.amp ?? 1.8, main = torn(pts, seed, amp), fr = torn(grow(pts, o.edge ?? 2.2), seed + 17, amp * 1.3);
  if (o.shadow !== false) { g.save(); g.translate(o.sx ?? 3, o.sy ?? 4); g.fillStyle = o.shadowCol || 'rgba(45,28,18,.2)'; g.fill(fr); g.restore(); }
  if (o.fringe !== false) { g.fillStyle = o.fringeCol || C.fringe; g.save(); g.translate(-.8, -1); g.fill(fr); g.restore(); }
  g.fillStyle = fill; g.fill(main);
  return main;
}

// ============================================================
//  TEXTURES
// ============================================================
function bgTex(col, seed, extra) {
  const c = mk(PW, PH), x = c.getContext('2d'); x.scale(S, S);
  x.fillStyle = col; x.fillRect(0, 0, VW, VH);
  const r = rng(seed);
  for (let i = 0; i < 26; i++) {
    const px = r() * VW, py = r() * VH, rr = 160 + r() * 380, light = r() < .5;
    const gr = x.createRadialGradient(px, py, 0, px, py, rr);
    gr.addColorStop(0, light ? 'rgba(255,255,255,.07)' : 'rgba(60,40,30,.06)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(px - rr, py - rr, rr * 2, rr * 2);
  }
  // paper fibres
  x.lineWidth = .7;
  for (let i = 0; i < 500; i++) { const px = r() * VW, py = r() * VH, a = r() * 6.28, L = 6 + r() * 18; x.strokeStyle = r() < .5 ? 'rgba(255,255,255,.08)' : 'rgba(40,30,20,.05)'; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 1) * L / 2, py + Math.sin(a + 1) * L / 2, px + Math.cos(a) * L, py + Math.sin(a) * L); x.stroke(); }
  if (extra) extra(x, r);
  const vg = x.createRadialGradient(VW / 2, VH / 2, VH * .4, VW / 2, VH / 2, VW * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,25,15,.22)');
  x.fillStyle = vg; x.fillRect(0, 0, VW, VH);
  x.setTransform(1, 0, 0, 1, 0, 0);
  noiseImg(x, PW, PH, 12);
  return c;
}
function buildTextures() {
  tex.sky = bgTex(C.sky, 1); tex.mint = bgTex(C.mint, 2); tex.ochre = bgTex(C.ochre, 3); tex.dusk = bgTex(C.dusk, 5); tex.plum = bgTex(C.plum, 6);
  tex.navy = bgTex(C.navy, 4, (x, r) => { for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(245,240,225,${.4 + r() * .6})`; x.beginPath(); x.arc(r() * VW, r() * 700, .8 + r() * 1.8, 0, 6.28); x.fill(); } });
  const c = mk(256, 256), x = c.getContext('2d');
  noiseImg(x, 256, 256, 0, (d, i) => { const w = Math.random() < .5; d[i] = d[i + 1] = d[i + 2] = w ? 255 : 30; d[i + 3] = Math.random() * 24; });
  tex.grain = g.createPattern(c, 'repeat');
  const gl = mk(64, 64), gx = gl.getContext('2d'), gr = gx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,226,150,1)'); gr.addColorStop(.25, 'rgba(255,200,110,.5)'); gr.addColorStop(1, 'rgba(255,180,90,0)');
  gx.fillStyle = gr; gx.fillRect(0, 0, 64, 64); tex.glow = gl;
}

// paper backgrounds are screen-fixed (the sheet under the camera), so zooming never shows an edge
function bg(img) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(img, 0, 0, PW, PH); g.restore(); }

// ============================================================
//  SET PIECES
// ============================================================
function ground(col, seed = 3) {
  g.save(); g.translate(0, 0);
  const pts = [[-30, GY], [VW + 30, GY], [VW + 30, VH + 30], [-30, VH + 30]];
  const main = torn(pts, seed, 3.2, 9), fr = torn(pts.map(([x, y]) => [x, y - 3]), seed + 5, 4.2, 9);
  g.fillStyle = C.fringe; g.fill(fr); g.fillStyle = col; g.fill(main);
  g.restore();
}
function cloud(x, y, s, seed, col = C.cream, fringe) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const pts = []; const n = 30;
  for (let i = 0; i < n; i++) { const a = i / n * 6.283, lob = 1 + .16 * Math.sin(a * 4 + seed) + .08 * Math.sin(a * 7 + seed * 2); pts.push([Math.cos(a) * 90 * lob, Math.sin(a) * 30 * lob - (Math.sin(a) < 0 ? 6 : 0)]); }
  paper(pts, col, seed, { amp: 2.4, shadow: false, fringeCol: fringe || C.fringe, edge: 2.6 });
  g.restore();
}
function tape(x, y, rot, w = 56) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = 'rgba(214,196,150,.78)';
  g.fill(torn(rectPts(w, 18), 900 + Math.round(x), 1.2, 5));
  g.restore();
}
// a taped paper caption; text types in character by character
function caption(text, x, y, n, alpha = 1, pop = 1, size = 40) {
  g.save(); g.globalAlpha *= alpha;
  g.font = `${size}px ${HAND}`;
  const tw = g.measureText(text).width, w = tw + 70, h = size * 1.45;
  g.translate(x, y); g.rotate(-.012); g.scale(pop, pop);
  paper(rectPts(w, h), C.cream, 700 + text.length, { amp: 2.2 });
  tape(-w / 2 + 16, -h / 2 + 2, -.6, 46); tape(w / 2 - 16, -h / 2 + 2, .6, 46);
  g.fillStyle = C.ink; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(text.slice(0, n), -tw / 2, 2);
  g.restore();
}
// ransom-note letter tile
const TILE = [['#e9a2b0', '#1f1c1a'], ['#5aa894', '#1f1c1a'], ['#3d6cb5', '#f6efe2'], ['#e8a33a', '#1f1c1a'], ['#df5a37', '#f6efe2'], ['#f1e8d6', '#df5a37'], ['#2b2826', '#f6efe2'], ['#f1e8d6', '#3d6cb5']];
function tile(ch, x, y, size, k, rot = 0, sc = 1) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc, sc);
  g.font = `${size}px ${BLOCK}`;
  const tw = g.measureText(ch).width, w = tw + size * .34, h = size * 1.14;
  const [bg, fg] = TILE[k % TILE.length];
  paper(rectPts(w, h), bg, 300 + k * 7, { amp: 1.6 });
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, 0, size * .06);
  g.restore();
}
function tileW(ch, size) { g.font = `${size}px ${BLOCK}`; return g.measureText(ch).width + size * .34; }

// ============================================================
//  CHARACTERS
// ============================================================
function face(x, y, s, o) {
  const lk = (o.look || 0) * 4 * s, ly = (o.lookY || 0) * 3 * s;
  g.fillStyle = C.ink; g.strokeStyle = C.ink; g.lineCap = 'round'; g.lineWidth = 2.4 * s;
  [-1, 1].forEach(d => {
    const ex = x + d * 10 * s + lk, ey = y - 3 * s + ly;
    if (o.eyes === 'happy') { g.beginPath(); g.arc(ex, ey + 2 * s, 4.5 * s, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    else if (o.eyes === 'closed') { g.beginPath(); g.moveTo(ex - 4 * s, ey); g.lineTo(ex + 4 * s, ey); g.stroke(); }
    else if (o.eyes === 'sad') { g.beginPath(); g.moveTo(ex - 4 * s, ey - d * 1.5 * s); g.lineTo(ex + 4 * s, ey + d * 1.5 * s); g.stroke(); g.beginPath(); g.arc(ex, ey + 2 * s, 2.2 * s, 0, 6.28); g.fill(); }
    else { g.beginPath(); g.arc(ex, ey, (o.eyes === 'wide' ? 3.6 : 2.8) * s, 0, 6.28); g.fill(); }
  });
  g.fillStyle = 'rgba(233,120,120,.55)';
  g.beginPath(); g.ellipse(x - 17 * s, y + 6 * s, 5 * s, 3.2 * s, 0, 0, 6.28); g.ellipse(x + 17 * s, y + 6 * s, 5 * s, 3.2 * s, 0, 0, 6.28); g.fill();
  const mx = x + lk * .6, my = y + 10 * s;
  g.strokeStyle = C.ink; g.fillStyle = '#5a2418'; g.lineWidth = 2.2 * s;
  switch (o.mouth) {
    case 'o': g.beginPath(); g.ellipse(mx, my + 1 * s, 3 * s, 4 * s, 0, 0, 6.28); g.fill(); break;
    case 'yawn': g.beginPath(); g.ellipse(mx, my + 2 * s, 4.5 * s, 7 * s, 0, 0, 6.28); g.fill(); break;
    case 'flat': g.beginPath(); g.moveTo(mx - 5 * s, my + 1 * s); g.lineTo(mx + 5 * s, my + 1 * s); g.stroke(); break;
    case 'sad': g.beginPath(); g.arc(mx, my + 7 * s, 6 * s, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); break;
    case 'grin': g.beginPath(); g.moveTo(mx - 7 * s, my - 1 * s); g.quadraticCurveTo(mx, my - 1 * s, mx + 7 * s, my - 1 * s); g.quadraticCurveTo(mx, my + 11 * s, mx - 7 * s, my - 1 * s); g.fill(); break;
    default: g.beginPath(); g.arc(mx, my - 3 * s, 6 * s, Math.PI * .22, Math.PI * .78); g.stroke();
  }
}
function limb(pts, s) { g.strokeStyle = C.ink; g.lineWidth = 3 * s; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
function armPts(side, sx, sy, s, pose, t) {
  const d = side;
  switch (pose) {
    case 'up': return [[sx, sy], [sx + d * 18 * s, sy - 18 * s], [sx + d * 24 * s, sy - 38 * s]];
    case 'wave': return d > 0 ? [[sx, sy], [sx + 20 * s, sy - 16 * s], [sx + (26 + Math.sin(t * 18) * 8) * s, sy - 38 * s]] : [[sx, sy], [sx - 8 * s, sy + 20 * s], [sx - 10 * s, sy + 38 * s]];
    case 'shrug': return [[sx, sy], [sx + d * 18 * s, sy + 10 * s], [sx + d * 26 * s, sy - 8 * s]];
    case 'pat': return d < 0 ? [[sx, sy], [sx - 20 * s, sy + 16 * s], [sx - 40 * s, sy + (30 + Math.abs(Math.sin(t * 14)) * -8) * s]] : [[sx, sy], [sx + 8 * s, sy + 20 * s], [sx + 10 * s, sy + 38 * s]];
    case 'hold': return d > 0 ? [[sx, sy], [sx + 12 * s, sy + 6 * s], [sx + 22 * s, sy - 4 * s]] : [[sx, sy], [sx - 8 * s, sy + 20 * s], [sx - 10 * s, sy + 36 * s]];
    case 'hug': return [[sx, sy], [sx + d * 6 * s, sy + 20 * s], [sx - d * 10 * s, sy + 30 * s]];
    default: return [[sx, sy], [sx + d * 8 * s, sy + 20 * s], [sx + d * 10 * s, sy + 38 * s]];
  }
}
// Pip: cream head, red body, stick limbs. y = feet (standing) or seat (sitting). returns the hand position for 'hold'
function pip(x, y, o = {}, t = 0) {
  const s = o.s || 1, sit = o.sit, sd = o.seed || 11;
  let hip = sit ? y - 2 * s : y - 38 * s;
  hip += o.bob || 0;
  const top = hip - 58 * s, hy = top - 22 * s + (o.headDy || 0);
  // legs
  if (sit) { limb([[x - 8 * s, hip], [x + 4 * s, hip + 4 * s], [x + 2 * s, GY - 2]], s); limb([[x + 8 * s, hip], [x + 18 * s, hip + 4 * s], [x + 16 * s, GY - 2]], s); }
  else { const w = o.walk ? Math.sin(o.walk) * 9 * s : 0; limb([[x - 8 * s, hip], [x - 9 * s + w, y]], s); limb([[x + 8 * s, hip], [x + 9 * s - w, y]], s); g.fillStyle = C.ink; g.fillRect(x - 15 * s + w, y - 2, 8 * s, 3); g.fillRect(x + 7 * s - w, y - 2, 8 * s, 3); }
  // arms behind? no: body first, then arms over
  g.save(); g.translate(x, hip - 27 * s); g.rotate(o.tilt || 0);
  paper(rrPts(56 * s, 64 * s, 16 * s), C.red, sd, { amp: 1.4 });
  g.restore();
  const shY = top + 16 * s;
  limb(armPts(-1, x - 24 * s, shY, s, o.armsL || o.arms, t), s);
  const R = armPts(1, x + 24 * s, shY, s, o.armsR || o.arms, t); limb(R, s);
  g.save(); g.translate(x + (o.headDx || 0), hy); g.rotate((o.tilt || 0) * .6);
  paper(ellPts(30 * s, 29 * s), '#f1e9da', sd + 3, { amp: 1.5 });
  g.restore();
  face(x + (o.headDx || 0), hy, s, o);
  return R[R.length - 1];
}
// a friend: one round coloured blob, face on the body, stick arms and legs
function blob(x, y, col, o = {}, t = 0) {
  const s = o.s || 1, sit = o.sit, sd = o.seed || 21, r = 34 * s;
  const by = (sit ? y - r + 6 * s : y - 24 * s - r) + (o.bob || 0);
  if (sit) { limb([[x - 10 * s, by + r - 4], [x - 6 * s, GY - 2]], s); limb([[x + 10 * s, by + r - 4], [x + 14 * s, GY - 2]], s); }
  else { const w = o.walk ? Math.sin(o.walk) * 8 * s : 0; limb([[x - 10 * s, by + r - 4], [x - 10 * s + w, y]], s); limb([[x + 10 * s, by + r - 4], [x + 10 * s - w, y]], s); }
  const L = armPts(-1, x - r + 4 * s, by + 4 * s, s, o.armsL || o.arms, t), R = armPts(1, x + r - 4 * s, by + 4 * s, s, o.armsR || o.arms, t);
  limb(L, s); limb(R, s);
  g.save(); g.translate(x, by); g.rotate(o.tilt || 0);
  paper(ellPts(r, r * .96), col, sd, { amp: 1.6 });
  g.restore();
  face(x, by - 2 * s, s * .9, o);
  return R[R.length - 1];
}
function umbrella(gx, gy, col, tilt = 0, sc = 1, seed = 41) {
  g.save(); g.translate(gx, gy); g.rotate(tilt); g.scale(sc, sc);
  g.strokeStyle = C.ink; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -118); g.stroke();

function LAYOUT_T() { if (!LAYOUT) layoutTitle(); return LAYOUT; }

let EV = [], AC = null, AUD = null, startAt = 0, loopN = 0, evIdx = 0, playing = false;
