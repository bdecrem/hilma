<style>
:root {
  --black: #000000;
  --hot: #ffff55;
  --cyan: #55ffff;
  --choice: #d58bff;
  --gold: #e6b547;

  /* layout: one full-bleed 320x180 pixel scene; text, labels and dialog choices float over it */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; }
body { height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: none; transform-origin: 73.75% 56.7%; }

<div id="stage">

<script>
(() => {
'use strict';
const W = 320, H = 144, OY = 18, FH = 180;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const lineEl = $('line'), labelEl = $('label'), choicesEl = $('choices'), fadeEl = $('fade'), screenEl = $('screen'), titleEl = $('title');
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pixel helpers ---------- */
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(c, cx, cy, r, col) { c.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + 0.5); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
function oval(c, cx, cy, rx, ry, col) { c.fillStyle = col; for (let y = -ry; y <= ry; y++) { const w = Math.floor(rx * Math.sqrt(1 - (y * y) / (ry * ry)) + 0.5); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
function dither(c, x, y, w, h, a, b) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { c.fillStyle = (i + j) % 2 ? a : b; c.fillRect(x + i, y + j, 1, 1); } }
function sprite(c, rows, pal, x, y) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) { const col = pal[rows[j][i]]; if (col) { c.fillStyle = col; c.fillRect(x + i, y + j, 1, 1); } } }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ---------- the campus map ---------- */
const C = {
  grass: '#e6b547', grass2: '#d9a63c', grass3: '#f1c962', path: '#f3e2bd', pathEdge: '#c9a469',
  roof: '#ded3bb', roofLine: '#cdc0a5', fascia: '#6f3a20', wall: '#9a5631', wallLo: '#7d4326', glass: '#5d7f8c', glassHi: '#86a8b4',
  brick: '#c46a4a', brick2: '#ad593c', stone: '#b9b4a8', oak: '#2f6b45', oak2: '#24553a', oak3: '#4a8f5f', trunk: '#5b3a21',
  asphalt: '#7b7771', line: '#f4efe2', shadow: 'rgba(20,20,20,0.2)', ink: '#141414', paper: '#fff7e6', orange: '#ff5a1f', lit: '#ffd96a'
};
function building(m, x, y, w, rh, wh, doors, wide) {
  rect(m, x + 2, y + rh + wh, w, 2, C.shadow);
  rect(m, x, y, w, rh, C.roof);
  for (let i = 4; i < rh - 1; i += 4) rect(m, x + 2, y + i, w - 4, 1, C.roofLine);
  rect(m, x, y, w, 1, C.fascia); rect(m, x, y, 1, rh, C.fascia); rect(m, x + w - 1, y, 1, rh, C.fascia); rect(m, x, y + rh - 1, w, 1, C.fascia);
  rect(m, x, y + rh, w, wh, C.wall);
  for (let i = x + 1; i < x + w; i += 3) rect(m, i, y + rh, 1, wh, C.wallLo);
  rect(m, x, y + rh + wh - 1, w, 1, C.fascia);
  doors.forEach(d => {
    const dx = typeof d === 'number' ? d : d.x, half = (typeof d === 'number' ? wide : d.wide) ? 5 : 3;
    rect(m, dx - half, y + rh, half * 2, wh, C.fascia);
    rect(m, dx - half + 1, y + rh + 1, half * 2 - 2, wh - 1, C.glass);
    rect(m, dx - half + 1, y + rh + 1, 1, wh - 1, C.glassHi);
  });
}
// a long north-south wing: roof seen from above, doors on one long side (side -1 = west, 1 = east)
function wing(m, x, y, w, h, doorYs, side) {
  rect(m, x + 2, y + 2, w + 2, h + 6, C.shadow);
  rect(m, x, y, w, h, C.roof);
  for (let i = x + 3; i < x + w - 2; i += 4) rect(m, i, y + 2, 1, h - 4, C.roofLine);
  rect(m, x, y, w, 1, C.fascia); rect(m, x, y + h - 1, w, 1, C.fascia); rect(m, x, y, 1, h, C.fascia); rect(m, x + w - 1, y, 1, h, C.fascia);
  rect(m, x, y + h, w, 5, C.wall); for (let i = x + 1; i < x + w; i += 3) rect(m, i, y + h, 1, 5, C.wallLo); rect(m, x, y + h + 4, w, 1, C.fascia);
  const sx = side < 0 ? x - 4 : x + w;
  rect(m, sx, y + 1, 4, h + 3, C.wall); rect(m, side < 0 ? sx : sx + 3, y + 1, 1, h + 3, C.fascia);
  doorYs.forEach(dy => { rect(m, sx, dy - 3, 4, 7, C.fascia); rect(m, sx + (side < 0 ? 1 : 0), dy - 2, 3, 5, C.glass); rect(m, sx + (side < 0 ? 1 : 0), dy - 2, 3, 1, C.glassHi); });
}
function oak(m, x, y, r) { oval(m, x + 1, y + r + 2, r, 2, C.shadow); rect(m, x - 1, y + r - 2, 2, 5, C.trunk); disc(m, x, y, r, C.oak2); disc(m, x - 1, y - 1, r - 1, C.oak); disc(m, x - Math.round(r / 3), y - Math.round(r / 3), Math.max(1, Math.round(r / 3)), C.oak3); }
function car(m, x, y, col) { rect(m, x, y, 10, 15, C.ink); rect(m, x + 1, y + 1, 8, 13, col); rect(m, x + 2, y + 3, 6, 3, C.glassHi); rect(m, x + 2, y + 10, 6, 2, C.glassHi); }
function cow(m, x, y) { rect(m, x, y + 2, 9, 5, C.ink); rect(m, x + 1, y + 3, 7, 3, '#fffaf0'); rect(m, x + 2, y + 3, 2, 2, C.ink); rect(m, x + 6, y + 4, 1, 2, C.ink); rect(m, x + 8, y + 1, 4, 4, C.ink); rect(m, x + 9, y + 2, 2, 2, '#fffaf0'); rect(m, x + 1, y + 7, 1, 2, C.ink); rect(m, x + 7, y + 7, 1, 2, C.ink); }
function dish(m, cx, cy) { oval(m, cx, cy + 11, 10, 3, C.shadow); rect(m, cx - 3, cy + 3, 1, 8, C.ink); rect(m, cx + 3, cy + 3, 1, 8, C.ink); oval(m, cx, cy, 8, 4, C.ink); oval(m, cx, cy, 7, 3, '#fffaf0'); rect(m, cx, cy - 6, 1, 6, C.ink); }
function dotted(m, x, y, w, h, col) { for (let i = 0; i < w; i += 3) { rect(m, x + i, y, 1, 1, col); rect(m, x + i, y + h - 1, 1, 1, col); } for (let j = 0; j < h; j += 3) { rect(m, x, y + j, 1, 1, col); rect(m, x + w - 1, y + j, 1, 1, col); } }
function stamp(m, s, h, col) { const n = Math.ceil(Math.hypot(s[2] - s[0], s[3] - s[1])); for (let i = 0; i <= n; i++) rect(m, s[0] + (s[2] - s[0]) * i / n - h, s[1] + (s[3] - s[1]) * i / n - h, h * 2, h * 2, col); }

/* The world is bigger than the screen: the camera opens on the middle of campus
   (Bart's row, the hall, the east wings) and the rest slides in as you walk:
   the hill with the long row and the cows up top, the west wings to the left,
   library and dining below. Loosely after the real CASBS plan, not to scale. */
const WW = 640, WH = 360;
const FELLOWS = {
  1: 'Daniel Chen', 2: 'Kah-Wee Lee', 4: 'Mary Helen Immordino-Yang', 5: 'Luke Miratrix', 6: 'Lewis Abedi Asante',
  7: 'Lawrence Cheung', 8: 'Brooke Harrington', 9: 'Katharyne Mitchell', 10: 'Frances Moore', 11: 'James Goldgeier', 12: 'Fred Singer',
  13: 'John Casellas Connors', 14: 'Garance Burke', 15: 'Graeme Blair', 16: 'Bart Decrem',
  21: 'Mike Gaetani', 22: 'Manny Pulido', 24: 'Sejung Park', 25: 'Bruce Young',
  27: ['Kevin Driscoll', 'Raul Saucedo', 'Mikael Jakobsson'], 28: ['Chi Kei Jacqueline Lam', 'Jurate Jaraite-Kazukauske'], 29: ['Ishara Casellas Connors', 'Ian Kysel'],
  30: 'Juliana Bidadanure', 31: 'Inbal Ben Ami Bartal', 32: 'Milena Tsvetkova', 33: 'T.L. Taylor', 34: 'Eli Cook', 35: 'Summerson Carr', 36: 'Alison McQueen', 37: 'Salman Chaudhry',
  38: 'June Gruber', 39: 'Lynda Powell', 40: 'Robert Kaplan', 41: 'R. Richard Banks', 42: 'Dessislava Lange-Damianova', 43: 'Joseph Tao-yi Wang', 44: 'Forrest Stuart', 45: 'Jamie Kreiner',
  46: 'Kepa Korta', 47: 'Henry Cowles', 48: 'Corey Abramson', 49: 'Lana Swartz', 50: 'Shigehiro Oishi', 51: 'Andrius Kazukauskas', 52: 'Bryn Rosenfeld', 53: 'Brian Knutson', 54: 'Heeju Sohn',
  '016': ['Toussaint Nothias', 'Matthew Sparke']
};
const NOTE_POOL = [
  'At lunch. Lunch is sacred.', 'Thinking under the oak.', 'Back in five. Five what, unclear.', 'In a seminar. Possibly this one.',
  'Walking to the Dish. Not listening to it.', 'Writing. Do not knock. (You knocked.)', 'On a call with a different time zone.',
  'In the library. The book is long.', 'Napping counts as fieldwork.', 'Gone to see the cows. For research.',
  'Back after this paragraph.', 'At the coffee. The coffee is far.', 'Out. Thinking. Same thing.'
];
// the paths, as segments; where one ends on another they join
const SEGS = [
  [28, 54, 160, 54], [160, 54, 176, 58], [176, 58, 420, 58],
  [140, 54, 140, 74], [140, 74, 250, 92], [250, 92, 140, 110], [140, 110, 250, 128], [250, 128, 250, 170],
  [420, 58, 496, 40],
  [420, 58, 420, 124], [420, 124, 420, 170], [420, 124, 524, 124],
  [64, 170, 598, 170],
  [64, 170, 64, 300], [250, 170, 250, 270], [420, 170, 420, 270],
  [526, 146, 526, 170], [526, 170, 526, 340],
  [598, 146, 598, 170], [598, 170, 598, 300],
  [64, 270, 526, 270]
];
const GRAPH = (function () {
  let segs = SEGS.map(s => s.slice());
  SEGS.forEach(s => [[s[0], s[1]], [s[2], s[3]]].forEach(([px, py]) => {
    const out = [];
    segs.forEach(q => {
      const dx = q[2] - q[0], dy = q[3] - q[1], L = dx * dx + dy * dy, t = ((px - q[0]) * dx + (py - q[1]) * dy) / L;
      const ex = q[0] + dx * t - px, ey = q[1] + dy * t - py;
      if (t > 0.001 && t < 0.999 && ex * ex + ey * ey < 0.25) out.push([q[0], q[1], px, py], [px, py, q[2], q[3]]); else out.push(q);
    });
    segs = out;
  }));
  const adj = new Map(), add = (a, b, w) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, w]); };
  segs.forEach(s => { const a = s[0] + ',' + s[1], b = s[2] + ',' + s[3], w = Math.hypot(s[2] - s[0], s[3] - s[1]); add(a, b, w); add(b, a, w); });
  return { segs, adj };
})();
// rows face south onto a walk; wings face a walk along their long side
const ROWS = [
  { x: 24, y: 26, first: 38, n: 8, d0: 34 }, { x: 176, y: 30, first: 46, n: 9, d0: 186 },
  { x: 440, y: 96, first: 26, n: 4, d0: 452 }, { x: 344, y: 142, first: 13, n: 4, d0: 354 }, { x: 96, y: 142, first: 7, n: 6, d0: 106 }
];
const WINGS = [
  { x: 42, y: 186, w: 14, h: 122, side: 1, path: 64, doors: [[6, 196], [5, 216], [4, 236], [3, 256], [2, 276], [1, 296]] },
  { x: 532, y: 150, w: 14, h: 80, side: -1, path: 526, doors: [[17, 160], [18, 180], [19, 200], [20, 220]] },
  { x: 532, y: 244, w: 14, h: 100, side: -1, path: 526, doors: [[21, 254], [22, 274], [23, 294], [24, 314], [25, 334]] },
  { x: 606, y: 146, w: 14, h: 160, side: -1, path: 598, doors: [[30, 156], [31, 176], [32, 196], [33, 216], [34, 236], [35, 256], [36, 276], [37, 296]] }
];
const COWS = [[546, 40], [578, 72], [604, 104]];
const BART_DOOR = { x: 402, y: 170 };
const SPURS = [[150, 270, 150, 290]];
ROWS.forEach(R => { for (let i = 0; i < R.n; i++) SPURS.push([R.d0 + i * 16, R.y + 22, R.d0 + i * 16, R.y + 28]); });
SPURS.push([160, 264, 160, 270], [210, 264, 210, 270], [345, 264, 345, 270], [468, 164, 468, 170]);

const world = document.createElement('canvas'); world.width = WW; world.height = WH;
(function () {
  const m = world.getContext('2d'), r = rng(7);
  rect(m, 0, 0, WW, WH, C.grass);
  // the hill: contour lines fade out as the ground flattens
  for (let k = 0; k < 7; k++) { const base = 10 + k * 18; for (let x = 0; x < WW; x++) { const y = Math.round(base + 5 * Math.sin(x / 37 + k * 1.7) + 2 * Math.sin(x / 11 + k)); if (y < 140) rect(m, x, y, 1, 1, k % 2 ? C.grass2 : '#d39a35'); } }
  for (let i = 0; i < 1500; i++) rect(m, r() * WW, r() * WH, 2, 1, r() < 0.6 ? C.grass2 : C.grass3);
  for (let i = 0; i < 40; i++) rect(m, 540 + r() * 96, 6 + r() * 120, 2, 2, C.orange);
  for (let i = 0; i < 26; i++) rect(m, 430 + r() * 90, 284 + r() * 50, 2, 2, C.orange);

  you: { base: 300, steps: [0, 2, 4, 5, 7, 9], type: 'square', gap: 0.072, len: 0.06, vowels: [700, 1100, 1500, 500] },
  bart: { base: 165, steps: [0, 3, 5, 7, 10, 12], type: 'sawtooth', gap: 0.085, len: 0.07, vowels: [500, 800, 1100, 650] }

function garble(who, text) {

  const end = t + Math.min(4.5, text.length * 0.05);
  for (let i = 0; i < text.length && t < end; i++) {
    const ch = text[i];
    if (ch === ' ') { t += v.gap * 0.6; chunk = 0; continue; }
    if ('.,!?:;'.includes(ch)) { t += v.gap * 2.2; chunk = 0; continue; }
    if (++chunk % 2 === 0) continue;
    const semi = v.steps[Math.floor(Math.random() * v.steps.length)] + (ch === ch.toUpperCase() && /[A-Z]/.test(ch) ? 3 : 0);

}
