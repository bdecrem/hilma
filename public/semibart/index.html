<style>
:root {
  --black: #000000;
  --hot: #ffff55;
  --cyan: #55ffff;
  --choice: #d58bff;
  --gold: #e6b547;
  --font: 'Jersey 15', 'Courier New', monospace;
  /* layout: one full-bleed 320x180 pixel scene; text, labels and dialog choices float over it */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; }
body { height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
body { background: var(--black); container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: var(--font); }
#stage { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--black); overflow: hidden; container-type: inline-size; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: none; transform-origin: 73.75% 56.7%; }
.outlined { text-shadow: 0.22cqw 0 0 #000, -0.22cqw 0 0 #000, 0 0.22cqw 0 #000, 0 -0.22cqw 0 #000, 0.22cqw 0.22cqw 0 #000, -0.22cqw 0.22cqw 0 #000, 0.22cqw -0.22cqw 0 #000, -0.22cqw -0.22cqw 0 #000, 0.15cqw 0.45cqw 0 rgba(0,0,0,0.55); }
#line { position: absolute; width: 62%; text-align: center; font-size: 3.5cqw; line-height: 1.08; font-weight: 400; letter-spacing: 0.02em; word-spacing: 0.06em; transform: translateY(-100%); pointer-events: none; text-wrap: balance; }
#label { position: absolute; color: var(--cyan); font-size: 2.5cqw; line-height: 1; pointer-events: none; white-space: nowrap; transform: translate(-50%, -160%); }
#label[hidden] { display: none; }
#choices { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.2cqw 3cqw 1.6cqw; background: rgba(0, 0, 0, 0.84); display: flex; flex-direction: column; }
#choices[hidden] { display: none; }
button { font: inherit; background: none; border: 0; margin: 0; cursor: pointer; line-height: 1.1; color: inherit; }
.choice { color: var(--choice); font-size: 3cqw; padding: 0.25cqw 0; text-align: left; }
.choice:hover, .choice:focus-visible { color: var(--hot); outline: none; }
#tools { position: absolute; right: 1cqw; bottom: 1cqw; display: flex; gap: 0.6cqw; opacity: 0.35; transition: opacity 0.2s; }
#tools:hover, #tools:focus-within { opacity: 1; }
#tools button { width: max(36px, 3.6cqw); height: max(36px, 3.6cqw); display: grid; place-items: center; color: #fff7e6; background: rgba(0, 0, 0, 0.55); }
#tools button:focus-visible { outline: 0.25cqw solid var(--hot); }
#tools svg { width: 60%; height: 60%; display: block; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.3s linear; }
#fade.on { opacity: 1; }
#screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; }
#screen[hidden] { display: none; }
#screenBar { flex: none; display: flex; align-items: center; gap: 2cqw; padding: 0.8cqw 2cqw; color: var(--cyan); font-size: 2cqw; line-height: 1.1; }
#screenBar span { flex: 1; min-width: 0; }
#screenBar a { color: var(--choice); }
#screenBar a:hover { color: var(--hot); }
#screenBack { color: var(--hot); font-size: 2.2cqw; border: 0.25cqw solid var(--hot); padding: 0.4cqw 1.4cqw; }
#phones { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; gap: 5cqw; padding: 1cqw 0 3cqw; background: #1a1a18; }
.phone { height: 100%; aspect-ratio: 640 / 1247; padding: 0.8cqw; background: #0c0c0c; border-radius: 3cqw; box-shadow: 0 0 0 0.3cqw #3a3a3a; }
.phone img { width: 100%; height: 100%; display: block; border-radius: 2.2cqw; object-fit: cover; }
#title { position: absolute; inset: 0; display: grid; place-items: center; }
#title[hidden] { display: none; }
.card { width: 62cqw; background: #12100c; color: #fff7e6; border: 0.5cqw solid var(--hot); box-shadow: 0 0 0 0.5cqw #000, 1.4cqw 1.4cqw 0 0.5cqw #000; padding: 2.4cqw 3.6cqw 2.6cqw; text-align: center; }
.card .eyebrow { margin: 0 0 0.6cqw; color: var(--cyan); font-size: 2.1cqw; letter-spacing: 0.3em; text-transform: uppercase; }
.card h1 { margin: 0; color: var(--hot); font-size: 9cqw; line-height: 0.9; white-space: nowrap; font-weight: 400; letter-spacing: 0.03em; }
.card .tag { margin: 1cqw 0 0; font-size: 3cqw; line-height: 1.2; }
.card hr { border: 0; border-top: 0.3cqw dashed #4a4436; margin: 2cqw 0 1.8cqw; }
.card dl { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 0.3cqw 1.6cqw; margin: 0; font-size: 2.3cqw; line-height: 1.1; text-align: left; }
.card dt { color: var(--choice); text-align: right; }
.card dd { margin: 0; color: #c9c3b4; }
#startBtn { margin-top: 2cqw; background: var(--hot); color: #000; font-size: 3.4cqw; font-weight: 400; padding: 0.9cqw 5cqw; box-shadow: 0.5cqw 0.5cqw 0 #8a7a1e; letter-spacing: 0.08em; }
#startBtn:hover { background: #fff; }
#startBtn:focus-visible { outline: 0.3cqw solid #fff; outline-offset: 0.4cqw; }
#startBtn:active { transform: translate(0.5cqw, 0.5cqw); box-shadow: none; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>

<body>
<div id="stage">
  <canvas id="cv" width="320" height="180" role="img" aria-label="CASBS Quest, a point-and-click game scene"></canvas>
  <div id="line" class="outlined" aria-live="polite"></div>
  <div id="label" class="outlined" hidden></div>
  <div id="choices" hidden></div>
  <div id="tools">
    <button id="bMute" type="button" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 4h2l3-3h1v10H6L3 8H1z"/><path id="waves" fill="currentColor" d="M8 4h1v4H8zM10 2h1v8h-1z"/></svg></button>
    <button id="bFull" type="button" aria-label="Full screen"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 1h4v1H2v3H1zM7 1h4v4h-1V2H7zM1 7h1v3h3v1H1zM10 7h1v4H7v-1h3z"/></svg></button>
  </div>
  <div id="screen" hidden>
    <div id="screenBar"><span></span><button id="screenBack" type="button">Back</button></div>
    <div id="phones">
      <div class="phone"><img src="/semibart/takt-splash.png" alt="Takt opening screen: TAKT spelled down the side, eins zwei drei vier"></div>
      <div class="phone"><img src="/semibart/takt-map.png" alt="Takt map screen: The Blues, episode 1, The Delta"></div>
    </div>
  </div>
  <div id="fade"></div>
  <div id="title" role="dialog" aria-modal="true" aria-labelledby="titleH">
    <div class="card">
      <p class="eyebrow">A point-and-click visit</p>
      <h1 id="titleH">CASBS Quest</h1>
      <p class="tag">Fourteen studies. One afternoon.</p>
      <hr>
      <dl>
        <dt>Click</dt><dd>walk, talk, open</dd>
        <dt>Right-click</dt><dd>look</dd>
        <dt>Space</dt><dd>skip a line</dd>
        <dt>Arrows</dt><dd>hop between studies</dd>
        <dt>M · F</dt><dd>mute · full screen</dd>
      </dl>
      <button id="startBtn" type="button">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 320, H = 144, OY = 18, FH = 180;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const lineEl = $('line'), labelEl = $('label'), choicesEl = $('choices'), fadeEl = $('fade'), screenEl = $('screen'), titleEl = $('title');
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pixel helpers ---------- */
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(c, cx, cy, r, col) { c.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + 0.5); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
function oval(c, cx, cy, rx, ry, col) { c.fillStyle = col; for (let y = -ry; y <= ry; y++) { const w = Math.floor(rx * Math.sqrt(1 - (y * y) / (ry * ry)) + 0.5); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
function dither(c, x, y, w, h, a, b) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { c.fillStyle = (i + j) % 2 ? a : b; c.fillRect(x + i, y + j, 1, 1); } }
function sprite(c, rows, pal, x, y) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) { const col = pal[rows[j][i]]; if (col) { c.fillStyle = col; c.fillRect(x + i, y + j, 1, 1); } } }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ---------- the campus map ---------- */
const C = {
  grass: '#e6b547', grass2: '#d9a63c', grass3: '#f1c962', path: '#f3e2bd', pathEdge: '#c9a469',
  roof: '#ded3bb', roofLine: '#cdc0a5', fascia: '#6f3a20', wall: '#9a5631', wallLo: '#7d4326', glass: '#5d7f8c', glassHi: '#86a8b4',
  brick: '#c46a4a', brick2: '#ad593c', stone: '#b9b4a8', oak: '#2f6b45', oak2: '#24553a', oak3: '#4a8f5f', trunk: '#5b3a21',
  asphalt: '#7b7771', line: '#f4efe2', shadow: 'rgba(20,20,20,0.2)', ink: '#141414', paper: '#fff7e6', orange: '#ff5a1f', lit: '#ffd96a'
};
const DOORS_TOP = [34, 50, 66], WING_DOORS = [106, 122];
const DOORS_A = [28, 44, 60, 76, 92, 108], DOORS_B = [212, 228, 244, 260, 276, 292], DOORS_C = [114, 130, 146, 174, 190, 206];
function building(m, x, y, w, rh, wh, doors, wide) {
  rect(m, x + 2, y + rh + wh, w, 2, C.shadow);
  rect(m, x, y, w, rh, C.roof);
  for (let i = 4; i < rh - 1; i += 4) rect(m, x + 2, y + i, w - 4, 1, C.roofLine);
  rect(m, x, y, w, 1, C.fascia); rect(m, x, y, 1, rh, C.fascia); rect(m, x + w - 1, y, 1, rh, C.fascia); rect(m, x, y + rh - 1, w, 1, C.fascia);
  rect(m, x, y + rh, w, wh, C.wall);
  for (let i = x + 1; i < x + w; i += 3) rect(m, i, y + rh, 1, wh, C.wallLo);
  rect(m, x, y + rh + wh - 1, w, 1, C.fascia);
  doors.forEach(dx => {
    const half = wide ? 5 : 3;
    rect(m, dx - half, y + rh, half * 2, wh, C.fascia);
    rect(m, dx - half + 1, y + rh + 1, half * 2 - 2, wh - 1, C.glass);
    rect(m, dx - half + 1, y + rh + 1, 1, wh - 1, C.glassHi);
  });
}
function wing(m, x, y, w, h, doorYs, side = -1) {
  rect(m, x + 2, y + 2, w + 2, h + 6, C.shadow);
  rect(m, x, y, w, h, C.roof);
  for (let i = x + 3; i < x + w - 2; i += 4) rect(m, i, y + 2, 1, h - 4, C.roofLine);
  rect(m, x, y, w, 1, C.fascia); rect(m, x, y + h - 1, w, 1, C.fascia); rect(m, x, y, 1, h, C.fascia); rect(m, x + w - 1, y, 1, h, C.fascia);
  rect(m, x, y + h, w, 5, C.wall); for (let i = x + 1; i < x + w; i += 3) rect(m, i, y + h, 1, 5, C.wallLo); rect(m, x, y + h + 4, w, 1, C.fascia);
  const sx = side < 0 ? x - 4 : x + w, gx = side < 0 ? sx + 1 : sx;
  rect(m, sx, y + 1, 4, h + 3, C.wall); rect(m, side < 0 ? sx : sx + 3, y + 1, 1, h + 3, C.fascia);
  doorYs.forEach(dy => { rect(m, sx, dy - 3, 4, 7, C.fascia); rect(m, gx, dy - 2, 3, 5, C.glass); rect(m, gx, dy - 2, 3, 1, C.glassHi); });
}
function litDoor(m, dx, top, h) {
  rect(m, dx - 2, top, 4, h, C.lit); rect(m, dx - 2, top, 1, h, '#fff3c4');
  oval(m, dx, top + h + 3, 6, 2, 'rgba(255,217,106,0.35)');
}
function oak(m, x, y, r) { oval(m, x + 1, y + r + 2, r, 2, C.shadow); rect(m, x - 1, y + r - 2, 2, 5, C.trunk); disc(m, x, y, r, C.oak2); disc(m, x - 1, y - 1, r - 1, C.oak); disc(m, x - Math.round(r / 3), y - Math.round(r / 3), Math.max(1, Math.round(r / 3)), C.oak3); }
function car(m, x, y, col) { rect(m, x, y, 10, 15, C.ink); rect(m, x + 1, y + 1, 8, 13, col); rect(m, x + 2, y + 3, 6, 3, C.glassHi); rect(m, x + 2, y + 10, 6, 2, C.glassHi); }
function turkey(m, x, y) {
  sprite(m, ['..kTk........', '.kTtTk.......', 'kTtktTk...HH.', 'TtkBBBBB.HHEb', 'kBBBBBBBBRHH.', '.BBBBBBBBRR..', '..BBBBBBBR...', '...BBBBBB....', '....L..L.....', '...LL.LL.....'],
    { k: C.ink, T: '#e0892e', t: '#9a5326', B: '#4e3322', H: '#c7d3de', E: C.ink, b: '#e8b13a', R: '#d6402e', L: '#e8a33a' }, x, y);
}

const mapBg = document.createElement('canvas'); mapBg.width = W; mapBg.height = H;
(function () {
  const m = mapBg.getContext('2d'), r = rng(7);
  rect(m, 0, 0, W, H, C.grass);
  for (let i = 0; i < 360; i++) rect(m, r() * W, r() * H, 2, 1, r() < 0.6 ? C.grass2 : C.grass3);
  const paths = [[60, 64, 60, 132], [10, 64, 304, 64], [240, 64, 240, 132], [50, 132, 292, 132], [160, 38, 160, 64], [140, 38, 140, 64], [180, 38, 180, 64], [10, 9, 82, 9], [10, 9, 10, 64], [292, 100, 292, 132]];
  DOORS_TOP.forEach(x => paths.push([x, 2, x, 9]));
  DOORS_A.concat(DOORS_B).forEach(x => paths.push([x, 54, x, 64]));
  DOORS_C.forEach(x => paths.push([x, 122, x, 132]));
  const box = (p, pad) => [Math.min(p[0], p[2]) - pad, Math.min(p[1], p[3]) - pad, Math.abs(p[2] - p[0]) + pad * 2, Math.abs(p[3] - p[1]) + pad * 2];
  paths.forEach(p => { const b = box(p, 4); rect(m, b[0], b[1], b[2], b[3], C.pathEdge); });
  paths.forEach(p => { const b = box(p, 3); rect(m, b[0], b[1], b[2], b[3], C.path); });
  rect(m, 117, 68, 86, 27, C.stone); rect(m, 118, 69, 84, 25, C.brick);
  for (let y = 69; y < 94; y += 2) for (let x = 118 + (((y - 69) / 2) % 2) * 2; x < 202; x += 4) rect(m, x, y, 1, 1, C.brick2);
  rect(m, 150, 68, 20, 1, C.brick); rect(m, 150, 94, 20, 1, C.brick);
  building(m, 16, 30, 100, 16, 8, DOORS_A);
  building(m, 204, 30, 100, 16, 8, DOORS_B);
  building(m, 128, 8, 64, 20, 10, [160], true);
  [140, 180].forEach(dx => { rect(m, dx - 3, 28, 6, 10, C.fascia); rect(m, dx - 2, 29, 4, 9, C.glass); rect(m, dx - 2, 29, 1, 9, C.glassHi); });
  building(m, 100, 98, 120, 16, 8, DOORS_C);
  // the five studies with the lights on
  litDoor(m, 180, 29, 9); litDoor(m, 292, 47, 7); litDoor(m, 76, 47, 7); litDoor(m, 114, 115, 7);
  oak(m, 160, 79, 8);
  // the meeting room, just off the courtyard, its door facing the oak
  rect(m, 108, 77, 10, 7, C.path); rect(m, 108, 77, 10, 1, C.pathEdge); rect(m, 108, 83, 10, 1, C.pathEdge);
  wing(m, 82, 68, 22, 22, [80], 1);
  { // a gold star on the roof: this is where the seminars happen
    const STAR = ['...X...', '...X...', '..XXX..', 'XXXXXXX', '.XXXXX.', '..XXX..', '.XX.XX.', '.X...X.'];
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([ox, oy]) => sprite(m, STAR, { X: C.ink }, 90 + ox, 75 + oy));
    sprite(m, STAR, { X: '#ffd93b' }, 90, 75); rect(m, 92, 78, 1, 1, '#fff3c4');
  }
  rect(m, 4, 98, 46, 42, C.ink); rect(m, 5, 99, 44, 40, C.asphalt);
  [19, 33].forEach(x => rect(m, x, 100, 1, 18, C.line));
  car(m, 7, 102, '#2b3fff'); car(m, 21, 102, '#ff9ccf'); car(m, 35, 102, '#fff7e6');
  oval(m, 224, 22, 10, 3, C.shadow); rect(m, 221, 14, 1, 8, C.ink); rect(m, 227, 14, 1, 8, C.ink);
  oval(m, 224, 11, 8, 4, C.ink); oval(m, 224, 11, 7, 3, '#fffaf0'); rect(m, 224, 5, 1, 6, C.ink);
  [[100, 14, 5], [308, 82, 7], [22, 82, 6], [82, 116, 5], [118, 6, 4]].forEach(o => oak(m, o[0], o[1], o[2]));
  for (let i = 0; i < 26; i++) rect(m, 250 + r() * 66, 90 + r() * 46, 2, 2, C.orange);
  wing(m, 300, 96, 12, 36, WING_DOORS);
  // the two easter-egg doors (Eli, the cafeteria): glass a shade greener than the rest
  rect(m, 297, 120, 3, 5, '#6b8c78'); rect(m, 297, 120, 3, 1, '#93b39f');
  rect(m, 204, 115, 4, 7, '#6b8c78'); rect(m, 204, 115, 1, 7, '#93b39f');
  // picnic tables on the courtyard, either side of the oak
  [[124, 75], [180, 75]].forEach(([x, y]) => {
    oval(m, x + 8, y + 13, 9, 2, C.shadow);
    rect(m, x, y, 16, 2, '#7d5632'); rect(m, x, y + 10, 16, 2, '#7d5632');
    rect(m, x - 1, y + 3, 18, 6, C.ink); rect(m, x, y + 4, 16, 4, '#b07a45'); rect(m, x, y + 6, 16, 1, '#9c6a3c');
  });
  rect(m, 196, 22, 1, 20, C.ink);
})();

/* ---------- Bart's study ---------- */
function makeRoomBg(bart) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const m = c.getContext('2d'), r = rng(23);
  // wall: wood panels
  rect(m, 0, 0, W, 106, '#9a5631');
  for (let x = 0; x < W; x += 14) { rect(m, x, 4, 1, 102, '#7f4426'); rect(m, x + 1, 4, 1, 102, '#ac6a42'); }
  rect(m, 0, 0, W, 4, '#5c2e18'); rect(m, 0, 4, W, 1, '#c27e52');
  dither(m, 40, 74, 90, 6, '#9a5631', '#a86a42');
  // floor
  rect(m, 0, 104, W, 3, '#5c2e18');
  for (let y = 107; y < H; y += 3) { rect(m, 0, y, W, 3, (y / 3) % 2 ? '#c9a77a' : '#bf9c6e'); for (let k = 0; k < 3; k++) rect(m, Math.floor(r() * W), y, 1, 3, '#a8865b'); }
  // rug
  rect(m, 52, 124, 168, 18, '#1f2c9e'); rect(m, 55, 126, 162, 14, '#ff9ccf'); rect(m, 58, 128, 156, 10, '#2b3fff');
  for (let x = 62; x < 212; x += 8) { rect(m, x, 132, 4, 2, '#ffd93b'); }
  // door
  rect(m, 4, 30, 32, 76, '#5c2e18'); rect(m, 7, 33, 26, 73, '#b8733f');
  rect(m, 10, 37, 20, 28, '#a5653a'); rect(m, 10, 70, 20, 30, '#a5653a'); rect(m, 10, 37, 20, 1, '#c98a55'); rect(m, 10, 70, 20, 1, '#c98a55');
  disc(m, 29, 68, 1, '#ffd93b');
  // window onto the hill
  rect(m, 44, 14, 78, 58, '#5c2e18');
  const gx = 47, gy = 17, gw = 72, gh = 52;
  rect(m, gx, gy, gw, 14, '#86c9e6'); dither(m, gx, gy + 14, gw, 2, '#86c9e6', '#a6dbf0'); rect(m, gx, gy + 16, gw, 8, '#a6dbf0'); dither(m, gx, gy + 24, gw, 2, '#a6dbf0', '#c4e8f4');
  rect(m, 54, 22, 12, 2, '#ffffff'); rect(m, 57, 21, 6, 1, '#ffffff'); rect(m, 96, 25, 10, 2, '#ffffff');

    rect(g, px + 2, 88, 5, 1, on ? '#141414' : '#ff5a1f'); rect(g, px + 4, 89, 1, 3, on ? '#141414' : '#ff5a1f');
    if (on) { rect(g, px - 3, 82, 2, 1, '#ff5a1f'); rect(g, px + 10, 82, 2, 1, '#ff5a1f'); rect(g, px - 3, 90, 2, 1, '#ff5a1f'); rect(g, px + 10, 90, 2, 1, '#ff5a1f'); } }
  const mh = B.mode === 'startle' && B.t < 0.4 && !calm ? Math.round(Math.sin(B.t / 0.4 * Math.PI) * 5) : 0;
  rect(g, 206, 88 - mh, 7, 8, '#141414'); rect(g, 207, 89 - mh, 5, 6, '#fff7e6'); rect(g, 207, 91 - mh, 5, 2, '#ff5a1f'); rect(g, 213, 90 - mh, 2, 3, '#141414');
  if (B.mode === 'type' && !calm) { const s = Math.floor(t * 3) % 3; rect(g, 209, 84 - s, 1, 1, 'rgba(255,247,230,0.8)'); }
  if (B.mode === 'startle') { rect(g, 206, by - 12, 11, 14, '#141414'); rect(g, 207, by - 11, 9, 12, '#fff7e6'); rect(g, 211, by - 9, 2, 5, '#ff5a1f'); rect(g, 211, by - 3, 2, 2, '#ff5a1f'); }
  disc(g, 295, 108, 7, '#2f6b45'); disc(g, 290, 112, 4, '#4a8f5f'); disc(g, 301, 112, 4, '#24553a');
  rect(g, 288, 116, 15, 14, '#141414'); rect(g, 289, 116, 13, 13, '#c46a4a'); rect(g, 289, 116, 13, 2, '#d98463');
  const moving = S.path.length > 0, fr = moving ? 1 + Math.floor(t * 7) % 2 : 0;
  const youTalk = S.line && S.line.who === 'you' && (calm || Math.floor(t * 8) % 2 === 0);
  drawYou(S.x, S.y, S.face, fr, youTalk);
  g.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  if (S.path.length) {
    const p = S.path[0], dx = p.x - S.x, dy = p.y - S.y, d = Math.hypot(dx, dy), step = (S.scene === 'map' ? 72 : 76) * dt;
    if (Math.abs(dx) > 0.5) S.face = Math.sign(dx);
    S.stepT += dt; if (S.stepT > (S.scene === 'map' ? 0.2 : 0.27)) { S.stepT = 0; SFX.step(S.scene === 'map'); }
    if (d <= step) { S.x = p.x; S.y = p.y; S.path.shift(); if (!S.path.length && S.arrive) { const a = S.arrive; S.arrive = null; a(); } }
    else { S.x += dx / d * step; S.y += dy / d * step; }
  }
  if (S.scene === 'room' && S.bart.mode === 'type') { S.keyT -= dt; if (S.keyT <= 0) { S.keyT = 0.06 + Math.random() * 0.12; SFX.key(); } }
  if (S.line) { S.line.t += dt; if (S.line.t >= S.line.dur) skipLine(); }
  S.bart.t += dt; if (S.phoneOn) S.phoneT += dt;
  if (S.zoomT >= 0 && S.screenDone === null) {
    S.zoomT += dt; const k = Math.min(1, S.zoomT / 0.9), e = k * k;
    cv.style.transform = calm ? '' : 'scale(' + (1 + e * 9) + ')';
  }
  if (S.scene === 'map') drawMap(t); else drawRoom(t);
  drawLine();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.quest = { S, hit, run, doAction, MAP, ROOM, start };
})();
