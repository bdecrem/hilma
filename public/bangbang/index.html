<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0018">
<title>Hello World Bang Bang · 뱅뱅</title>
<meta property="og:title" content="Hello World Bang Bang · 뱅뱅">
<meta property="og:description" content="안녕 세계 — 뱅뱅! Debut stage. World Tour 2026. 💖✨🎤">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bangbang.tunn3l.sh/">
<meta property="og:image" content="https://bangbang.tunn3l.sh/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bangbang.tunn3l.sh/og.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    background: radial-gradient(130% 130% at 50% 0%, #2b0a4d 0%, #150029 55%, #0a0018 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- stage light beams ---- */
  .beam {
    position: fixed;
    top: -20%;
    width: 24vw;
    height: 150vh;
    pointer-events: none;
    opacity: 0.10;
    filter: blur(28px);
    transform-origin: top center;
    animation: sway 11s ease-in-out infinite;
  }
  .beam.pink { left: 12%; background: linear-gradient(to bottom, #ff2fb3, transparent 75%); }
  .beam.blue { right: 12%; background: linear-gradient(to bottom, #01cdfe, transparent 75%); animation-delay: -5.5s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(9deg); }
  }

  /* ---- twinkling stars ---- */
  .star {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    pointer-events: none;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.6); }
    50%      { opacity: 0.9; transform: scale(1.3); box-shadow: 0 0 8px #fff; }
  }

  /* ---- floating hangul decorations ---- */
  .deco {
    position: fixed;
    font-weight: 900;
    user-select: none;
    pointer-events: none;
    opacity: 0.17;
    animation: floaty 7s ease-in-out infinite;
    text-shadow: 0 0 30px currentColor;
  }
  .deco:nth-child(odd) { animation-duration: 9s; }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-28px) rotate(6deg); }
  }

  .stage {
    text-align: center;
    position: relative;
    z-index: 2;
    padding: 2rem;
  }

  /* ---- welcome-back banner for Kira ---- */
  .welcome {
    display: inline-block;
    margin-bottom: 1.6rem;
    padding: 0.7em 1.9em;
    border-radius: 999px;
    background: linear-gradient(100deg, #ff2fb3, #b967ff, #01cdfe);
    background-size: 220% 100%;
    color: #fff;
    font-weight: 800;
    font-size: clamp(0.9rem, 2.6vw, 1.25rem);
    letter-spacing: 0.06em;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    box-shadow: 0 0 28px rgba(255, 47, 179, 0.5), 0 0 56px rgba(1, 205, 254, 0.3);
    animation: dropIn 1.1s cubic-bezier(0.22, 1.4, 0.36, 1) both,
               slide 6s linear 1.1s infinite;
  }
  @keyframes dropIn {
    from { transform: translateY(-90px) scale(0.7); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .welcome .wave {
    display: inline-block;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .tagline {
    font-size: clamp(0.8rem, 2vw, 1.05rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: #ff9de2;
    margin-bottom: 1.4rem;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.65; }
    50%      { opacity: 1; }
  }

  h1 {
    font-size: clamp(2.6rem, 9vw, 7rem);
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.02em;
    background: linear-gradient(92deg, #ff2fb3, #ff71ce, #b967ff, #01cdfe, #05ffa1, #ff2fb3);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 47, 179, 0.45));
    animation: slide 8s linear infinite;
  }

  @keyframes slide {
    to { background-position: 200% 0; }
  }

  .hangul-title {
    margin-top: 1.1rem;
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 12px #ff2fb3, 0 0 42px #b967ff;
  }

  /* ---- Hi Kira photocard (flips to VIP back) ---- */
  .kira {
    position: relative;
    display: inline-block;
    margin-top: 2.1rem;
    perspective: 1200px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .kira-card {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.3, 1.05);
  }
  @media (hover: hover) {
    .kira:hover .kira-card { transform: rotateY(180deg); }
  }
  .kira-card.flipped { transform: rotateY(180deg); }

  .kira-face {
    padding: 0.9em 2.6em;
    border-radius: 24px;
    background: linear-gradient(#1c0433, #1c0433) padding-box,
                linear-gradient(120deg, #ffd93d, #ff2fb3, #b967ff, #01cdfe, #ffd93d) border-box;
    background-size: 100% 100%, 300% 100%;
    border: 2px solid transparent;
    box-shadow: 0 0 34px rgba(255, 217, 61, 0.28), 0 0 60px rgba(255, 47, 179, 0.22);
    animation: borderflow 6s linear infinite;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .kira-back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* holographic sheen sweeping across the back */
  .kira-back::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: linear-gradient(115deg,
      transparent 15%,
      rgba(255, 47, 179, 0.35) 32%,
      rgba(1, 205, 254, 0.35) 46%,
      rgba(5, 255, 161, 0.35) 58%,
      rgba(255, 217, 61, 0.30) 70%,
      transparent 85%);
    background-size: 250% 250%;
    mix-blend-mode: screen;
    animation: holo 3.2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes holo {
    from { background-position: 0% 0%; }
    to   { background-position: 100% 100%; }
  }

  .vip-num {
    font-size: clamp(1.5rem, 4.6vw, 2.7rem);
    font-weight: 900;
    background: linear-gradient(100deg, #ffd93d, #fff6c9, #ffd93d);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 217, 61, 0.5));
    animation: shimmer 3.2s linear infinite;
  }
  .vip-name {
    margin-top: 0.3rem;
    font-size: clamp(0.95rem, 2.6vw, 1.4rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px #ff2fb3;
    letter-spacing: 0.12em;
  }
  .vip-club {
    margin-top: 0.3rem;
    font-size: clamp(0.6rem, 1.6vw, 0.8rem);
    font-weight: 700;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #9fe8ff;
    opacity: 0.85;
  }
  @keyframes borderflow {
    to { background-position: 0 0, 300% 0; }
  }

  .kira-hangul {
    font-size: clamp(1.9rem, 6vw, 3.6rem);
    font-weight: 900;
    background: linear-gradient(100deg, #ffd93d 10%, #fff6c9 30%, #ffd93d 50%, #ff9de2 75%, #ffd93d 95%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 217, 61, 0.55));
    animation: shimmer 3.2s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 250% 0; }
  }

  .kira-latin {
    margin-top: 0.35rem;
    font-size: clamp(0.75rem, 2vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #ffe9a8;
    opacity: 0.85;
  }

  .kira .spark {
    position: absolute;
    font-size: clamp(1rem, 2.6vw, 1.6rem);
    animation: sparkfade 2.1s ease-in-out infinite;
  }
  @keyframes sparkfade {
    0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(-8deg); }
    50%      { opacity: 1;    transform: scale(1.15) rotate(8deg); }
  }
  .kira .spark.s1 { top: -1.3em; left: -1.2em; animation-delay: 0s; }
  .kira .spark.s2 { top: -1.4em; right: -1.1em; animation-delay: 0.7s; }
  .kira .spark.s3 { bottom: -1.4em; left: -1.2em; animation-delay: 1.4s; }
  .kira .spark.s4 { bottom: -1.3em; right: -1.1em; animation-delay: 0.4s; }

  .hearts {
    margin-top: 1.8rem;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    letter-spacing: 0.6em;
  }
  .hearts span {
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .hearts span:nth-child(2) { animation-delay: 0.15s; }
  .hearts span:nth-child(3) { animation-delay: 0.30s; }
  .hearts span:nth-child(4) { animation-delay: 0.45s; }
  .hearts span:nth-child(5) { animation-delay: 0.60s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  .badge {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.65em 1.8em;
    border: 2px solid #ff2fb3;
    border-radius: 999px;
    color: #ffb3ec;
    font-weight: 700;
    letter-spacing: 0.28em;
    font-size: clamp(0.7rem, 1.8vw, 0.95rem);
    text-transform: uppercase;
    box-shadow: 0 0 22px rgba(255, 47, 179, 0.4), inset 0 0 18px rgba(185, 103, 255, 0.25);
    animation: pulse 1.8s ease-in-out infinite;
  }
</style>
</head>
<body>
  <div class="beam pink"></div>
  <div class="beam blue"></div>

  <!-- twinkling stars, spread on a rough grid so no clumps -->
  <div class="star" style="top:12%; left:22%; animation-delay:0s;"></div>
  <div class="star" style="top:24%; left:64%; animation-delay:0.5s;"></div>
  <div class="star" style="top:8%;  left:82%; animation-delay:1.1s;"></div>
  <div class="star" style="top:38%; left:12%; animation-delay:1.6s;"></div>
  <div class="star" style="top:56%; left:88%; animation-delay:0.8s;"></div>
  <div class="star" style="top:70%; left:30%; animation-delay:2.2s;"></div>
  <div class="star" style="top:82%; left:58%; animation-delay:1.3s;"></div>
  <div class="star" style="top:64%; left:70%; animation-delay:2.7s;"></div>
  <div class="star" style="top:30%; left:44%; animation-delay:1.9s;"></div>
  <div class="star" style="top:88%; left:14%; animation-delay:0.3s;"></div>

  <!-- floating hangul: bang bang / love / heartbeat / fighting / starlight / sparkle -->
  <div class="deco" style="top:8%;  left:6%;  font-size:5rem;  color:#ff71ce; animation-delay:0s;">뱅뱅</div>
  <div class="deco" style="top:14%; right:8%; font-size:3.4rem; color:#01cdfe; animation-delay:1.2s;">사랑해</div>
  <div class="deco" style="bottom:16%; left:9%; font-size:3.8rem; color:#b967ff; animation-delay:0.6s;">두근두근</div>
  <div class="deco" style="bottom:10%; right:7%; font-size:4.6rem; color:#05ffa1; animation-delay:1.8s;">화이팅!</div>
  <div class="deco" style="top:46%; left:2%;  font-size:2.6rem; color:#ff2fb3; animation-delay:2.4s;">별빛</div>
  <div class="deco" style="top:42%; right:3%; font-size:2.6rem; color:#ffe14d; animation-delay:0.9s;">반짝반짝</div>

  <main class="stage">
    <div class="welcome"><span class="wave">💜</span> 어서와 키라, 다시 만나서 반가워! · Welcome back, VIP #1 <span class="wave">💜</span></div>
    <div class="tagline">데뷔 무대 · Debut Stage</div>
    <h1>HELLO WORLD<br>BANG&nbsp;BANG</h1>
    <div class="hangul-title">안녕 세계 — 뱅뱅!</div>

    <div class="kira" title="flip me!">
      <span class="spark s1">✨</span>
      <span class="spark s2">💛</span>
      <span class="spark s3">⭐️</span>
      <span class="spark s4">✨</span>
      <div class="kira-card">
        <div class="kira-face kira-front">
          <div class="kira-hangul">안녕 키라!</div>
          <div class="kira-latin">Hi Kira · 키라 최고!</div>
        </div>
        <div class="kira-face kira-back">
          <div class="vip-num">★ VIP #1 ★</div>
          <div class="vip-name">키라 · KIRA</div>
          <div class="vip-club">뱅뱅 Official Fanclub</div>
        </div>
      </div>
    </div>

    <div class="hearts"><span>💖</span> <span>✨</span> <span>🎤</span> <span>✨</span> <span>💖</span></div>
    <div class="badge">뱅뱅 · World Tour 2026</div>
  </main>
  <script>
    // tap-to-flip for touch devices (hover handles desktop)
    document.querySelector('.kira').addEventListener('click', () => {
      document.querySelector('.kira-card').classList.toggle('flipped');
    });
  </script>
</body>
</html>
