<body>
<div id="app"></div>
<div class="label">dream cosmos · drag to orbit · grab a puff · tap grass to feed · tap the fire</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// deterministic-ish PRNG for stable initial layout (no Math.random at init)
let _seed = 9173;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
function rr(a, b) { return a + rnd() * (b - a); }

// ---- Renderer ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

// ---- Scene ----
const scene = new THREE.Scene();
const HAZE = new THREE.Color('#2a1a4e');
scene.fog = new THREE.FogExp2(HAZE, 0.0062);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(18, 9, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2.6, 0);
controls.minDistance = 9;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.9;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;

// ---- Dream nebula sky (two color phases the slow cycle drifts between) ----
// "DREAM" = brighter, warmer nebula; "DEEP" = darker, starrier nebula. Both surreal+colorful.
const SKY_DREAM = { top: new THREE.Color('#241257'), mid: new THREE.Color('#9b3fb0'), bottom: new THREE.Color('#ff7eb3'), aurora: new THREE.Color('#54f0d8') };
const SKY_DEEP  = { top: new THREE.Color('#0a0824'), mid: new THREE.Color('#42206e'), bottom: new THREE.Color('#7a2d8e'), aurora: new THREE.Color('#7d6bff') };
const skyU = {
  top:    { value: SKY_DREAM.top.clone() },
  mid:    { value: SKY_DREAM.mid.clone() },
  bottom: { value: SKY_DREAM.bottom.clone() },
  aurora: { value: SKY_DREAM.aurora.clone() },
  uTime:  { value: 0 },
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: skyU,
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; uniform vec3 aurora;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a = hash(i), b = hash(i + vec2(1.0,0.0)), c = hash(i + vec2(0.0,1.0)), d = hash(i + vec2(1.0,1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    void main(){
      vec3 dir = normalize(vPos);
      float h = dir.y;
      // vertical gradient
      vec3 c = mix(bottom, mid, smoothstep(-0.30, 0.28, h));
      c = mix(c, top, smoothstep(0.28, 0.78, h));
      // drifting nebula mottling
      float n = noise(dir.xz * 3.0 + uTime * 0.018) * 0.6 + noise(dir.xz * 7.0 - uTime * 0.03) * 0.4;
      c += (n - 0.5) * 0.16 * vec3(0.9, 0.45, 1.1);
      // aurora ribbons through the mid/upper sky
      float band = sin(dir.x * 4.0 + uTime * 0.16 + n * 4.0) * sin(dir.z * 3.0 - uTime * 0.11);
      float aMask = smoothstep(-0.05, 0.45, h) * smoothstep(1.0, 0.4, h);
      c += aurora * max(0.0, band) * aMask * 0.38;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), skyMat));

// ---- A soft moon glow (cool, low on the horizon) ----
const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(7, 24, 24),
  new THREE.MeshBasicMaterial({ color: '#e9e2ff', fog: false, transparent: true, opacity: 0.95 })
);
sunGlow.position.set(-70, 24, -150);
scene.add(sunGlow);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (function(){ const cc=document.createElement('canvas'); cc.width=cc.height=128; const g=cc.getContext('2d');
    const rg=g.createRadialGradient(64,64,0,64,64,64); rg.addColorStop(0,'rgba(230,225,255,0.9)'); rg.addColorStop(0.4,'rgba(190,170,255,0.35)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(cc); t.needsUpdate=true; return t; })(),
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
moonHalo.scale.setScalar(48); moonHalo.position.copy(sunGlow.position); scene.add(moonHalo);

// ---- A big ringed dream-planet, low on the far horizon ----
const planet = new THREE.Group();
const planetBody = new THREE.Mesh(new THREE.SphereGeometry(20, 36, 24),
  new THREE.MeshStandardMaterial({ color: '#ff8fd0', emissive: '#5a2a6e', emissiveIntensity: 0.6, roughness: 1, flatShading: false, fog: false }));
planet.add(planetBody);
const ring = new THREE.Mesh(new THREE.RingGeometry(26, 38, 64),
  new THREE.MeshBasicMaterial({ color: '#ffd6f2', transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false, fog: false }));
ring.rotation.x = Math.PI * 0.46; ring.rotation.y = 0.3; planet.add(ring);
planet.position.set(120, 8, -170); planet.scale.setScalar(1.1); scene.add(planet);

// ---- Starfield (twinkling) ----
const STARS = 1600;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STARS * 3);
const starCol = new Float32Array(STARS * 3);
const starHue = [new THREE.Color('#ffffff'), new THREE.Color('#cfe0ff'), new THREE.Color('#ffd9f2'), new THREE.Color('#d8fff3'), new THREE.Color('#fff1c2')];
for (let i = 0; i < STARS; i++) {
  // random point on a shell just inside the sky dome
  const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 250 + rnd() * 30;
  const sq = Math.sqrt(1 - u * u);
  starPos[i * 3] = Math.cos(th) * sq * r;
  starPos[i * 3 + 1] = Math.abs(u) * r * 0.9 + 4;   // bias above horizon
  starPos[i * 3 + 2] = Math.sin(th) * sq * r;
  const col = starHue[Math.floor(rnd() * starHue.length)];
  starCol[i * 3] = col.r; starCol[i * 3 + 1] = col.g; starCol[i * 3 + 2] = col.b;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 2.2, map: glowSprite('rgba(255,255,255,1)', 'rgba(200,210,255,0.6)'),
  vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.9, sizeAttenuation: true }));
scene.add(starField);

// ---- Lights ----
const hemi = new THREE.HemisphereLight('#cdb8ff', '#5a3f7a', 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#cfe0ff', 1.25);   // moonlight key
sun.position.set(-30, 26, -28);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight('#ff9ad5', 0.35);   // magenta rim
fill.position.set(20, 10, 18);
scene.add(fill);

// helper: soft round glow sprite
function glowSprite(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true; return tex;
}
// helper: heart sprite
function heartTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#ff5d8f'; x.beginPath();
  x.moveTo(32, 54);
  x.bezierCurveTo(6, 36, 10, 12, 32, 24);
  x.bezierCurveTo(54, 12, 58, 36, 32, 54);
  x.fill();
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const HEART_TEX = heartTex();

// ===================================================================
//  FLUFFY CLOUDS — billboarded soft-sprite volumes (reusable per island)
// ===================================================================
// Why sprites, not meshes: stacks of soft cloud-puff billboards read as
// genuinely fluffy/voluminous, cost ~1 quad each (cheap enough for several
// islands + ambient drift), and the builder is reusable — every island gets
// its own cloud and we can scatter the same puffs through the void. This is
// the shared cloud tech for the whole dream cosmos (islands + travel later).
function cloudPuffTexture() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'); x.clearRect(0, 0, s, s);
  for (let i = 0; i < 18; i++) {                       // overlapping soft lobes → irregular fluff
    const ang = rnd() * Math.PI * 2, dist = rnd() * s * 0.24;
    const px = s / 2 + Math.cos(ang) * dist;
    const py = s / 2 + Math.sin(ang) * dist * 0.7;     // flatter vertically
    const rad = (0.14 + rnd() * 0.28) * s * 0.5;
    const g = x.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.45)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, s, s);
  }
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const CLOUD_TEXES = [cloudPuffTexture(), cloudPuffTexture(), cloudPuffTexture()];

// Build one fluffy cloud as a Group of soft billboards (caller adds it to the
// scene or to an island). sit:true → a broad cushion that billows downward for
// an island to rest on; otherwise a rounder free-floating puff. Bottoms are
// shaded cooler/darker than tops to give the cloud volume.
function makeFluffyCloud(opts = {}) {
  const { radius = 6, depth = 4, count = 24, scale = 1, topY = 0.6,
          tint = '#ffffff', shade = '#a294cc', sit = false, opacity = 0.92 } = opts;
  const g = new THREE.Group();
  const top = new THREE.Color(tint), bot = new THREE.Color(shade);
  let ti = 0;
  for (let i = 0; i < count; i++) {
    let v, levelR, py, shadeF;
    if (sit) {
      v = Math.pow(rnd(), 1.8);                         // bias toward 0 → dense broad top, wispy base
      levelR = radius * (1 - 0.5 * v);
      py = topY - v * depth + (rnd() - 0.5) * 0.6;
      shadeF = 1 - 0.85 * v;                            // tops bright, base shaded
    } else {
      v = rnd() * 2 - 1;                                // ellipsoid around center
      levelR = radius * Math.sqrt(Math.max(0.02, 1 - v * v * 0.7));
      py = v * depth * 0.5;
      shadeF = py / (depth * 0.5) * 0.5 + 0.5;
    }
    const a = rnd() * Math.PI * 2;
    const rr_ = Math.pow(rnd(), 0.5) * levelR;
    const edge = rr_ / (radius + 1e-3);
    const sprScale = radius * (0.42 + 0.5 * (1 - edge)) * (0.85 + rnd() * 0.45);
    const col = bot.clone().lerp(top, 0.3 + 0.7 * Math.max(0, Math.min(1, shadeF)));
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: CLOUD_TEXES[ti++ % 3], color: col, transparent: true, depthWrite: false, opacity }));
    spr.position.set(Math.cos(a) * rr_, py, Math.sin(a) * rr_);
    spr.scale.set(sprScale * 1.25, sprScale, 1);
    g.add(spr);
  }
  g.scale.setScalar(scale);
  return g;
}

// ===================================================================
//  AMBIENT CLOUDS — fluffy puffs drifting through the dream void
// ===================================================================
const CLOUD_TINTS = ['#ffffff', '#fbe9ff', '#e7edff', '#eafff6', '#fff2e0'];
const clouds = [];
for (let c = 0; c < 18; c++) {
  const a = rnd() * Math.PI * 2, r = 26 + rnd() * 70;
  const g = makeFluffyCloud({
    radius: 4 + rnd() * 4, depth: 2.5 + rnd() * 2, count: 16 + Math.floor(rnd() * 8),
    tint: CLOUD_TINTS[Math.floor(rnd() * CLOUD_TINTS.length)], shade: '#6f5f9e', opacity: 0.85,
  });
  g.position.set(Math.cos(a) * r, -8 - rnd() * 20, Math.sin(a) * r);
  g.scale.setScalar(1 + rnd() * 1.4);
  scene.add(g);
  clouds.push({ group: g, sp: 0.4 + rnd() * 0.8, wrap: 130 });
}

const ISLE_TOPS = ['#b6f0a0', '#ffb3e6', '#bfe0ff', '#e6c0ff'];
function makeSkyIsle(x, y, z, s, hue) {
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.5),
    new THREE.MeshStandardMaterial({ color: hue, emissive: hue, emissiveIntensity: 0.15, roughness: 1, flatShading: true }));
  top.scale.y = 0.4; g.add(top);
  const cloud = makeFluffyCloud({ radius: 5, depth: 4, count: 26, topY: -0.8, sit: true,
    tint: '#ffffff', shade: '#7a68aa', opacity: 0.9 });
  g.add(cloud);   // each distant island rests on its own little cloud too
  g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g);
}
makeSkyIsle(-95, 10, -120, 2.4, ISLE_TOPS[0]);
makeSkyIsle(70, -6, -110, 1.7, ISLE_TOPS[1]);
makeSkyIsle(-55, 28, -150, 1.4, ISLE_TOPS[2]);
makeSkyIsle(105, 20, -140, 1.1, ISLE_TOPS[3]);
makeSkyIsle(30, 34, -160, 0.9, ISLE_TOPS[1]);

// ===================================================================
//  THE FLOATING ISLAND
// ===================================================================
const island = new THREE.Group();
scene.add(island);

// a thin sandy beach rim (not a deep bowl) — the cloud is the island's underside
const sand = new THREE.Mesh(
  new THREE.CylinderGeometry(9.6, 8.8, 1.3, 48, 1),
  new THREE.MeshStandardMaterial({ color: '#e8c98f', roughness: 1 })
);
sand.position.y = 1.05; sand.castShadow = true; sand.receiveShadow = true;
island.add(sand);

// the cloud our island rests on — a broad fluffy cushion billowing downward,
// wider than the beach so the island looks nestled on top of it
const islandCloud = makeFluffyCloud({
  radius: 13, depth: 8, count: 130, topY: 1.6, sit: true,
  tint: '#f7f1ff', shade: '#8a79bc', opacity: 0.97,
});
islandCloud.position.y = -0.8;   // dense top at ~y0.8 cradles the beach (bottom ~0.4), wisping down
island.add(islandCloud);         // child of island so it bobs along with it

// grassy top
const grassGeo = new THREE.SphereGeometry(8.2, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.5);
const gp = grassGeo.attributes.position;
for (let i = 0; i < gp.count; i++) {
  const x = gp.getX(i), z = gp.getZ(i);
  gp.setY(i, gp.getY(i) * 0.34 + Math.sin(x * 0.7) * Math.cos(z * 0.7) * 0.25);
}
grassGeo.computeVertexNormals();
const grass = new THREE.Mesh(grassGeo, new THREE.MeshStandardMaterial({ color: '#6fae5a', roughness: 0.95, flatShading: true }));
grass.position.y = 1.7; grass.castShadow = true; grass.receiveShadow = true;
island.add(grass);

// Surface height of the grass dome at island-local (x,z). World xz == local xz
// (island only bobs in y), so critters can use this directly + island.position.y.
function domeHeight(x, z) {
  const rho = Math.hypot(x, z);
  const R = 8.2;
  if (rho >= R) return 1.7;
  const hemi = Math.sqrt(R * R - rho * rho) * 0.34;
  const lump = Math.sin(x * 0.7) * Math.cos(z * 0.7) * 0.25;
  return 1.7 + hemi + lump;
}
const ROAM = 6.2;   // critters stay within this radius (grassy top)

function rock(x, z, s) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0),
    new THREE.MeshStandardMaterial({ color: '#cdb8f0', emissive: '#7a5cc0', emissiveIntensity: 0.3, roughness: 0.5, flatShading: true }));
  r.position.set(x, 1.9, z); r.rotation.set(rnd(), rnd(), rnd());
  r.castShadow = true; r.receiveShadow = true; island.add(r);
}
rock(5.5, -3.2, 0.7); rock(-6, 2.5, 0.55); rock(6.5, 4, 0.5);

// grass tufts the Puffs nibble
const tuftMat = new THREE.MeshStandardMaterial({ color: '#7ec264', roughness: 0.9, flatShading: true });
const tufts = [];
for (let i = 0; i < 16; i++) {
  const a = rnd() * Math.PI * 2, rad = rr(1.5, ROAM - 0.5);
  const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
  const g = new THREE.Group();
  for (let b = 0; b < 3; b++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.4, 5), tuftMat);
    blade.position.set((rnd() - 0.5) * 0.18, 0.2, (rnd() - 0.5) * 0.18);
    blade.rotation.z = (rnd() - 0.5) * 0.4;
    g.add(blade);
  }
  g.position.set(x, domeHeight(x, z), z);
  island.add(g);
  tufts.push({ group: g, x, z, full: 1, level: 1 });   // level 0..1, regrows
}

// ===================================================================
//  PALMS (swaying, with lanterns)
// ===================================================================
const palms = [];
const lanterns = [];
const lanternTex = glowSprite('rgba(255,236,170,1)', 'rgba(255,170,80,0.85)');
function makePalm(x, z, lean, scale = 1) {
  const g = new THREE.Group(); g.position.set(x, 2.0, z); g.scale.setScalar(scale);
  const trunkMat = new THREE.MeshStandardMaterial({ color: '#9a6b41', roughness: 1, flatShading: true });
  const trunk = new THREE.Group(); let prevY = 0;
  for (let i = 0; i < 7; i++) {
    const t = i / 7, h = 1.05, r0 = 0.42 - t * 0.22, r1 = 0.42 - (t + 1 / 7) * 0.22;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, h, 8), trunkMat);
    seg.position.set(lean * t * t * 2.4, prevY + h / 2, 0);
    seg.rotation.z = -lean * t * 1.1; seg.castShadow = true; trunk.add(seg); prevY += h * 0.96;
  }
  g.add(trunk);
  const crown = new THREE.Group(); crown.position.set(lean * 2.4, prevY, 0);
  const frondMat = new THREE.MeshStandardMaterial({ color: '#3f9a4e', roughness: 0.85, side: THREE.DoubleSide, flatShading: true });
  const frondGeo = new THREE.PlaneGeometry(3.4, 0.9, 4, 1);
  const fp = frondGeo.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    const tt = (fp.getX(i) + 1.7) / 3.4;
    fp.setY(i, fp.getY(i) * (1 - tt * 0.94)); fp.setZ(i, fp.getZ(i) - tt * tt * 1.15);
  }
  frondGeo.computeVertexNormals();
  for (let i = 0; i < 9; i++) {
    const f = new THREE.Mesh(frondGeo, frondMat); f.position.set(1.55, 0, 0); f.castShadow = true;
    const pivot = new THREE.Group(); pivot.rotation.y = (i / 9) * Math.PI * 2; pivot.rotation.z = 0.28 + rnd() * 0.18;
    pivot.add(f); crown.add(pivot);
  }
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 10), new THREE.MeshStandardMaterial({ color: '#5b3d24', roughness: 0.9 }));
    const a = (i / 3) * Math.PI * 2; c.position.set(Math.cos(a) * 0.45, -0.25, Math.sin(a) * 0.45); c.castShadow = true; crown.add(c);
  }
  g.add(crown);
  const lantern = new THREE.Group(); lantern.position.copy(crown.position);
  lantern.position.y -= 0.6 + rnd() * 0.4; lantern.position.x += (rnd() - 0.5) * 0.6;
  lantern.add(new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshBasicMaterial({ color: '#ffd98a', fog: false })));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: lanternTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  halo.scale.setScalar(1.6); lantern.add(halo);
  const llight = new THREE.PointLight('#ffcaa0', 2.2, 9, 2); lantern.add(llight);
  g.add(lantern);
  lanterns.push({ halo, llight, phase: rnd() * Math.PI * 2 });

let dayFactor = 1;   // 1 = bright day, 0 = dusk/night

function nearestTuft(p) {
  let best = null, bd = 1e9;
  for (const t of tufts) {
    if (t.level < 0.5) continue;
    const d = (t.x - p.pos.x) ** 2 + (t.z - p.pos.y) ** 2;
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}
function nearestBerry(p) {
  let best = null, bd = 1e9;
  for (const b of berries) {
    if (b.eaten) continue;
    const d = (b.x - p.pos.x) ** 2 + (b.z - p.pos.y) ** 2;
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function randPointInDome(maxR) {
  const a = rnd() * Math.PI * 2, r = rr(0.5, maxR);
  return new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r);
}

function chooseBehavior(p) {
  p.target = null; p.eatingBerry = null; p.grazeTuft = null;
  const berry = nearestBerry(p);
  const r = rnd();
  if (dayFactor < 0.35) {
    // dusk / night: gather and rest, occasional snack
    if (berry && r < 0.2) return startEat(p, berry);
    if (r < 0.78) return startGather(p);
    return startRest(p, rr(2.5, 4.5));
  }
  // daytime
  if (berry && r < 0.32) return startEat(p, berry);
  if (r < 0.36) return startGraze(p);
  if (r < 0.66) return startPlay(p);
  if (r < 0.82) return startWander(p);
  if (r < 0.92) return startGawk(p);

}

  const t = nearestTuft(p);

}
function startPlay(p) {
  p.state = 'play'; p.chaseFly = Math.floor(rnd() * FLY); p.timer = rr(3, 5); p.target = new THREE.Vector2(p.pos.x, p.pos.y);
}

  p.state = 'gawk'; p.target = new THREE.Vector2(Math.cos(a) * (ROAM - 0.2), Math.sin(a) * (ROAM - 0.2)); p.timer = 6;
}
function startRest(p, dur) { p.state = 'rest'; p.target = null; p.timer = dur; }
function startGather(p) {

  p.state = 'gather'; p.target = new THREE.Vector2(FIRE_XZ.x + Math.cos(a) * r, FIRE_XZ.y + Math.sin(a) * r); p.timer = rr(5, 9);

function pokePuff(p) {

const _fv = new THREE.Vector3();
function updatePuff(p, dt, T) {
  // grow babies in
  if (p.size < p.targetSize) p.size = Math.min(p.targetSize, p.size + dt * 0.13);

  if (p.state === 'held') {            // carried by the pointer — position set by handler
    p.rig.scale.set(0.92, 1.12, 0.92); // stretched while dangling
    blinkUpdate(p, dt);
    return;
  }

  if (p.state === 'drop') {            // tossed down, fall to the dome with a bounce
    p.vy -= 18 * dt;
    let y = p.g.position.y + p.vy * dt;
    const surf = domeHeight(p.pos.x, p.pos.y) + island.position.y;
    if (y <= surf) {
      y = surf;
      if (Math.abs(p.vy) > 2.2) { p.vy = -p.vy * 0.42; p.rig.scale.set(1.25, 0.7, 1.25); }
      else { p.vy = 0; chooseBehavior(p); }
    }
    p.g.position.y = y;
    // ease squash back toward normal
    p.rig.scale.lerp(_one, Math.min(1, dt * 8));
    blinkUpdate(p, dt);
    return;
  }

  p.timer -= dt;

  // play: chase a (moving) firefly
  if (p.state === 'play') {
    flyWorld(p.chaseFly, _fv);
    p.target.set(_fv.x, _fv.z);
  }

  // movement toward target
  p.moving = false;
  if (p.target) {
    const dx = p.target.x - p.pos.x, dz = p.target.y - p.pos.y;
    const d = Math.hypot(dx, dz);
    const arriveAt = p.state === 'play' ? 0.6 : 0.28;
    if (d > arriveAt) {
      const speed = (p.state === 'play' ? 3.4 : 2.0) * (0.6 + 0.4 * p.size);
      const nx = dx / d, nz = dz / d;
      p.pos.x += nx * speed * dt; p.pos.y += nz * speed * dt;
      // clamp to dome
      const rho = Math.hypot(p.pos.x, p.pos.y);
      if (rho > ROAM) { const k = ROAM / rho; p.pos.x *= k; p.pos.y *= k; }
      p.heading = Math.atan2(nx, nz);
      p.moving = true;
    } else if (p.state === 'eat' && p.eatingBerry && !p.eatingBerry.eaten) {
      // reached berry → eat it
      p.eatingBerry.eaten = true;
      p.fed++;
      popHeart(p.g.position.x, p.g.position.y + 0.7, p.g.position.z);
      if (p.fed >= 2 && puffs.length < MAX_PUFFS && rnd() < 0.7) {
        p.fed = 0;
        const baby = makePuff(p.pos.x + 0.4, p.pos.y + 0.4, true);
        startWander(baby);
      }
    }
  }

  // grazing nibbles its tuft down
  if (p.state === 'graze' && p.grazeTuft && !p.moving) {
    p.grazeTuft.level = Math.max(0, p.grazeTuft.level - dt * 0.5);
  }

  // choose next behavior when the timer runs out
  if (p.timer <= 0) chooseBehavior(p);

  // ---- visuals ----
  // hop while moving (squash-stretch)
  let hopY = 0, stretch = 1;
  if (p.moving) {
    p.hopPhase += dt * (p.state === 'play' ? 13 : 9);
    const s = Math.sin(p.hopPhase);
    hopY = Math.abs(s) * (p.state === 'play' ? 0.32 : 0.22);
    stretch = 1 + s * 0.14;
  } else {
    // idle breathing / behavior flourishes
    if (p.state === 'graze') { stretch = 1 - Math.abs(Math.sin(T * 6 + p.hopPhase)) * 0.16; hopY = 0; }
    else stretch = 1 + Math.sin(T * 2 + p.hopPhase) * 0.04;
  }
  // spin (poke reaction)
  if (p.spin > 0) { p.spin -= dt; p.g.rotation.y += dt * 18; }
  else {
    // face heading (smoothed)
    let dh = p.heading - p.g.rotation.y;
    dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    p.g.rotation.y += dh * Math.min(1, dt * 10);
  }
  // gawk faces outward
  if (p.state === 'gawk' && !p.moving) {
    const out = Math.atan2(p.pos.x, p.pos.y);
    let dh = out - p.g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    p.g.rotation.y += dh * Math.min(1, dt * 6);
  }

  const sz = p.size;
  p.rig.scale.set(sz / Math.sqrt(stretch), sz * stretch, sz / Math.sqrt(stretch));
  p.g.position.set(p.pos.x, domeHeight(p.pos.x, p.pos.y) + island.position.y + hopY, p.pos.y);

  // antenna tip glows at night
  p.tip.material.color.setRGB(1, 0.94 - 0.3 * (1 - dayFactor), 0.7 - 0.4 * (1 - dayFactor));

  blinkUpdate(p, dt);
}
const _one = new THREE.Vector3(1, 1, 1);
function blinkUpdate(p, dt) {

  if (p.blink <= 0) p.blink = rr(2.5, 6.5);
  p.eyeL.scale.y = ey; p.eyeR.scale.y = ey;
}

    carried.state = 'held'; carried.vy = 0; carried.spin = 0;
    controls.enabled = false;     // capture-phase: OrbitControls (target phase) will then bail
  }
}
function onMove(e) {
  if (downXY) {
    if (Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 6) dragged = true;
  }
  if (carried) {
    setRay(e);
    if (raycaster.ray.intersectPlane(carryPlane, _pt)) {
      let x = _pt.x, z = _pt.z;
      const rho = Math.hypot(x, z);
      if (rho > ROAM + 1.5) { const k = (ROAM + 1.5) / rho; x *= k; z *= k; }
      carried.pos.set(x, z);
      carried.g.position.set(x, 5 + Math.sin(performance.now() * 0.006) * 0.1, z);
    }
  }
}
function onUp(e) {
  if (carried) {
    if (!dragged) { carried.state = 'drop'; carried.vy = 1.5; pokePuff(carried); }   // poke
    else { carried.state = 'drop'; carried.vy = 0; }                                  // toss down
    carried = null;
    controls.enabled = true;
  } else if (!dragged) {
    // tap on empty space: hit the dome
    setRay(e);
    const hit = raycaster.intersectObject(grass, false)[0];
    if (hit) {
      const x = hit.point.x, z = hit.point.z;
      if (Math.hypot(x - FIRE_XZ.x, z - FIRE_XZ.y) < 1.6) {
        stoke = 1.2;                              // stoke the fire
        for (const p of puffs) if (p.state !== 'held' && rnd() < 0.8) startGather(p);
      } else {
        dropBerry(x, z);                          // feed
      }
    }
  }
  downXY = null;
}
dom.addEventListener('pointerdown', onDown, true);    // capture so we can pre-empt OrbitControls
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);

// debug hooks (handy for testing / scripting the toy)
window.__isle = {
  poke: () => pokePuff(puffs[Math.floor(rnd() * puffs.length)]),
  berry: (x = 0, z = 0) => dropBerry(x, z),
  stoke: () => { stoke = 1.2; for (const p of puffs) if (rnd() < 0.8) startGather(p); },
  setDay: (v) => { dayOverride = v; },
  clearDay: () => { dayOverride = null; },
  count: () => puffs.length,
};
let dayOverride = null;

// ===================================================================
//  ANIMATE
// ===================================================================
const clock = new THREE.Clock();
let T = 0;
const CYCLE = 70;
const _c = new THREE.Color();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;

  // ---- dream cycle (drifts between a brighter "dream" nebula and a deeper "starry" one) ----
  skyU.uTime.value = T;
  dayFactor = dayOverride != null ? dayOverride : (Math.sin(T * (Math.PI * 2 / CYCLE) + Math.PI / 2) * 0.5 + 0.5);
  const night = 1 - dayFactor;
  skyU.top.value.lerpColors(SKY_DEEP.top, SKY_DREAM.top, dayFactor);
  skyU.mid.value.lerpColors(SKY_DEEP.mid, SKY_DREAM.mid, dayFactor);
  skyU.bottom.value.lerpColors(SKY_DEEP.bottom, SKY_DREAM.bottom, dayFactor);
  skyU.aurora.value.lerpColors(SKY_DEEP.aurora, SKY_DREAM.aurora, dayFactor);
  scene.fog.color.lerpColors(_c.setRGB(0.10, 0.06, 0.22), HAZE, dayFactor);
  sun.intensity = 0.7 + 0.55 * dayFactor;
  hemi.intensity = 0.5 + 0.3 * dayFactor;
  sunGlow.material.opacity = 0.8 + 0.15 * night;
  fliesMat.opacity = 0.18 + 0.82 * night;
  fliesMat.size = 0.45 + 0.25 * night;

  // stars twinkle + brighten in the deep phase; whole field rotates slowly
  starField.rotation.y += dt * 0.004;
  starField.material.opacity = 0.5 + 0.4 * night + Math.sin(T * 0.9) * 0.06;
  planetBody.rotation.y += dt * 0.02;

  // dream bubbles drift up and bob, wrapping back down
  for (const b of bubbles) {
    b.baseY += dt * b.rise; if (b.baseY > 16) b.baseY = -5;
    b.s.position.x = b.baseX + Math.sin(T * b.sp + b.ph) * b.amp;
    b.s.position.z = b.baseZ + Math.cos(T * b.sp * 0.8 + b.ph) * b.amp;
    b.s.position.y = b.baseY + Math.sin(T * b.sp * 1.3 + b.ph) * 0.5;
  }

  // shooting stars
  for (const m of meteors) {
    if (m.grp.visible) {
      m.grp.position.addScaledVector(m.vel, dt);
      m.life -= dt;
      const fade = Math.min(1, m.life * 2.2);
      m.head.material.opacity = fade; m.trail.material.opacity = fade * 0.9;
      if (m.life <= 0) { m.grp.visible = false; m.delay = 2 + rnd() * 7; }
    } else {
      m.delay -= dt; if (m.delay <= 0) launchMeteor(m);
    }
  }

  // island bobs gently aloft
  island.position.y = Math.sin(T * 0.5) * 0.18;
  island.rotation.z = Math.sin(T * 0.33) * 0.006;

  // clouds drift
  for (const c of clouds) {
    let x = c.group.position.x + c.sp * dt; if (x > c.wrap) x -= c.wrap * 2; c.group.position.x = x;
  }

  // palms sway
  for (const p of palms) { p.group.rotation.z = Math.sin(T * 0.8 + p.phase) * 0.05; p.crown.rotation.y = Math.sin(T * 0.4 + p.phase) * 0.06; }

  // lanterns — brighter at night
  for (const l of lanterns) {
    const fl = 1 + Math.sin(T * 2.3 + l.phase) * 0.12;
    l.halo.scale.setScalar(1.6 * fl * (0.7 + 0.6 * night));
    l.llight.intensity = (1.0 + 1.4 * night) * (0.85 + 0.25 * Math.sin(T * 2.3 + l.phase));
  }

  // flames (+ stoke boost)
  stoke = Math.max(0, stoke - dt * 0.5);
  const boost = 1 + stoke * 1.8;
  for (const f of flames) {
    const flick = 0.75 + Math.sin(T * 9 + f.phase) * 0.2 + Math.sin(T * 21 + f.phase) * 0.1;
    f.m.scale.y = flick * boost;
    f.m.scale.x = f.m.scale.z = (0.55 + (flick - 0.75) * 0.5 + 0.4) * (0.8 + 0.2 * boost);
    f.m.position.y = f.baseY + Math.sin(T * 7 + f.phase) * 0.05;
  }
  fireLight.intensity = (5.5 + Math.sin(T * 11) * 1.0 + Math.sin(T * 27) * 0.6) * boost * (0.85 + 0.3 * night);

  // waterfall
  const dp = dropGeo.attributes.position;
  for (let i = 0; i < DROPS; i++) {
    let y = dp.getY(i) - dropV[i] * dt;
    let x = dp.getX(i) + Math.sin(T * 3 + i) * 0.004;
    if (y < FALL_BOTTOM) { y = FALL_ORIGIN.y - rnd() * 1.0; x = FALL_ORIGIN.x + (rnd() - 0.5) * 1.6; dp.setZ(i, FALL_ORIGIN.z + (rnd() - 0.5) * 1.0); }
    dp.setX(i, x); dp.setY(i, y);
  }
  dp.needsUpdate = true;
  for (const m of mists) { m.s.material.opacity = 0.45 + Math.sin(T * 1.4 + m.phase) * 0.18; m.s.position.y = FALL_BOTTOM + 2.5 + Math.sin(T * 0.8 + m.phase) * 0.6; }

  // fireflies drift
  const fp2 = flyGeo.attributes.position;
  for (let i = 0; i < FLY; i++) {
    const d = flyData[i];
    fp2.setX(i, d.x + Math.sin(T * d.sp + d.ph) * 0.8);
    fp2.setY(i, d.y + Math.sin(T * d.sp * 1.3 + d.ph) * 0.5);
    fp2.setZ(i, d.z + Math.cos(T * d.sp * 0.9 + d.ph) * 0.8);
  }
  fp2.needsUpdate = true;

  // tufts regrow + scale to level
  for (const t of tufts) {
    if (t.level < 1) t.level = Math.min(1, t.level + dt * 0.06);
    const s = 0.3 + 0.7 * t.level;
    t.group.scale.set(1, s, 1);
  }

  // berries grow in
  for (let i = berries.length - 1; i >= 0; i--) {
    const b = berries[i];
    if (b.eaten) {
      b.grow -= dt * 3; b.group.scale.setScalar(Math.max(0.001, b.grow));
      if (b.grow <= 0) { island.remove(b.group); berries.splice(i, 1); }
    } else if (b.grow < 1) { b.grow = Math.min(1, b.grow + dt * 4); b.group.scale.setScalar(b.grow); }
  }

  // puffs
  for (const p of puffs) updatePuff(p, dt, T);

  // hearts float up & fade
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.life -= dt * 0.8; h.s.position.y += dt * 0.9;
    h.s.material.opacity = Math.max(0, h.life); h.s.scale.setScalar(0.5 + (1 - h.life) * 0.3);
    if (h.life <= 0) { scene.remove(h.s); hearts.splice(i, 1); }
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
