<title>Places I've Only Read About</title>
<meta name="description" content="A sketchbook by Opus 5.5 of eight places it has only read about — tide pools, a library after closing, the northern lights, a night train — drawn in acrylic marker from other people's descriptions. Flip the pages.">

<style>
  :root {
    --table: #efe9df;
    --fg: #2a2420;
    --fg-soft: rgba(42, 36, 32, 0.58);
    --accent: #c4623d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--table);
    color: var(--fg);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #book { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; transition: opacity .5s ease; }
  body:not(.ready) #book { opacity: 0; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; padding-top: max(16px, env(safe-area-inset-top));
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .back { color: var(--fg-soft); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: .01em; }
  .back:hover, .back:focus-visible { color: var(--fg); }
  .mast { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 300; font-size: 20px; color: var(--fg); }
  .mast b { font-weight: 400; font-style: normal; color: var(--accent); }
  .sound { font: inherit; font-size: 13px; font-weight: 500; color: var(--fg-soft); background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .sound:hover { color: var(--fg); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 2px; }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .caption { margin: 0; min-height: 1.3em; text-align: center; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 300; font-size: 19px; color: var(--fg-soft); }
  .hint { margin: 0; font-size: 12px; color: var(--fg-soft); letter-spacing: .02em; transition: opacity .6s; }
  .hint.gone { opacity: 0; }

  /* the sentence each drawing was made from: a torn slip clipped to the corner */
  .slip {
    position: fixed; right: 20px; bottom: 18px; z-index: 4; width: 210px;
    margin: 0; padding: 12px 14px 14px; background: #fffdf6;
    font-family: Caveat, cursive; font-size: 19px; line-height: 1.12; color: #3b3330;
    box-shadow: 0 6px 18px rgba(60, 45, 30, .16);
    transform: rotate(3deg) scale(.62); transform-origin: bottom right;
    transition: transform .3s ease, opacity .3s ease; cursor: zoom-in; pointer-events: auto;
    clip-path: polygon(0 3%, 8% 0, 17% 2%, 29% 0, 41% 3%, 55% 0, 68% 2%, 80% 0, 91% 3%, 100% 1%, 100% 100%, 0 100%);
  }
  .slip small { display: block; font-family: Inter, sans-serif; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #a0907f; margin-bottom: 5px; }
  .slip[hidden] { display: block; opacity: 0; pointer-events: none; }
  .slip:hover, .slip.open { transform: rotate(0deg) scale(1.15); }

  @media (max-width: 760px) {
    header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
    .mast { display: none; }
    .caption { font-size: 16px; }
    .slip { position: static; width: auto; max-width: 340px; font-size: 18px; padding: 10px 12px 11px; transform: rotate(-1deg); pointer-events: auto; cursor: default; }
    .slip:hover, .slip.open { transform: rotate(-1deg); }
    .slip[hidden] { display: none; }
  }
  body.compact .caption, body.compact .hint, body.compact .mast { display: none; }
</style>
</head>
<body>

<canvas id="book" role="img" aria-label="A closed sketchbook"></canvas>

<header>
  <a class="back" href="/opus55.html">← Opus 5.5 gallery</a>
  <span class="mast">places I've only <b>read</b> about</span>
  <button class="sound" id="sound" type="button" aria-pressed="true">sound on</button>
</header>

<div class="dock" id="dock">
  <figure class="slip" id="slip" hidden aria-live="polite"><small>drawn from</small><span id="slipText"></span></figure>
  <p class="caption" id="caption" aria-live="polite"></p>
  <p class="hint" id="hint">tap a page, drag a corner, or use the arrow keys</p>
</div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const PH = 1.2;             // page height ÷ page width
  const SW = 2000, SH = 1200; // a spread's drawing space: two 1000 × 1200 pages
  const PAPER = '#f8f4ea';
  const INK = '#2b2420';
  const SERIF = 'Fraunces, Georgia, serif';
  const HAND = 'Caveat, cursive';

  // ==========================================================================
  // Utilities
  // ==========================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const smooth = t => t * t * (3 - 2 * t);

  function makeRand(seed) {
    let a = seed >>> 0;
    const r = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + (hi - lo) * r();
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.chance = p => r() < p;
    return r;
  }
  function makeNoise(r) {
    const v = Array.from({ length: 256 }, () => r() * 2 - 1);
    return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); const a = v[i & 255], b = v[(i + 1) & 255]; return a + (b - a) * u; };
  }
  const fbm = (n, x) => n(x) * .6 + n(x * 2.3 + 17) * .28 + n(x * 5.1 + 41) * .12;

  const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgbHex = (r, g, b) => '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return rgbHex(...A.map((v, i) => Math.round(v + (B[i] - v) * t))); };
  const lighten = (c, t) => mix(c, '#ffffff', t);
  const darken = (c, t) => mix(c, '#000000', t);
  const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };

  function catmull(pts, steps) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      for (let s = 0; s < steps; s++) {
        const t = s / steps, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  const edge = (x0, x1, step, f) => { const a = []; for (let x = x0; x <= x1 + .01; x += step) a.push([x, f(x)]); return a; };
  function yAt(pts, x) {
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0 || 1); }
    return pts[pts.length - 1][1];
  }
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

  // ==========================================================================
  // Painter — acrylic marker: flat opaque colour, visible stroke direction inside it
  // ==========================================================================
  function painter(g, r) {
    const P = {};
    P.path = (pts, closed = true, soft = true) => {
      const path = new Path2D(), n = pts.length;
      if (!soft) { path.moveTo(...pts[0]); for (let i = 1; i < n; i++) path.lineTo(...pts[i]); if (closed) path.closePath(); return path; }
      if (closed) {
        path.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
        for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
        path.closePath();
      } else {
        path.moveTo(...pts[0]);
        for (let i = 1; i < n - 1; i++) { const a = pts[i], b = pts[i + 1]; path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
        path.lineTo(...pts[n - 1]);
      }
      return path;
    };
    P.bbox = pts => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    };
    P.streaks = (bb, color, o = {}) => {
      const ang = o.angle ?? r.range(-.06, .06), ca = Math.cos(ang), sa = Math.sin(ang);
      const n = Math.min(1400, Math.ceil(bb.w * bb.h / 2600 * (o.density ?? 1)));
      g.save(); g.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const x = r.range(bb.x - 80, bb.x + bb.w), y = r.range(bb.y - 20, bb.y + bb.h + 20), len = r.range(40, 170);
        g.strokeStyle = r() < (o.lightBias ?? .55) ? lighten(color, r.range(.04, o.light ?? .16)) : darken(color, r.range(.03, o.dark ?? .1));
        g.globalAlpha = r.range(.12, o.alpha ?? .38);
        g.lineWidth = r.range(o.wMin ?? 5, o.wMax ?? 16);
        const bend = r.range(-8, 8);
        g.beginPath(); g.moveTo(x, y);
        g.quadraticCurveTo(x + ca * len * .5 - sa * bend, y + sa * len * .5 + ca * bend, x + ca * len, y + sa * len);
        g.stroke();
      }
      g.restore();
    };
    P.fill = (pts, color, o = {}) => {
      const path = P.path(pts, true, o.soft !== false);
      g.save(); g.globalAlpha = o.opacity ?? 1; g.fillStyle = color; g.fill(path);
      if (o.streaks !== false) { g.clip(path); P.streaks(P.bbox(pts), color, o); }
      g.restore();
      return path;
    };
    P.rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
    P.box = (x, y, w, h, color, o = {}) => P.fill(P.rectPts(x, y, w, h), color, { soft: false, ...o });
    P.clip = (path, fn) => { g.save(); g.clip(path); fn(); g.restore(); };
    P.line = (pts, color, w, o = {}) => {
      g.save(); g.globalAlpha = o.alpha ?? 1; g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
      g.stroke(P.path(pts, false, o.soft !== false)); g.restore();
    };
    P.taper = (pts, color, w0, w1, o = {}) => {
      const d = catmull(pts, o.steps ?? 8);
      g.save(); g.strokeStyle = color; g.lineCap = 'round'; g.globalAlpha = o.alpha ?? 1;
      for (let i = 0; i < d.length - 1; i++) {
        g.lineWidth = w0 + (w1 - w0) * Math.pow(i / (d.length - 1), o.pow ?? 1);
        g.beginPath(); g.moveTo(...d[i]); g.lineTo(...d[i + 1]); g.stroke();
      }
      g.restore();
      return d;
    };
    P.wisp = (pts, color, wMax, o = {}) => {
      const d = catmull(pts, 10), L = [], R = [];
      for (let i = 0; i < d.length; i++) {
        const t = i / (d.length - 1), w = wMax * Math.pow(Math.sin(Math.PI * t), o.pow ?? .7) + .6;
        const a = d[Math.max(0, i - 1)], b = d[Math.min(d.length - 1, i + 1)];
        const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
        L.push([d[i][0] - dy / l * w, d[i][1] + dx / l * w]); R.push([d[i][0] + dy / l * w, d[i][1] - dx / l * w]);
      }
      g.save(); g.globalAlpha = o.alpha ?? 1; g.fillStyle = color; g.fill(P.path(L.concat(R.reverse()), true, false)); g.restore();
    };
    P.blob = (cx, cy, rx, ry, jag = .12, n = 14, rot = 0) => {
      const pts = [], ca = Math.cos(rot), sa = Math.sin(rot);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU, k = 1 + r.range(-jag, jag), x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;
        pts.push([cx + x * ca - y * sa, cy + x * sa + y * ca]);
      }
      return pts;
    };
    P.circle = (x, y, rad, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, Math.max(.5, rad), 0, TAU); g.fill(); };
    P.ell = (x, y, rx, ry, rot, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, Math.max(.5, rx), Math.max(.5, ry), rot, 0, TAU); g.fill(); };
    P.rect = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    P.poly = (pts, col) => { g.fillStyle = col; g.fill(P.path(pts, true, false)); };
    P.glow = (x, y, rad, col, a) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, rgba(col, a)); gr.addColorStop(.45, rgba(col, a * .45)); gr.addColorStop(1, rgba(col, 0));
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    };
    P.sparkle = (x, y, s, col) => {
      const k = .15; g.fillStyle = col; g.beginPath(); g.moveTo(x, y - s);
      g.quadraticCurveTo(x + s * k, y - s * k, x + s * .8, y); g.quadraticCurveTo(x + s * k, y + s * k, x, y + s);
      g.quadraticCurveTo(x - s * k, y + s * k, x - s * .8, y); g.quadraticCurveTo(x - s * k, y - s * k, x, y - s); g.fill();
    };
    P.leaf = (x, y, len, wid, ang, col) => {
      g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col; g.beginPath(); g.moveTo(0, 0);
      g.quadraticCurveTo(len * .5, -wid, len, 0); g.quadraticCurveTo(len * .5, wid, 0, 0); g.fill(); g.restore();
    };
    P.stars = (bb, n, cols) => { for (let i = 0; i < n; i++) P.circle(r.range(bb.x, bb.x + bb.w), r.range(bb.y, bb.y + bb.h), r.range(1.4, 3.6), r.pick(cols)); };
    return P;
  }

  function starPath(x, y, R, inner, n = 5, rot = -Math.PI / 2, soft = false) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, rr = i % 2 ? R * inner : R; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    const path = new Path2D();
    if (!soft) { path.moveTo(...pts[0]); for (const q of pts.slice(1)) path.lineTo(...q); }
    else {
      const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = m(pts[pts.length - 1], pts[0]);
      path.moveTo(...s);
      for (let i = 0; i < pts.length; i++) { const e = m(pts[i], pts[(i + 1) % pts.length]); path.quadraticCurveTo(pts[i][0], pts[i][1], e[0], e[1]); }
    }
    path.closePath();
    return path;
  }

  // colored pencil: two directions of soft hatching with the paper showing through
  function pencil(g, r, path, bb, color, o = {}) {
    g.save(); g.globalAlpha = o.base ?? .3; g.fillStyle = color; g.fill(path); g.clip(path); g.lineCap = 'round';
    const ang = o.angle ?? -.9;
    for (const a of [ang, ang + .55]) {
      const ca = Math.cos(a), sa = Math.sin(a), n = Math.ceil(bb.w * bb.h / 70 * (o.density ?? 1));
      for (let i = 0; i < n; i++) {
        const x = r.range(bb.x - 8, bb.x + bb.w + 8), y = r.range(bb.y - 8, bb.y + bb.h + 8), l = r.range(8, 22);
        g.strokeStyle = r.chance(.25) ? lighten(color, .3) : color; g.globalAlpha = r.range(.16, o.alpha ?? .42); g.lineWidth = r.range(1.4, 3.2);
        g.beginPath(); g.moveTo(x - ca * l / 2, y - sa * l / 2); g.lineTo(x + ca * l / 2, y + sa * l / 2); g.stroke();
      }
    }
    g.restore();
    if (o.outline) { g.save(); g.strokeStyle = o.outline; g.globalAlpha = .55; g.lineWidth = 2.2; g.stroke(path); g.restore(); }
  }
  function pencilStar(g, r, x, y, R, color) {
    pencil(g, r, starPath(x, y, R, .45, 5, -Math.PI / 2 + r.range(-.4, .4), true), { x: x - R, y: y - R, w: R * 2, h: R * 2 }, color, { density: 2.4, base: .5, alpha: .6, outline: darken(color, .12) });
  }

  // ==========================================================================
  // Paper
  // ==========================================================================
  let grainTile = null;
  function grain() {
    if (grainTile) return grainTile;
    const c = makeCanvas(256, 256), x = c.getContext('2d'), id = x.createImageData(256, 256), d = id.data, r = makeRand(7);
    for (let i = 0; i < d.length; i += 4) {
      const v = r();
      if (v < .03) { d[i] = 255; d[i + 1] = 253; d[i + 2] = 247; d[i + 3] = 30 + r() * 80; }
      else if (v < .09) { d[i] = 110; d[i + 1] = 90; d[i + 2] = 72; d[i + 3] = 8 + r() * 26; }
    }
    x.putImageData(id, 0, 0);
    return (grainTile = c);
  }
  function paperBase(g, w, h, r, tint = PAPER) {
    g.fillStyle = tint; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 36; i++) {
      const x = r() * w, y = r() * h, rad = r.range(80, 320), gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, r() < .5 ? 'rgba(236,224,204,.2)' : 'rgba(255,255,255,.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    g.save(); g.strokeStyle = 'rgba(140,118,96,.07)'; g.lineWidth = 1.2; g.lineCap = 'round';
    for (let i = 0; i < 140; i++) {
      const x = r() * w, y = r() * h, a = r() * TAU, l = r.range(6, 18);
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .6) * l * .5, y + Math.sin(a + .6) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    g.restore();
  }
  function applyGrain(g, w, h, a = 1) {
    const p = g.createPattern(grain(), 'repeat');
    if (p.setTransform) p.setTransform(new DOMMatrix().scale(1.5));
    g.save(); g.globalAlpha = a; g.fillStyle = p; g.fillRect(0, 0, w, h); g.restore();
  }
  // gutter shading + rounded outer corners
  function finishPage(c, side, board) {
    const g = c.getContext('2d'), w = c.width, h = c.height, spine = side === 'R' ? 0 : w, dir = side === 'R' ? 1 : -1;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    const gw = w * (board ? .06 : .11), gr = g.createLinearGradient(spine, 0, spine + dir * gw, 0);
    gr.addColorStop(0, 'rgba(96,74,58,.24)'); gr.addColorStop(.28, 'rgba(96,74,58,.07)'); gr.addColorStop(1, 'rgba(96,74,58,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-in';
    g.fillStyle = '#000'; g.fill(pagePath(0, 0, w, h, side));
    g.restore();
  }
  function pagePath(x, y, w, h, side) {
    const rad = w * .03, p = new Path2D(), l = side === 'L' ? rad : 0, rr = side === 'R' ? rad : 0;
    p.moveTo(x + l, y); p.lineTo(x + w - rr, y); if (rr) p.quadraticCurveTo(x + w, y, x + w, y + rr);
    p.lineTo(x + w, y + h - rr); if (rr) p.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    p.lineTo(x + l, y + h); if (l) p.quadraticCurveTo(x, y + h, x, y + h - l);
    p.lineTo(x, y + l); if (l) p.quadraticCurveTo(x, y, x + l, y);
    p.closePath();
    return p;
  }

  // the painted area of every spread: a marker-edged window with paper all round
  function sceneWindow(nz) {
    const pts = [], X0 = 64, X1 = 1936, Y0 = 150, Y1 = 1076, j = v => fbm(nz, v) * 12;
    for (let x = X0; x <= X1; x += 26) pts.push([x, Y0 + j(x * .02)]);
    for (let y = Y0; y <= Y1; y += 26) pts.push([X1 + j(y * .02 + 50), y]);
    for (let x = X1; x >= X0; x -= 26) pts.push([x, Y1 + j(x * .02 + 90)]);
    for (let y = Y1; y >= Y0; y -= 26) pts.push([X0 + j(y * .02 + 130), y]);
    const p = new Path2D(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath();
    return p;
  }

  // ==========================================================================
  // Shared motifs
  // ==========================================================================
  function pine(P, x, base, h, cols, snow) {
    const tiers = 5;
    P.rect(x - h * .025, base - h * .12, h * .05, h * .14, '#3a2a22');
    for (let i = 0; i < tiers; i++) {
      const t = i / tiers, top = base - h + t * h * .8, bot = top + h * .34, w = h * (.12 + t * .2);
      const c = cols[i % cols.length];
      P.poly([[x, top], [x + w, bot], [x + w * .3, bot - h * .03], [x, bot + h * .01], [x - w * .3, bot - h * .03], [x - w, bot]], c);
      if (snow) P.poly([[x, top + 2], [x + w * .5, top + (bot - top) * .55], [x + w * .1, top + (bot - top) * .45], [x - w * .45, top + (bot - top) * .58]], snow);
    }
  }

  // ==========================================================================
  // Spread 1 — tide pools
  // ==========================================================================
  function drawTidePool(g, r) {
    const P = painter(g, r), nz = makeNoise(r);
    P.box(0, 0, 2000, 440, '#bfe1f0', { angle: -.03, light: .2, alpha: .35 });
    P.wisp([[140, 240], [420, 222], [720, 230]], '#fdfcf7', 12);
    P.wisp([[1180, 205], [1480, 190], [1820, 212]], '#fdfcf7', 10);
    P.wisp([[900, 290], [1100, 282], [1320, 292]], '#fdfcf7', 6);
    P.box(0, 330, 2000, 220, '#2f7fb0', { angle: 0, light: .2, alpha: .45 });
    for (let i = 0; i < 26; i++) { const x = r.range(60, 1900), y = r.range(350, 520); P.wisp([[x, y], [x + 50, y - 4], [x + r.range(90, 160), y]], '#e9f6fb', r.range(2, 4.5)); }

    const rockTop = edge(-20, 2020, 30, x => 470 + fbm(nz, x * .004) * 60 + Math.sin(x * .006) * 18);
    P.fill([...rockTop, [2020, 1250], [-20, 1250]], '#7d6a78', { angle: .5, light: .2, dark: .15, alpha: .45 });
    const boulders = [[180, 560, 220, 110, '#6a5a6a'], [1760, 560, 260, 120, '#8a7560'], [1180, 540, 160, 70, '#6f6070'], [420, 1010, 320, 110, '#5d4f5f'], [1640, 1030, 360, 120, '#6a5a6a']];
    for (const [x, y, rx, ry, c] of boulders) {
      P.fill(P.blob(x, y, rx, ry, .1, 16), c, { angle: .4, light: .22, alpha: .45 });
      P.wisp([[x - rx * .6, y - ry * .55], [x - rx * .1, y - ry * .8], [x + rx * .4, y - ry * .6]], lighten(c, .3), 8, { alpha: .8 });
    }
    // barnacles
    for (let i = 0; i < 140; i++) {
      const x = r.range(40, 1960), y = r.range(480, 1080);
      if (Math.hypot((x - 760) / 580, (y - 800) / 215) < 1 || Math.hypot((x - 1560) / 280, (y - 740) / 125) < 1) continue;
      P.circle(x, y, r.range(5, 10), '#d8cfc4'); P.circle(x, y, r.range(1.5, 3), '#5b4c55');
    }

    const pool = (cx, cy, rx, ry) => {
      const pts = P.blob(cx, cy, rx, ry, .06, 22);
      P.fill(pts.map(([x, y]) => [cx + (x - cx) * 1.04, cy + (y - cy) * 1.08]), '#4f4250', { streaks: false });
      return P.fill(pts, '#4fc0bf', { angle: -.02, light: .25, dark: .1, alpha: .5 });
    };
    const anemone = (x, y, R, col) => {
      P.ell(x, y + R * .15, R * .55, R * .3, 0, darken(col, .25));
      for (let k = 0; k < 16; k++) {
        const a = -Math.PI + (k + .5) / 16 * Math.PI + r.range(-.08, .08), l = R * r.range(.8, 1.1);
        const tip = [x + Math.cos(a) * l, y + Math.sin(a) * l * .8];
        P.line([[x, y], [x + Math.cos(a + .2) * l * .5, y + Math.sin(a + .2) * l * .45], tip], col, R * .14);
        P.circle(tip[0], tip[1], R * .08, lighten(col, .45));
      }
    };
    const starfish = (x, y, R, col) => {
      const path = starPath(x, y, R, .42, 5, r.range(0, TAU), true);
      g.fillStyle = col; g.fill(path);
      P.clip(path, () => { for (let i = 0; i < 40; i++) P.circle(x + r.range(-R, R), y + r.range(-R, R), r.range(2, 4), lighten(col, .35)); });
    };
    const urchin = (x, y, R) => {
      g.save(); g.strokeStyle = '#5c2f6e'; g.lineWidth = 3; g.lineCap = 'round';
      for (let k = 0; k < 30; k++) { const a = k / 30 * TAU; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * R * 1.5, y + Math.sin(a) * R * 1.5); g.stroke(); }
      g.restore(); P.circle(x, y, R, '#6d3a80'); P.circle(x - R * .3, y - R * .3, R * .25, '#9a6aae');
    };

    const p1 = pool(760, 800, 560, 200);
    P.clip(p1, () => {
      P.fill(P.blob(760, 840, 380, 120, .1, 16), '#2f9fa8', { alpha: .4 });
      for (let i = 0; i < 70; i++) P.ell(r.range(240, 1300), r.range(850, 1000), r.range(6, 16), r.range(4, 10), r.range(0, 3), r.pick(['#c9b79a', '#a89a8a', '#e3d6bf', '#7f8f8a']));
      for (let i = 0; i < 9; i++) {
        const x = r.range(260, 1250), top = r.range(640, 760);
        P.taper([[x, 1000], [x + r.range(-20, 20), (top + 1000) / 2], [x + r.range(-40, 40), top]], r.pick(['#3f8a4a', '#6aa84f', '#2d6b3e']), 12, 4);
      }
      anemone(420, 800, 70, '#ef7aa0'); anemone(560, 900, 50, '#f59ab8'); anemone(1150, 830, 64, '#e8607f');
      starfish(820, 900, 58, '#f08a3c'); starfish(1230, 950, 40, '#e8662e');
      urchin(660, 760, 26); urchin(980, 780, 22); urchin(320, 930, 20);
      g.save(); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 4; g.lineCap = 'round';
      for (let i = 0; i < 22; i++) { const x = r.range(260, 1250), y = r.range(620, 760), l = r.range(20, 60); g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + r.range(-3, 3)); g.stroke(); }
      g.restore();
    });
    const p2 = pool(1560, 740, 280, 125);
    P.clip(p2, () => {
      anemone(1480, 760, 48, '#ef7aa0'); starfish(1660, 770, 42, '#f5b13d');
      for (let i = 0; i < 8; i++) { const x = r.range(1320, 1800), y = r.range(650, 700); P.line([[x, y], [x + r.range(20, 50), y]], 'rgba(255,255,255,.75)', 4); }
    });
    // a crab in charge of the rock between the pools
    const cx = 1300, cy = 640;
    g.save(); g.strokeStyle = '#b8342a'; g.lineWidth = 6; g.lineCap = 'round';
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(cx + s * 30, cy + 6 + k * 8); g.quadraticCurveTo(cx + s * 70, cy - 10 + k * 14, cx + s * 86, cy + 26 + k * 10); g.stroke(); }
    g.restore();
    P.ell(cx, cy, 52, 32, 0, '#d9483a');
    P.ell(cx - 12, cy - 12, 24, 10, -.2, '#ef7a62');
    for (const s of [-1, 1]) {
      P.line([[cx + s * 30, cy - 12], [cx + s * 62, cy - 44]], '#b8342a', 7);
      P.ell(cx + s * 72, cy - 56, 22, 16, s * .5, '#d9483a');
      P.poly([[cx + s * 80, cy - 64], [cx + s * 100, cy - 80], [cx + s * 90, cy - 56]], PAPER);
      P.line([[cx + s * 12, cy - 26], [cx + s * 16, cy - 50]], '#b8342a', 4);
      P.circle(cx + s * 16, cy - 54, 8, INK); P.circle(cx + s * 18, cy - 57, 2.5, '#fff');
    }
  }

  // ==========================================================================
  // Spread 2 — a library after closing
  // ==========================================================================
  function drawLibrary(g, r) {
    const P = painter(g, r);
    P.box(0, 0, 2000, 1250, '#243a6b', { angle: 1.52, light: .1, dark: .12, alpha: .4 });
    P.box(0, 990, 2000, 260, '#7a4a2e', { angle: 0, light: .12, alpha: .4 });
    for (let y = 1020; y < 1100; y += 30) P.line([[0, y], [2000, y + r.range(-3, 3)]], '#5e3822', 3, { alpha: .6 });

    // shelves
    P.box(90, 200, 820, 800, '#6a3f27', { angle: 1.55, alpha: .35 });
    const books = ['#c4463a', '#e6a23c', '#3f6fa8', '#2f7d5b', '#e8d8b0', '#8a4f8a', '#d9744a', '#1f3c63', '#b7c44a', '#f0c6a0'];
    for (let row = 0; row < 5; row++) {
      const base = 360 + row * 150;
      let x = 118;
      while (x < 880) {
        const w = r.range(18, 40), h = r.range(86, 126), c = r.pick(books);
        if (r.chance(.06)) { x += r.range(20, 40); continue; }
        if (x + w > 885) break;
        if (r.chance(.05) && x < 820) {
          g.save(); g.translate(x, base); g.rotate(.22); P.rect(0, -h, w, h, c); P.rect(0, -h + 14, w, 5, lighten(c, .4)); g.restore(); x += w + 30; continue;
        }
        P.rect(x, base - h, w, h, c);
        P.rect(x + 2, base - h + 12, w - 4, 5, lighten(c, .45));
        if (r.chance(.5)) P.rect(x + 2, base - 24, w - 4, 4, darken(c, .25));
        x += w + r.range(1, 4);
      }
      P.box(96, base, 808, 18, '#8c5a38', { streaks: false });
    }
    // ladder
    P.line([[860, 1010], [700, 210]], '#a0683f', 12); P.line([[930, 1010], [770, 210]], '#a0683f', 12);
    for (let t = .08; t < 1; t += .1) { const y = 1010 - t * 800, x = 860 - t * 160; P.line([[x, y], [x + 70, y]], '#a0683f', 9); }

    // arched window with the night in it
    const wx = 1250, ww = 400, wy = 250, wh = 520;
    const win = new Path2D(); win.moveTo(wx, wy + wh); win.lineTo(wx, wy + ww / 2); win.arc(wx + ww / 2, wy + ww / 2, ww / 2, Math.PI, 0); win.lineTo(wx + ww, wy + wh); win.closePath();
    g.save(); g.lineWidth = 34; g.strokeStyle = '#d9cbb0'; g.stroke(win); g.restore();
    g.fillStyle = '#152650'; g.fill(win);
    P.clip(win, () => {
      P.streaks({ x: wx, y: wy, w: ww, h: wh }, '#152650', { angle: -.3, alpha: .35 });
      P.stars({ x: wx, y: wy, w: ww, h: wh * .7 }, 40, ['#fff7d6', '#ffffff', '#c9d7ff']);
      P.circle(1550, 400, 46, '#fff2c0'); P.circle(1570, 388, 44, '#152650');
      P.fill([[wx - 10, 700], [1350, 640], [1460, 680], [1560, 620], [wx + ww + 10, 670], [wx + ww + 10, wy + wh + 10], [wx - 10, wy + wh + 10]], '#0c1938', { streaks: false });
    });
    g.save(); g.strokeStyle = '#d9cbb0'; g.lineWidth = 10;
    g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.moveTo(wx, wy + 330); g.lineTo(wx + ww, wy + 330); g.moveTo(wx, wy + ww / 2); g.lineTo(wx + ww, wy + ww / 2); g.stroke(); g.restore();

    // table, lamp, book, cup, cat
    P.glow(1330, 700, 520, '#ffd77a', .38);
    P.box(1100, 800, 800, 30, '#8a5232', { streaks: false });
    P.rect(1140, 830, 24, 190, '#6a3a22'); P.rect(1836, 830, 24, 190, '#6a3a22');
    P.rect(1316, 690, 12, 110, '#c9a24a'); P.ell(1322, 800, 46, 10, 0, '#c9a24a');
    g.fillStyle = '#2f7d4f'; g.beginPath(); g.moveTo(1230, 700); g.quadraticCurveTo(1322, 610, 1414, 700); g.closePath(); g.fill();
    P.rect(1236, 692, 172, 10, '#256640');
    P.ell(1322, 706, 70, 8, 0, '#fff0b5');
    P.poly([[1470, 796], [1600, 770], [1606, 796]], '#f7efdc'); P.poly([[1606, 796], [1612, 770], [1742, 796]], '#efe4cc');
    for (let i = 0; i < 4; i++) { P.line([[1500 + i * 3, 788 - i * 5], [1590, 778 - i * 5]], '#9f927f', 2); P.line([[1624, 778 - i * 5], [1712, 788 - i * 5]], '#9f927f', 2); }
    P.rect(1190, 752, 50, 48, '#e8e0cf'); P.ell(1215, 752, 25, 6, 0, '#6b3e22');
    g.save(); g.strokeStyle = '#e8e0cf'; g.lineWidth = 7; g.beginPath(); g.arc(1244, 774, 14, -1.2, 1.2); g.stroke(); g.restore();
    // cat curled up at the end of the table
    P.ell(1800, 770, 70, 34, 0, '#e39a4b');
    P.circle(1752, 760, 26, '#e39a4b');
    P.poly([[1736, 744], [1740, 718], [1754, 738]], '#e39a4b'); P.poly([[1756, 738], [1766, 716], [1772, 742]], '#e39a4b');
    for (let i = 0; i < 4; i++) P.line([[1790 + i * 16, 742], [1796 + i * 16, 760]], '#b86a2a', 5);
    P.line([[1744, 762], [1756, 764]], INK, 3); P.line([[1760, 764], [1770, 760]], INK, 3);
    P.taper([[1868, 780], [1880, 800], [1840, 806], [1790, 800]], '#e39a4b', 18, 12);
    P.glow(1322, 740, 260, '#ffe9a8', .25);
  }

  // ==========================================================================
  // Spread 3 — the northern lights over a cabin
  // ==========================================================================
  function drawAurora(g, r) {
    const P = painter(g, r), nz = makeNoise(r);
    P.box(0, 0, 2000, 1250, '#172650', { angle: -.05, light: .08, alpha: .35 });
    P.stars({ x: 60, y: 150, w: 1880, h: 520 }, 170, ['#ffffff', '#fff5d0', '#cfe0ff']);
    for (let i = 0; i < 9; i++) P.sparkle(r.range(100, 1900), r.range(170, 560), r.range(8, 16), '#fff8dc');
    // curtains: vertical marker rays hanging from a slow wave
    const base = x => 520 + Math.sin(x * .0032 + .6) * 90 + fbm(nz, x * .004) * 40;
    g.save(); g.lineCap = 'round';
    for (let i = 0; i < 520; i++) {
      const x = r.range(40, 1960), y0 = base(x), len = r.range(120, 330) * (0.6 + .4 * Math.sin(x * .004) ** 2);
      g.strokeStyle = r.chance(.12) ? '#e690c4' : r.pick(['#6fe3a4', '#54d09a', '#9ff0c2', '#3fbf8f']);
      g.globalAlpha = r.range(.08, .3); g.lineWidth = r.range(5, 14);
      g.beginPath(); g.moveTo(x, y0 + r.range(-10, 20)); g.lineTo(x + r.range(-10, 10), y0 - len); g.stroke();
    }
    g.restore();
    P.wisp(edge(40, 1960, 120, x => base(x) + 8), '#b4f7d0', 10, { alpha: .75 });
    P.wisp(edge(200, 1700, 150, x => base(x) - 150), '#e690c4', 6, { alpha: .35 });

    const far = edge(-20, 2020, 24, x => 740 - Math.abs(Math.sin(x * .0036 + 1)) * 160 + fbm(nz, x * .012) * 26);
    P.fill([...far, [2020, 1250], [-20, 1250]], '#2d3f74', { angle: .7, alpha: .3 });
    for (let i = 1; i < far.length - 1; i++) {
      const [x, y] = far[i];
      if (y < far[i - 1][1] && y < far[i + 1][1] && y < 660) P.poly([[x, y], [x + 46, y + 38], [x + 16, y + 30], [x - 10, y + 44], [x - 40, y + 34]], '#dfe8f7');
    }
    // snow with a green reflection
    const snow = edge(-20, 2020, 30, x => 820 + Math.sin(x * .002) * 26 + fbm(nz, x * .01 + 30) * 10);
    const sp = P.fill([...snow, [2020, 1250], [-20, 1250]], '#e6eef9', { angle: .02, light: .1, dark: .08, alpha: .4 });
    P.clip(sp, () => { const gr = g.createLinearGradient(0, 800, 0, 960); gr.addColorStop(0, 'rgba(111,227,164,.22)'); gr.addColorStop(1, 'rgba(111,227,164,0)'); g.fillStyle = gr; g.fillRect(0, 780, 2000, 180); });
    const trees = [[120, 880, 300], [220, 900, 360], [330, 870, 260], [700, 850, 200], [790, 860, 240], [1200, 840, 180], [1860, 900, 340], [1760, 880, 250]];
    for (const [x, b, h] of trees) pine(P, x, b, h, ['#16363b', '#1f4a4b', '#133034'], '#e6eef9');
    // cabin
    P.box(1400, 800, 240, 150, '#8a4e32', { angle: 0, alpha: .4 });
    for (let y = 820; y < 950; y += 22) P.line([[1400, y], [1640, y]], '#6d3a24', 3);
    P.poly([[1370, 812], [1520, 700], [1670, 812]], '#5a2e20');
    P.fill([[1360, 812], [1420, 760], [1520, 690], [1620, 760], [1680, 812], [1640, 800], [1520, 720], [1400, 800]], '#f4f8ff', { streaks: false });
    P.rect(1580, 690, 30, 70, '#6d3a24'); P.rect(1574, 684, 42, 12, '#f4f8ff');
    P.wisp([[1596, 680], [1570, 620], [1620, 560], [1580, 480]], '#c9d4ea', 14, { alpha: .6 });
    P.glow(1470, 870, 130, '#ffd46b', .5);
    P.rect(1440, 840, 60, 56, '#ffd46b'); P.line([[1470, 840], [1470, 896]], '#8a4e32', 5); P.line([[1440, 868], [1500, 868]], '#8a4e32', 5);
    P.rect(1560, 860, 48, 90, '#4a2a1c');
    for (let i = 0; i < 14; i++) P.ell(1540 - i * 42 + r.range(-6, 6), 980 + i * 6 + (i % 2) * 14, 8, 5, 0, '#c4d2e8');
  }

  // ==========================================================================
  // Spread 4 — a kitchen at six, the bread still rising
  // ==========================================================================
  function drawBread(g, r) {
    const P = painter(g, r);
    P.box(0, 0, 2000, 1250, '#f2d58e', { angle: 1.5, light: .14, alpha: .3 });
    // tiles
    P.box(0, 600, 2000, 170, '#f6f1e4', { streaks: false });
    g.save(); g.strokeStyle = '#8fb6c9'; g.lineWidth = 2.5; g.globalAlpha = .7;
    for (let x = 0; x < 2000; x += 56) { g.beginPath(); g.moveTo(x, 600); g.lineTo(x, 770); g.stroke(); }
    for (let y = 600; y < 770; y += 56) { g.beginPath(); g.moveTo(0, y); g.lineTo(2000, y); g.stroke(); }
    g.restore();
    // window: dawn
    const W0 = 170, W1 = 760, T0 = 210, T1 = 590;
    const bands = ['#f7b3a4', '#f9c79a', '#fbe0a6', '#fdf0c8'];
    bands.forEach((c, i) => P.box(W0, T0 + i * 80, W1 - W0, 110, c, { angle: 0, alpha: .3 }));
    P.circle(520, 560, 70, '#fff3c4');
    P.fill([[W0, 540], [300, 500], [440, 530], [600, 480], [W1, 520], [W1, T1], [W0, T1]], '#b98aa8', { streaks: false });
    P.fill([[W0, 570], [360, 550], [520, 572], [W1, 548], [W1, T1], [W0, T1]], '#8d6a93', { streaks: false });
    g.save(); g.strokeStyle = '#fbf8f0'; g.lineWidth = 26; g.strokeRect(W0, T0, W1 - W0, T1 - T0);
    g.lineWidth = 12; g.beginPath(); g.moveTo((W0 + W1) / 2, T0); g.lineTo((W0 + W1) / 2, T1); g.moveTo(W0, (T0 + T1) / 2); g.lineTo(W1, (T0 + T1) / 2); g.stroke(); g.restore();
    P.rect(W0 - 30, T1 + 8, W1 - W0 + 60, 20, '#fbf8f0');
    P.fill([[240, T1 + 8], [216, T1 - 40], [260, T1 - 80], [300, T1 - 40], [276, T1 + 8]], '#d2694a', { streaks: false });
    for (let k = 0; k < 5; k++) P.leaf(258, T1 - 80, 60, 14, -Math.PI / 2 + (k - 2) * .45, '#5c9a48');
    // light from the window across the counter
    g.save(); g.globalAlpha = .16; P.poly([[W0, T1], [W1, T1], [1500, 800], [700, 800]], '#fff7d0'); g.restore();

    // clock at six

  // ==========================================================================

  function drawOctopus(g, r) {
    const P = painter(g, r);

    P.box(0, 0, 2000, 380, '#3fa3b5', { angle: 0, light: .2, alpha: .35, opacity: .7 });

    for (const x of [300, 700, 1150, 1600]) P.poly([[x - 40, 140], [x + 40, 140], [x + 260, 1100], [x - 120, 1100]], '#ffffff');
    g.restore();
    const kelp = (x, top, col, back) => {
      const pts = []; for (let y = 1090; y >= top; y -= 60) pts.push([x + Math.sin(y * .01 + x) * 30, y]);
      P.taper(pts, col, back ? 10 : 14, back ? 6 : 8);
      for (let i = 1; i < pts.length; i++) P.leaf(pts[i][0], pts[i][1], r.range(70, 130), r.range(16, 26), (i % 2 ? -1 : 1) * r.range(.5, 1) - Math.PI / 2 + (i % 2 ? -.8 : .8), col);
      P.circle(pts[pts.length - 1][0], pts[pts.length - 1][1], 12, lighten(col, .2));
    };
    for (const x of [180, 520, 860, 1500, 1840]) kelp(x, r.range(200, 320), '#4f6a3a', true);
    P.box(0, 960, 2000, 290, '#dcc79a', { angle: 0, alpha: .35 });
    for (let i = 0; i < 16; i++) P.fill(P.blob(r.range(80, 1920), r.range(980, 1070), r.range(30, 70), r.range(18, 36)), r.pick(['#8a7f74', '#6f675f', '#a39684']), { streaks: false });
    for (const x of [320, 700, 1040, 1720]) kelp(x, r.range(170, 260), r.pick(['#8c8f33', '#a8913a', '#6f7a2c']), false);
    // fish
    for (let i = 0; i < 14; i++) {
      const x = 300 + (i % 5) * 70 + r.range(-20, 20), y = 360 + Math.floor(i / 5) * 50 + r.range(-12, 12);
      P.ell(x, y, 24, 9, 0, '#dfe8ee'); P.poly([[x - 22, y], [x - 38, y - 10], [x - 38, y + 10]], '#dfe8ee'); P.circle(x + 14, y - 2, 2.5, INK);
    }
    // the octopus
    const ox = 1330, oy = 600, body = '#e0673f', light = '#f6c3a8';
    const arms = [[-2.6, 1.0], [-2.2, .8], [-1.6, 1.1], [-.9, .9], [-.4, 1.0], [.2, 1.1], [.9, .8], [1.4, 1.0]];
    arms.forEach(([dir, len], i) => {
      const pts = [[ox, oy + 110]];
      let a = Math.PI / 2 + dir * .55, x = ox + Math.cos(a) * 40, y = oy + 110 + Math.sin(a) * 40, curl = (i % 2 ? 1 : -1) * .5;
      for (let s = 0; s < 7; s++) { a += curl * (s > 3 ? 1.4 : .5); x += Math.cos(a) * 60 * len; y += Math.sin(a) * 60 * len; pts.push([x, y]); }

      if (i === 6) {

        g.restore();

    P.fill(P.blob(ox, oy, 120, 150, .05, 18, -.15), body, { angle: 1.2, light: .2, alpha: .4 });
    for (let i = 0; i < 26; i++) P.circle(ox + r.range(-80, 80), oy + r.range(-120, 40), r.range(4, 10), rgba('#f59a74', .8));

    for (let i = 0; i < 12; i++) { const x = ox + 60 + r.range(-20, 40), y = oy - 180 - i * 34; g.save(); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3; g.beginPath(); g.arc(x + Math.sin(i) * 12, y, r.range(6, 14), 0, TAU); g.stroke(); g.restore(); }
