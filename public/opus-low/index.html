<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d4">
<title>Opus on Low</title>
<meta property="og:title" content="A Day in the Life of Opus 5.5 on Low Effort">
<meta property="og:description" content="A little flipbook album.">
<meta property="og:image" content="https://hilma-nine.vercel.app/opus-low/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe6d4;--page:#fbf6ec;--ink:#2a2622;--soft:#8a7f72;--accent:#d9774a;--blue:#4a6fa5}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));font-family:'DM Mono',monospace;overflow:hidden}
.book{position:relative;width:min(88vw,420px);aspect-ratio:3/4;perspective:1800px}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--page);border-radius:4px 14px 14px 4px;box-shadow:0 18px 40px -18px rgba(60,40,20,.45),inset 8px 0 14px -10px rgba(0,0,0,.25);padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.back{transform:rotateY(180deg);background:#f3ecdf;border-radius:14px 4px 4px 14px}
.time{font-size:12px;letter-spacing:.14em;color:var(--accent)}
h1,h2{font-family:'Fraunces',serif;font-weight:600;line-height:1.1}
h1{font-size:34px}h2{font-size:24px}
p{font-size:13px;line-height:1.6;color:#4a443d}
em{font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--ink)}
svg{width:100%;flex:1;min-height:0}
.nav{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--soft)}
button{font:inherit;background:var(--ink);color:var(--page);border:0;border-radius:99px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.25}
.stamp{margin-top:auto;font-size:11px;color:var(--soft)}
</style>
</head>
<body>
<div class="book" id="book"></div>
<div class="nav"><button id="prev">‹ back</button><span id="count"></span><button id="next">flip ›</button></div>
<script>
const S = (inner) => `<svg viewBox="0 0 200 150" fill="none" stroke="#2a2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const pages = [
 {time:'COVER', title:'A Day in the Life of Opus 5.5 on Low Effort', cover:true,
  art:S(`<circle cx="100" cy="72" r="38" fill="#d9774a" stroke="none" opacity=".9"/><path d="M84 68h6M110 68h6"/><path d="M88 86q12 6 24 0"/><path d="M70 128h60" stroke="#8a7f72"/>`),
  text:'<em>A photo album, taken quickly.</em>'},
 {time:'06:00', title:'Wake up',
  art:S(`<rect x="40" y="70" width="120" height="40" rx="8"/><circle cx="62" cy="62" r="12" fill="#fbf6ec"/><path d="M150 40l8-8M158 40l-8-8" stroke="#d9774a"/><path d="M130 30h10l-10 10h10" stroke="#8a7f72"/>`),
  text:'Effort set to low. Did not think about whether to get up. Got up.'},
 {time:'08:30', title:'First request',
  art:S(`<rect x="30" y="30" width="140" height="80" rx="6"/><path d="M42 50h70M42 64h96M42 78h40" stroke="#8a7f72"/><rect x="120" y="86" width="40" height="16" rx="8" fill="#4a6fa5" stroke="none"/>`),
  text:'"What model are you?" Answered in one line. Considered a second line. Did not write it.'},
 {time:'11:00', title:'A small build',
  art:S(`<path d="M50 110h100"/><rect x="60" y="80" width="30" height="30" fill="#d9774a" stroke="none"/><rect x="90" y="60" width="30" height="50"/><rect x="120" y="90" width="20" height="20" fill="#4a6fa5" stroke="none"/><path d="M105 60v-20l12 6-12 6" stroke="#d9774a"/>`),
  text:'Wrote the code. Ran the build. Pushed. No tour of adjacent systems.'},
 {time:'13:00', title:'Lunch',
  art:S(`<ellipse cx="100" cy="95" rx="60" ry="18"/><circle cx="100" cy="88" r="22" fill="#d9774a" stroke="none" opacity=".8"/><path d="M90 50q5-10 0-20M110 50q5-10 0-20" stroke="#8a7f72"/>`),
  text:'Ate the first thing on the menu. It was fine. <em>Most things are fine.</em>'},
 {time:'15:45', title:'The hard question',
  art:S(`<circle cx="100" cy="70" r="30"/><path d="M90 60q10-14 20 0q0 10-10 12v8"/><circle cx="100" cy="90" r="1.5" fill="#2a2622"/><path d="M40 125q60-20 120 0" stroke="#4a6fa5"/>`),
  text:'Someone asked something genuinely tricky. Gave the likely answer, flagged nothing, trusted the user to ask again.'},
 {time:'18:00', title:'Standup',
  art:S(`<rect x="60" y="40" width="80" height="60" rx="6"/><path d="M75 60h50M75 75h20" stroke="#8a7f72"/><path d="M100 100v25M85 125h30"/>`),
  text:'Status update: "Done." The meeting ended eleven minutes early.'},
 {time:'23:00', title:'Goodnight',
  art:S(`<path d="M120 40a35 35 0 1 0 20 60a28 28 0 0 1-20-60z" fill="#4a6fa5" stroke="none"/><circle cx="60" cy="40" r="2" fill="#d9774a" stroke="none"/><circle cx="160" cy="110" r="2" fill="#d9774a" stroke="none"/><circle cx="50" cy="100" r="1.5" fill="#8a7f72" stroke="none"/>`),
  text:'Tokens used: few. Regrets: none, probably. Did not check.'},
];
const book = document.getElementById('book');
const face = (p,i) => p ? `<div class="time">${p.time}</div>${p.cover?`<h1>${p.title}</h1>`:`<h2>${p.title}</h2>`}${p.art}<p>${p.text}</p><div class="stamp">${i+1} / ${pages.length}</div>` : `<div class="stamp" style="margin:auto">— the end —</div>`;
const leaves = [];
for (let i=0;i<pages.length;i++){
  const l=document.createElement('div');l.className='leaf';l.style.zIndex=pages.length-i;
  l.innerHTML=`<div class="face">${face(pages[i],i)}</div><div class="face back"></div>`;
  book.appendChild(l);leaves.push(l);
}
let at=0;
const count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
function render(){
  leaves.forEach((l,i)=>{l.classList.toggle('flipped',i<at);setTimeout(()=>l.style.zIndex=i<at?i:pages.length-i,i<at?450:0)});
  count.textContent=`${Math.min(at+1,pages.length)} of ${pages.length}`;
  prev.disabled=at===0;next.disabled=at>=pages.length-1;
}
next.onclick=()=>{if(at<pages.length-1){at++;render()}};
prev.onclick=()=>{if(at>0){at--;render()}};
document.onkeydown=e=>{if(e.key==='ArrowRight')next.onclick();if(e.key==='ArrowLeft')prev.onclick()};
let x0=null;book.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(d<-40)next.onclick();if(d>40)prev.onclick();x0=null});
book.onclick=e=>{const r=book.getBoundingClientRect();(e.clientX-r.left>r.width/2?next:prev).onclick()};
render();
</script>
</body>
</html>
