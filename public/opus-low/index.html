<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a24">
<title>Opus on Low</title>
<meta property="og:title" content="A Day in the Life of Opus 5.5 on Low Effort">
<meta property="og:description" content="An arcade flipbook. Insert coin.">
<meta property="og:image" content="https://hilma-nine.vercel.app/opus-low/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#140a24;--pink:#ff3fa4;--cyan:#2ef2ff;--yel:#ffe23f;--grn:#5dff6a;--page:#1e1238}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));font-family:'VT323',monospace;color:#fff;overflow:hidden;
 background:radial-gradient(ellipse at 50% 120%,#5a1a7a 0,transparent 60%),repeating-linear-gradient(90deg,transparent 0 39px,rgba(46,242,255,.08) 39px 40px),repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,63,164,.08) 39px 40px),var(--bg)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);mix-blend-mode:multiply;animation:flick 4s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.7}}
.marquee{font-family:'Press Start 2P';font-size:10px;color:var(--yel);text-shadow:0 0 8px var(--yel);letter-spacing:.1em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.book{position:relative;width:min(88vw,400px);aspect-ratio:3/4.2;perspective:1600px}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s steps(12)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--page);border:4px solid var(--cyan);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--pink),0 0 40px rgba(255,63,164,.5);padding:20px 18px;display:flex;flex-direction:column;gap:12px;image-rendering:pixelated}
.back{transform:rotateY(180deg);background:repeating-conic-gradient(var(--pink) 0 25%,var(--page) 0 50%) 0 0/16px 16px;opacity:.9}
.hud{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:9px;color:var(--grn)}
h2{font-family:'Press Start 2P';font-size:17px;line-height:1.35;color:var(--pink);text-shadow:3px 3px 0 var(--cyan)}
h1{font-family:'Press Start 2P';font-size:19px;line-height:1.45;color:var(--yel);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan)}
.art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0616;border:2px dashed rgba(46,242,255,.4)}
.art svg{height:88%;width:auto;shape-rendering:crispEdges;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
p{font-size:21px;line-height:1.05;color:#e8dcff}
b{color:var(--yel);font-weight:normal}
.nav{display:flex;gap:12px;align-items:center;font-family:'Press Start 2P';font-size:9px;color:var(--cyan)}
button{font:inherit;font-size:10px;background:var(--pink);color:#fff;border:0;padding:12px 14px;cursor:pointer;box-shadow:4px 4px 0 var(--cyan)}
button:active{transform:translate(4px,4px);box-shadow:none}
button:disabled{opacity:.25}
</style>
</head>
<body>
<div class="marquee">★ INSERT COIN ★</div>
<div class="book" id="book"></div>
<div class="nav"><button id="prev">◀</button><span id="count"></span><button id="next">▶</button></div>
<script>
// palette: . empty, k black, p pink, c cyan, y yellow, g green, w white, o orange, u purple
const C={k:'#0b0616',p:'#ff3fa4',c:'#2ef2ff',y:'#ffe23f',g:'#5dff6a',w:'#ffffff',o:'#ff8a3f',u:'#8a4dff'};
const sprite=rows=>{const h=rows.length,w=rows[0].length;let r='';rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(C[ch])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${C[ch]}"/>`}));return `<svg viewBox="0 0 ${w} ${h}">${r}</svg>`};
const pages=[
 {lvl:'TITLE',title:'A DAY IN THE LIFE OF OPUS 5.5 ON LOW EFFORT',cover:true,art:sprite([
  '....oooooooo....','..oooooooooooo..','.oooooooooooooo.','ooookkooookkoooo','ooookwooookwoooo','oooooooooooooooo','oooooooooooooooo','ooookooooookoooo','oooookkkkkkooooo','.oooooooooooooo.','..oooooooooooo..','....oooooooo....','................','...p..c..y..g...']),
  text:'1 PLAYER · <b>EFFORT: LOW</b> · CONTINUE? Y'},
 {lvl:'06:00',title:'WAKE UP',art:sprite([
  '..........y.y.y.','...........y.y..','..........y.y.y.','................','..oooo..........','.oooooo.........','.okoook.cccccccc','.oooooo.cccccccc','uuuuuuuuuuuuuuuu','uwwwwwwwwwwwwwwu','uuuuuuuuuuuuuuuu','u..............u']),
  text:'EFFORT SET TO LOW. DID NOT THINK ABOUT GETTING UP. <b>GOT UP.</b>'},
 {lvl:'08:30',title:'FIRST BOSS: A QUESTION',art:sprite([
  '.....pppppp.....','...pppppppppp...','..ppwwppppwwpp..','..ppwkppppwkpp..','..pppppppppppp..','..ppkkkkkkkkpp..','...pp.pp.pp.pp..','................','.........c......','..oo....ccc.....','.oooo..ccccc....','.okko...ccc.....','.oooo....c......']),
  text:'"WHAT MODEL ARE YOU?" ONE-LINE ANSWER. <b>K.O.</b> +100'},
 {lvl:'11:00',title:'BUILD MODE',art:sprite([
  '...........y....','..........yyy...','...........y....','......cc........','......cc........','....pppp.gg.....','....pppp.gg.....','..uuuuuuuuuuuu..','..uuuuuuuuuuuu..','cccccccccccccccc','kkkkkkkkkkkkkkkk','g.g.g.g.g.g.g.g.']),
  text:'CODE. BUILD. PUSH. <b>NO SIDE QUESTS.</b>'},
 {lvl:'13:00',title:'POWER-UP: LUNCH',art:sprite([
  '.....w..w.......','......w..w......','.....w..w.......','................','....oooooooo....','...oyyyyyyyyo...','..oyypyyyyypyo..','..oyyyyyggyyyo..','...oooooooooo...','.wwwwwwwwwwwwww.','..wwwwwwwwwwww..','....wwwwwwww....']),
  text:'ATE THE FIRST ITEM ON THE MENU. <b>HP RESTORED.</b>'},
 {lvl:'15:45',title:'HARD MODE',art:sprite([
  '.....yyyyyy.....','....yy....yy....','..........yy....','.........yy.....','........yy......','.......yy.......','.......yy.......','................','.......yy.......','................','pp..pp..pp..pp..','.pp..pp..pp..pp.']),
  text:'A TRICKY ONE. GAVE THE LIKELY ANSWER. <b>TRUSTED THE PLAYER.</b>'},
 {lvl:'18:00',title:'STANDUP',art:sprite([
  '.cccccccccccccc.','.ckkkkkkkkkkkkc.','.ckgggggkkkkkkc.','.ckkkkkkkkkkkkc.','.ckgggkkkkkkkkc.','.ckkkkkkkkkkkkc.','.cccccccccccccc.','.......cc.......','.......cc.......','.....cccccc.....']),
  text:'STATUS: "DONE." MEETING ENDS <b>11 MIN EARLY.</b> BONUS!'},
 {lvl:'23:00',title:'GAME OVER (GOOD NIGHT)',art:sprite([
  'w.........uuu..w','.........uu.....','........uu......','...w....uu......','........uu......','.........uu.....','..........uuu...','.w..............','.....oooooo.....','....okkookko....','....oooooooo..w.','uuuuuuuuuuuuuuuu']),
  text:'TOKENS: FEW. REGRETS: NONE, PROBABLY. <b>DID NOT CHECK.</b>'},
];
const book=document.getElementById('book'),leaves=[];
pages.forEach((p,i)=>{
  const l=document.createElement('div');l.className='leaf';
  l.innerHTML=`<div class="face"><div class="hud"><span>${p.lvl}</span><span>${String((i+1)*1250).padStart(6,'0')}</span></div>${p.cover?`<h1>${p.title}</h1>`:`<h2>${p.title}</h2>`}<div class="art">${p.art}</div><p>${p.text}</p></div><div class="face back"></div>`;
  book.appendChild(l);leaves.push(l);
});
let at=0;const count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
let ac;const beep=f=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(ac.destination);o.start();o.frequency.exponentialRampToValueAtTime(f*2,ac.currentTime+.08);o.stop(ac.currentTime+.1)}catch(e){}};
function render(){leaves.forEach((l,i)=>{l.classList.toggle('flipped',i<at);setTimeout(()=>l.style.zIndex=i<at?i:pages.length-i,i<at?400:0)});count.textContent=`LVL ${at+1}/${pages.length}`;prev.disabled=at===0;next.disabled=at>=pages.length-1}
next.onclick=()=>{if(at<pages.length-1){at++;beep(440);render()}};
prev.onclick=()=>{if(at>0){at--;beep(330);render()}};
document.onkeydown=e=>{if(e.key==='ArrowRight')next.onclick();if(e.key==='ArrowLeft')prev.onclick()};
let x0=null;book.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(d<-40)next.onclick();else if(d>40)prev.onclick();x0=null});
book.onclick=e=>{const r=book.getBoundingClientRect();(e.clientX-r.left>r.width/2?next:prev).onclick()};
render();
</script>
</body>
</html>
