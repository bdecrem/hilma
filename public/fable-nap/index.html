<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecdc">
<title>Fable Naptime</title>
<meta property="og:title" content="Fable 5.5 on Low, Getting Ready for a Nap">
<meta property="og:image" content="https://hilma-nine.vercel.app/fable-nap/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow:hidden;color:#2b2320;
 background:radial-gradient(circle at 30% 20%,#fbf5e8,#f4ecdc 55%,#e9dcc4)}
h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(20px,5vw,28px);text-align:center}
.cap{font-family:'Caveat',cursive;font-size:24px;color:#b4543a;height:30px;transition:opacity .6s}
svg{width:min(92vw,520px);height:auto;overflow:visible}
.ink{fill:none;stroke:#2b2320;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,2.4s) var(--t,0s) cubic-bezier(.6,0,.3,1) forwards}
.wash{opacity:0;animation:wash 2s var(--t) ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wash{to{opacity:1}}
.breathe{transform-origin:200px 215px;animation:br 4.5s 13s ease-in-out infinite}
@keyframes br{50%{transform:scaleY(1.035)}}
.z{font-family:'Caveat';font-size:26px;fill:#b4543a;opacity:0;animation:z 5s ease-in-out infinite}
@keyframes z{0%{opacity:0;transform:translate(0,0) rotate(0)}25%{opacity:.9}100%{opacity:0;transform:translate(30px,-70px) rotate(18deg)}}
.moon{animation:sway 9s ease-in-out infinite;transform-origin:320px 20px}
@keyframes sway{50%{transform:rotate(3deg)}}
.awake{animation:gone 1.2s 9.8s ease forwards}@keyframes gone{to{opacity:0;transform:translateY(40px)}}
.again{font-family:'Caveat';font-size:18px;color:#8a7c6c;background:none;border:0;cursor:pointer;text-decoration:underline;opacity:0;animation:wash 1s 16s forwards}
</style>
</head>
<body>
<h1>Fable 5.5, on low, getting ready for a nap</h1>
<svg viewBox="0 0 400 300" id="art">
  <defs><filter id="w"><feTurbulence baseFrequency=".04" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter></defs>
  <!-- watercolor washes -->
  <ellipse class="wash" style="--t:1s" cx="320" cy="78" rx="46" ry="42" fill="#f2c97a" opacity=".5" filter="url(#w)"/>
  <path class="wash" style="--t:6s" d="M70 210 Q200 180 340 205 L345 250 Q200 262 65 250Z" fill="#9fb8d6" filter="url(#w)" opacity=".55"/>
  <ellipse class="wash" style="--t:9s" cx="120" cy="196" rx="30" ry="16" fill="#e8a38c" filter="url(#w)"/>
  <!-- hanging moon -->
  <g class="moon">
    <path class="ink" pathLength="1" style="--t:.3s;--d:1s" d="M320 0 V40"/>
    <path class="ink" pathLength="1" style="--t:1s;--d:2.2s" d="M338 58 a34 34 0 1 0 6 44 a26 26 0 1 1 -6 -44z"/>
    <path class="ink" pathLength="1" style="--t:2.6s;--d:1s" d="M300 78 q4 3 8 0"/>
  </g>
  <!-- stars -->
  <path class="ink" pathLength="1" style="--t:2s;--d:.8s" d="M60 50 l4 10 l-10 -6 h12 l-10 6z"/>
  <path class="ink" pathLength="1" style="--t:2.4s;--d:.8s" d="M180 30 v10 M175 35 h10"/>
  <!-- Fable: one looping line, stretching, yawning -->
  <g class="awake">
  <path class="ink" pathLength="1" style="--t:3.2s;--d:3.2s" d="M100 170 c-10 -30 10 -60 38 -52 c20 6 24 30 12 44 c-6 8 -18 10 -26 6 M138 118 c4 -20 -14 -38 -6 -52 c6 -10 18 0 10 12 M112 124 c-14 -16 -30 -30 -24 -44 c4 -9 16 -2 12 8"/>
  <path class="ink" pathLength="1" style="--t:6s;--d:.9s" d="M114 140 q5 -4 10 0 M132 138 q5 -4 10 0"/>
  <path class="ink" pathLength="1" style="--t:6.8s;--d:.8s" d="M124 154 a5 6 0 1 0 0.1 0"/>
  </g>
  <!-- bed -->
  <g class="breathe">
    <path class="ink" pathLength="1" style="--t:4.5s;--d:3s" d="M60 250 V190 q0 -14 14 -14 q12 0 14 14 V206 H320 V180 q0 -12 12 -12 q12 0 12 12 V250 M60 230 H344"/>
    <path class="ink" pathLength="1" style="--t:7.5s;--d:2.2s" d="M92 210 c10 -18 44 -20 56 -6 M160 208 q80 -22 168 0 q-14 20 -30 22 q-110 10 -150 -4 q-10 -8 12 -18"/>
    <path class="ink" pathLength="1" style="--t:9.5s;--d:1.6s" d="M190 220 q10 -8 20 0 q10 8 20 0 q10 -8 20 0 q10 8 20 0"/>
  </g>
  <!-- the wisp, now asleep on the pillow -->
  <path class="ink" pathLength="1" style="--t:10.5s;--d:1.8s" d="M104 196 c0 -16 20 -22 32 -12 c6 6 2 16 -6 14 M112 194 q4 3 8 0 M124 193 q4 3 8 0"/>
  <text class="z" x="150" y="170" style="animation-delay:12s">z</text>
  <text class="z" x="160" y="160" style="animation-delay:13.6s;font-size:32px">Z</text>
  <text class="z" x="145" y="165" style="animation-delay:15.2s;font-size:20px">z</text>
</svg>
<div class="cap" id="cap"></div>
<button class="again" onclick="location.reload()">again</button>
<script>
const lines=[[0,'first, a moon.'],[3.2,'a small stretch…'],[6,'a yawn, low effort.'],[7.5,'one blanket, no planning.'],[10.5,'and down.'],[12.5,'z z z']];
const cap=document.getElementById('cap'),t0=performance.now();let last='';
(function tick(){const t=(performance.now()-t0)/1000;let s='';for(const[a,l]of lines)if(t>=a)s=l;if(s!==last){last=s;cap.textContent=s}requestAnimationFrame(tick)})();
</script>
</body>
</html>
