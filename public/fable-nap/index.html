<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a24">
<title>Fable Naptime</title>
<meta property="og:title" content="Fable 5.5 on Low, Getting Ready for a Nap">
<meta property="og:image" content="https://hilma-nine.vercel.app/fable-nap/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#140a24}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;font-family:'Press Start 2P';color:#fff;overflow:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px)}
h1{font-size:13px;line-height:1.6;text-align:center;color:#ffe23f;text-shadow:3px 3px 0 #ff3fa4}
.cap{font-size:10px;color:#2ef2ff;height:14px}
.stage{width:min(90vw,420px);aspect-ratio:1;border:4px solid #2ef2ff;box-shadow:0 0 0 4px #140a24,0 0 0 8px #ff3fa4,0 0 40px rgba(255,63,164,.5);position:relative;background:#241650;overflow:hidden}
.dim{position:absolute;inset:0;background:#05020c;opacity:0;animation:dim 12s steps(6) infinite;z-index:5;pointer-events:none}
@keyframes dim{0%,55%{opacity:0}70%,95%{opacity:.72}100%{opacity:0}}
svg{position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
.fable{animation:walk 12s steps(24) infinite}
@keyframes walk{0%{transform:translate(-30px,0)}20%{transform:translate(8px,0)}25%{transform:translate(8px,-6px)}35%,45%{transform:translate(8px,0)}55%,100%{transform:translate(8px,6px) }}
.eyes-open{animation:eo 12s steps(1) infinite}.eyes-shut{animation:es 12s steps(1) infinite}
@keyframes eo{0%,26%{opacity:1}27%,29%{opacity:0}30%,52%{opacity:1}53%,100%{opacity:0}}
@keyframes es{0%,26%{opacity:0}27%,29%{opacity:1}30%,52%{opacity:0}53%,100%{opacity:1}}
.yawn{animation:yawn 12s steps(1) infinite}@keyframes yawn{0%,24%{opacity:0}25%,32%{opacity:1}33%,100%{opacity:0}}
.blanket{animation:blank 12s steps(8) infinite}@keyframes blank{0%,45%{transform:translateY(-60px);opacity:0}46%{opacity:1}55%,97%{transform:translateY(0);opacity:1}100%{opacity:0}}
.z{fill:#ffe23f;opacity:0;animation:z 3s steps(6) infinite}
.z2{animation-delay:1s}.z3{animation-delay:2s}
.zs{animation:zs 12s steps(1) infinite}@keyframes zs{0%,58%{opacity:0}59%,96%{opacity:1}97%{opacity:0}}
@keyframes z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-40px)}}
.lamp{animation:lamp 12s steps(1) infinite}@keyframes lamp{0%,55%{fill:#ffe23f}56%,100%{fill:#5a4a20}}
.star{animation:tw 1.6s steps(2) infinite}
</style>
</head>
<body>
<h1>FABLE 5.5 ON LOW<br>NAPTIME.EXE</h1>
<div class="stage">
<svg viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="44" fill="#241650"/>
  <rect x="0" y="44" width="64" height="20" fill="#3a2270"/>
  <rect x="6" y="6" width="16" height="12" fill="#0b0616"/><rect x="6" y="6" width="16" height="12" fill="none" stroke="#2ef2ff" stroke-width="1"/>
  <rect class="star" x="10" y="9" width="1" height="1" fill="#fff"/><rect class="star" x="17" y="13" width="1" height="1" fill="#fff" style="animation-delay:.8s"/>
  <rect x="16" y="8" width="3" height="3" fill="#ffe23f"/><rect x="17" y="8" width="2" height="2" fill="#0b0616"/>
  <rect x="52" y="22" width="2" height="22" fill="#8a4dff"/><rect class="lamp" x="48" y="16" width="10" height="6"/>
  <rect x="26" y="40" width="32" height="6" fill="#8a4dff"/><rect x="26" y="46" width="2" height="4" fill="#8a4dff"/><rect x="56" y="46" width="2" height="4" fill="#8a4dff"/>
  <rect x="26" y="38" width="32" height="3" fill="#fff"/><rect x="48" y="35" width="9" height="4" fill="#ffffff"/>
  <g class="fable">
    <rect x="34" y="28" width="12" height="10" fill="#5dff6a"/><rect x="33" y="30" width="14" height="6" fill="#5dff6a"/>
    <rect x="35" y="26" width="2" height="2" fill="#5dff6a"/><rect x="43" y="26" width="2" height="2" fill="#5dff6a"/>
    <g class="eyes-open"><rect x="37" y="31" width="2" height="2" fill="#0b0616"/><rect x="41" y="31" width="2" height="2" fill="#0b0616"/></g>
    <g class="eyes-shut"><rect x="37" y="32" width="2" height="1" fill="#0b0616"/><rect x="41" y="32" width="2" height="1" fill="#0b0616"/></g>
    <rect class="yawn" x="39" y="34" width="2" height="3" fill="#ff3fa4"/>
    <rect x="31" y="21" width="18" height="2" fill="#ff3fa4"/><rect x="36" y="15" width="8" height="6" fill="#ff3fa4"/><rect x="44" y="13" width="2" height="2" fill="#ffe23f"/>
  </g>
  <g class="blanket"><rect x="28" y="36" width="28" height="6" fill="#ff3fa4"/><rect x="28" y="36" width="28" height="1" fill="#ff8ac8"/><rect x="32" y="38" width="2" height="2" fill="#ffe23f"/><rect x="42" y="38" width="2" height="2" fill="#ffe23f"/><rect x="50" y="38" width="2" height="2" fill="#ffe23f"/></g>
  <g class="zs" style="font-family:'Press Start 2P'"><text class="z" x="46" y="30" font-size="5">Z</text><text class="z z2" x="49" y="28" font-size="4">z</text><text class="z z3" x="51" y="26" font-size="3">z</text></g>
</svg>
<div class="dim"></div>
</div>
<div class="cap" id="cap"></div>
<script>
const lines=[[0,'WALKING TO BED...'],[2.9,'*YAAAWN*'],[4.1,'THINKING: MINIMAL'],[5.5,'BLANKET DEPLOYED'],[6.7,'LIGHTS OUT'],[7.5,'Zzz... (EFFORT: NONE)']];
const cap=document.getElementById('cap'),t0=performance.now();
(function tick(){const t=((performance.now()-t0)/1000)%12;let s='';for(const[a,l]of lines)if(t>=a)s=l;cap.textContent=s;requestAnimationFrame(tick)})();
</script>
</body>
</html>
