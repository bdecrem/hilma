name: Loci
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

targets:
  Loci:
    type: application
    platform: iOS
    sources:
      - path: Loci
        excludes:
          - "Secrets.swift.example"
    dependencies:
      - package: WebRTC
    info:
      path: Loci/Info.plist
      properties:
        CFBundleDisplayName: Loci
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Loci listens in voice mode so you can review and discuss topics hands-free.
        # Voice sessions keep running with the screen locked / phone pocketed.
        UIBackgroundModes:
          - audio
        # Simulator/dev builds talk to the Next.js dev server over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.Loci
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # iOS 27 beta chokes on the Xcode debug-dylib stub launch path
        # (black screen at launch until reboot). Single-binary debug builds.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Xcode 26's debugger can't attach on the iOS 27 beta — the app aborts at
# launch (__abort_with_payload) whenever lldb attaches. Run without the
# debugger so plain Cmd+R works on Bart's phone; launches fine undebugged.
schemes:
  Loci:
    build:
      targets:
        Loci: all
    run:
      config: Debug
      debugEnabled: false
