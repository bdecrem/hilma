<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for the server-side chart render (sharp/librsvg): the almanac's own TTFs first, then the system's.
     lib/artifacts.mjs points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>/tmp/almanac-fontconfig-cache</cachedir>
</fontconfig>
