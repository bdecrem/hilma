# Bart's Ola apps. `xcodegen generate` makes Ola.xcodeproj (not committed); this file is the truth.
name: Ola
options:
  bundleIdPrefix: cx.ola
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  OlaKit:
    path: OlaKit
  # Kit's voice meetings on the phone (iOS/Kit/ElevenKitTransport.swift): the same SDK and version
  # as the Dodo app. It rides on LiveKit's WebRTC.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 3.3.1
  # Pinned to what the Dodo app ships with this SDK (its Package.resolved), so the pair is the proven one.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
targets:
  OlaMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: Shared
        excludes: ["Fonts/*.txt"]
      # Ola's web commands for "On this Mac" (OlaKit LocalServer.installWebTools), the same files
      # as the customers' sealed image.
      - path: ../workspace
        includes: [ola-search, ola-fetch, ola-lookup, ola-db, olaspec.py, lib/olatext.py, ola-see, ola-page]
        buildPhase: resources
        group: WebTools
      # ola-page on this Mac: asks this app to render a page in its own web view (Mac/PageRender.swift).
      - path: ../bart
        includes: [ola-page-mac]
        buildPhase: resources
        group: WebTools
      # Ola's own skills (designer, app-designer, chart, ...), staged fresh from ../skills at the
      # commit, with VERSION.json, by tools/skills.mjs (tools/build.sh and testflight/ship-via-mini.sh
      # do it, and refuse a build that carries anything else); installed for the local agent at each
      # start (LocalServer.installSkills), the only skills it is offered.
      - path: build/OlaSkills
        type: folder
        buildPhase: resources
      # Ola's own build of opencode (../opencode-fork: the pinned release with Ola's wordmark and
      # wording in its terminal interface), one program per processor, staged by
      # ../opencode-fork/stage.sh (tools/build.sh and testflight/ship-via-mini.sh do it, and refuse a
      # build that carries another). Contents/Helpers is a place macOS signs code in; OlaKit
      # LocalServer.bundledBinary runs it from there. opencode's MIT notice rides in Resources.
      - path: build/OlaOpencode
        includes: [ola-opencode-arm64, ola-opencode-x86_64]
        group: Opencode
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
      - path: build/OlaOpencode
        includes: [opencode-LICENSE.txt, opencode-source.txt]
        group: Opencode
        buildPhase: resources
    dependencies:
      - package: OlaKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Ola
        CFBundleName: Ola
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Made for Bart, 2026.
        # Export compliance: only HTTPS and the system's own encryption (TLS, Keychain, CryptoKit).
        ITSAppUsesNonExemptEncryption: false
        # The numbers bump-build.sh moves (xcodegen otherwise writes a fixed 1.0 (1)).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The machine is reached over Tailscale by plain HTTP (the tailnet encrypts it).
        # Plain HTTP is allowed only to local addresses and to Tailscale names (*.ts.net).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    # Passkeys in the app (OlaKit NativePasskey, 2026-11-17): Mac/Ola.entitlements carries the
    # associated domain webcredentials:app.ola.cx, which signing accepts only with a provisioning
    # profile whose App ID has Associated Domains. Until Bart accepts Apple's latest Program License
    # Agreement, Xcode cannot add that capability, so the passkey build is opt-in, like the phone's
    # push: tools/build.sh mac with OLA_PASSKEY=1. Without it the app says passkeys arrive with the
    # next update, and never opens a browser.
    settings:
      base:
        PRODUCT_NAME: Ola
        PRODUCT_BUNDLE_IDENTIFIER: cx.ola.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        # The opencode programs in Contents/Helpers carry their own payload; copy them as they are.
        COPY_PHASE_STRIP: NO
      # The signed download (testflight/README.md): Developer ID and notarization need the hardened
      # runtime. Release only, so the Debug builds Bart installs sign exactly as before.
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  OlaPhone:
    type: application
    platform: iOS
    sources:
      - iOS
      - path: Shared
        excludes: ["Fonts/*.txt"]
    dependencies:
      - package: OlaKit
      - package: ElevenLabs
      - package: LiveKit
    # Apple push needs iOS/Ola.entitlements (aps-environment), which signing accepts only once the
    # team's App ID has Push Notifications. Until Bart accepts Apple's latest Program License
    # Agreement, Xcode cannot add it, so the push build is opt-in: tools/build.sh device with OLA_PUSH=1.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Ola
        # Export compliance: only HTTPS and the system's own encryption (TLS, Keychain, CryptoKit).
        ITSAppUsesNonExemptEncryption: false
        # The numbers bump-build.sh moves (xcodegen otherwise writes a fixed 1.0 (1)).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchRoom
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Ola talks to Ola on your Mac over your private network.
        NSCameraUsageDescription: The camera reads the pairing code that Ola on your Mac shows.
        NSMicrophoneUsageDescription: To talk with Kit and leave it voice notes.
        # A meeting with Kit keeps going with the screen locked or another app in front. This is
        # a plain Info.plist key, not a capability, so it needs nothing from Apple's agreement.
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Ola
        PRODUCT_BUNDLE_IDENTIFIER: cx.ola.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OlaMac:
    build:
      targets:
        OlaMac: all
  OlaPhone:
    build:
      targets:
        OlaPhone: all
