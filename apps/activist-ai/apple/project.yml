# Bart's Ola apps. `xcodegen generate` makes Ola.xcodeproj (not committed); this file is the truth.
name: Ola
options:
  bundleIdPrefix: cx.ola
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  OlaKit:
    path: OlaKit
  # Kit's voice meetings on the phone (iOS/Kit/ElevenKitTransport.swift): the same SDK and version
  # as the Dodo app. It rides on LiveKit's WebRTC.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 3.3.1
  # Pinned to what the Dodo app ships with this SDK (its Package.resolved), so the pair is the proven one.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
targets:
  OlaMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: Shared
        excludes: ["Fonts/*.txt"]
    dependencies:
      - package: OlaKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Ola
        CFBundleName: Ola
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Made for Bart, 2026.
        # The machine is reached over Tailscale by plain HTTP (the tailnet encrypts it).
        # Plain HTTP is allowed only to local addresses and to Tailscale names (*.ts.net).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Ola
        PRODUCT_BUNDLE_IDENTIFIER: cx.ola.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  OlaPhone:
    type: application
    platform: iOS
    sources:
      - iOS
      - path: Shared
        excludes: ["Fonts/*.txt"]
    dependencies:
      - package: OlaKit
      - package: ElevenLabs
      - package: LiveKit
    # Apple push needs iOS/Ola.entitlements (aps-environment), which signing accepts only once the
    # team's App ID has Push Notifications. Until Bart accepts Apple's latest Program License
    # Agreement, Xcode cannot add it, so the push build is opt-in: tools/build.sh device with OLA_PUSH=1.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Ola
        UILaunchScreen:
          UIColorName: LaunchRoom
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Ola talks to Ola on your Mac over your private network.
        NSCameraUsageDescription: The camera reads the pairing code that Ola on your Mac shows.
        NSMicrophoneUsageDescription: To talk with Kit and leave it voice notes.
        # A meeting with Kit keeps going with the screen locked or another app in front. This is
        # a plain Info.plist key, not a capability, so it needs nothing from Apple's agreement.
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Ola
        PRODUCT_BUNDLE_IDENTIFIER: cx.ola.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OlaMac:
    build:
      targets:
        OlaMac: all
  OlaPhone:
    build:
      targets:
        OlaPhone: all
