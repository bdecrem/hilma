# The checker's drivers for the apps (OLA-237; tools/drive.sh, README "Using the apps as a checker").
# A project of its own, apart from the apps: it drives the iPhone app as installed in a simulator,
# from the outside, by its bundle id; nothing of the app is compiled in. `xcodegen generate` makes
# OlaDrive.xcodeproj (not committed); tools/drive.sh does it on the mini.
name: OlaDrive
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  OlaDrivePhone:
    type: bundle.ui-testing
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.ola.drive.phone
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OlaDrivePhone:
    build:
      targets:
        OlaDrivePhone: [test]
    test:
      targets: [OlaDrivePhone]
