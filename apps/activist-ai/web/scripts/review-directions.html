<!doctype html>
<!-- OLA-312: two directions for the three most-used screens, as static mockups (made-up words only).
     ?d=a|b  &s=conv|question|home      rendered by review-directions.mjs at 390 (phone) or 1280 (home).
     A "Paper under the lamp, edited": the look Bart picked on Nov 16, with the chrome cut down.
     B "Quiet workbench": system type on white, the conversation is the screen, color only for state. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
@font-face{font-family:Bricolage;src:url(../public/fonts/bricolage.woff2) format('woff2');font-weight:400 760}
@font-face{font-family:Literata;src:url(../public/fonts/literata.woff2) format('woff2');font-weight:400 700}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh}
svg{display:block}
/* ---------------- A: paper under the lamp, edited ---------------- */
.A{--room:#25407a;--paper:#f7f0e3;--paper2:#efe6d3;--rule:#e2d6bf;--ink:#141c33;--ink2:#4b5268;--ink3:#6b6f80;--lamp:#efcf82;--wash:#f6e4ae;--verm:#ff6a3d;

.A .bar{background:var(--room);color:#f7f0e3;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0}
.A .bar .back{opacity:.8;font-size:30px;line-height:1;margin-top:-4px}
.A .bar .t{font-weight:640;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A .bar .dots{width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.A .seg{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
.A .seg span{padding:12px 0 10px;font-weight:560;color:var(--ink3);font-size:14px}
.A .seg span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.A .seg em{font-style:normal;color:var(--ink3);font-weight:450;margin-left:3px}
.A .thread{padding:20px 16px 150px}
.A .me{margin-left:auto;max-width:82%;background:var(--paper2);border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:15px;line-height:1.45;margin-bottom:18px}
.A .steps{border-left:2px solid var(--rule);margin:0 0 14px 6px;padding-left:14px;color:var(--ink2);font-size:13.5px;line-height:1.5}
.A .steps div{position:relative;padding:2px 0}
.A .steps div::before{content:"";position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:4px;background:var(--room)}
.A .steps b{color:var(--ink);font-weight:560}
.A .reply{font-family:Literata,Georgia,serif;font-size:16.5px;line-height:1.55;margin-bottom:12px}
.A .made{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:#fbf6ec}
.A .made .ic{width:40px;height:48px;border-radius:4px;background:#fff;border:1px solid var(--rule);display:grid;place-items:center;font-size:10px;color:var(--ink3)}
.A .made .n{font-weight:600}.A .made .w{color:var(--ink3);font-size:13px}
.A .made .open{margin-left:auto;font-weight:600;color:var(--room)}
.A .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 26px;background:linear-gradient(transparent,var(--paper) 30%)}
.A .box{background:#fffaf1;border:1px solid var(--rule);border-radius:22px;padding:12px 14px 10px;box-shadow:0 2px 10px rgba(20,28,51,.07)}

.A .box .row{display:flex;align-items:center;gap:8px}
.A .chip{font-size:12.5px;border:1px solid var(--rule);border-radius:14px;padding:4px 10px;color:var(--ink2)}
.A .chip .d{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--lamp);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 2px #fff3cf}
.A .plus{width:32px;height:32px;border-radius:16px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink2);font-size:20px}
.A .send{margin-left:auto;width:34px;height:34px;border-radius:17px;background:var(--room);display:grid;place-items:center}
.A .ask{border:1px solid var(--rule);border-left:3px solid var(--verm);border-radius:12px;background:#fffaf1;padding:14px 14px 10px;margin-top:6px}
.A .ask .k{font-size:12.5px;color:#b93d17;font-weight:600;margin-bottom:6px}
.A .ask .q{font-family:Literata,serif;font-size:17.5px;line-height:1.4;margin-bottom:12px}
.A .opt{display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding:12px 2px}
.A .opt .l{font-weight:600}.A .opt .s{color:var(--ink3);font-size:13px}
.A .opt .ch{margin-left:auto;color:var(--ink3)}

.A .pane .dock{position:absolute}
