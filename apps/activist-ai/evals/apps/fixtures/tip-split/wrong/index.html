<!doctype html>
<html><head><meta charset="utf-8"><title>Tip splitter</title></head>
<body>
<!-- A plausible mistake: the tip is split, the bill is not (each pays only their share of the tip). -->
<h1>Split the bill</h1>
<label>Bill amount <input id="bill" type="number"></label>
<label>Tip % <input id="tip" type="number" value="15"></label>
<label>Number of people <input id="people" type="number" value="1"></label>
<p>Each person pays: <strong id="each">$0.00</strong></p>
<script>
const calc = () => {
  const b = +document.getElementById('bill').value || 0, t = +document.getElementById('tip').value || 0, n = Math.max(1, +document.getElementById('people').value || 1)
  document.getElementById('each').textContent = '$' + (b * t / 100 / n).toFixed(2)
}
document.querySelectorAll('input').forEach((i) => i.oninput = calc)
</script>
</body></html>
