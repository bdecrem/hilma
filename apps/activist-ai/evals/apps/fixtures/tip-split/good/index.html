<!doctype html>
<html><head><meta charset="utf-8"><title>Tip splitter</title></head>
<body>
<h1>Split the bill</h1>
<label>Bill amount <input id="bill" type="number"></label>
<p>Tip: <button data-t="15">15%</button> <button data-t="20">20%</button> <button data-t="25">25%</button></p>
<label>Number of people <input id="people" type="number" value="1"></label>
<p>Each person pays: <strong id="each">$0.00</strong></p>
<script>
let tip = 15
const calc = () => {
  const b = +document.getElementById('bill').value || 0, n = Math.max(1, +document.getElementById('people').value || 1)
  document.getElementById('each').textContent = '$' + (b * (1 + tip / 100) / n).toFixed(2)
}
document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { tip = +b.dataset.t; calc() })
document.querySelectorAll('input').forEach((i) => i.oninput = calc)
</script>
</body></html>
