<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Theremin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #090a0f;
    color: #ececf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  canvas#field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(circle at 50% 40%, #161a26 0%, #090a0f 70%);
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    pointer-events: none;
    z-index: 10;
  }
  #note {
    font-size: clamp(28px, 9vw, 64px);
    font-weight: 700;
    letter-spacing: 8px;
    opacity: 0.92;
  }
  #panel { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #freq {
    font-size: clamp(13px, 3vw, 18px);
    opacity: 0.55;
  }
  #mode {
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.45;
  }
  #start {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at center, #161a26 0%, #090a0f 70%);
    z-index: 30;
    /* The start screen is a visual only: it never blocks the canvas underneath,
       so a tap or drag anywhere on the screen starts the instrument and the
       whole field responds. It fades away on the first touch. */
    pointer-events: none;
  }
  #start h1 { font-size: 26px; letter-spacing: 10px; opacity: 0.85; }
  #start p { margin-top: 10px; font-size: 14px; opacity: 0.55; letter-spacing: 3px; }
  .gone { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="hud">
  <div id="note">—</div>
  <div id="panel"><div id="freq">— Hz</div><div id="mode">pentatonic</div></div>
</div>
<div id="start"><h1>Pocket Theremin</h1><p>Tap anywhere to begin</p></div>
<script src="theremin.js"></script>
<script>
(function(){
  const field = document.getElementById('field');
  const cx = field.getContext('2d');
  const noteEl = document.getElementById('note');
  const freqEl = document.getElementById('freq');
  const startEl = document.getElementById('start');

  let W, H;
  function resize(){ W = field.width = field.clientWidth; H = field.height = field.clientHeight; }
  window.addEventListener('resize', resize);
  resize();

  // The scale (A minor pentatonic, 3 octaves) — same shape the tests check.
  const notes = buildScale(57, 'minor', 3);

  // ---------- audio ----------
  const Ctx = window.AudioContext || window.webkitAudioContext;
  let actx;
  let started = false;
  const voices = new Map(); // pointerId -> voice

  function unlockAudio(){
    if (started) return;
    started = true;
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    actx = new Ctx();
    if (actx.state === 'suspended') actx.resume();
    // A short silent WAV blob (a few hundred samples) played in an <audio>
    // element — the classic iOS gesture that unlocks the audio context.
    const sr = actx.sampleRate || 44100;
    const n = 512;
    const ab = new ArrayBuffer(44 + n * 2);
    const v = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true);
    w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);   // PCM
    v.setUint16(22, 1, true);   // mono
    v.setUint32(24, sr, true);  // sample rate
    v.setUint32(28, sr * 2, true); // byte rate
    v.setUint16(32, 2, true);   // block align
    v.setUint16(34, 16, true);  // bits per sample
    w(36, 'data'); v.setUint32(40, n * 2, true);
    const silence = new Audio();
    silence.src = URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
    silence.play().catch(() => {});
    startEl.classList.add('gone');
  }

  function newVoice(){
    const osc = actx.createOscillator();
    const filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    const gain = actx.createGain();
    osc.connect(filt);
    filt.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    return { osc, filt, gain };
  }

  // Show the topmost (latest) finger's note in the HUD, since there's one line.
  let topId = null;

  function apply(id, x, y, down){
    const n = yToNote(y, notes);
    const v = voices.get(id);
    if (!v) return;
    v.osc.frequency.setTargetAtTime(midiToFreq(n.midi), actx.currentTime, 0.01);
    v.filt.frequency.setTargetAtTime(xToCutoff(x), actx.currentTime, 0.02);
    v.filt.Q.value = xToResonance(x);
    v.gain.gain.setTargetAtTime(down ? voiceLevel(true) : voiceLevel(false), actx.currentTime, down ? 0.05 : 0.12);
    if (down) {
      topId = id;
      noteEl.textContent = n.name;
      freqEl.textContent = Math.round(midiToFreq(n.midi)) + ' Hz';
    }
  }

  function startVoice(id, x, y){
    const v = newVoice();
    voices.set(id, v);
    apply(id, x, y, true);
  }

  function stopVoice(id){
    const v = voices.get(id);
    if (!v) return;
    v.gain.gain.setTargetAtTime(voiceLevel(false), actx.currentTime, 0.12);
    setTimeout(() => {
      try { v.osc.stop(); } catch (e) {}
      voices.delete(id);
      if (topId === id) {
        topId = null;
        noteEl.textContent = '—';
        freqEl.textContent = '— Hz';
        // Show the note of the newest remaining finger, if any.
        const remaining = [...voices.keys()];
        if (remaining.length) {
          const last = remaining[remaining.length - 1];
          const t = touches.get(last);
          if (t) apply(last, t.x, t.y, true);
        }
      }
    }, 300);
  }

  // ---------- visuals ----------
  const trail = []; // {x, y, t}
  const touches = new Map(); // pointerId -> {x, y}

  function addTrail(x, y){ trail.push({ x, y, t: performance.now() }); }

  function draw(){
    const now = performance.now();
    cx.clearRect(0, 0, W, H);

    // Guide lines for each scale tone (subtle). Top of field = highest note.
    cx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    cx.lineWidth = 1;
    for (let i = 0; i < notes.length; i++) {
      const y = noteToY(i, notes) * H;
      cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
    }

    // Fade the trail using the same curve the tests check.
    for (let i = trail.length - 1; i >= 0; i--) {
      const age = (now - trail[i].t) / 1000;
      const a = trailAlpha(age, 1.6);
      if (a <= 0.02) { trail.splice(i, 1); continue; }
      const gx = trail[i].x * W, gy = trail[i].y * H;
      const r = 6 + 16 * a;
      cx.beginPath(); cx.arc(gx, gy, r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(120, 180, 255, ${a * 0.4})`;
      cx.fill();
    }

    // The finger / pointer as a soft glowing dot.
    for (const [, t] of touches) {
      const gx = t.x * W, gy = t.y * H;
      const grad = cx.createRadialGradient(gx, gy, 0, gx, gy, 80);
      grad.addColorStop(0, 'rgba(130, 190, 255, 0.5)');
      grad.addColorStop(1, 'rgba(130, 190, 255, 0)');
      cx.fillStyle = grad;
      cx.beginPath(); cx.arc(gx, gy, 80, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = '#ffffff';
      cx.beginPath(); cx.arc(gx, gy, 10, 0, Math.PI * 2); cx.fill();
    }

    requestAnimationFrame(draw);
  }
  draw();

  // ---------- interaction ----------
  function toField(clientX, clientY){
    const r = field.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (clientY - r.top) / r.height))
    };
  }

  function onDown(e){
    if (!started) { unlockAudio(); }
    const p = toField(e.clientX, e.clientY);
    touches.set(e.pointerId, p);
    addTrail(p.x, p.y);
    if (started && actx) startVoice(e.pointerId, p.x, p.y);
  }
  function onMove(e){
    const p = toField(e.clientX, e.clientY);
    touches.set(e.pointerId, p);
    addTrail(p.x, p.y);
    if (started && actx) apply(e.pointerId, p.x, p.y, true);
  }
  function onUp(e){
    touches.delete(e.pointerId);
    stopVoice(e.pointerId);
  }

  field.addEventListener('pointerdown', onDown);
  field.addEventListener('pointermove', onMove, { passive: false });
  field.addEventListener('pointerup', onUp);
  field.addEventListener('pointercancel', onUp);

  // Mouse fallback (pointer events cover it, but be safe).
  field.addEventListener('mousedown', (e) => { if (!started) unlockAudio(); const p = toField(e.clientX, e.clientY); touches.set('mouse', p); addTrail(p.x, p.y); if (started && actx) startVoice('mouse', p.x, p.y); });
  field.addEventListener('mousemove', (e) => { const p = toField(e.clientX, e.clientY); touches.set('mouse', p); addTrail(p.x, p.y); if (started && actx) apply('mouse', p.x, p.y, true); });
  field.addEventListener('mouseup', () => { touches.delete('mouse'); stopVoice('mouse'); });
})();
</script>
</body>
</html>
