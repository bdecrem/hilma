<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Spreadsheet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#0b0b0f; color:#e8e8ec;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:1rem; gap:0.75rem; min-height:100dvh;
  }
  header { width:100%; max-width:1120px; display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  h1 { font-size:1.1rem; font-weight:700; }
  h1 small { font-weight:400; color:#9a9aa5; font-size:0.8rem; margin-left:0.5rem; }
  .bar { width:100%; max-width:1120px; display:flex; align-items:stretch; background:#14141b; border:1px solid #26262f; border-radius:10px; overflow:hidden; }
  .ref { flex:0 0 auto; min-width:3.4rem; display:flex; align-items:center; justify-content:center; background:#1b1b24; color:#4fd1c5; font-family:ui-monospace,Menlo,monospace; font-size:0.95rem; font-weight:600; border-right:1px solid #26262f; padding:0 0.5rem; }
  .bar input { flex:1; background:transparent; border:none; outline:none; color:#e8e8ec; font-family:ui-monospace,Menlo,monospace; font-size:1rem; padding:0.65rem 0.75rem; min-width:0; }
  .wrap { width:100%; max-width:1120px; overflow:auto; border:1px solid #26262f; border-radius:10px; background:#101016; scrollbar-width:thin; scrollbar-color:#33333e transparent; }
  .grid { display:grid; grid-template-columns:44px repeat(20, minmax(58px, 1fr)); grid-auto-rows:40px; min-width:1150px; }
  .corner,.colhead,.rowh { background:#1b1b24; color:#8f8f9b; font-size:0.7rem; font-weight:600; display:flex; align-items:center; justify-content:center; border-right:1px solid #26262f; border-bottom:1px solid #26262f; user-select:none; }
  .corner { position:sticky; top:0; left:0; z-index:5; background:#15151c; }
  .colhead { position:sticky; top:0; z-index:4; }
  .rowh { position:sticky; left:0; z-index:3; font-family:ui-monospace,Menlo,monospace; }
  .cell { border:none; outline:none; background:transparent; color:#d8d8e0; font-family:ui-monospace,Menlo,monospace; font-size:0.88rem; padding:0 0.5rem; text-align:right; min-width:0; border-right:1px solid #1e1e27; border-bottom:1px solid #1e1e27; font-variant-numeric:tabular-nums; }
  .cell.text { text-align:left; color:#b8e6d9; }
  .cell.err { color:#ff7b7b; font-size:0.75rem; text-align:center; }
  .cell.sel { background:#1a2b2a; box-shadow:inset 0 0 0 2px #4fd1c5; }
  .hint { width:100%; max-width:1120px; color:#8a8a95; font-size:0.75rem; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>Spreadsheet <small>10 rows × 20 cols · type = formulas · arrow keys move</small></h1>
</header>
<div class="bar">
  <div class="ref" id="ref">A1</div>
  <input id="fx" spellcheck="false" autocomplete="off" placeholder="type a number, text, or =SUM(A1:A5)">
</div>
<div class="wrap" id="wrap">
  <div class="grid" id="grid"></div>
</div>
<div class="hint">Cells show the value of a formula. Formulas: =A1+B2*3, =SUM(A1:A5), =A1*2+1. A circular reference shows #LOOP!. Arrow keys move; Enter moves down; type to overwrite.</div>
<script>
'use strict';
const COLS = 20, ROWS = 10;
const colName = i => String.fromCharCode(65 + i);
const ref = (r,c) => colName(c) + (r+1);
const splitRef = r => { const m = /^([A-Z]+)([0-9]+)$/.exec(r.toUpperCase()); if(!m) return null; const c = m[1].charCodeAt(0) - 65; const row = parseInt(m[2],10) - 1; if (c<0||c>=COLS||row<0||row>=ROWS) return null; return {r:row,c}; };
let raw = new Map();
let sel = {r:0, c:0};
let computing = false;
const cache = new Map();

function getRaw(r,c){ return raw.get(ref(r,c)) || ''; }
function compute(r,c, seen){
  const key = ref(r,c);
  if (seen.has(key)) return { err: true, msg: '#LOOP!' };
  seen.add(key);
  try {
    const v = getRaw(r,c).trim();
    if (v === '') return { value: '' };
    if (!v.startsWith('=')) {
      if (v !== '' && !isNaN(parseFloat(v)) && isFinite(Number(v))) return { value: Number(v), num: true };
      return { value: v, num: false };
    }
    try {
      const res = evalFormula(v.slice(1), seen);
      if (res && res.err) return { err: true, msg: res.msg };
      return { value: res, num: typeof res === 'number' };
    } catch (e) {
      return { err: true, msg: e.msg || '#ERROR!' };
    }
  } finally {
    seen.delete(key);
  }
}

function evalFormula(expr, seen){
  // tokenizer
  const tokens = [];
  let i = 0;
  while (i < expr.length){
    const ch = expr[i];
    if (ch === ' ' || ch === '\t') { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i; while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
      tokens.push({t:'num', v:parseFloat(expr.slice(i,j))}); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i; while (j < expr.length && /[A-Za-z0-9_.]/.test(expr[j])) j++;
      const word = expr.slice(i,j);
      // range? A1:A5 handled after being parsed as word? 
      tokens.push({t:'word', v:word}); i = j; continue;
    }
    if ('+-*/%(),:'.includes(ch)) { tokens.push({t:ch}); i++; continue; }
    throw { msg: '#ERROR!' };
  }
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  function parseExpr(){
    let v = parseTerm();
    while (peek() && (peek().t === '+' || peek().t === '-')){
      const op = next().t; const rhs = parseTerm();
      v = op === '+' ? num(v) + num(rhs) : num(v) - num(rhs);
    }
    return v;
  }
  function parseTerm(){
    let v = parseFactor();
    while (peek() && (peek().t === '*' || peek().t === '/' || peek().t === '%')){
      const op = next().t; const rhs = parseFactor();
      if (op === '*') v = num(v) * num(rhs);
      else if (op === '/') v = num(v) / num(rhs);
      else v = num(v) % num(rhs);
    }
    return v;
  }
  function parseFactor(){
    const p = peek();
    if (!p) throw { msg: '#ERROR!' };
    if (p.t === '-') { next(); return -num(parseFactor()); }
    if (p.t === '+') { next(); return num(parseFactor()); }
    if (p.t === '(') { next(); const v = parseExpr(); if (peek() && peek().t === ')') next(); else throw { msg:'#ERROR!' }; return v; }
    if (p.t === 'num') { next(); return p.v; }
    if (p.t === 'word') {
      next(); const w = p.v;
      if (/^[A-Za-z]+[0-9]+$/.test(w)) {
        // cell ref or function-ish; check range
        if (peek() && peek().t === ':') {
          next();
          const p2 = next();
          if (!p2 || p2.t !== 'word' || !/^[A-Za-z]+[0-9]+$/.test(p2.v)) throw { msg:'#ERROR!' };
          return { range: [splitRef(w), splitRef(p2.v)] };
        }
        const cell = splitRef(w);
        if (!cell) throw { msg:'#ERROR!' };
        const res = compute(cell.r, cell.c, seen);
        if (res.err) throw res;
        if (res.value === '') return 0;
        return num(res.value);
      }
      // function call
      const fname = w.toUpperCase();
      if (peek() && peek().t === '(') {
        next();
        const args = [];
        if (!(peek() && peek().t === ')')) {
          args.push(parseExpr());
          while (peek() && peek().t === ',') { next(); args.push(parseExpr()); }
        }
        if (peek() && peek().t === ')') next(); else throw { msg:'#ERROR!' };
        // flatten args (ranges)
        const flat = [];
        for (const a of args) {
          if (a && a.range) {
            const [a1,a2] = a.range;
            if (!a1 || !a2) throw { msg:'#ERROR!' };
            const r1 = Math.min(a1.r,a2.r), r2 = Math.max(a1.r,a2.r);
            const c1 = Math.min(a1.c,a2.c), c2 = Math.max(a1.c,a2.c);
            for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) {
              const res = compute(r,c, seen);
              if (res.err) throw res;
              if (res.value !== '') flat.push(num(res.value));
            }
          } else if (a && a.err) throw a;
          else flat.push(a);
        }
        if (fname === 'SUM') return flat.reduce((s,x)=>s+num(x),0);
        if (fname === 'AVG' || fname === 'AVERAGE') { if (!flat.length) throw {msg:'#DIV/0!'}; return flat.reduce((s,x)=>s+num(x),0)/flat.length; }
        if (fname === 'MIN') return Math.min(...flat.map(num));
        if (fname === 'MAX') return Math.max(...flat.map(num));
        if (fname === 'COUNT') return flat.length;
        throw { msg:'#NAME?' };
      }
      throw { msg:'#NAME?' };
    }
    throw { msg: '#ERROR!' };
  }
  function num(x){
    if (typeof x === 'number') return x;
    if (x && x.err) throw x;
    if (x && x.range) throw { msg:'#ERROR!' };
    const n = parseFloat(x);
    if (isNaN(n)) return 0; // text treated as 0 in arithmetic
    return n;
  }
  const result = parseExpr();
  if (pos < tokens.length) throw { msg:'#ERROR!' };
  if (result && result.err) throw result;
  if (result && result.range) return result.range ? flatRangeValue(result.range, seen) : 0;
  return num(result);
}
function flatRangeValue(range, seen){
  const [a1,a2] = range;
  const r1=Math.min(a1.r,a2.r), r2=Math.max(a1.r,a2.r);
  const c1=Math.min(a1.c,a2.c), c2=Math.max(a1.c,a2.c);
  let sum = 0, n = 0;
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) {
    const res = compute(r,c, seen);
    if (res.err) throw res;
    if (res.value !== '') { sum += numOf(res.value); n++; }
  }
  return n ? sum : 0;
}
function numOf(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

const grid = document.getElementById('grid');
const fx = document.getElementById('fx');
const refEl = document.getElementById('ref');
const cells = [];

// Build grid: corner + col headers, then rows
const corner = document.createElement('div'); corner.className = 'corner'; grid.appendChild(corner);
for (let c=0;c<COLS;c++){ const h = document.createElement('div'); h.className='colhead'; h.textContent = colName(c); grid.appendChild(h); }
for (let r=0;r<ROWS;r++){
  const rh = document.createElement('div'); rh.className='rowh'; rh.textContent = r+1; grid.appendChild(rh);
  cells[r] = [];
  for (let c=0;c<COLS;c++){
    const inp = document.createElement('input');
    inp.className = 'cell'; inp.spellcheck = false; inp.autocomplete = 'off';
    inp.setAttribute('aria-label', ref(r,c));
    inp.dataset.r = r; inp.dataset.c = c;
    inp.addEventListener('input', () => { raw.set(ref(r,c), inp.value); recalc(r,c); });
    inp.addEventListener('focus', () => { sel = {r,c}; updateBar(); markSel(); renderCell(r,c); });
    inp.addEventListener('keydown', e => onKey(e, r, c, inp));
    grid.appendChild(inp);
    cells[r][c] = inp;
  }
}

function recalc(){
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) renderCell(r,c);
  updateBar();
  markSel();
}
function renderCell(r,c){
  const inp = cells[r][c];
  const rawVal = getRaw(r,c);
  const rawTrim = rawVal.trim();
  if (document.activeElement === inp) {
    if (inp.value !== rawVal) inp.value = rawVal;
    inp.className = 'cell' + (rawTrim && (rawTrim.startsWith('=') || isNaN(parseFloat(rawTrim))) ? ' text' : '');
    return;
  }
  const res = compute(r,c,new Set());
  if (res.err) { inp.value = res.msg; inp.className = 'cell err'; return; }
  if (res.value === '') { inp.value = ''; inp.className = 'cell'; return; }
  if (rawTrim && !rawTrim.startsWith('=')) {
    inp.value = rawTrim;
    inp.className = 'cell' + (isNaN(parseFloat(rawTrim)) ? ' text' : '');
    return;
  }
  inp.value = (typeof res.value === 'number' && isFinite(res.value)) ? formatNum(res.value) : String(res.value);
  inp.className = 'cell';
}
function formatNum(n){
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  return String(parseFloat(n.toPrecision(10)));
}
function markSel(){
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) cells[r][c].classList.toggle('sel', r===sel.r && c===sel.c);
}
function updateBar(){
  refEl.textContent = ref(sel.r, sel.c);
  fx.value = getRaw(sel.r, sel.c);
}
function focusCell(r,c, selectAll){
  sel = {r,c};
  const inp = cells[r][c];
  inp.focus();
  if (selectAll) inp.select();
  updateBar(); markSel();
  inp.scrollIntoView({ block:'nearest', inline:'nearest' });
}
function onKey(e, r, c, inp){
  const key = e.key;
  if (key === 'ArrowUp'){ e.preventDefault(); focusCell(Math.max(0,r-1), c); }
  else if (key === 'ArrowDown'){ e.preventDefault(); focusCell(Math.min(ROWS-1,r+1), c); }
  else if (key === 'ArrowLeft'){ e.preventDefault(); if (e.shiftKey) return; focusCell(r, Math.max(0,c-1)); }
  else if (key === 'ArrowRight'){ e.preventDefault(); focusCell(r, Math.min(COLS-1,c+1)); }
  else if (key === 'Enter'){ e.preventDefault(); focusCell(Math.min(ROWS-1,r+1), c); }
  else if (key === 'Tab'){ e.preventDefault(); if (e.shiftKey) focusCell(r, Math.max(0,c-1)); else focusCell(r, Math.min(COLS-1,c+1)); }
  else if (key === 'Escape'){ e.preventDefault(); inp.blur(); }
  else if (key === 'F2'){ e.preventDefault(); /* keep */ }
}
fx.addEventListener('input', () => { raw.set(ref(sel.r,sel.c), fx.value); recalc(); });
fx.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); focusCell(Math.min(ROWS-1, sel.r+1), sel.c); }
  else if (e.key === 'Escape'){ e.preventDefault(); focusCell(sel.r, sel.c); }
});
fx.addEventListener('focus', () => updateBar());
raw.set('A1','5');
raw.set('A2','3');
raw.set('A3','=A1+A2');
raw.set('B1','=SUM(A1:A3)');
raw.set('B2','=A1*2+1');
raw.set('C1','hello');
raw.set('D1','=D1+1');
recalc();
focusCell(0,0,false);
</script>
</body>
</html>
