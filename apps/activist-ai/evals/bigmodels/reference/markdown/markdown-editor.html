<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f6f7f9; --text: #1d2127; --muted: #656d78;
    --line: #d9dde3; --link: #0a63c9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1e2127; --text: #e4e6ea; --muted: #9aa2ad;
      --line: #343942; --link: #6cb0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 100%;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, sans-serif;
  }
  section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  section + section { border-left: 1px solid var(--line); }
  header {
    padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 13px;
  }
  textarea, #preview { flex: 1; min-height: 0; overflow: auto; padding: 20px; }
  textarea {
    width: 100%; border: 0; resize: none; outline: none;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; tab-size: 4;
  }
  #preview { overflow-wrap: break-word; }
  #preview > :first-child { margin-top: 0; }
  h1, h2 { border-bottom: 1px solid var(--line); padding-bottom: .25em; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.4em 0 .6em; }
  a { color: var(--link); }
  img { max-width: 100%; }
  blockquote {
    margin: 1em 0; padding: 0 1em; color: var(--muted);
    border-left: 4px solid var(--line);
  }
  code {
    font: .875em ui-monospace, Menlo, Consolas, monospace;
    background: var(--panel); padding: .15em .35em; border-radius: 4px;
  }
  pre { background: var(--panel); padding: 12px 16px; border-radius: 6px; overflow: auto; }
  pre code { padding: 0; background: none; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; margin: 1em 0; }
  th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  th { background: var(--panel); }
  hr { border: 0; border-top: 2px solid var(--line); margin: 1.5em 0; }
  @media (max-width: 700px) {
    body { grid-template-columns: 100%; grid-template-rows: 50% 50%; }
    section + section { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<section>
  <header>Markdown (Tab indents, Shift+Tab outdents, Esc then Tab leaves the box)</header>
  <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
</section>
<section>
  <header>Preview</header>
  <div id="preview"></div>
</section>

<script id="parser">
const Markdown = (() => {
  const MAX_DEPTH = 32;
  const PUNCT = /[!-\/:-@\[-`{-~]/;

  const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // Allow relative URLs and a short list of schemes; everything else becomes "#".
  function safeUrl(url, isImage) {
    const compact = url.replace(/[\u0000- ]/g, '');
    const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(compact);
    if (scheme && !/^(https?|mailto|tel)$/i.test(scheme[1]) &&
        !(isImage && /^data:image\//i.test(compact))) return '#';
    return escapeHtml(url.replace(/ /g, '%20'));
  }

  /* ---------- Inline ---------- */

  // Length of the code span starting at i, or 0 if the backticks never close.
  function codeSpanLength(s, i) {
    let n = 1;
    while (s[i + n] === '`') n++;
    const run = /`+/g;
    run.lastIndex = i + n;
    for (let m; (m = run.exec(s));) {
      if (m[0].length === n) return m.index + n - i;
    }
    return 0;
  }

  // Map each "[" to its matching "]", in one pass.
  function matchBrackets(s) {
    const pairs = new Map(), stack = [];
    for (let i = 0; i < s.length; i++) {
      if (s[i] === '\\') i++;
      else if (s[i] === '`') {
        const len = codeSpanLength(s, i);
        if (len) i += len - 1;
        else while (s[i + 1] === '`') i++;
      }
      else if (s[i] === '[') stack.push(i);
      else if (s[i] === ']' && stack.length) pairs.set(stack.pop(), i);
    }
    return pairs;
  }

  // Parse "(url "title")" starting at the "(".
  function linkTarget(s, i) {
    if (s[i] !== '(') return null;
    const skipSpace = () => { while (/\s/.test(s[i] || '')) i++; };
    i++;
    skipSpace();
    let url = '';
    if (s[i] === '<') {
      const end = s.indexOf('>', i);
      if (end < 0) return null;
      url = s.slice(i + 1, end);
      i = end + 1;
    } else {
      for (let depth = 0; i < s.length && !/\s/.test(s[i]); i++) {
        if (s[i] === '\\' && PUNCT.test(s[i + 1] || '')) { url += s[++i]; continue; }
        if (s[i] === '(') depth++;
        if (s[i] === ')' && depth-- === 0) break;
        url += s[i];
      }
    }
    skipSpace();
    let title = null;
    const quote = { '"': '"', "'": "'", '(': ')' }[s[i]];
    if (quote) {
      title = '';
      for (i++; i < s.length && s[i] !== quote; i++) {
        if (s[i] === '\\' && PUNCT.test(s[i + 1] || '')) i++;
        title += s[i];
      }
      i++;
      skipSpace();
    }
    return s[i] === ')' ? { url, title, end: i + 1 } : null;
  }

  function delimiterRun(s, i) {
    const ch = s[i];
    let end = i;
    while (s[end] === ch) end++;
    const before = s[i - 1] || ' ', after = s[end] || ' ';
    const space = c => /\s/.test(c);
    const punct = c => /[\p{P}\p{S}]/u.test(c);
    const left = !space(after) && (!punct(after) || space(before) || punct(before));
    const right = !space(before) && (!punct(before) || space(after) || punct(after));
    return {
      ch, len: end - i, size: end - i,
      // "_" does not work inside a word, so snake_case stays as typed.
      open: ch === '_' ? left && (!right || punct(before)) : left,
      close: ch === '_' ? right && (!left || punct(after)) : right,
    };
  }

  // Pair up *, _ and ~ runs, innermost first (CommonMark's delimiter rules).
  function emphasis(nodes) {
    const text = n => typeof n === 'string' ? n : n.ch.repeat(n.len);
    const openers = [];            // indexes into out
    const out = [];
    for (const node of nodes) {
      if (typeof node === 'string') { out.push(node); continue; }
      while (node.close && node.len) {
        let k = openers.length - 1;
        for (; k >= 0; k--) {
          const o = out[openers[k]];
          if (o.ch !== node.ch) continue;
          if (node.ch === '~') { if (o.len === 2 && node.len === 2) break; continue; }
          const ruleOfThree = (o.close || node.open) && (o.size + node.size) % 3 === 0 &&
            !(o.size % 3 === 0 && node.size % 3 === 0);
          if (!ruleOfThree) break;
        }
        if (k < 0) break;
        const at = openers[k], o = out[at];
        const n = o.len >= 2 && node.len >= 2 ? 2 : 1;
        const tag = node.ch === '~' ? 'del' : n === 2 ? 'strong' : 'em';
        const inner = out.splice(at + 1).map(text).join('');
        o.len -= n;
        node.len -= n;
        openers.length = o.len ? k + 1 : k;
        if (!o.len) out.pop();
        out.push(`<${tag}>${inner}</${tag}>`);
      }
      if (node.len) {
        if (node.open) openers.push(out.length);
        out.push(node);
      }
    }
    return out.map(text).join('');
  }

  function inline(s, inLink = false, depth = 0) {
    if (depth > MAX_DEPTH) return escapeHtml(s);
    const nodes = [], brackets = matchBrackets(s);
    let text = '';
    const flush = () => { if (text) { nodes.push(escapeHtml(text)); text = ''; } };
    const emit = html => { flush(); nodes.push(html); };

    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '\\') {
        if (s[i + 1] === '\n') { emit('<br>\n'); i++; }
        else if (PUNCT.test(s[i + 1] || '')) text += s[++i];
        else text += c;
      } else if (c === '`') {
        const len = codeSpanLength(s, i);
        let n = 1;
        while (s[i + n] === '`') n++;
        if (!len) { text += '`'.repeat(n); i += n - 1; continue; }
        let code = s.slice(i + n, i + len - n).replace(/\n/g, ' ');
        if (/^ .*[^ ].* $/.test(code)) code = code.slice(1, -1);
        emit(`<code>${escapeHtml(code)}</code>`);
        i += len - 1;
      } else if (c === '<') {
        const re = /<((?:https?:\/\/|mailto:)[^\s<>]*|[\w.+-]+@[\w-]+(?:\.[\w-]+)+)>/iy;
        re.lastIndex = i;
        const m = re.exec(s);
        if (!m || inLink) { text += c; continue; }
        const url = /^(https?:|mailto:)/i.test(m[1]) ? m[1] : 'mailto:' + m[1];
        emit(`<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(m[1])}</a>`);
        i += m[0].length - 1;
      } else if (c === '[' || (c === '!' && s[i + 1] === '[')) {
        const image = c === '!';
        const open = image ? i + 1 : i;
        const close = brackets.get(open);
        const target = close !== undefined && (image || !inLink) ? linkTarget(s, close + 1) : null;
        // A link cannot contain a link: let the inner one win.
        const label = target ? s.slice(open + 1, close) : '';
        if (!target || (!image && /(^|[^!\\])\[[^\[\]]*\]\([^()]*\)/.test(label))) { text += c; continue; }
        const title = target.title === null ? '' : ` title="${escapeHtml(target.title)}"`;
        const body = inline(label, !image || inLink, depth + 1);
        if (image) {
          const alt = body.replace(/<img [^>]*?alt="([^"]*)"[^>]*>/g, '$1').replace(/<[^>]*>/g, '');
          emit(`<img src="${safeUrl(target.url, true)}" alt="${alt}"${title}>`);
        } else {
          emit(`<a href="${safeUrl(target.url)}"${title} target="_blank" rel="noopener noreferrer">${body}</a>`);
        }
        i = target.end - 1;
      } else if (c === '*' || c === '_' || c === '~') {
        const run = delimiterRun(s, i);
        flush();
        nodes.push(run);
        i += run.len - 1;
      } else if (c === '\n') {
        // Two or more trailing spaces make a hard line break.
        const spaces = text.length - text.replace(/ +$/, '').length;
        text = text.slice(0, text.length - spaces);
        if (spaces >= 2) emit('<br>\n'); else text += '\n';
      } else {
        text += c;
      }
    }
    flush();
    return emphasis(nodes);
  }

  /* ---------- Blocks ---------- */

  const FENCE = /^( {0,3})(`{3,}(?=[^`]*$)|~{3,})\s*(.*)$/;
  const HEADING = /^ {0,3}(#{1,6})(?:\s+(.*?))??(?:\s+#+)?\s*$/;
  const RULE = /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
  const QUOTE = /^ {0,3}> ?/;
  const ITEM = /^( *)([-+*]|\d{1,9}[.)])(?:( +)(.*))?$/;
  const blank = line => !line.trim();
  const indentOf = line => line.length - line.replace(/^ +/, '').length;

  // Can this line cut a paragraph short without a blank line before it?
  function interrupts(line) {
    if (FENCE.test(line) || HEADING.test(line) || RULE.test(line) || QUOTE.test(line)) return true;
    const m = ITEM.exec(line);
    return !!m && m[1].length < 4 && !!m[4] && (!/\d/.test(m[2]) || parseInt(m[2], 10) === 1);
  }

  function cells(line) {
    const row = line.trim().replace(/^\|/, '');
    const out = [''];
    for (let i = 0; i < row.length; i++) {
      if (row[i] === '\\' && row[i + 1] === '|') out[out.length - 1] += row[++i];
      else if (row[i] === '|') out.push('');
      else out[out.length - 1] += row[i];
    }
    if (out.length > 1 && !out[out.length - 1].trim()) out.pop();
    return out.map(c => c.trim());
  }

  function tableStart(lines, i) {
    const head = lines[i], rule = lines[i + 1];
    if (rule === undefined || !head.includes('|') || !rule.includes('|')) return null;
    const marks = cells(rule);
    if (!marks.every(c => /^:?-+:?$/.test(c)) || cells(head).length !== marks.length) return null;
    return marks.map(c => c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right')
      : (c.startsWith(':') ? 'left' : ''));
  }

  function table(lines, i, align) {
    const row = (line, tag) => {
      const values = cells(line);
      return '<tr>' + align.map((a, n) =>
        `<${tag}${a ? ` style="text-align:${a}"` : ''}>${inline(values[n] || '')}</${tag}>`
      ).join('') + '</tr>\n';
    };
    let html = `<div class="table-wrap"><table>\n<thead>\n${row(lines[i], 'th')}</thead>\n<tbody>\n`;
    for (i += 2; i < lines.length && !blank(lines[i]) && lines[i].includes('|') && !interrupts(lines[i]); i++) {
      html += row(lines[i], 'td');
    }
    return { html: html + '</tbody>\n</table></div>\n', next: i };
  }

  function list(lines, i, depth) {
    const first = ITEM.exec(lines[i]);
    const ordered = /\d/.test(first[2]);
    const kind = first[2].slice(-1);        // "-", "+", "*", "." or ")"
    const items = [];
    let loose = false, end = i;

    while (i < lines.length) {
      const m = ITEM.exec(lines[i]);
      if (!m || RULE.test(lines[i]) || m[2].slice(-1) !== kind || /\d/.test(m[2]) !== ordered) break;
      if (items.length && i > end) loose = true;   // blank line between items

      const base = m[1].length;
      const gap = m[3] && m[4] && m[3].length <= 4 ? m[3].length : 1;
      const width = base + m[2].length + gap;
      const body = [m[3] ? lines[i].slice(width) : ''];
      for (i++; i < lines.length; i++) {
        const line = lines[i], indent = indentOf(line);
        if (blank(line)) { body.push(''); continue; }
        const nested = ITEM.test(line) && indent >= base + 2;
        if (indent >= width || nested) body.push(line.slice(Math.min(indent, width)));
        // Unindented text right after paragraph text continues that paragraph.
        else if (body[body.length - 1] && !ITEM.test(line) && !interrupts(line)) body.push(line);
        else break;
      }
      end = i;
      while (end > 0 && blank(lines[end - 1])) end--;
      while (body.length && !body[body.length - 1]) body.pop();
      items.push(body);
    }

    const parsed = items.map(body => blocks(body, depth + 1));
    if (parsed.some(p => p.gap)) loose = true;
    const tag = ordered ? 'ol' : 'ul';
    const start = ordered && parseInt(first[2], 10) !== 1 ? ` start="${parseInt(first[2], 10)}"` : '';
    const html = parsed.map(p => {
      const content = p.parts.map(part =>
        part.paragraph !== undefined
          ? (loose ? `<p>${part.paragraph}</p>\n` : part.paragraph + '\n')
          : part.html
      ).join('').trim();
      return `<li>${content}</li>\n`;
    }).join('');
    return { html: `<${tag}${start}>\n${html}</${tag}>\n`, next: end };
  }

  // Returns the parts of a run of lines, and whether a blank line separated any two.
  function blocks(lines, depth) {
    const parts = [];
    let gap = false, sawBlank = false;
    const add = part => {
      if (sawBlank && parts.length) gap = true;
      sawBlank = false;
      parts.push(part);
    };
    if (depth > MAX_DEPTH) {
      return { parts: [{ paragraph: escapeHtml(lines.join('\n')) }], gap };
    }

    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      let m, align;
      if (blank(line)) {
        sawBlank = true;
        i++;
      } else if ((m = FENCE.exec(line))) {
        const [, indent, fence, info] = m;
        const closing = new RegExp(`^ {0,3}${fence[0]}{${fence.length},}\\s*$`);
        const code = [];
        for (i++; i < lines.length && !closing.test(lines[i]); i++) {
          code.push(lines[i].slice(Math.min(indentOf(lines[i]), indent.length)));
        }
        i++;                                   // an unclosed fence runs to the end
        const lang = info.trim().split(/\s+/)[0];
        const cls = lang ? ` class="language-${escapeHtml(lang)}"` : '';
        add({ html: `<pre><code${cls}>${escapeHtml(code.map(l => l + '\n').join(''))}</code></pre>\n` });
      } else if (indentOf(line) >= 4) {
        const code = [];
        for (; i < lines.length && (blank(lines[i]) || indentOf(lines[i]) >= 4); i++) {
          code.push(lines[i].slice(4));
        }
        while (blank(code[code.length - 1])) { code.pop(); i--; }
        add({ html: `<pre><code>${escapeHtml(code.join('\n'))}\n</code></pre>\n` });
      } else if ((m = HEADING.exec(line))) {
        const level = m[1].length;
        add({ html: `<h${level}>${inline(m[2] || '')}</h${level}>\n` });
        i++;
      } else if (RULE.test(line)) {
        add({ html: '<hr>\n' });
        i++;
      } else if (QUOTE.test(line)) {
        const quoted = [];
        for (; i < lines.length; i++) {
          if (QUOTE.test(lines[i])) quoted.push(lines[i].replace(QUOTE, ''));
          else if (!blank(lines[i]) && !interrupts(lines[i]) &&
                   quoted.length && !blank(quoted[quoted.length - 1])) quoted.push(lines[i]);
          else break;
        }
        add({ html: `<blockquote>\n${join(blocks(quoted, depth + 1))}</blockquote>\n` });
      } else if (ITEM.test(line)) {
        const result = list(lines, i, depth);
        add({ html: result.html });
        i = result.next;
      } else if ((align = tableStart(lines, i))) {
        const result = table(lines, i, align);
        add({ html: result.html });
        i = result.next;
      } else {
        const text = [line.trimStart()];
        let level = 0;
        for (i++; i < lines.length && !blank(lines[i]); i++) {
          const under = /^ {0,3}(=+|-+)\s*$/.exec(lines[i]);   // underlined heading
          if (under) { level = under[1][0] === '=' ? 1 : 2; i++; break; }
          if (interrupts(lines[i]) || tableStart(lines, i)) break;
          text.push(lines[i].trimStart());
        }
        const html = inline(text.join('\n').trimEnd());
        add(level ? { html: `<h${level}>${html}</h${level}>\n` } : { paragraph: html });
      }
    }
    return { parts, gap };
  }

  const join = result => result.parts.map(p =>
    p.paragraph !== undefined ? `<p>${p.paragraph}</p>\n` : p.html).join('');

  function render(source) {
    const lines = source.replace(/\r\n?/g, '\n').split('\n').map(line =>
      // Expand leading tabs (including those after ">" or a list marker) to 4-column stops.
      line.replace(/^[ \t>]*(?:(?:[-+*]|\d+[.)])[ \t]+)?/, prefix => {
        let out = '';
        for (const c of prefix) out += c === '\t' ? ' '.repeat(4 - out.length % 4) : c;
        return out;
      }));
    return join(blocks(lines, 0));
  }

  return { render };
})();
</script>

<script id="app">
(() => {
  const source = document.getElementById('source');
  const preview = document.getElementById('preview');
  const KEY = 'markdown-editor-text';

  const picture = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80">' +
    '<rect width="240" height="80" rx="10" fill="#4a7bd0"/>' +
    '<circle cx="48" cy="40" r="22" fill="#ffd166"/></svg>').replace(/\(/g, '%28').replace(/\)/g, '%29');

  const sample = `# Markdown editor

Type on the left and the **preview** updates on the right. It handles *italic*,
***both at once***, ~~strikethrough~~, \`inline code\` and [links](https://example.com "Example").

## Lists

- Fruit
  - Apples
  - Pears
    1. Conference
    2. Comice
- Bread

## Quote

> Quotes can hold **formatting**,
>
> > nest inside each other,
>
> - and contain lists.

## Code block

\`\`\`js
function greet(name) {
  return \`Hello, \${name}\`;   // <not> **parsed**
}
\`\`\`

## Table

| Item   | Quantity | Price |
|:-------|:--------:|------:|
| Apples |    4     |  1.20 |
| Bread  |    1     |  2.50 |

## Image

![A blue card with a yellow circle](${picture})
`;

  // Storage can be unavailable (private mode, some file:// setups).
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  source.value = saved ?? sample;

  let pending = false;
  function update() {
    pending = false;
    preview.innerHTML = Markdown.render(source.value);
  }

  source.addEventListener('input', () => {
    try { localStorage.setItem(KEY, source.value); } catch {}
    if (!pending) { pending = true; requestAnimationFrame(update); }
  });

  // Keep the preview at the same relative scroll position as the editor.
  source.addEventListener('scroll', () => {
    const range = source.scrollHeight - source.clientHeight;
    if (range > 0) {
      preview.scrollTop = source.scrollTop / range * (preview.scrollHeight - preview.clientHeight);
    }
  });

  let escaped = false;
  source.addEventListener('keydown', e => {
    if (e.key === 'Escape') { escaped = true; return; }
    if (e.key === 'Shift') return;
    if (e.key !== 'Tab' || escaped || e.ctrlKey || e.metaKey || e.altKey) { escaped = false; return; }
    e.preventDefault();

    const { selectionStart: from, selectionEnd: to, value } = source;
    if (!e.shiftKey && from === to) return replace(from, to, '  ');

    // Indent or outdent every selected line.
    const start = from === 0 ? 0 : value.lastIndexOf('\n', from - 1) + 1;
    let end = value.indexOf('\n', to > from && value[to - 1] === '\n' ? to - 1 : to);
    if (end < 0) end = value.length;
    const old = value.slice(start, end);
    const next = e.shiftKey ? old.replace(/^( {1,2}|\t)/gm, '') : old.replace(/^/gm, '  ');
    if (next === old) return;
    replace(start, end, next);
    if (from === to) {
      const caret = Math.max(start, from - (old.length - next.length));
      source.setSelectionRange(caret, caret);
    } else {
      source.setSelectionRange(start, start + next.length);
    }
  });

  // execCommand keeps the browser's undo history; setRangeText is the fallback.
  function replace(from, to, text) {
    source.setSelectionRange(from, to);
    const command = text ? 'insertText' : 'delete';
    if (!document.execCommand(command, false, text)) {
      source.setRangeText(text, from, to, 'end');
      source.dispatchEvent(new Event('input'));
    }
  }

  update();
})();
</script>
</body>
