<!doctype html><html lang="en"><head><meta charset="utf-8"><title>A random walk</title></head><body>
<h1>Tune</h1><button id="play" type="button">Play the tune</button>
<script>
let c
const P = [0, 2, 4, 7, 9]
const WALK = [2, 3, 2, 1, 2, 4, 3, 5, 6, 5, 4, 2, 3, 1, 0, 1, 3, 4]
document.getElementById('play').onclick = () => {
  c = c || new AudioContext(); let t = c.currentTime + 0.05
  for (const d of WALK) {
    const midi = 62 + 12 * Math.floor(d / 5) + P[d % 5]
    const o = c.createOscillator(), g = c.createGain()
    o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12)
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28)
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.3); t += 0.3
  }
}
</script></body></html>
