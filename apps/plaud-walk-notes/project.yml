name: PlaudWalkNotes
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    macOS: "14.0"
targets:
  PlaudWalkNotes:
    type: application
    platform: macOS
    sources:
      - path: PlaudWalkNotes
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.PlaudWalkNotes
        DEVELOPMENT_TEAM: 274T5WCVD2
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PlaudWalkNotes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  PlaudWalkNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PlaudWalkNotesTests
    dependencies:
      - target: PlaudWalkNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  PlaudWalkNotes:
    build:
      targets:
        PlaudWalkNotes: all
        PlaudWalkNotesTests: [test]
    test:
      targets:
        - PlaudWalkNotesTests
