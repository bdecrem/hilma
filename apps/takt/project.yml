name: Takt
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Takt:
    type: application
    platform: iOS
    sources:
      - path: Takt
    info:
      path: Takt/Info.plist
      properties:
        CFBundleDisplayName: Takt
        # Short name: the macOS Dock hover label and app menu use this.
        CFBundleName: Takt
        # XcodeGen's generated Info.plist otherwise pins these to 1 / 1.0.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Mac App Store metadata, required for macOS (Catalyst) uploads.
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.Takt
        # 6 = Mac idiom ("Optimize Interface for Mac"). iPhone-only on iOS.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        # The iOS 27 beta aborts the debug-dylib stub launch path (see apps/feynd/CLAUDE.md).
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
