name: Omniglot
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

targets:
  OmniglotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OmniglotUITests]
    dependencies:
      - target: Omniglot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.OmniglotUITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  Omniglot:
    type: application
    platform: iOS
    sources:
      - path: Omniglot
        excludes:
          - "Secrets.swift.example"
    dependencies:
      - package: WebRTC
    info:
      path: Omniglot/Info.plist
      properties:
        CFBundleDisplayName: Omniglot
        # Light-only app (the Talk booth opts into dark itself via SwiftUI).
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: "Omniglot listens during conversation practice so you can speak with your tutor."
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.Omniglot
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iOS 27 beta chokes on the Xcode debug-dylib stub launch path
        # (black screen at launch until reboot). Single-binary debug builds.
        ENABLE_DEBUG_DYLIB: NO

schemes:
  Omniglot:
    build:
      targets:
        Omniglot: all
    run:
      config: Debug
      # Xcode 26 debugger can't attach on iOS 27 beta (app aborts at launch
      # under lldb) — run undebugged so plain Cmd+R works on device.
      debugEnabled: false
    test:
      config: Debug
      targets:
        - OmniglotUITests
