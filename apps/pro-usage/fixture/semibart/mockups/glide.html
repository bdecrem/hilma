<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Mockup B: CASBS Quest's whole campus as one strip that glides past, settling on five neighborhoods.">
<meta property="og:title" content="CASBS Quest · Mockup B, Glide">
<meta property="og:description" content="The whole campus as one strip. Scroll along it, it settles on each neighborhood.">
<meta property="og:url" content="https://ola.cx/semibart/mockups/glide.html">
<meta property="og:image" content="https://ola.cx/semibart/mockups/og-glide.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>CASBS Quest · Glide</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<style>
/* Mockup B: the five neighborhoods are one strip, east to west. Scroll, drag or swipe and it
   slides past (branches in the foreground move faster than the ground); let go and it settles
   on the nearest neighborhood, and you walk there. The strip at the bottom is the whole campus
   in miniature: the box is what you see, drag it to scrub. */
#names { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#names div { position: absolute; transform: translate(-50%, -50%); color: var(--paper); font-size: 3.2cqw; letter-spacing: 0.22em; white-space: nowrap; opacity: 0.88; transition: color 0.3s; }
#names div.here { color: var(--hot); opacity: 1; }
#arrows button { position: absolute; top: 50%; transform: translateY(-50%); width: 4.4cqw; height: 8cqw; display: grid; place-items: center; color: var(--hot); opacity: 0.6; z-index: 3; }
#arrows button:hover, #arrows button:focus-visible { opacity: 1; outline: none; }
#arrows button[disabled] { visibility: hidden; }
#arrows svg { width: 1.8cqw; height: 2.6cqw; filter: drop-shadow(0.22cqw 0 0 #000) drop-shadow(-0.22cqw 0 0 #000) drop-shadow(0 0.22cqw 0 #000) drop-shadow(0 -0.22cqw 0 #000); }
#left { left: 0; } #right { right: 0; }
#trail { position: absolute; left: 50%; bottom: 0.9cqw; transform: translateX(-50%); display: flex; align-items: center; gap: 1.2cqw; z-index: 3; }
#trail .nm { width: 15cqw; text-align: right; color: var(--hot); font-size: 2.5cqw; line-height: 1; white-space: nowrap; }
#trail .no { width: 4cqw; color: var(--cyan); font-size: 2.2cqw; line-height: 1; }
#strip { position: relative; width: 32cqw; height: 3.6cqw; background: #000; box-shadow: 0 0 0 0.3cqw #000, 0 0 0 0.55cqw rgba(255,255,85,0.35); cursor: ew-resize; touch-action: none; }
#strip canvas { display: block; width: 100%; height: 100%; opacity: 0.8; }
#strip .seams { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 0.15cqw), rgba(0,0,0,0.75) calc(20% - 0.15cqw) 20%); pointer-events: none; }
#win { position: absolute; top: -0.35cqw; bottom: -0.35cqw; width: 20%; border: 0.3cqw solid var(--hot); box-shadow: 0 0 0 0.25cqw #000; pointer-events: none; }
#pip { position: absolute; bottom: -0.9cqw; width: 0.9cqw; height: 0.9cqw; margin-left: -0.45cqw; background: #e8743b; box-shadow: 0 0 0 0.2cqw #000; pointer-events: none; }
#who { position: absolute; left: 50%; bottom: 6.4cqw; transform: translateX(-50%); width: max-content; max-width: 70cqw; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.4s; z-index: 3; }
#who.on { opacity: 1; }
#who .nums { color: var(--choice); font-size: 2.2cqw; line-height: 1.1; }
#who .people { color: var(--paper); font-size: 2.2cqw; line-height: 1.15; text-wrap: balance; }
.people span { display: inline-block; white-space: nowrap; }
.people span:not(:last-child)::after { content: '\00a0·'; color: var(--cyan); }
.ui[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="320" height="180" role="img" aria-label="CASBS Quest, the campus as one strip"></canvas>
  <div id="names" class="ui outlined" hidden></div>
  <div id="line" class="outlined" aria-live="polite"></div>
  <div id="label" class="outlined" hidden></div>
  <div id="who" class="outlined ui" hidden><div class="nums"></div><div class="people"></div></div>
  <div id="arrows" class="ui" hidden>
    <button id="left" type="button" aria-label="Previous neighborhood"><svg viewBox="0 0 4 5" aria-hidden="true"><path fill="currentColor" d="M3 0h1v5H3V4H2V3H1V2h1V1h1z"/></svg></button>
    <button id="right" type="button" aria-label="Next neighborhood"><svg viewBox="0 0 4 5" aria-hidden="true"><path fill="currentColor" d="M0 0h1v1h1v1h1v1H2v1H1v1H0z"/></svg></button>
  </div>
  <nav id="trail" class="ui outlined" aria-label="The campus" hidden>
    <span class="nm"></span>
    <div id="strip" role="slider" aria-label="Where you are on campus" aria-valuemin="1" aria-valuemax="5" tabindex="0"><canvas width="320" height="36"></canvas><div class="seams"></div><div id="win"></div><div id="pip"></div></div>
    <span class="no"></span>
  </nav>
  <nav id="mock" aria-label="Mockups"><a href="pages.html">A · Pages</a><a href="glide.html" aria-current="page">B · Glide</a></nav>
  <div id="title" role="dialog" aria-modal="true" aria-labelledby="titleH">
    <div class="card">
      <p class="eyebrow">Mockup B · Glide</p>
      <h1 id="titleH">CASBS Quest</h1>
      <p class="tag">Fifty-four studies. One long walk. One afternoon.</p>
      <hr>
      <dl>
        <dt>Scroll · drag</dt><dd>look along campus</dd>
        <dt>← →</dt><dd>next neighborhood</dd>
        <dt>The strip</dt><dd>scrub or jump</dd>
        <dt>Click</dt><dd>walk, look</dd>
      </dl>
      <button id="startBtn" type="button">Start</button>
    </div>
  </div>
</div>
<script src="world.js"></script>
<script>
(() => {
'use strict';
const { W, FH, C, rect, oval, disc, rng, AREAS, art, route, walker } = World;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = AREAS.length, WW = W * N, MAXCAM = WW - W;

// the strip: the five areas side by side; their walks meet at the seams
const world = document.createElement('canvas'); world.width = WW; world.height = FH;
const wm = world.getContext('2d'); art.forEach((c, i) => wm.drawImage(c, i * W, 0));
const pts = []; AREAS.forEach((A, i) => A.route.forEach(p => pts.push([p[0] + i * W, p[1]])));
const GR = route(pts);
const ANCH = AREAS.map((A, i) => GR.project(A.anchor[0] + i * W, A.anchor[1]));

const S = { started: false, cam: 0, stop: 0, mode: 'snap', s: ANCH[0], tgt: null, speed: 80, arrive: null, idle: 0, drag: null, scrub: null, line: null, birds: null, flockT: 5, shown: -1, wheelT: 0 };
const clampCam = x => Math.max(0, Math.min(MAXCAM, x));
const clampStop = k => Math.max(0, Math.min(N - 1, k));

function walkTo(s, cb, maxT) {
  const d = Math.abs(s - S.s);
  if (d < 0.5) { S.tgt = null; S.s = s; if (cb) cb(); return; }
  S.tgt = s; S.speed = Math.max(80, d / (maxT || 2)); S.arrive = cb || null;
}
function say(text, at) { S.line = text ? { text, at, t: 0, dur: Math.min(5, 1.6 + text.length * 0.045) } : null; }
// travel: you walk (or run) there and the camera follows you; it settles when you arrive
function travel(k) {
  if (!S.started) return;
  k = clampStop(k); S.stop = k; S.mode = 'follow'; say(null); hideWho();
  const d = Math.abs(ANCH[k] - S.s);
  walkTo(ANCH[k], () => { S.mode = 'snap'; }, Math.max(0.5, Math.min(1.7, d / 170)));
}
// settle: after a scroll or drag the camera eases to the nearest neighborhood and you run to it
function settle(k) {
  k = clampStop(k); S.stop = k; S.mode = 'snap';
  const d = Math.abs(ANCH[k] - S.s);
  if (d > 1) walkTo(ANCH[k], null, Math.max(0.5, Math.min(1.4, d / 200)));
}

/* ---------- names in the world, the strip, the residents ---------- */
const namesEl = $('names');
const nameEls = AREAS.map(A => { const d = document.createElement('div'); d.textContent = A.name.toUpperCase(); namesEl.appendChild(d); return d; });
{ const c = $('strip').querySelector('canvas').getContext('2d'); c.imageSmoothingEnabled = true; c.drawImage(world, 0, 0, 320, 36); }
const peopleHTML = A => A.people.split(' · ').map(n => '<span>' + n + '</span>').join(' ');
function showWho(k) { const el = $('who'), A = AREAS[k]; el.querySelector('.nums').textContent = 'Studies ' + A.nums; el.querySelector('.people').innerHTML = peopleHTML(A); el.classList.add('on'); clearTimeout(showWho.t); showWho.t = setTimeout(hideWho, 4200); }
function hideWho() { $('who').classList.remove('on'); }
function ui() {
  const k = S.stop;
  $('trail').querySelector('.nm').textContent = AREAS[k].name;
  $('trail').querySelector('.no').textContent = (k + 1) + '/' + N;
  $('strip').setAttribute('aria-valuenow', k + 1);
  $('left').disabled = k === 0; $('right').disabled = k === N - 1;
}

function start() {
  if (S.started) return;
  S.started = true; $('title').hidden = true;
  document.querySelectorAll('.ui').forEach(el => { el.hidden = false; });
  ui(); setTimeout(() => say('CASBS. Fifty-four studies. Scroll along.'), 700);
  // who lives here comes up once the opening line is done, not on top of it
  S.shown = 0; setTimeout(() => { if (S.stop === 0 && S.mode === 'snap') showWho(0); }, 3900);
}
$('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
$('startBtn').focus({ preventScroll: true });
$('left').addEventListener('click', e => { e.stopPropagation(); travel(S.stop - 1); });
$('right').addEventListener('click', e => { e.stopPropagation(); travel(S.stop + 1); });

/* ---------- input ---------- */
const labelEl = $('label'), lineEl = $('line');
const pxScale = () => W / cv.getBoundingClientRect().width;
function toWorld(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * W + Math.round(S.cam), (e.clientY - b.top) / b.height * FH]; }
function hit(x, y) { const i = Math.floor(x / W); if (i < 0 || i >= N) return null; const lx = x - i * W, h = AREAS[i].spots.find(h => lx >= h.r[0] && lx < h.r[0] + h.r[2] && y >= h.r[1] && y < h.r[1] + h.r[3]); return h ? { h, i } : null; }
cv.addEventListener('wheel', e => {
  if (!S.started) return;
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (e.deltaMode === 1 || (Math.abs(d) >= 80 && Number.isInteger(d))) { // a mouse wheel: one notch, one neighborhood
    const now = performance.now(); if (now - S.wheelT < 450) return; S.wheelT = now; travel(S.stop + Math.sign(d)); return;
  }
  S.mode = 'free'; S.tgt = null; S.cam = clampCam(S.cam + d * pxScale() * 1.2); S.idle = 0.22; hideWho(); say(null);
}, { passive: false });
cv.addEventListener('pointerdown', e => { if (!S.started) return; S.drag = { x: e.clientX, y: e.clientY, cam: S.cam, moved: false, v: 0, lx: e.clientX, lt: performance.now() }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!S.started) return;
  const d = S.drag;
  if (d) {
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 6) { d.moved = true; S.mode = 'free'; S.tgt = null; hideWho(); say(null); labelEl.hidden = true; }
    if (d.moved) { S.cam = clampCam(d.cam - dx * pxScale()); const now = performance.now(), dtm = Math.max(1, now - d.lt); d.v = 0.7 * d.v + 0.3 * ((e.clientX - d.lx) / dtm) * pxScale() * 1000; d.lx = e.clientX; d.lt = now; return; }
  }
  const [x, y] = toWorld(e), r = hit(x, y);
  cv.style.cursor = r ? 'pointer' : 'grab';
  if (!r) { labelEl.hidden = true; return; }
  const b = cv.getBoundingClientRect();
  labelEl.textContent = r.h.name; labelEl.hidden = false;
  labelEl.style.left = Math.max(8, Math.min(92, (e.clientX - b.left) / b.width * 100)) + '%';
  labelEl.style.top = Math.max(6, (e.clientY - b.top) / b.height * 100) + '%';
});
cv.addEventListener('pointerleave', () => { labelEl.hidden = true; });
cv.addEventListener('pointerup', e => {
  const d = S.drag; S.drag = null;
  if (!S.started || !d) return;
  if (d.moved) { settle(Math.round(clampCam(S.cam - d.v * 0.22) / W)); return; }
  const [x, y] = toWorld(e), r = hit(x, y);
  if (r) { const cx = r.i * W + r.h.r[0] + r.h.r[2] / 2, cy = r.h.r[1] + r.h.r[3] / 2; say(null); walkTo(GR.project(cx, cy), () => say(r.h.look, [cx, r.h.r[1]]), 1.4); }
  else { say(null); walkTo(GR.project(x, y), null, 1.6); }
});
// the strip: drag to scrub, click to jump
const strip = $('strip');
function stripX(e) { const b = strip.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)); }
strip.addEventListener('pointerdown', e => { if (!S.started) return; e.stopPropagation(); strip.setPointerCapture(e.pointerId); S.scrub = { x: e.clientX, moved: false }; });
strip.addEventListener('pointermove', e => { const sc = S.scrub; if (!sc) return; if (!sc.moved && Math.abs(e.clientX - sc.x) > 4) { sc.moved = true; S.mode = 'free'; S.tgt = null; hideWho(); say(null); } if (sc.moved) S.cam = clampCam(stripX(e) * WW - W / 2); });
strip.addEventListener('pointerup', e => { const sc = S.scrub; S.scrub = null; if (!sc) return; if (sc.moved) settle(Math.round(S.cam / W)); else travel(Math.round(stripX(e) * N)); });
strip.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); travel(S.stop + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); travel(S.stop - 1); } });
window.addEventListener('keydown', e => {
  if (!S.started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); travel(S.stop + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); travel(S.stop - 1); }
  if (/^[1-5]$/.test(e.key)) travel(+e.key - 1);
  if (e.key === ' ' || e.key === 'Escape') { e.preventDefault(); say(null); }
});

/* ---------- the foreground: branches nearer the eye than the ground, so they pass faster ---------- */
const FG = [[-10, 0], [332, 1], [560, 0], [770, 1], [1010, 0], [1200, 1], [1430, 0], [1650, 1], [1890, 0], [2090, 1]].map(([x, top], j) => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64; const m = c.getContext('2d'), r = rng(300 + j * 17), R = 17 + (j * 5) % 6;
  disc(m, 32, 32, R, '#163524');
  for (let i = 0; i < 22; i++) { const a = r() * 6.283, d = R * (0.55 + r() * 0.5); disc(m, 32 + Math.cos(a) * d, 32 + Math.sin(a) * d, 2 + Math.floor(r() * 4), r() < 0.5 ? '#1c4430' : '#163524'); }
  for (let i = 0; i < 26; i++) { const a = r() * 6.283, d = r() * R; rect(m, 32 + Math.cos(a) * d, 32 + Math.sin(a) * d, 2, 1, r() < 0.6 ? '#24553a' : '#2f6b45'); }
  return { x, top, c };
});
const FG_SPEED = 1.35;
function foreground(cam) { FG.forEach(f => { const sx = Math.round(f.x - cam * FG_SPEED); if (sx < -40 || sx > W + 40) return; g.drawImage(f.c, sx - 32, f.top ? -44 : FH - 20); }); }

/* ---------- drawing ---------- */
function sky(t, dt, cr) {
  if (calm) return;
  for (let j = 0; j < 3; j++) { const wx = ((t * 6 + j * 560) % (WW + 200)) - 100, sx = wx - cr; if (sx > -50 && sx < W + 50) oval(g, sx, j % 2 ? 48 : 114, j % 2 ? 26 : 34, j % 2 ? 7 : 9, 'rgba(20,20,20,0.06)'); }
  S.flockT -= dt;
  if (!S.birds && S.flockT <= 0) { S.birds = { x: -16, y: 10 + Math.random() * 50 }; S.flockT = 24 + Math.random() * 18; }
  if (S.birds) {
    const b = S.birds; b.x += 34 * dt; b.y += Math.sin(t * 1.3) * 3 * dt;
    [[0, 0], [-6, -3], [-6, 3], [-12, -6]].forEach(([ox, oy], i) => { const x = Math.round(b.x + ox), y = Math.round(b.y + oy), up = Math.floor(t * 7 + i) % 2, c = 'rgba(20,20,20,0.7)'; rect(g, x, y, 1, 1, c); rect(g, x - 2, y - up, 2, 1, c); rect(g, x + 1, y - up, 2, 1, c); });
    if (b.x > W + 24) S.birds = null;
  }
}
function drawLine(cr) {
  const l = S.line;
  if (!l) { if (lineEl.textContent) lineEl.textContent = ''; return; }
  if (lineEl.textContent !== l.text) lineEl.textContent = l.text;
  const p = l.at || (() => { const [x, y] = GR.at(S.s); return [x, y - 12]; })(), sx = p[0] - cr;
  lineEl.style.left = Math.max(1, Math.min(37, sx / W * 100 - 31)) + '%';
  lineEl.style.top = Math.max(11, p[1] / FH * 100) + '%';
}
let last = performance.now() / 1000;
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, Math.max(0, t - last)); last = t;
  if (S.tgt !== null) {
    const d = S.tgt - S.s, step = S.speed * dt;
    if (Math.abs(d) <= step) { S.s = S.tgt; S.tgt = null; const a = S.arrive; S.arrive = null; if (a) a(); }
    else S.s += Math.sign(d) * step;
  }
  if (S.line) { S.line.t += dt; if (S.line.t >= S.line.dur) S.line = null; }
  const [wx, wy] = GR.at(S.s);
  // the camera
  if (S.mode === 'free' && !S.drag && !S.scrub) { S.idle -= dt; if (S.idle <= 0) settle(Math.round(S.cam / W)); }
  if (S.mode !== 'free') {
    const target = S.mode === 'follow' ? clampCam(wx - W / 2) : S.stop * W;
    S.cam += (target - S.cam) * (calm ? 1 : 1 - Math.exp(-dt * (S.mode === 'follow' ? 7 : 6)));
    if (Math.abs(target - S.cam) < 0.3) S.cam = target;
  }
  const near = clampStop(Math.round(S.cam / W));
  if (near !== S.stop && S.mode === 'free') { S.stop = near; }
  ui();
  const settled = S.mode === 'snap' && Math.abs(S.cam - S.stop * W) < 1 && S.tgt === null;
  if (settled && S.shown !== S.stop && S.started) { S.shown = S.stop; showWho(S.stop); }
  if (!settled && S.shown === S.stop && S.mode !== 'snap') S.shown = -1;

  const cr = Math.round(S.cam);
  if (cr !== S.lastCr) { S.lastCr = cr; labelEl.hidden = true; } // whatever was under the pointer has moved on
  g.drawImage(world, cr, 0, W, FH, 0, 0, W, FH);
  const vis = AREAS.map((A, i) => i * W - cr).map((ox, i) => (ox > -W && ox < W) ? [i, ox] : null).filter(Boolean);
  vis.forEach(([i, ox]) => { g.save(); g.translate(ox, 0); AREAS[i].under(g, t, dt, calm); g.restore(); });
  walker(g, Math.round(wx - cr), Math.round(wy), S.tgt !== null && !calm ? Math.floor(t * (S.speed > 160 ? 12 : 8)) % 2 : 0);
  vis.forEach(([i, ox]) => { g.save(); g.translate(ox, 0); AREAS[i].over(g, t, dt, calm); g.restore(); });
  sky(t, dt, cr);
  foreground(S.cam);

  // overlays that live in the world
  AREAS.forEach((A, i) => { const sx = i * W + A.label[0] - S.cam, el = nameEls[i]; if (sx < -80 || sx > W + 80) { el.style.display = 'none'; return; } el.style.display = ''; el.style.left = (sx / W * 100) + '%'; el.style.top = (A.label[1] / FH * 100) + '%'; el.classList.toggle('here', i === S.stop && settled); });
  $('win').style.left = (S.cam / WW * 100) + '%';
  $('pip').style.left = (wx / WW * 100) + '%';
  drawLine(cr);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.mock = { S, travel, settle, start, say };
})();
</script>
</body>
</html>
