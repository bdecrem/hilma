<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Mockup A: CASBS Quest's whole campus as five rooms you walk between, one screen each.">
<meta property="og:title" content="CASBS Quest · Mockup A, Pages">
<meta property="og:description" content="The whole campus, five neighborhoods, one screen each.">
<meta property="og:url" content="https://ola.cx/semibart/mockups/pages.html">
<meta property="og:image" content="https://ola.cx/semibart/mockups/og-pages.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>CASBS Quest · Pages</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<style>
/* Mockup A: each neighborhood is one room. Walk off an edge (or click its name) and the next
   room slides in, with its name stamped on top; the dots jump anywhere. */
/* the dots are 5 x 2.4cqw + 4 x 1.1cqw = 16.4cqw wide, so the tag starts 8.2cqw + a gap right of center */
#tag { position: absolute; left: calc(50% + 9.6cqw); bottom: 1.25cqw; color: var(--hot); font-size: 2.6cqw; line-height: 1; pointer-events: none; z-index: 3; white-space: nowrap; }
#tag b { color: var(--cyan); font-weight: 400; margin-right: 0.9cqw; }
/* an exit's name sits just above the walk that leaves the screen, its arrow pointing along it */
.edge { position: absolute; display: flex; align-items: center; gap: 0.5cqw; color: var(--hot); font-size: 2.7cqw; padding: 0.6cqw 1cqw; z-index: 3; transform: translateY(-100%); }
.edge svg { width: 1.9cqw; height: 2.4cqw; display: block; filter: drop-shadow(0.22cqw 0 0 #000) drop-shadow(-0.22cqw 0 0 #000) drop-shadow(0 0.22cqw 0 #000) drop-shadow(0 -0.22cqw 0 #000); }
.edge[hidden] { display: none; }
.edge:hover, .edge:focus-visible { color: #fff; outline: none; }
#next { right: 0; }
#prev { left: 0; flex-direction: row-reverse; }
@keyframes nudgeR { 50% { transform: translate(0.6cqw, -100%); } }
@keyframes nudgeL { 50% { transform: translate(-0.6cqw, -100%); } }
#next { animation: nudgeR 1.3s ease-in-out infinite; }
#prev { animation: nudgeL 1.3s ease-in-out infinite; }
#dots { position: absolute; left: 50%; bottom: 1.3cqw; transform: translateX(-50%); display: flex; gap: 1.1cqw; z-index: 3; }
#dots button { position: relative; width: 2.4cqw; height: 2.4cqw; background: #000; box-shadow: 0 0 0 0.25cqw rgba(0,0,0,0.5); }
#dots button > i { position: absolute; inset: 0.5cqw; background: #8a826f; }
#dots button:hover > i { background: #fff; }
#dots button[aria-current] > i { background: var(--hot); }
#dots .thumb { position: absolute; bottom: 3.6cqw; left: 50%; transform: translateX(-50%); display: none; pointer-events: none; }
#dots button:hover .thumb, #dots button:focus-visible .thumb { display: block; }
.thumb canvas { display: block; width: 18cqw; height: 10.125cqw; border: 0.35cqw solid var(--hot); box-shadow: 0 0 0 0.35cqw #000; }
.thumb span { display: block; margin-top: 0.6cqw; color: var(--hot); font-size: 2.2cqw; text-align: center; white-space: nowrap; }
/* entering a room: its name comes up over the scene the way a game names a place, then fades */
#stamp { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); width: max-content; max-width: 72cqw; text-align: center; opacity: 0; pointer-events: none; z-index: 4; }
#stamp.on { animation: hold 3.4s ease-out forwards; }
#stamp.on h2 { animation: spread 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes hold { 0% { opacity: 0; } 9% { opacity: 1; } 76% { opacity: 1; } 100% { opacity: 0; } }
@keyframes spread { from { letter-spacing: 0.45em; } to { letter-spacing: 0.04em; } }
#stamp .no { margin: 0; color: var(--cyan); font-size: 2.1cqw; letter-spacing: 0.2em; }
#stamp h2 { margin: 0.2cqw 0 0; color: var(--hot); font-size: 9.5cqw; line-height: 0.9; font-weight: 400; white-space: nowrap; }
#stamp .rule { width: 26cqw; height: 0.4cqw; margin: 0.9cqw auto 0.8cqw; background: var(--hot); box-shadow: 0 0 0 0.22cqw #000; }
#stamp .nums { margin: 0; color: var(--choice); font-size: 2.5cqw; }
#stamp .people { margin: 0.4cqw auto 0; max-width: 62cqw; color: var(--paper); font-size: 2.4cqw; line-height: 1.15; text-wrap: balance; }
.people span { display: inline-block; white-space: nowrap; }
.people span:not(:last-child)::after { content: '\00a0·'; color: var(--cyan); }
.ui[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #next, #prev { animation: none; } #stamp.on { animation-duration: 0.01s; opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="320" height="180" role="img" aria-label="CASBS Quest, one neighborhood of the campus"></canvas>
  <div id="line" class="outlined" aria-live="polite"></div>
  <div id="label" class="outlined" hidden></div>
  <div id="stamp" class="outlined" aria-live="polite"><p class="no"></p><h2></h2><div class="rule"></div><p class="nums"></p><p class="people"></p></div>
  <button id="prev" class="edge outlined ui" type="button" hidden><span></span><svg viewBox="0 0 4 5" aria-hidden="true"><path fill="currentColor" d="M3 0h1v5H3V4H2V3H1V2h1V1h1z"/></svg></button>
  <button id="next" class="edge outlined ui" type="button" hidden><span></span><svg viewBox="0 0 4 5" aria-hidden="true"><path fill="currentColor" d="M0 0h1v1h1v1h1v1H2v1H1v1H0z"/></svg></button>
  <nav id="dots" class="ui" aria-label="Neighborhoods" hidden></nav>
  <div id="tag" class="outlined ui" hidden></div>
  <nav id="mock" aria-label="Mockups"><a href="pages.html" aria-current="page">A · Pages</a><a href="glide.html">B · Glide</a></nav>
  <div id="title" role="dialog" aria-modal="true" aria-labelledby="titleH">
    <div class="card">
      <p class="eyebrow">Mockup A · Pages</p>
      <h1 id="titleH">CASBS Quest</h1>
      <p class="tag">Fifty-four studies. Five neighborhoods. One afternoon.</p>
      <hr>
      <dl>
        <dt>Click</dt><dd>walk, look</dd>
        <dt>Edges · ← →</dt><dd>next neighborhood</dd>
        <dt>Dots</dt><dd>jump anywhere</dd>
        <dt>Swipe</dt><dd>on a phone</dd>
      </dl>
      <button id="startBtn" type="button">Start</button>
    </div>
  </div>
</div>
<script src="world.js"></script>
<script>
(() => {
'use strict';
const { W, FH, C, rect, oval, AREAS, art, route, walker } = World;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = AREAS.length, R = AREAS.map(A => route(A.route));
const S = { started: false, page: 0, s: R[0].project(...AREAS[0].anchor), tgt: null, speed: 80, arrive: null, trans: null, hide: false, line: null, birds: null, flockT: 4 };

/* ---------- walking ---------- */
function walkTo(s, cb, maxT) {
  const d = Math.abs(s - S.s);
  if (d < 0.5) { S.tgt = null; S.s = s; if (cb) cb(); return; }
  S.tgt = s; S.speed = Math.max(80, d / (maxT || 2)); S.arrive = cb || null;
}
function say(text, at) { S.line = text ? { text, at, t: 0, dur: Math.min(5, 1.6 + text.length * 0.045) } : null; }

/* ---------- moving between rooms ---------- */
function go(dir) {
  if (!S.started || S.trans) return;
  const to = S.page + dir; if (to < 0 || to >= N) return;
  say(null);
  walkTo(dir > 0 ? R[S.page].len : 0, () => slide(to, dir, dir > 0 ? 0 : R[to].len, true), 0.5);
}
function jump(j) {
  if (!S.started || S.trans || j === S.page) return;
  say(null); slide(j, Math.sign(j - S.page), R[j].project(...AREAS[j].anchor), false);
}
function slide(to, dir, entry, walkIn) {
  S.trans = { from: S.page, to, dir, t0: performance.now() / 1000, entry, walkIn };
  S.hide = true; S.tgt = null; S.arrive = null; $('label').hidden = true; $('stamp').classList.remove('on');
}
function finishSlide() {
  const tr = S.trans; S.trans = null; S.page = tr.to; S.s = tr.entry; S.hide = false;
  if (tr.walkIn) walkTo(Math.max(0, Math.min(R[S.page].len, tr.entry + tr.dir * 58)), null, 0.6);
  stamp(); ui();
}

/* ---------- interface ---------- */
const dotsEl = $('dots');
AREAS.forEach((A, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', A.name);
  b.innerHTML = '<i></i><div class="thumb"><canvas width="160" height="90"></canvas><span></span></div>';
  const c = b.querySelector('canvas').getContext('2d'); c.imageSmoothingEnabled = true; c.drawImage(art[i], 0, 0, 160, 90);
  b.querySelector('span').textContent = A.name;
  b.addEventListener('click', e => { e.stopPropagation(); jump(i); });
  dotsEl.appendChild(b);
});
function ui() {
  const A = AREAS[S.page], r = R[S.page];
  [...dotsEl.children].forEach((b, i) => b.toggleAttribute('aria-current', i === S.page));
  $('tag').innerHTML = '<b>' + (S.page + 1) + '/' + N + '</b>' + A.name.toUpperCase();
  const prev = $('prev'), next = $('next');
  prev.hidden = S.page === 0; next.hidden = S.page === N - 1;
  // the label's bottom sits 5px above the center of the walk, which is 6px wide: clear of the gravel
  if (S.page > 0) { prev.querySelector('span').textContent = AREAS[S.page - 1].name; prev.style.top = ((r.pts[0][1] - 4) / FH * 100) + '%'; }
  if (S.page < N - 1) { next.querySelector('span').textContent = AREAS[S.page + 1].name; next.style.top = ((r.pts[r.pts.length - 1][1] - 4) / FH * 100) + '%'; }
}
function stamp() {
  const A = AREAS[S.page], el = $('stamp');
  el.querySelector('.no').textContent = (S.page + 1) + ' OF ' + N;
  el.querySelector('h2').textContent = A.name;
  el.querySelector('.nums').textContent = 'Studies ' + A.nums;
  el.querySelector('.people').innerHTML = A.people.split(' · ').map(n => '<span>' + n + '</span>').join(' ');
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
$('prev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
$('next').addEventListener('click', e => { e.stopPropagation(); go(1); });

function start() {
  if (S.started) return;
  S.started = true; $('title').hidden = true;
  document.querySelectorAll('.ui').forEach(el => { el.hidden = false; });
  ui(); stamp();
  setTimeout(() => say('CASBS. Fifty-four studies, five neighborhoods.'), 900);
}
$('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
$('startBtn').focus({ preventScroll: true });

/* ---------- pointer: hover labels, click to walk and look, swipe to change rooms ---------- */
const labelEl = $('label'), lineEl = $('line');
function toScene(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * FH]; }
function hit(x, y) { return AREAS[S.page].spots.find(h => x >= h.r[0] && x < h.r[0] + h.r[2] && y >= h.r[1] && y < h.r[1] + h.r[3]); }
let down = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', e => {
  if (!S.started || S.trans) return;
  const [x, y] = toScene(e), h = hit(x, y);
  cv.style.cursor = h ? 'pointer' : 'crosshair';
  if (!h) { labelEl.hidden = true; return; }
  const b = cv.getBoundingClientRect();
  labelEl.textContent = h.name; labelEl.hidden = false;
  labelEl.style.left = Math.max(8, Math.min(92, (e.clientX - b.left) / b.width * 100)) + '%';
  labelEl.style.top = Math.max(6, (e.clientY - b.top) / b.height * 100) + '%';
});
cv.addEventListener('pointerleave', () => { labelEl.hidden = true; });
cv.addEventListener('pointerup', e => {
  if (!S.started || S.trans) return;
  const d = down; down = null;
  if (d) { const dx = e.clientX - d.x, dy = e.clientY - d.y, b = cv.getBoundingClientRect(); if (Math.abs(dx) > b.width * 0.06 && Math.abs(dx) > Math.abs(dy) * 1.4) { go(dx < 0 ? 1 : -1); return; } }
  const [x, y] = toScene(e), h = hit(x, y), r = R[S.page];
  if (h) { const cx = h.r[0] + h.r[2] / 2, cy = h.r[1] + h.r[3] / 2; say(null); walkTo(r.project(cx, cy), () => say(h.look, [cx, h.r[1]]), 1.4); }
  else { say(null); walkTo(r.project(x, y), null, 1.6); }
});
window.addEventListener('keydown', e => {
  if (!S.started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); go(-1); }
  if (/^[1-5]$/.test(e.key)) jump(+e.key - 1);
  if (e.key === ' ' || e.key === 'Escape') { e.preventDefault(); say(null); }
});

/* ---------- drawing ---------- */
function sky(t, dt) {
  if (calm) return;
  const cx = ((t * 6) % (W + 120)) - 60;
  oval(g, cx, 114, 34, 9, 'rgba(20,20,20,0.06)'); oval(g, cx - 170, 48, 26, 7, 'rgba(20,20,20,0.06)');
  S.flockT -= dt;
  if (!S.birds && S.flockT <= 0) { S.birds = { x: -16, y: 10 + Math.random() * 50 }; S.flockT = 24 + Math.random() * 18; }
  if (S.birds) {
    const b = S.birds; b.x += 34 * dt; b.y += Math.sin(t * 1.3) * 3 * dt;
    [[0, 0], [-6, -3], [-6, 3], [-12, -6]].forEach(([ox, oy], i) => { const x = Math.round(b.x + ox), y = Math.round(b.y + oy), up = Math.floor(t * 7 + i) % 2, c = 'rgba(20,20,20,0.7)'; rect(g, x, y, 1, 1, c); rect(g, x - 2, y - up, 2, 1, c); rect(g, x + 1, y - up, 2, 1, c); });
    if (b.x > W + 24) S.birds = null;
  }
}
function drawLine() {
  const l = S.line;
  if (!l) { if (lineEl.textContent) lineEl.textContent = ''; return; }
  if (lineEl.textContent !== l.text) lineEl.textContent = l.text;
  const p = l.at || (() => { const [x, y] = R[S.page].at(S.s); return [x, y - 12]; })();
  lineEl.style.left = Math.max(1, Math.min(37, p[0] / W * 100 - 31)) + '%';
  lineEl.style.top = Math.max(11, p[1] / FH * 100) + '%';
}
let last = performance.now() / 1000;
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, Math.max(0, t - last)); last = t;
  if (S.tgt !== null) {
    const d = S.tgt - S.s, step = S.speed * dt;
    if (Math.abs(d) <= step) { S.s = S.tgt; S.tgt = null; const a = S.arrive; S.arrive = null; if (a) a(); }
    else S.s += Math.sign(d) * step;
  }
  if (S.line) { S.line.t += dt; if (S.line.t >= S.line.dur) S.line = null; }
  if (S.trans) {
    const tr = S.trans, k = calm ? 1 : Math.min(1, (t - tr.t0) / 0.62), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, off = Math.round(e * W) * tr.dir;
    g.drawImage(art[tr.from], -off, 0); g.drawImage(art[tr.to], tr.dir * W - off, 0);
    if (k >= 1) finishSlide();
  } else {
    const A = AREAS[S.page];
    g.drawImage(art[S.page], 0, 0);
    A.under(g, t, dt, calm);
    if (!S.hide) { const [x, y] = R[S.page].at(S.s); walker(g, Math.round(x), Math.round(y), S.tgt !== null && !calm ? Math.floor(t * 8) % 2 : 0); }
    A.over(g, t, dt, calm);
    sky(t, dt);
  }
  drawLine();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.mock = { S, go, jump, start, say };
})();
</script>
</body>
</html>
