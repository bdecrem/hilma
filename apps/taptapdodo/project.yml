name: TapTapDodo
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TapTapDodo:
    type: application
    platform: iOS
    sources:
      - path: TapTapDodo
    info:
      path: TapTapDodo/Info.plist
      properties:
        CFBundleDisplayName: Tap Tap Dodo
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Unbounded-Black.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bartdecrem.taptapdodo.play
            CFBundleURLSchemes:
              - taptapdodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.taptapdodo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Xcode debug-dylib stub launch aborts at startup on the iOS 27 beta.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
