<!doctype html>
<!--
  Engine host page — loaded into a hidden WKWebView by EngineHost.swift via
  the jambot-engine:// scheme (EngineSchemeHandler serves this file,
  engine-bridge.js and jambot-web.js straight from the app bundle, so the
  page has a real origin and the ES-module bundle imports cleanly — file://
  origins can't import modules in WebKit).

  jambot-web.js is hilma's committed engine bundle, referenced by path in
  project.yml from ../../public/jam/jambot-web.js — never copied here.

  engine-bridge.js owns the one session and answers Swift's
  bridge.call(id, name, argsJSON) calls per the table in ../../DESIGN.md.
-->

  <meta charset="utf-8">
  <title>Jambot engine host</title>
</head>

<script src="engine-bridge.js"></script>
</body>
</html>
