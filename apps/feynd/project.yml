name: Feynd
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "47"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

targets:
  Feynd:
    type: application
    platform: iOS
    sources:
      - path: Feynd
        excludes:
          - "Secrets.swift.example"
    dependencies:
      - package: WebRTC
    info:
      path: Feynd/Info.plist
      properties:
        CFBundleDisplayName: Dodo
        # Wire the yml's version settings into the bundle — without these the
        # generated plist hardcodes 1.0 (1) and About lies about the build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Short name — the macOS Dock hover label and app menu use this.
        CFBundleName: Dodo
        # Escape-closes-modals responder — see FeyndApplication.swift.
        NSPrincipalClass: Feynd.FeyndApplication
        # HTTPS only — skips TestFlight's export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fredoka.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # dodo://peck — direct scheme for testing deep-link routing in the
        # simulator (universal links need the AASA live on feynd.cc).
        CFBundleURLTypes:
          - CFBundleURLName: com.bartdecrem.Feynd
            CFBundleURLSchemes:
              - dodo
        NSMicrophoneUsageDescription: Dodo uses the microphone so you can talk with your learning assistant.
        # Dodo never takes photos or video — the WebRTC voice framework
        # references camera APIs, and App Store processing (error 90683)
        # demands the string whenever the API is merely linked.
        NSCameraUsageDescription: Dodo does not take photos or video; this permission is only required by the voice-call framework.
        # Required by PhotosPicker on Mac Catalyst — without it the app is
        # terminated the moment the picker tries to access the photo library.
        NSPhotoLibraryUsageDescription: Pick a profile photo from your library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Keep Audio Summary playback alive with the screen locked.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.Feynd
        # Universal links (applinks:feynd.cc — see Feynd/Feynd.entitlements)
        # apply to DEVICE iOS builds only. Catalyst would need its own Mac
        # provisioning profile for the capability, and the daily-card link
        # this exists for is always tapped on the phone. The sim doesn't
        # need it either (dodo:// covers deep-link testing there).
        CODE_SIGN_ENTITLEMENTS: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Feynd/Feynd.entitlements
        # 1 = iPhone, 2 = iPad. Catalyst piggybacks on the iPad device family,
        # but device/simulator builds are iPhone-only — App Store validation
        # otherwise demands iPad multitasking orientations + iPad icons.
        TARGETED_DEVICE_FAMILY: "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Xcode debug-dylib stub launch path aborts at startup on the
        # iOS 27 beta — black screen. Ship a single binary instead.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac Catalyst — same bundle ID, Mac runs the iPad layout with native
        # window chrome (resizable). Minimum macOS pegged at Sonoma so the
        # SwiftUI APIs in use (Observation, AsyncImage, PhotosPicker) work.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
