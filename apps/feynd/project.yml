name: Feynd
options:
  bundleIdPrefix: com.bartdecrem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 274T5WCVD2
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Feynd:
    type: application
    platform: iOS
    sources:
      - path: Feynd
        excludes:
          - "Secrets.swift.example"
    info:
      path: Feynd/Info.plist
      properties:
        CFBundleDisplayName: Feynd
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Feynd uses the microphone so you can talk with your learning assistant.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartdecrem.Feynd
        # 1 = iPhone, 2 = iPad. Catalyst piggybacks on the iPad device family.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac Catalyst — same bundle ID, Mac runs the iPad layout with native
        # window chrome (resizable). Minimum macOS pegged at Sonoma so the
        # SwiftUI APIs in use (Observation, AsyncImage, PhotosPicker) work.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
